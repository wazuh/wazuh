<ossec_config>
    <remote>
        <connection>secure</connection>
        <port>1514</port>
        <protocol>tcp</protocol>
    </remote>
    <remote>
        <connection>syslog</connection>
        <port>514</port>
        <protocol>udp</protocol>
        <allowed-ips>127.0.0.0/24</allowed-ips>
        <allowed-ips>192.168.0.0/24</allowed-ips>
        <denied-ips>127.0.0.1</denied-ips>
        <denied-ips>192.168.0.1</denied-ips>
    </remote>
</ossec_config>
