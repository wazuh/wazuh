- sections:
    - section: sca
      elements:
        - enabled:
            value: ENABLED
        - scan_on_start:
            value: 'yes'
        - interval:
            value: INTERVAL
        - synchronization:
            elements:
              - response_timeout:
                  value: 1
        - policies:
            elements:
              - policy:
                  value: POLICY_FILE

    - section: rootcheck
      elements:
        - disabled:
            value: 'yes'

    - section: syscheck
      elements:
        - disabled:
            value: 'yes'

    - section: wodle
      attributes:
        - name: syscollector
      elements:
        - disabled:
            value: 'yes'

    # <agent> is the 5.x name for what 4.x spelled <client> (#38103) -- the legacy tag is only
    # read for <client><server><address> as a fallback, so <port> would be silently ignored under it.
    # <endpoint> must be explicit empty: unset it defaults to the manager's HTTPS global prefix
    # (e.g. /wazuh-manager/), which RemotedSimulator does not serve, so enrollment 404s.
    - section: agent
      elements:
        - manager:
            elements:
              - address:
                  value: '127.0.0.1'
              - port:
                  value: 1517
              - endpoint:
                  value: ''
