- fragments:
    auth:
      disabled: false
      port: 1515
      use_source_ip: false
      force:
        enabled: FORCE_ENABLED
        key_mismatch: KEY_MISMATCH
        after_registration_time: AFTER_REGISTRATION_TIME
        disconnected_time:
          enabled: DISCONNECTED_TIME_ENABLED
          value: DISCONNECTED_TIME
      purge: true
      use_password: false
      ciphers: TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
      ssl_verify_host: false
      ssl_manager_cert: /var/wazuh-manager/etc/certs/remoted.pem
      ssl_manager_key: /var/wazuh-manager/etc/certs/remoted-key.pem
