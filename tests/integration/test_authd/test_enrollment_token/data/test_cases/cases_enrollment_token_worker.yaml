- name: 'worker_forwards_token_id'
  description: 'A worker forwards the token id to the master untouched and returns the agent the master created'
  configuration_parameters:
    FERNET_KEY: x1b1y3fwf7tywwhqzzasom2czwk7zuj0
  metadata:
    action: 'worker_forwards_token_id'
    FERNET_KEY: x1b1y3fwf7tywwhqzzasom2czwk7zuj0
    local_input: '{"arguments":{"name":"etoken-wk","ip":"any","token_id":"AAECAwQFBgcICQoLDA0ODw"},"function":"add"}'
    cluster_input: '{"daemon_name":"authd","message":{"arguments":{"name":"etoken-wk","ip":"any","token_id":"AAECAwQFBgcICQoLDA0ODw"},"function":"add"}}'
    cluster_output: '{"error":0,"data":{"id":"007","name":"etoken-wk","ip":"any","key":"675aaf366e6827ee7a77b2f7b4d89e603a21333c09afbb02c40191f199d7c915"}}'
    expected_agent_id: '007'
    expected_token_id: 'AAECAwQFBgcICQoLDA0ODw'

