- name: Use empty password file.
  description: Set the use_password tag with the value 'yes',
               create the file authd.pass and keep it empty
               making authd impossible to start.
  configuration_parameters:
    USE_PASSWORD: 'yes'
  metadata:
    error: "Invalid password provided in '/etc/wazuh-manager/authd.pass'."
    password: ''

- name: Use only spaces password.
  description: Set the use_password tag with the value 'yes',
               create the file authd.pass and fill it with only
               spaces making authd impossible to start.
  configuration_parameters:
    USE_PASSWORD: 'yes'
  metadata:
    error: "Invalid password provided in '/etc/wazuh-manager/authd.pass'."
    password: '      '

- name: Use a password shorter than the minimum.
  description: Set the use_password tag with the value 'yes',
               create the file authd.pass with a 15-character
               password, one under the 16-byte minimum,
               making authd impossible to start.
  configuration_parameters:
    USE_PASSWORD: 'yes'
  metadata:
    error: "Authentication password in '/etc/wazuh-manager/authd.pass' is too short: it must be at least 16 bytes. Write a longer one, or delete the file to have a random one generated."
    password: '0123456789abcde'
