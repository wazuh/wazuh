- fragments:
    auth:
      disabled: false
      port: 1515
      use_source_ip: false
      force:
        enabled: true
        key_mismatch: false
        after_registration_time: 0h
        disconnected_time:
          enabled: true
          value: 0h
      purge: true
      use_password: false
      ciphers: CIPHERS
      ssl_verify_host: false
      ssl_manager_cert: /var/wazuh-manager/etc/certs/remoted.pem
      ssl_manager_key: /var/wazuh-manager/etc/certs/remoted-key.pem
