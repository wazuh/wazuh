- sections:
  - section: auth
    elements:
    - disabled:
        value: 'no'
    - port:
        value: 1515
    - use_source_ip:
        value: 'no'
    - force:
        elements:
        - enabled:
            value: 'yes'
        - key_mismatch:
            value: 'no'
        - after_registration_time:
            value: '0h'
        - disconnected_time:
            attributes:
            - enabled: 'yes'
            value: '0h'
    - purge:
        value: 'yes'
    - use_password:
        value: 'no'
    - ciphers:
        value: CIPHERS
    - ssl_verify_host:
        value: 'no'
    - ssl_manager_cert:
        value: '/etc/wazuh-manager/certs/remoted.pem'
    - ssl_manager_key:
        value: '/etc/wazuh-manager/certs/remoted-key.pem'
