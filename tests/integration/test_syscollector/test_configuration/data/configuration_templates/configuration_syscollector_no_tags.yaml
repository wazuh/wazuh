- sections:
    - section: agent
      elements:
        - manager:
            elements:
                # Trailing '/' on purpose (#38624): it is the explicit opt-out from the
                # endpoint prefix. Without it the agent takes the default /wazuh-manager/
                # prefix, which RemotedSimulator does not serve -- every request 404s and
                # the agent never reaches the accepted /startup the module start (behind
                # the agentd startup gate) depends on. This section replaces the installed
                # one, so the installer's own opt-out does not reach it.
                - endpoint:
                    value: '127.0.0.1:1517/'
        # #38684: the agent's default verification_mode is now 'system', which
        # RemotedSimulator's self-signed cert fails -- opt out explicitly since this
        # suite is not testing TLS trust.
        - ssl:
            elements:
              - verification_mode:
                  value: none
    - section: wodle
      attributes:
        - name: syscollector

    - section: syscheck
      elements:
        - disabled:
            value: 'yes'

    - section: rootcheck
      elements:
        - disabled:
            value: 'yes'

    - section: sca
      elements:
        - enabled:
            value: 'no'
