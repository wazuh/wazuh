- sections:
    - section: wodle
      attributes:
        - name: syscollector

    - section: syscheck
      elements:
        - disabled:
            value: 'yes'

    - section: rootcheck
      elements:
        - disabled:
            value: 'yes'

    - section: sca
      elements:
        - enabled:
            value: 'no'

    - section: client
      elements:
        - manager:
            elements:
              - address:
                  value: '127.0.0.1'
              - port:
                  value: '1514'
        - ssl:
            elements:
              - verification_mode:
                  value: 'none'
