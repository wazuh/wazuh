- sections:
    - section: agent
      elements:
        - manager:
            elements:
                - endpoint:
                    value: '127.0.0.1:1517'
        # The agent's default verification_mode is now 'system', which
        # RemotedSimulator's self-signed cert fails -- opt out explicitly since this
        # suite is not testing TLS trust.
        - ssl:
            elements:
              - verification_mode:
                  value: none
    - section: wodle
      attributes:
        - name: syscollector

    - section: syscheck
      elements:
        - disabled:
            value: 'yes'

    - section: rootcheck
      elements:
        - disabled:
            value: 'yes'

    - section: sca
      elements:
        - enabled:
            value: 'no'
