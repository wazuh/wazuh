- sections:
    - section: agent
      elements:
        - manager:
            elements:
                # RemotedSimulator now understands the manager's default /wazuh-manager/
                # reverse-proxy prefix (qa-integration-framework#835), so this no longer
                # needs to opt out of it. This section replaces the installer's own
                # opt-out (WAZUH_MANAGER_ENDPOINT="127.0.0.1:1517/") entirely with this
                # suite's own explicit default-prefix endpoint.
                - endpoint:
                    value: '127.0.0.1:1517'
    - section: wodle
      attributes:
        - name: syscollector
      elements:
        - disabled:
            value: DISABLED
        - interval:
            value: INTERVAL_SCAN
        - scan_on_start:
            value: START_ON_START
        - hardware:
            value: HARDWARE_SCAN
        - os:
            value: OS_SCAN
        - network:
            value: NETWORK_SCAN
        - packages:
            value: PACKAGES_SCAN
        - ports:
            value: PORTS_SCAN
            attributes:
              - all: ALL_PORTS
        - processes:
            value: PROCESSES_SCAN
        - hotfixes:
            value: HOTFIXES_SCAN
        - groups:
            value: GROUPS_SCAN
        - users:
            value: USERS_SCAN
        - services:
            value: SERVICES_SCAN
        - browser_extensions:
            value: BROWSER_EXTENSIONS_SCAN

    - section: syscheck
      elements:
        - disabled:
            value: 'yes'

    - section: rootcheck
      elements:
        - disabled:
            value: 'yes'

    - section: sca
      elements:
        - enabled:
            value: 'no'
