- sections:
    - section: agent
      elements:
        - manager:
            elements:
                # Trailing '/' on purpose (#38624): it is the explicit opt-out from the
                # endpoint prefix. Without it the agent takes the default /wazuh-manager/
                # prefix, which RemotedSimulator does not serve -- every request 404s and
                # the agent never reaches the accepted /startup the module start (behind
                # the agentd startup gate) depends on. This section replaces the installed
                # one, so the installer's own opt-out does not reach it.
                - endpoint:
                    value: '127.0.0.1:1517/'
    - section: wodle
      attributes:
        - name: syscollector
      elements:
        - disabled:
            value: DISABLED
        - interval:
            value: INTERVAL_SCAN
        - scan_on_start:
            value: START_ON_START
        - hardware:
            value: HARDWARE_SCAN
        - os:
            value: OS_SCAN
        - network:
            value: NETWORK_SCAN
        - packages:
            value: PACKAGES_SCAN
        - ports:
            value: PORTS_SCAN
            attributes:
              - all: ALL_PORTS
        - processes:
            value: PROCESSES_SCAN
        - hotfixes:
            value: HOTFIXES_SCAN
        - groups:
            value: GROUPS_SCAN
        - users:
            value: USERS_SCAN
        - services:
            value: SERVICES_SCAN
        - browser_extensions:
            value: BROWSER_EXTENSIONS_SCAN

    - section: syscheck
      elements:
        - disabled:
            value: 'yes'

    - section: rootcheck
      elements:
        - disabled:
            value: 'yes'

    - section: sca
      elements:
        - enabled:
            value: 'no'
