- sections:
    - section: agent
      elements:
        - manager:
            elements:
                - address:
                    value: 127.0.0.1
                - port:
                    value: 1517
                # Empty on purpose (#38492): an absent <endpoint> defaults to the manager's
                # /wazuh-manager/ prefix, which the remoted simulator does not serve, so every
                # request 404s and the agent never reaches the accepted /startup the module
                # start (behind the agentd startup gate) depends on. This section replaces the
                # installed one, so the installer's own opt-out does not reach it.
                - endpoint:
                    value: ''
    - section: wodle
      attributes:
        - name: syscollector
      elements:
        - disabled:
            value: DISABLED
        - interval:
            value: INTERVAL_SCAN
        - scan_on_start:
            value: START_ON_START
        - hardware:
            value: HARDWARE_SCAN
        - os:
            value: OS_SCAN
        - network:
            value: NETWORK_SCAN
        - packages:
            value: PACKAGES_SCAN
        - ports:
            value: PORTS_SCAN
            attributes:
              - all: ALL_PORTS
        - processes:
            value: PROCESSES_SCAN
        - hotfixes:
            value: HOTFIXES_SCAN
        - groups:
            value: GROUPS_SCAN
        - users:
            value: USERS_SCAN
        - services:
            value: SERVICES_SCAN
        - browser_extensions:
            value: BROWSER_EXTENSIONS_SCAN
        - synchronization:
            elements:
              - interval:
                  value: SYNC_INTERVAL
              - response_timeout:
                  value: SYNC_RESPONSE_TIMEOUT
              - retries:
                  value: 0

    - section: syscheck
      elements:
        - disabled:
            value: 'yes'

    - section: rootcheck
      elements:
        - disabled:
            value: 'yes'

    - section: sca
      elements:
        - enabled:
            value: 'no'
