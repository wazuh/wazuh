- sections:
    - section: agent
      elements:
        - notify_time:
            value: 10
        - time-reconnect:
            value: 60
        - auto_restart:
            value: "yes"
        - manager:
            elements:
                - address:
                    value: 127.0.0.1
                - port:
                    value: 1517
                # Empty on purpose (#38492): an absent <endpoint> defaults to the manager's
                # /wazuh-manager/ prefix, which the remoted simulator does not serve, so every
                # request 404s and the agent never reaches the accepted /startup this suite
                # waits for. This section replaces the installed one, so the installer's own
                # opt-out does not reach it.
                - endpoint:
                    value: ''
    - section: active-response
      elements:
        - disabled:
            value: "no"
