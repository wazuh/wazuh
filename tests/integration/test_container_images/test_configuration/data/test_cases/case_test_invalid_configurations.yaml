- name: empty_value_enabled
  description: Verify that an empty enabled value is rejected with an error
  configuration_parameters:
    ENABLED: ''
    SCAN_ON_START: 'yes'
    INTERVAL: 1h
    LOCAL_PATH: /tmp/wazuh-container-images/oci
  metadata:
    field: enabled

- name: invalid_value_enabled
  description: Verify that a non yes/no enabled value is rejected with an error
  configuration_parameters:
    ENABLED: 'maybe'
    SCAN_ON_START: 'yes'
    INTERVAL: 1h
    LOCAL_PATH: /tmp/wazuh-container-images/oci
  metadata:
    field: enabled

- name: empty_value_scan_on_start
  description: Verify that an empty scan_on_start value is rejected with an error
  configuration_parameters:
    ENABLED: 'yes'
    SCAN_ON_START: ''
    INTERVAL: 1h
    LOCAL_PATH: /tmp/wazuh-container-images/oci
  metadata:
    field: scan_on_start

- name: empty_value_interval
  description: Verify that an empty interval value is rejected with an error
  configuration_parameters:
    ENABLED: 'yes'
    SCAN_ON_START: 'yes'
    INTERVAL: ''
    LOCAL_PATH: /tmp/wazuh-container-images/oci
  metadata:
    field: interval

- name: invalid_value_interval
  description: Verify that an interval with an unsupported unit suffix is rejected with an error
  configuration_parameters:
    ENABLED: 'yes'
    SCAN_ON_START: 'yes'
    INTERVAL: 1y
    LOCAL_PATH: /tmp/wazuh-container-images/oci
  metadata:
    field: interval

- name: empty_local_reference
  description: Verify that an empty local reference is rejected with an error
  configuration_parameters:
    ENABLED: 'yes'
    SCAN_ON_START: 'yes'
    INTERVAL: 1h
    LOCAL_PATH: ''
  metadata:
    field: local
