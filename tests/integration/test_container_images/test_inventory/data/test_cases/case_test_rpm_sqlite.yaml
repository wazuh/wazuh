- name: rpm_sqlite_database_is_inventoried
  description: An image whose package database is an rpm sqlite one is inventoried with its packages
  configuration_parameters:
    SCAN_ON_START: 'yes'
    INTERVAL: 1h
    ARCHIVE_PATH: /tmp/wazuh-container-images/oci-rpm-sqlite
  metadata:
    package_format: rpm
    database_format: sqlite
