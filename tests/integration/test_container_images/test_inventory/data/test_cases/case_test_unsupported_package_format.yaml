- name: unsupported_package_format_reports_zero_packages
  description: An image whose package format is recognized but not implemented yet is inventoried with zero packages
  configuration_parameters:
    SCAN_ON_START: 'yes'
    INTERVAL: 1h
    ARCHIVE_PATH: /tmp/wazuh-container-images/oci-rpm
  metadata:
    package_format: rpm
