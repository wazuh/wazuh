- name: "No_connection_with_remoted"
  description:
  configuration_parameters:
  metadata:
    remoted: false
    output:
    - type: "file"
      fields:
        status: "pending"
        last_keepalive: ""
        last_ack: ""
        msg_count: ""

- name: "Successful_connection_with_remoted"
  description:
  configuration_parameters:
  metadata:
    remoted: true
    output:
    - type: "file"
      fields:
        status: "connected"
        last_keepalive: true
        # Not checked: UPDATE_ACK (state.c) has had no caller anywhere in client-agent since
        # the HTTPS migration, so agent_state.last_ack -- and this field, local or remote --
        # is dead everywhere in the product, not just dropped from the /stats push.
        last_ack: ""
        msg_count: true
    - type: "remote"
      fields:
        status: "connected"
        last_keepalive: true
        # Not checked: same dead field as the "file" block above (no producer left in the
        # product at all, see that comment), and also dropped from the /stats push itself
        # (wazuh/wazuh@72ace94e97).
        last_ack: ""
        msg_count: true

- name: "Only_remote_request_available"
  description:
  configuration_parameters:
  metadata:
    local_internal_options:
      agent.state_interval: 0
    remoted: true
    output:
    - type: "remote"
      fields:
        status: "connected"
        last_keepalive: true
        # Not checked: no producer left in the product at all (UPDATE_ACK has had no caller
        # anywhere in client-agent since the HTTPS migration), and also dropped from the
        # /stats push itself (wazuh/wazuh@72ace94e97).
        last_ack: ""
        msg_count: true
