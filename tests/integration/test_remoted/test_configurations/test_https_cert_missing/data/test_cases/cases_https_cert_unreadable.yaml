- name: Listener key unreadable by the service user under a configured name, credential resolver
  description: With the listener key configured at a root-owned (0600) copy, the credential resolver's check refuses it as unsafe before anything starts
  configuration_parameters:
    CERTIFICATE: '/etc/wazuh-manager/certs/remoted.pem'
    KEY: '/etc/wazuh-manager/certs/listener-key-unreadable.pem'
    CA_CERTIFICATE: '/etc/wazuh-manager/certs/root-ca.pem'
  metadata:
    certificate: '/etc/wazuh-manager/certs/remoted.pem'
    key: '/etc/wazuh-manager/certs/listener-key-unreadable.pem'
    ca_certificate: '/etc/wazuh-manager/certs/root-ca.pem'
    mutation: unreadable_copy
    copy_from: '/etc/wazuh-manager/certs/remoted-key.pem'
    target: '/etc/wazuh-manager/certs/listener-key-unreadable.pem'
    # A copy of the installed key under another name. The resolver follows remote.https.key and holds
    # the listener's files under any name to root:wazuh-manager 0640, so the first check that fails is
    # the group and the start is refused as unsafe. remoted's own preflight
    # (w_remoted_check_tls_files() in src/remoted/src/secure.c) is not reached.
    expected_error: ".*UNSAFE .*/certs/listener-key-unreadable\\.pem: group is root, not wazuh-manager.*"
- name: Listener key unreadable by the service user, credential resolver
  description: With the installed /etc/wazuh-manager/certs/remoted-key.pem itself root-owned (0600), the credential resolver's check refuses it before anything starts
  configuration_parameters:
    CERTIFICATE: '/etc/wazuh-manager/certs/remoted.pem'
    KEY: '/etc/wazuh-manager/certs/remoted-key.pem'
    CA_CERTIFICATE: '/etc/wazuh-manager/certs/root-ca.pem'
  metadata:
    certificate: '/etc/wazuh-manager/certs/remoted.pem'
    key: '/etc/wazuh-manager/certs/remoted-key.pem'
    ca_certificate: '/etc/wazuh-manager/certs/root-ca.pem'
    mutation: unreadable_key
    # The listener pair is the resolver's: it must be root:wazuh-manager 0640, so the first check that
    # fails is the group, and the start is refused as unsafe.
    expected_error: ".*UNSAFE .*/certs/remoted-key\\.pem: group is root, not wazuh-manager.*"
- name: Published CA certificate unreadable by the service user, credential resolver
  description: With the ca_certificate remoted publishes on /cacerts present but root-owned (0600), the credential resolver's check refuses it as unsafe before anything starts
  configuration_parameters:
    CERTIFICATE: '/etc/wazuh-manager/certs/remoted.pem'
    KEY: '/etc/wazuh-manager/certs/remoted-key.pem'
    CA_CERTIFICATE: '/etc/wazuh-manager/certs/cacerts-unreadable.pem'
  metadata:
    certificate: '/etc/wazuh-manager/certs/remoted.pem'
    key: '/etc/wazuh-manager/certs/remoted-key.pem'
    ca_certificate: '/etc/wazuh-manager/certs/cacerts-unreadable.pem'
    mutation: unreadable_copy
    copy_from: '/etc/wazuh-manager/certs/root-ca.pem'
    target: '/etc/wazuh-manager/certs/cacerts-unreadable.pem'
    # A dedicated copy of /etc/wazuh-manager/certs/root-ca.pem, created by the fixture root-owned 0600 and
    # removed afterwards: root-ca.pem itself is shared with other daemons, which must keep starting. The
    # resolver follows remote.https.ca_certificate (the agents' bundle) and holds it to
    # root:wazuh-manager 0640, so the start is refused as unsafe before remoted's preflight
    # (w_remoted_check_tls_files() in src/remoted/src/secure.c) is reached.
    expected_error: ".*UNSAFE .*/certs/cacerts-unreadable\\.pem: group is root, not wazuh-manager.*"
