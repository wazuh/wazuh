- name: Missing listener certificate
  description: With etc/certs/remoted.pem absent and no CA key on the host, the credential resolver cannot reissue it and refuses to start the service
  configuration_parameters:
    CERTIFICATE: 'etc/certs/remoted.pem'
    KEY: 'etc/certs/remoted-key.pem'
  metadata:
    certificate: 'etc/certs/remoted.pem'
    key: 'etc/certs/remoted-key.pem'
    mutation: missing_certificate
    # The unit's ExecStartPre (src/init/credentials/resolve-credentials) runs before any daemon and
    # writes its verdict to the unit's journal. The CI provisions the anchor without its key (case D).
    expected_error: ".*MISSING the manager's TLS certificates in .*etc/certs.*"
