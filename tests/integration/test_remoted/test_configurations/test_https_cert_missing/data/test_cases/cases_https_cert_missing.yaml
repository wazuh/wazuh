- name: Missing listener certificate under a configured name, credential resolver
  description: With the listener certificate configured at a name nothing provides, the credential resolver's check refuses the configured key left without it before the configuration validator checks the files
  configuration_parameters:
    CERTIFICATE: '/etc/wazuh-manager/certs/listener-missing.pem'
    KEY: '/etc/wazuh-manager/certs/remoted-key.pem'
    CA_CERTIFICATE: '/etc/wazuh-manager/certs/root-ca.pem'
  metadata:
    certificate: '/etc/wazuh-manager/certs/listener-missing.pem'
    key: '/etc/wazuh-manager/certs/remoted-key.pem'
    ca_certificate: '/etc/wazuh-manager/certs/root-ca.pem'
    mutation: absent_file
    target: '/etc/wazuh-manager/certs/listener-missing.pem'
    # The resolver follows remote.https.certificate and remote.https.key, so the configured key, present,
    # is half a pair. Its check runs before `wazuh-manager-conf validate` checks the files
    # (checkcredentials() in src/init/wazuh-server.sh), so the validator's 'file not found' is never
    # reached; the resolver's verdict follows the control script's line in the manager log.
    expected_error: ".*INVALID .*/certs/remoted-key\\.pem: half a pair \\(listener-missing\\.pem is missing\\).*"
- name: Missing listener certificate, credential resolver
  description: With the installed /etc/wazuh-manager/certs/remoted.pem moved aside, the credential resolver's check refuses the half pair before the configuration is validated
  configuration_parameters:
    CERTIFICATE: '/etc/wazuh-manager/certs/remoted.pem'
    KEY: '/etc/wazuh-manager/certs/remoted-key.pem'
    CA_CERTIFICATE: '/etc/wazuh-manager/certs/root-ca.pem'
  metadata:
    certificate: '/etc/wazuh-manager/certs/remoted.pem'
    key: '/etc/wazuh-manager/certs/remoted-key.pem'
    ca_certificate: '/etc/wazuh-manager/certs/root-ca.pem'
    mutation: missing_certificate
    # wazuh-manager-control runs `wazuh-manager-resolve-credentials --check` first (checkcredentials()
    # in src/init/wazuh-server.sh) and appends its verdict to the manager log; the key left without its
    # certificate is half a pair.
    expected_error: ".*INVALID .*/certs/remoted-key\\.pem: half a pair \\(remoted\\.pem is missing\\).*"
