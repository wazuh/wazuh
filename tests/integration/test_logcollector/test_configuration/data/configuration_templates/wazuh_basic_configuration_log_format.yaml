- sections:
    - section: localfile
      elements:
        - command:
            value: 'COMMAND'
        - location:
            value: 'LOCATION'
        - log_format:
            value: 'LOG_FORMAT'

    - section: agent
      elements:
        - server:
            elements:
              - address:
                  value: '127.0.0.1'
              - port:
                  value: '1514'
        - ssl:
            elements:
              - verification_mode:
                  value: 'none'
