- sections:
    - section: socket
      elements:
        - name:
            value: 'SOCKET_NAME'
        - location:
            value: 'SOCKET_PATH'
    - section: localfile
      elements:
        - location:
            value: 'LOCATION'
        - log_format:
            value: 'LOG_FORMAT'
        - target:
            value: 'TARGET'
        - out_format:
            value: OUT_FORMAT
            attributes:
              - target: TARGET_OUT_FORMAT

    - section: client
      elements:
        - manager:
            elements:
              - address:
                  value: '127.0.0.1'
              - port:
                  value: '1514'
        - ssl:
            elements:
              - verification_mode:
                  value: 'none'
