- sections:
    - section: localfile
      elements:
        - location:
            value: 'LOCATION'
        - log_format:
            value: 'json'
        - label:
            value: 'LABEL'
            attributes:
            - key: KEY

    - section: client
      elements:
        - manager:
            elements:
              - address:
                  value: '127.0.0.1'
              - port:
                  value: '1514'
        - ssl:
            elements:
              - verification_mode:
                  value: 'none'
