- name: No directory tag - Real-time
  description: When a real-time monitored directory is deleted
               or added FIM immediately raises a log.
  configuration_parameters:
    FREQUENCY: 43200 # As default 12 hs
    FIM_MODE:
      realtime: 'yes'
  metadata:
    fim_mode: realtime

- name: No directory tag - Scheduled
  description: When a scheduled monitored directory is deleted
               or added FIM raises a log in the next scan, in
               this case the scan are made every 3 secconds.
  configuration_parameters:
    FREQUENCY: 3
    FIM_MODE:
      realtime: 'no'
  metadata:
    fim_mode: scheduled
