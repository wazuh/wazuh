- name: UPLOAD_ONE_BLOCK_CONFIG
  description: Upload one block configuration
  configuration_parameters: null
  metadata:
    body: >
      <wazuh_config>
        <remote>
          <legacy>
            <port>1514</port>
          </legacy>
        </remote>
        <cluster>
          <key>0123456789abcdef0123456789abcdef</key>
        </cluster>
        <indexer>
          <hosts>
            <host>https://127.0.0.1:9200</host>
          </hosts>
        </indexer>
      </wazuh_config>
    expected_code: 200
    expected_error_code: 0

