- sections:
    - section: agent
      elements:
        - manager:
            elements:
                # Trailing '/' on purpose (#38624): it is the explicit opt-out from the
                # endpoint prefix. Without it the agent takes the default /wazuh-manager/
                # prefix, which RemotedSimulator does not serve -- every request 404s and
                # the agent never reaches the accepted /startup the module start (behind
                # the agentd startup gate) depends on. This section replaces the installed
                # one, so the installer's own opt-out does not reach it.
                - endpoint:
                    value: '127.0.0.1:1517/'
    - section: ms-graph
      elements:
        - enabled:
            value: 'ENABLED'
        - only_future_events:
            value: 'ONLY_FUTURE'
        - interval:
            value: 'INTERVAL'
        - curl_max_size:
            value: 'CURL_SIZE'
        - run_on_start:
            value: 'yes'
        - version:
            value: 'v1.0'
        - api_auth:
            elements:
              - tenant_id:
                  value: 'TENANT_ID'
              - client_id:
                  value: 'client_id'
              - secret_value:
                  value: 'secret_value'
              - api_type:
                  value: 'global'
        - resource:
            elements:
              - name:
                  value: 'RESOURCE_NAME'
              - relationship:
                  value: 'RESOURCE_RELATIONSHIP1'
              - relationship:
                  value: 'RESOURCE_RELATIONSHIP2'

    - section: sca
      elements:
        - enabled:
            value: 'no'

    - section: rootcheck
      elements:
        - disabled:
            value: 'yes'

    - section: syscheck
      elements:
        - disabled:
            value: 'yes'

    - section: wodle
      attributes:
        - name: syscollector
      elements:
        - disabled:
            value: 'yes'
