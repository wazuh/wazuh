- sections:
    # #38956: the agent's default verification_mode is now 'system', which
    # RemotedSimulator's self-signed cert fails -- opt out explicitly since this
    # suite is not testing TLS trust.
    - section: agent
      elements:
        - manager:
            elements:
              - endpoint:
                  value: '127.0.0.1:1517'
        - ssl:
            elements:
              - verification_mode:
                  value: none

    - section: ms-graph
      elements:
        - enabled:
            value: 'ENABLED'
        - only_future_events:
            value: 'ONLY_FUTURE_EVENTS'
        - interval:
            value: 'INTERVAL'
        - curl_max_size:
            value: 'CURL_MAX_SIZE'
        - page_size:
            value: 'PAGE_SIZE'
        - time_delay:
            value: 'TIME_DELAY'
        - run_on_start:
            value: 'RUN_ON_START'
        - version:
            value: 'VERSION'
        - api_auth:
            elements:
              - tenant_id:
                  value: 'TENANT_ID'
              - client_id:
                  value: 'CLIENT_ID'
              - secret_value:
                  value: 'SECRET_VALUE'
              - api_type:
                  value: 'API_TYPE'
        - resource:
            elements:
              - name:
                  value: 'RESOURCE_NAME'
              - relationship:
                  value: 'RESOURCE_RELATIONSHIP'

    - section: sca
      elements:
        - enabled:
            value: 'no'

    - section: rootcheck
      elements:
        - disabled:
            value: 'yes'

    - section: syscheck
      elements:
        - disabled:
            value: 'yes'

    - section: wodle
      attributes:
        - name: syscollector
      elements:
        - disabled:
            value: 'yes'
