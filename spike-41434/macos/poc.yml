name: macos-telemetry-poc
on: [push, workflow_dispatch]
jobs:
  poc:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ./run.sh
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.os }}
          path: out/
