<!-- No <remote><legacy> block, but legacy enrollment is set explicitly: authd binds auth.port, so it
     must not collide with remote.https.port. -->
<wazuh_config>
  <auth>
    <legacy_enrollment>yes</legacy_enrollment>
    <port>1517</port>
  </auth>
  <cluster>
    <key>0123456789abcdef0123456789abcdef</key>
  </cluster>
  <indexer>
    <hosts>
      <host>https://127.0.0.1:9200</host>
    </hosts>
  </indexer>
</wazuh_config>
