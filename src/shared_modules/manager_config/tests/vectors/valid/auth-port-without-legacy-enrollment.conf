<!-- Legacy enrollment is off (explicitly here, while remote.legacy is enabled), so authd binds no port and
     auth.port reserves nothing: it may equal remote.legacy.port. -->
<wazuh_config>
  <remote>
    <legacy>
      <port>1514</port>
    </legacy>
  </remote>
  <auth>
    <legacy_enrollment>no</legacy_enrollment>
    <port>1514</port>
  </auth>
  <cluster>
    <key>0123456789abcdef0123456789abcdef</key>
  </cluster>
  <indexer>
    <hosts>
      <host>https://127.0.0.1:9200</host>
    </hosts>
  </indexer>
</wazuh_config>
