<!-- The minimal valid document (issue #38638): every manager runs as a cluster node, so cluster.key
     has no usable default; wazuh-manager-analysisd cannot start with zero indexer hosts either, so
     indexer.hosts is the other option every effective document must carry explicitly. -->
<wazuh_config>
  <cluster>
    <key>0123456789abcdef0123456789abcdef</key>
  </cluster>
  <indexer>
    <hosts>
      <host>https://127.0.0.1:9200</host>
    </hosts>
  </indexer>
</wazuh_config>
