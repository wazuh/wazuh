<wazuh_config>
  <!-- Host names, bracketed IPv6 URLs, and every duration and size at its largest accepted spelling. -->
  <global>
    <agents_disconnection_time>999w</agents_disconnection_time>
  </global>
  <remote>
    <legacy>
      <rids_closing_time>999999999</rids_closing_time>
    </legacy>
    <https>
      <max_body_size>1G</max_body_size>
    </https>
  </remote>
  <wdb>
    <backup database="global">
      <interval>0009999d</interval>
    </backup>
  </wdb>
  <vulnerability-detection>
    <feed-update-interval>9999999m</feed-update-interval>
  </vulnerability-detection>
  <cluster>
    <key>0123456789abcdef0123456789abcdef</key>
    <bind_addr>wazuh_master.example.com</bind_addr>
    <nodes>
      <node>wazuh_master</node>
    </nodes>
  </cluster>
  <indexer>
    <hosts>
      <host>https://indexer-1.example.com:9200</host>
      <host>http://10.0.0.5:9200/</host>
      <host>https://[fd00::5]:9200</host>
    </hosts>
  </indexer>
</wazuh_config>
