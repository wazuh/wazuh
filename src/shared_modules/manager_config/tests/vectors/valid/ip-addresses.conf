<wazuh_config>
  <remote>
    <https>
      <bind_addr>::</bind_addr>
      <global_prefix>/wazuh-manager/</global_prefix>
    </https>
    <legacy>
      <local_ip>::ffff:10.0.0.1</local_ip>
    </legacy>
  </remote>
  <cluster>
    <key>0123456789abcdef0123456789abcdef</key>
    <bind_addr>localhost</bind_addr>
  </cluster>
  <indexer>
    <hosts>
      <host>https://127.0.0.1:9200</host>
    </hosts>
  </indexer>
</wazuh_config>
