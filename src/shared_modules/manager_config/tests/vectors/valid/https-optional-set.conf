<wazuh_config>
  <remote>
    <https>
      <ca>etc/certs/root-ca.pem</ca>
      <verification_mode>full</verification_mode>
      <ciphers>TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256</ciphers>
      <max_body_size>2M</max_body_size>
      <dual_stack>yes</dual_stack>
      <enroll_rate_limit>500</enroll_rate_limit>
      <enroll_rate_burst>1000</enroll_rate_burst>
      <cacerts_rate_limit>0</cacerts_rate_limit>
    </https>
    <legacy>
      <protocol>tcp,udp</protocol>
      <rids_closing_time>2h</rids_closing_time>
    </legacy>
  </remote>
  <cluster>
    <key>0123456789abcdef0123456789abcdef</key>
  </cluster>
  <indexer>
    <hosts>
      <host>https://127.0.0.1:9200</host>
    </hosts>
  </indexer>
</wazuh_config>
