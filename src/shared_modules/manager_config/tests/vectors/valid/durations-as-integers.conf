<wazuh_config>
  <global>
    <agents_disconnection_time>900</agents_disconnection_time>
  </global>
  <wdb>
    <backup database="global">
      <enabled>no</enabled>
      <interval>3600</interval>
      <max_files>1</max_files>
    </backup>
  </wdb>
  <task-manager>
    <task_ttl>0</task_ttl>
  </task-manager>
  <cluster>
    <key>0123456789abcdef0123456789abcdef</key>
  </cluster>
  <indexer>
    <hosts>
      <host>https://127.0.0.1:9200</host>
    </hosts>
  </indexer>
</wazuh_config>
