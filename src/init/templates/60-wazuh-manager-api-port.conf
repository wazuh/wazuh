# Keep the Wazuh API port out of the kernel's ephemeral port range, so an unrelated outbound
# connection is never given it as a source port while wazuh-manager-apid is not bound to it (for
# example between a stop and the next start). Reserving it only stops the kernel from handing it
# out automatically; a process that binds it explicitly is unaffected.
#
# net.ipv4.ip_local_reserved_ports holds one whole value, not a set each package adds to: this
# line replaces whatever another sysctl.d drop-in or an administrator set for the same key, and a
# drop-in that sorts after this one replaces this reservation in turn.
#
# The port is hardcoded to the packaged default. api.yaml's 'port' setting can change the port
# apid binds, and this reservation does not follow it: an installation that changes the port ends
# up with a reservation for a port nothing listens on, and none for the port it actually uses.
# Reading the configured value at postinst time instead would need the reservation to be rewritten
# whenever api.yaml changes, which nothing does today.
net.ipv4.ip_local_reserved_ports = 55000
