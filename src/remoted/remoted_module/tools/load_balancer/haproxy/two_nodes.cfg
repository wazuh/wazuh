# ===========================================================================================
#  TWO NODES -- balancing and failover, with HAProxy's DEFAULT retry policy
#
#  The HAProxy twin of nginx/two_nodes_no_retry.conf and two_nodes_with_retry.conf. Those are
#  two separate NGINX files because there the choice is binary and has to be made explicitly;
#  here one file is enough, because HAProxy's default is already the interesting case:
#
#    * ACTIVE health checks ('check' on each server line, every 2 s by default): a node that
#      stops answering is taken out of rotation on its own, before a client request reaches it.
#      NGINX Open Source only has PASSIVE checks (max_fails/fail_timeout) -- it has to spend a
#      real client request to notice a node is gone, which is the request our NGINX run loses.
#
#    * 'retries 3' with the default 'retry-on conn-failure': a request is retried ONLY when the
#      connection could not be established -- that is, before any byte of it was delivered.
#      Retrying that cannot duplicate anything, because nothing was consumed.
#      'option redispatch' lets the retry pick a DIFFERENT server (without it, the retry goes to
#      the same one and fails again).
#
#  So out of the box HAProxy gets the outcome NGINX can only get by opting into duplicate
#  delivery: nothing is lost AND nothing is delivered twice. NGINX's proxy_next_upstream as we
#  configure it also retries on http_502/http_503 -- responses, meaning the request WAS
#  delivered and may already have been processed, which is what produces the duplicate.
#
#  To opt into the NGINX-like behaviour (and its duplicates), add to the backend:
#      retry-on all-retryable-errors    # includes empty-response, 502, 503...
#
#  Reproduce:
#      ./start_haproxy.sh two_nodes
#      ./send_signed_request.py --url https://127.0.0.1:8443 --repeat 6 --keepalive   # 3x202 3x503
#      ./send_signed_request.py --url https://127.0.0.1:8444 --repeat 6 --keepalive   # 6x202
#      # then stop node 2 and repeat the :8443 run -- nothing is lost, nothing duplicated
#
#  Node 2 has no engine, so 503 there means the signature was ACCEPTED: the status code is how
#  each node identifies itself, with no log parsing.
#
#  Derived from both_topologies.cfg, which is the one commented in full.
# ===========================================================================================

global
    log stdout format raw local0

defaults
    log     global
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  30s

frontend passthrough_in
    mode tcp
    bind :8444
    option tcplog
    default_backend remoted_nodes_tcp

backend remoted_nodes_tcp
    mode tcp
    # L4 decides once, when the connection opens: every request inside it lands on one node.
    server node1 127.0.0.1:1517 check
    server node2 127.0.0.1:1518 check

frontend termination_in
    mode http
    option httplog
    bind :8443 ssl crt /lab/certs/load_balancer.pem ssl-min-ver TLSv1.2
    default_backend remoted_nodes_http

backend remoted_nodes_http
    mode http

    # L7 decides per request, so one keep-alive connection is spread across both nodes.
    server node1 127.0.0.1:1517 ssl ssl-min-ver TLSv1.3 verify required ca-file /lab/certs/ca.crt verifyhost localhost sni str(localhost) crt /lab/certs/proxy_client.pem check
    server node2 127.0.0.1:1518 ssl ssl-min-ver TLSv1.3 verify required ca-file /lab/certs/ca.crt verifyhost localhost sni str(localhost) crt /lab/certs/proxy_client.pem check

    # remoted answers GET / with 200 without authentication. NOTE the caveat measured in the
    # lab: this is liveness, not readiness -- node 2 answers 200 here while dropping every
    # event with 503, and this health check keeps it in rotation regardless.
    option httpchk
    http-check send meth GET uri /
    http-check expect status 200

    http-request set-header X-Real-IP %[src]
    option forwardfor

    retries 3
    option redispatch
