# =============================================================================================
#  HAProxy equivalent of nginx/both_topologies.conf -- READ THAT ONE FIRST for the concepts.
#
#  Serves BOTH topologies at once, on the same ports NGINX uses, so the two proxies can be
#  compared by swapping which container is running and nothing else:
#     :8444  ->  passthrough  (HAProxy does not decrypt; the agent sees REMOTED's certificate)
#     :8443  ->  termination  (HAProxy decrypts and re-encrypts; the agent sees the LB's cert)
#
#  ANATOMY OF A haproxy.cfg (it is organised very differently from an nginx.conf)
#  ---------------------------------------------------------------------------
#  * There are no nested blocks. The file is a flat list of SECTIONS, each introduced by a
#    keyword in column 1, and everything indented under it belongs to that section.
#  * The sections used here:
#
#       global      process-wide settings (logging, tuning). One per file.
#       defaults    values inherited by every section declared AFTER it.
#       frontend    what HAProxy OFFERS: which port it listens on and with which certificate.
#       backend     WHERE it forwards: the group of destination servers.
#
#  * A frontend and a backend are separate objects joined by 'default_backend'. NGINX instead
#    nests 'location' inside 'server' and names an 'upstream'. Same idea, flatter syntax.
#  * 'mode' decides the layer, and it is the single most important keyword here:
#
#       mode tcp    ->  HAProxy moves bytes without understanding them.   PASSTHROUGH.
#       mode http   ->  HAProxy parses HTTP: methods, paths, headers.     TERMINATION.
#
#    NGINX expresses the same split with two different top-level blocks (stream{} vs http{});
#    HAProxy expresses it with one keyword, which is why a single mistyped 'mode' silently
#    changes the whole topology. Set it explicitly in every section, never rely on defaults.
#  * TLS lives on the 'bind' line (client side) and on the 'server' line (backend side) --
#    there is no separate directive per option like NGINX's ssl_* / proxy_ssl_*.
#
#  * Lines marked [!] are traps: changing them breaks the AES-CMAC request signature or the
#    handshake. See ../README.md (sections 10 and 11).
# =============================================================================================


global
    # Log to stdout so 'docker logs remoted-lb-haproxy' shows the traffic, the way the NGINX
    # config logs to /dev/stdout. 'format raw' drops the syslog priority prefix.
    log stdout format raw local0

    # No 'user'/'group' here: the container image already runs HAProxy as its own unprivileged
    # user, and dropping privileges twice makes it fail to start.


defaults
    # Inherited by every frontend/backend below. HAProxy warns at startup if the timeouts are
    # missing, and a missing one means "wait forever".
    log     global
    option  dontlognull

    # How long to wait for a backend to accept the TCP connection.
    timeout connect 5s

    # [!] Idle timeout on the connection FROM THE AGENT. This is HAProxy's equivalent of NGINX's
    # keepalive_timeout, and it is what an ALB calls its idle timeout (60 s by default there).
    # An agent that keeps a connection open and sends events sporadically will hit it.
    timeout client  60s

    # [!] How long to wait for remoted's answer. remoted gives itself a 30 s budget per request,
    # so anything lower here would cut off a request that was still legitimately in progress --
    # and, worse, a retry of it could then reach a second node (duplicate delivery).
    timeout server  30s


# =============================================================================================
#  TOPOLOGY A - PASSTHROUGH  (:8444)
#
#  'mode tcp' and no 'ssl' anywhere: HAProxy never sees the HTTP, so it cannot break the
#  signature even if misconfigured. The agent validates REMOTED's certificate and the agent's
#  own client certificate arrives intact, so agent mTLS genuinely works.
#
#  Managed equivalent in AWS: NLB.
# =============================================================================================
frontend passthrough_in
    mode tcp
    bind :8444

    # In tcp mode HAProxy can only log network facts -- it does not know HTTP is inside.
    option tcplog

    default_backend remoted_nodes_tcp

backend remoted_nodes_tcp
    mode tcp

    # With several servers the balancing algorithm would be chosen here ('balance roundrobin' is
    # the default). 'balance source' pins each client IP to one node, the equivalent of NGINX's
    # 'hash $remote_addr consistent'.
    server node1 127.0.0.1:1517

    # [!] DO NOT add 'send-proxy' or 'send-proxy-v2' to that server line.
    # PROXY protocol prepends the real client address to the START of the connection, before any
    # application byte. remoted does not parse it, so those bytes land where it expects the TLS
    # ClientHello and BREAK EVERY AGENT'S HANDSHAKE AT ONCE -- the same failure NGINX's
    # 'proxy_protocol on' causes, measured in breaks_handshake_proxy_protocol.cfg.


# =============================================================================================
#  TOPOLOGY B - TERMINATION + RE-ENCRYPTION  (:8443)
#
#  HAProxy decrypts, can inspect and alter everything, and opens a NEW TLS connection to
#  remoted. The agent validates the LB's certificate; the agent's client certificate DIES here
#  (a different TLS session cannot carry it); and this process is a plaintext point.
#
#  Managed equivalent in AWS: ALB.
#
#  NOTE: remoted has no plaintext listener, so the backend connection MUST be TLS. Termination
#  here always means re-encryption, exactly as with NGINX.
# =============================================================================================
frontend termination_in
    mode http
    option httplog

    # ---------------------------------------------------------------------------------
    # What HAProxy offers TO THE AGENT.
    #
    # [!] 'crt' takes ONE file containing the certificate AND its private key concatenated.
    # This is the practical difference from NGINX, which takes ssl_certificate and
    # ssl_certificate_key separately. generate_test_certificates.sh builds the combined .pem.
    #
    # In this topology the agent trusts the balancer, so this certificate's SAN must contain the
    # name the agents connect to.
    #
    # 'alpn h2,http/1.1' would also offer HTTP/2 to clients (what an ALB does); left off here so
    # this config matches nginx/both_topologies.conf exactly. See termination_http2.cfg.
    # ---------------------------------------------------------------------------------
    # [!] THE LINE THIS CONFIG EXISTS FOR: 'alpn h2,http/1.1' offers HTTP/2 through TLS ALPN,
    # exactly what an AWS ALB does towards clients while still speaking HTTP/1.1 to its targets.
    bind :8443 ssl crt /lab/certs/load_balancer.pem ssl-min-ver TLSv1.2 alpn h2,http/1.1

    default_backend remoted_nodes_http

backend remoted_nodes_http
    mode http

    # -----------------------------------------------------------------------------
    # What HAProxy opens TOWARDS REMOTED. All of it lives on the 'server' line.
    #
    # [!] THE MOST IMPORTANT LINE IN THIS FILE, and it is important for what it does NOT say:
    # there is no path rewriting here. HAProxy forwards the request target verbatim unless you
    # explicitly ask it not to (with 'http-request set-path' / 'replace-path'), so the default
    # is the safe one -- the opposite of NGINX, where a trailing slash on proxy_pass silently
    # rewrites the path and breaks the signature. See breaks_signature_path_rewrite.cfg.
    #
    #   ssl                    speak TLS to the backend (remoted has no plaintext port)
    #   ssl-min-ver TLSv1.3    [!] remoted requires TLS 1.3 as a minimum; offering 1.2 makes
    #                          the backend handshake fail and the agent sees 502/503
    #   verify required        validate remoted's certificate (HAProxy defaults to NOT verifying)
    #   ca-file                the CA that must have signed it
    #   verifyhost localhost   [!] WHICH NAME that certificate is checked against. Must appear in
    #                          the node certificate's SAN. NGINX calls this proxy_ssl_name.
    #   sni str(localhost)     send that name in the handshake (NGINX: proxy_ssl_server_name on)
    #   crt                    the CLIENT certificate HAProxy presents when remoted requires
    #                          mTLS. NOTE, THIS IS THE MAIN SECURITY FINDING: this is the
    #                          PROXY's identity, not the agent's -- with it in place remoted
    #                          accepts requests from agents that presented no certificate at all
    #   check                  enable health checking (see option httpchk below)
    # -----------------------------------------------------------------------------
    # NOTE: it must be ONE physical line. HAProxy has no line-continuation syntax -- a trailing
    # backslash is parsed as an unknown keyword, not as "continues below".
    server node1 127.0.0.1:1517 ssl ssl-min-ver TLSv1.3 verify required ca-file /lab/certs/ca.crt verifyhost localhost sni str(localhost) crt /lab/certs/proxy_client.pem check

    # Health check: remoted answers GET / with 200, unauthenticated and exempt from its in-flight
    # byte budget. CAVEAT measured in the lab: this is LIVENESS, not readiness -- a node whose
    # engine is down answers 200 here while dropping every event with 503.
    option httpchk
    http-check send meth GET uri /
    http-check expect status 200

    # Informational headers carrying the agent's real address. Adding headers is SAFE: the
    # signature does not cover them. (remoted ignores both today; reading them is one of the
    # proposed improvements, and it must only trust them from an authenticated proxy.)
    http-request set-header X-Real-IP %[src]
    option forwardfor

    # [!] RETRIES -- the trade-off with no good answer, and where HAProxy differs from NGINX by
    # DEFAULT, not by configuration:
    #
    #   'retries 3' is HAProxy's default, but 'retry-on' defaults to conn-failure only: it
    #   retries when the connection could not be established, i.e. before the request was ever
    #   sent. That is the SAFE case -- nothing was consumed, so a retry cannot duplicate.
    #
    #   NGINX's proxy_next_upstream, as configured in nginx/both_topologies.conf, also retries on
    #   http_502/http_503 -- responses, which means the request WAS delivered and may have been
    #   processed. That is what produces duplicate delivery.
    #
    # So out of the box HAProxy is the more conservative of the two. Adding
    # 'retry-on all-retryable-errors' or 'empty-response' would opt into the same duplicate
    # delivery NGINX exhibits. 'option redispatch' additionally allows the retry to go to a
    # DIFFERENT server (without it, retries hit the same one).
    retries 3
    option redispatch
