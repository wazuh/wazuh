# ===========================================================================================
#  MEANT TO FAIL -- passthrough with 'send-proxy' towards remoted
#
#  The HAProxy twin of nginx/breaks_handshake_proxy_protocol.conf, and it fails for exactly the
#  same reason: PROXY protocol prepends the real client address to the START of the TCP
#  connection, before any application byte. remoted does not parse it, so those bytes land where
#  it expects the TLS ClientHello and the handshake of EVERY agent dies. Nothing reaches HTTP, so
#  there is no status code to investigate -- only a TLS error.
#
#  'send-proxy-v2' (the binary variant, and what an AWS NLB target group would enable) fails the
#  same way.
#
#  Reproduce:
#      ./start_haproxy.sh breaks_handshake_proxy_protocol 8444
#      ./send_signed_request.py --url https://127.0.0.1:8444
#  Expected: no HTTP response, TLS/connection error
# ===========================================================================================

global
    log stdout format raw local0

defaults
    log     global
    timeout connect 5s
    timeout client  60s
    timeout server  30s

frontend passthrough_in
    mode tcp
    bind :8444
    option tcplog
    default_backend remoted_nodes_tcp

backend remoted_nodes_tcp
    mode tcp
    # [!] THE LINE THIS CONFIG EXISTS FOR.
    server node1 127.0.0.1:1517 send-proxy
