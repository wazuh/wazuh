global
    log stdout format raw local0 info
    maxconn 4096
    # The balancer leaf lives here as cert+key in one file, which is what `crt` wants.
    ca-base  /certs
    crt-base /certs

defaults
    log     global
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # Section 4.5 of the load-balancer guide: the response timeout must clear remoted's
    # own 30 s request deadline, or the balancer gives up first and the agent sees a 504
    # it cannot distinguish from a manager fault.
    timeout tunnel  90s

# ---------------------------------------------------------------------------
# :1517  TLS PASSTHROUGH (layer 4)
#
# The balancer never opens the connection. The agent's TLS peer is the BACKEND, so
# the backend leaf is the certificate the agent validates -- which is why every node
# carries the balancer names in its SAN (see FINDINGS.md L-01).
#
# Note what this model can and cannot do: a TCP frontend balances per CONNECTION.
# An agent reusing one connection stays pinned to one node for its whole lifetime.
# Only the termination frontend below spreads per REQUEST.
# ---------------------------------------------------------------------------
frontend passthrough
    mode tcp
    option tcplog
    bind *:1517
    default_backend nodes_tcp

backend nodes_tcp
    mode tcp
    # roundrobin, NOT `balance source`. Source hashing is what the API integration
    # environment uses, and it pins each agent to one node, hiding every per-node-state
    # defect this lab exists to find.
    balance roundrobin
    server master  wazuh-master:1517  check
    server worker1 wazuh-worker1:1517 check
    server worker2 wazuh-worker2:1517 check

# ---------------------------------------------------------------------------
# :1518  TLS TERMINATION AND RE-ENCRYPTION (layer 7)
#
# The balancer is the agent's TLS peer and presents its own leaf. It then opens a
# SECOND TLS 1.3 connection to the backend and verifies the backend leaf against the
# same CA. This is the model that balances per request.
# ---------------------------------------------------------------------------
frontend termination
    mode http
    option httplog
    bind *:1518 ssl crt /certs/lb-bundle.pem
    # Section 4.4: the balancer must not truncate below the manager's transport cap
    # (<remote><https><max_body_size>, 10 MiB by default). The auth middleware answers a
    # clean 413 below that, at remoted.auth_max_body_size (5 MiB by default).
    http-request set-header X-Lab-Frontend termination
    default_backend nodes_http

backend nodes_http
    mode http
    balance roundrobin
    # Node attribution for the route matrix: the issue asks to record, for every request,
    # WHICH NODE handled it. Under termination the balancer knows, so it says so. This is a
    # lab affordance, not something a production front end should leak.
    http-response set-header X-Lab-Node %[srv_name]
    # The path is never rewritten: remoted serves everything under the configured
    # global_prefix and answers 404 to anything else (section 4.1).
    option forwardfor
    server master  wazuh-master:1517  check ssl ca-file /certs/root-ca.pem verify required verifyhost wazuh-master  alpn http/1.1
    server worker1 wazuh-worker1:1517 check ssl ca-file /certs/root-ca.pem verify required verifyhost wazuh-worker1 alpn http/1.1
    server worker2 wazuh-worker2:1517 check ssl ca-file /certs/root-ca.pem verify required verifyhost wazuh-worker2 alpn http/1.1

# ---------------------------------------------------------------------------
# :1519  TLS TERMINATION with a certificate from a DIFFERENT CA
#
# The realistic production shape: the balancer presents a public or corporate certificate
# that the agent trusts, while the managers keep their own internal CA. This exists to
# show what GET /cacerts hands back in that topology.
# ---------------------------------------------------------------------------
frontend termination_public
    mode http
    option httplog
    bind *:1519 ssl crt /certs-public/lb-bundle.pem
    http-response set-header X-Lab-Node %[srv_name]
    default_backend nodes_http

# ---------------------------------------------------------------------------
# :1514 / :1515  legacy front end, for the mixed 4.x/5.x fleet
#   1514 -> every node      1515 -> the master only (identity creation is master-owned)
# ---------------------------------------------------------------------------
frontend legacy_agents
    mode tcp
    bind *:1514
    default_backend legacy_nodes

backend legacy_nodes
    mode tcp
    balance roundrobin
    server master  wazuh-master:1514  check
    server worker1 wazuh-worker1:1514 check
    server worker2 wazuh-worker2:1514 check

frontend legacy_enroll
    mode tcp
    bind *:1515
    default_backend legacy_master

backend legacy_master
    mode tcp
    server master wazuh-master:1515 check

# Stats, so a run can show which node served what.
frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
