worker_processes auto;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events { worker_connections 4096; }

# ---------------------------------------------------------------------------
# :1517  TLS PASSTHROUGH (layer 4, stream module)
# The agent's TLS peer is the BACKEND. Per connection, not per request.
# ---------------------------------------------------------------------------
stream {
    log_format basic '$remote_addr -> $upstream_addr [$protocol] $status $bytes_sent';
    access_log /dev/stdout basic;

    upstream remoted_tcp {
        # No hash directive: plain round robin. `hash $remote_addr consistent` would
        # pin each agent to one node and hide every per-node-state defect.
        server wazuh-master:1517  max_fails=0;
        server wazuh-worker1:1517 max_fails=0;
        server wazuh-worker2:1517 max_fails=0;
    }

    server {
        listen 1517;
        proxy_pass remoted_tcp;
        proxy_connect_timeout 5s;
        proxy_timeout 90s;
    }

    # Legacy front end for the mixed fleet: 1514 to every node, 1515 to the master only.
    upstream legacy_tcp {
        server wazuh-master:1514  max_fails=0;
        server wazuh-worker1:1514 max_fails=0;
        server wazuh-worker2:1514 max_fails=0;
    }
    server {
        listen 1514;
        proxy_pass legacy_tcp;
        proxy_timeout 90s;
    }

    upstream legacy_master {
        server wazuh-master:1515 max_fails=0;
    }
    server {
        listen 1515;
        proxy_pass legacy_master;
        proxy_timeout 90s;
    }
}

# ---------------------------------------------------------------------------
# :1518  TLS TERMINATION AND RE-ENCRYPTION (layer 7)
# The balancer presents its own leaf, then opens a second TLS 1.3 connection to the
# backend and verifies it against the same CA. Balances per REQUEST.
# ---------------------------------------------------------------------------
http {
    log_format lab '$remote_addr "$request" $status upstream=$upstream_addr';
    access_log /dev/stdout lab;

    upstream remoted_http {
        server wazuh-master:1517;
        server wazuh-worker1:1517;
        server wazuh-worker2:1517;
        # keepalive is deliberately NOT set: a fresh upstream pick per request is what
        # makes the cross-node behaviour observable.
    }

    server {
        listen 1518 ssl;
        http2 off;

        ssl_certificate     /certs/wazuh-lb/node.pem;
        ssl_certificate_key /certs/wazuh-lb/node-key.pem;
        ssl_protocols       TLSv1.3;

        # Section 4.4 of the guide: do not truncate below the manager's transport cap
        # (<remote><https><max_body_size>, 10 MiB by default); the auth middleware answers a
        # clean 413 below that, at remoted.auth_max_body_size (5 MiB by default).
        client_max_body_size 10m;
        # Section 4.5: clear remoted's own 30 s request deadline.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        location / {
            # Section 4.1: the target is forwarded verbatim. No rewrite, no trailing
            # slash on proxy_pass, or the configured global_prefix would be stripped
            # and every route would answer 404.
            proxy_pass https://remoted_http;
            proxy_ssl_protocols       TLSv1.3;
            proxy_ssl_trusted_certificate /certs/root-ca.pem;
            proxy_ssl_verify       on;
            proxy_ssl_verify_depth 2;
            # The backend leaf carries its own node name; verify against that.
            proxy_ssl_name         wazuh-lb-nginx;
            proxy_ssl_server_name  on;
            # Session reuse is left at nginx's default ON: it is exactly what surfaced
            # the mTLS resumption defect the remoted lab found.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Lab-Frontend termination;
        }
    }
}
