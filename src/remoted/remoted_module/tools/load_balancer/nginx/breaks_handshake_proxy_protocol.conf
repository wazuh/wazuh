# ===========================================================================================
#  MEANT TO FAIL -- passthrough with 'proxy_protocol on;' towards remoted
#
#  PROXY protocol is how an L4 balancer tells the backend the REAL client IP: it prepends one
#  extra line ("PROXY TCP4 <client> <proxy> <ports>\r\n") to the very START of the TCP
#  connection, BEFORE any application bytes. It is tempting to enable, because passthrough
#  otherwise hides the agent's address behind the balancer's.
#
#  But remoted does NOT parse that line. The prepended bytes land exactly where remoted expects
#  the TLS ClientHello to begin, the handshake fails, and EVERY AGENT'S CONNECTION BREAKS AT
#  ONCE. Nothing ever reaches HTTP, so no status code comes back -- the failure is a TLS-level
#  connection error.
#
#  Reproduce:
#      ./start_load_balancer.sh breaks_handshake_proxy_protocol 8444
#      ./send_signed_request.py --url https://127.0.0.1:8444
#  Expected: no HTTP response, TLS/connection error
#
#  Conclusion: never enable PROXY protocol towards remoted -- neither here nor as
#  'proxy_protocol_v2' on an AWS NLB target group (v2 is a binary header, same failure mode).
#  Until remoted learns to parse it, passthrough deployments simply do not see the agent IP.
#
#  Derived from both_topologies.conf (topology A), which is the one commented in full.
# ===========================================================================================

worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx-lb.pid;

events {
    worker_connections 1024;
}

stream {
    log_format lb4 '[passthrough+proxy_protocol] client=$remote_addr -> upstream=$upstream_addr '
                   'bytes_in=$bytes_received bytes_out=$bytes_sent duration=$session_time s';

    access_log /dev/stdout lb4;

    upstream remoted_nodes_tcp {
        server 127.0.0.1:1517;
    }

    server {
        listen 8444;
        proxy_pass remoted_nodes_tcp;
        proxy_connect_timeout 5s;

        # [!] THE LINE THIS CONFIG EXISTS FOR. This is the directive both_topologies.conf warns
        # against: it prepends the PROXY line to the bytes sent to remoted, which corrupts the
        # TLS handshake of every connection.
        proxy_protocol on;
    }
}
