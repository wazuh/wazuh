# ===========================================================================================
#  TERMINATION WITH A SHORT IDLE TIMEOUT -- what an ALB's 60 s idle timeout does to keep-alive
#
#  Every managed balancer closes client connections that sit idle: an AWS ALB after 60 s by
#  default, an NLB after 350 s (not configurable). An agent that keeps one connection open and
#  sends events sporadically WILL hit this. This config reproduces the behaviour with a 3 s
#  timeout instead of 60, so the test takes seconds rather than a minute -- the mechanism is
#  identical, only the number differs.
#
#  What the measurement shows:
#    * requests spaced INSIDE the timeout reuse the connection and keep working
#    * after an idle gap LONGER than the timeout, the proxy has closed the connection: the next
#      send on it fails at transport level (no HTTP response at all, not a 4xx/5xx)
#
#  The failure is clean and immediate -- no silent hang, no half-delivered request -- so a
#  client that reconnects and resends on connection errors (which agents must already do for
#  ordinary network failures) is enough. No signature or protocol implication: the request
#  never left the client, so nothing was consumed and a resend is not a duplicate.
#
#  Reproduce:
#      ./start_load_balancer.sh termination_idle_timeout
#      ./send_signed_request.py --url https://127.0.0.1:8443 --repeat 2 --keepalive --interval 1
#      ./send_signed_request.py --url https://127.0.0.1:8443 --repeat 2 --keepalive --interval 5
#  Expected: 2x 202 with the 1 s gap; with the 5 s gap the first request gets 202 and the
#  second dies on the closed connection.
#
#  Derived from both_topologies.conf (topology B), which is the one commented in full.
# ===========================================================================================

worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx-lb.pid;

events {
    worker_connections 1024;
}

http {
    log_format lb7 '[termination-idle] client=$remote_addr "$request" -> upstream=$upstream_addr '
                   'status=$status node_status=$upstream_status duration=$request_time s';

    access_log /dev/stdout lb7;

    merge_slashes off;

    upstream remoted_nodes_http {
        server 127.0.0.1:1517;
        keepalive 32;
    }

    server {
        listen 8443 ssl;
        server_name wazuh-lb.test;
        ssl_certificate     /lab/certs/load_balancer.crt;
        ssl_certificate_key /lab/certs/load_balancer.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 20m;

        # [!] THE LINE THIS CONFIG EXISTS FOR. How long an idle keep-alive connection FROM THE
        # AGENT stays open. NGINX defaults to 75 s; an ALB to 60 s (configurable), an NLB to
        # 350 s (fixed). Set to 3 s so the test measures the effect in seconds.
        keepalive_timeout 3s;

        location / {
            proxy_pass https://remoted_nodes_http;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_ssl_protocols TLSv1.3;
            proxy_ssl_trusted_certificate /lab/certs/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name localhost;
            proxy_ssl_server_name on;
            proxy_ssl_certificate     /lab/certs/proxy_client.crt;
            proxy_ssl_certificate_key /lab/certs/proxy_client.key;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 5s;
            # Kept at 30 s on purpose (remoted's own per-request budget): the short timeout
            # above applies to IDLE time between requests, not to a request in flight.
            proxy_read_timeout 30s;
        }
    }
}
