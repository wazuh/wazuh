# ===========================================================================================
#  TERMINATION WITH NO CLIENT CERTIFICATE FROM NGINX
#
#  The other half of the verification_mode=certificate finding.
#
#  With remoted requiring a client certificate and nginx presenting none, the deployment is simply
#  broken -- and it is broken IDENTICALLY whether or not the agent presents its own certificate:
#
#      ./set_manager_verification_mode.sh certificate
#      ./start_load_balancer.sh termination_without_client_cert
#      ./send_signed_request.py --url https://127.0.0.1:8443                        -> 502
#      ./send_signed_request.py --url https://127.0.0.1:8443 --client-cert ... -> 502
#
#  Compare with both_topologies.conf, where nginx DOES present one: there both cases return 202,
#  again regardless of the agent's certificate.
#
#  So in either configuration the agent's certificate is irrelevant under termination. That is the
#  finding. The 202 variant is the dangerous one, because it looks like it works.
#
#  Derived from both_topologies.conf, which is the one commented in full.
# ===========================================================================================

# =============================================================================================
#  RECOMMENDED CONFIG, AND THE ONE TO READ FIRST
#
#  Serves BOTH topologies at once so they can be compared without restarting:
#     :8444  ->  passthrough  (NGINX does not decrypt; the agent sees REMOTED's certificate)
#     :8443  ->  termination  (NGINX decrypts and re-encrypts; the agent sees the LB's certificate)
#
#  Commented line by line. If you have never read an nginx.conf, start here:
#
#  ANATOMY OF AN nginx.conf
#  ------------------------
#  * It is organised into BLOCKS (nginx calls them "contexts") delimited by { }.
#  * Each individual instruction is a DIRECTIVE and ends with a semicolon.
#  * Blocks nest, and inner blocks INHERIT from outer ones. A directive set in an inner block
#    overrides the same directive from the outer block.
#  * The two top-level blocks that matter here are ALTERNATIVES to each other:
#
#       stream { ... }   -> works with raw TCP. NGINX moves bytes without understanding them.
#                           This is "layer 4". PASSTHROUGH lives here.
#
#       http   { ... }   -> works with HTTP. NGINX understands methods, URLs and headers.
#                           This is "layer 7". TERMINATION lives here.
#
#    Both can coexist in one file, as they do here, serving different ports.
#
#  * Inside http {} there are three more blocks we use:
#
#       upstream <name> { ... }  -> a named GROUP of destination servers. This is what NGINX
#                                   balances across.
#       server { ... }           -> one "site": which port is served and with which certificate.
#       location <path> { ... }  -> a rule per URL PATH. What to do with matching requests.
#
#  * Directives prefixed with 'proxy_' configure the connection FROM NGINX TO THE BACKEND.
#    Directives WITHOUT that prefix configure the connection NGINX OFFERS TO THE CLIENT.
#    This is the single most common confusion: there are TWO separate connections, each with
#    its own directives.
#
#         agent  ──[connection 1]──>  NGINX  ──[connection 2]──>  remoted
#                    ssl_*                        proxy_ssl_*
#
#  * Lines marked [!] are traps: changing them breaks the AES-CMAC request signature and
#    returns 401 on every request. See ../README.md.
# =============================================================================================


# ------------------------------------------------------------------------------ global settings

# How many worker processes nginx spawns. Production usually sets 'auto' (one per CPU).
# Kept at 1 here so log lines from different workers do not interleave during tests.
worker_processes 1;

# Where to write errors. /dev/stderr so they show up under 'docker logs remoted-lb'.
# The second argument is the verbosity: debug, info, notice, warn, error, crit.
error_log /dev/stderr info;

# File where nginx stores its process id. Under /tmp because the container mounts its
# configuration read-only.
pid /tmp/nginx-lb.pid;

# Mandatory block, even though we do nothing special with it.
events {
    # Maximum simultaneous connections PER worker process.
    worker_connections 1024;
}


# =============================================================================================
#  TOPOLOGY A — PASSTHROUGH  (:8444)
#
#  NGINX does NOT decrypt. The encrypted session runs from the agent all the way to remoted.
#  Consequences:
#    * the agent validates REMOTED's certificate, not NGINX's
#    * NGINX cannot break the request signature even if it wanted to: it never sees the HTTP
#    * the agent's CLIENT certificate arrives intact -> agent mTLS genuinely works
#    * but NGINX is blind: it cannot filter, cannot cap body sizes, and can only balance whole
#      connections, not individual requests
#
#  Managed equivalent in AWS: NLB (Network Load Balancer).
# =============================================================================================
stream {

    # A named log line format ('lb4') referenced by access_log below. The $variables are filled
    # in by nginx. Only network facts appear here, because in this block nginx DOES NOT KNOW
    # that HTTP is inside: it cannot log the URL or the response code.
    log_format lb4 '[passthrough] client=$remote_addr -> upstream=$upstream_addr '
                   'bytes_in=$bytes_received bytes_out=$bytes_sent duration=$session_time s';

    access_log /dev/stdout lb4;

    # Destination group. With a single server it balances nothing; it exists so the second node
    # can be added later without touching anything else.
    upstream remoted_nodes_tcp {
        server 127.0.0.1:1517;

        # With several nodes, the balancing method would be chosen here. The default is
        # round-robin (one after another). The common alternative is:
        #     hash $remote_addr consistent;
        # which pins each agent IP to the same node. That is what the Wazuh cluster guide uses
        # for port 1514.
    }

    server {
        # Port served. NOTE: there is NO 'ssl' keyword here. That is precisely what makes this
        # passthrough: nginx takes no part in the encryption, so it needs no certificate.
        listen 8444;

        # Where the bytes go, untouched. In stream{} 'proxy_pass' is only a TCP destination:
        # no paths, no URLs, because nginx does not know which protocol is inside.
        proxy_pass remoted_nodes_tcp;

        # How long to wait for the destination to accept the TCP connection.
        proxy_connect_timeout 5s;

        # [!] DO NOT enable 'proxy_protocol on;'
        # PROXY protocol tells the backend the real client IP by prepending a few bytes to the
        # START of the connection. remoted does NOT parse them, so they would land where it
        # expects the TLS handshake to begin and would BREAK EVERY AGENT'S HANDSHAKE AT ONCE.
        # The same risk applies to 'proxy_protocol_v2' on an AWS NLB.
    }
}


# =============================================================================================
#  TOPOLOGY B — TERMINATION + RE-ENCRYPTION  (:8443)
#
#  NGINX decrypts, inspects, and opens a NEW encrypted connection to remoted.
#  Consequences:
#    * the agent validates the LB's certificate (the one configured below), not remoted's
#    * NGINX can inspect, filter, and balance per request
#    * the agent's CLIENT certificate DIES here and is not propagated. This is impossible to
#      work around in TLS: the connection to remoted is a different session with different keys
#    * there is a point where the traffic is in the clear: this NGINX
#
#  Managed equivalent in AWS: ALB (Application Load Balancer).
#
#  NOTE: remoted does NOT accept plaintext connections and there is no option to disable TLS.
#  That is why 'proxy_pass https://' (re-encryption) is mandatory here. The usual "terminate at
#  the balancer and go plaintext internally" setup is NOT possible with remoted.
# =============================================================================================
http {

    # Here we can log HTTP facts, because in this block nginx understands the protocol.
    #   $request         -> the full request line, e.g. POST /stateless HTTP/1.1
    #   $upstream_addr   -> which node it was sent to. On a retry, SEVERAL appear comma-separated:
    #                       that is how duplicate delivery becomes visible.
    #   $status          -> the code returned to the client
    #   $upstream_status -> the code the node returned (they differ when a retry happened)
    log_format lb7 '[termination] client=$remote_addr "$request" -> upstream=$upstream_addr '
                   'status=$status node_status=$upstream_status duration=$request_time s';

    access_log /dev/stdout lb7;

    # 'merge_slashes' makes nginx collapse repeated slashes in the URL (// -> /). Default: on.
    #
    # We initially assumed turning it off was essential, and MEASURED THAT IT IS NOT: with a
    # 'proxy_pass' that has no URI component (see below) the target is forwarded verbatim
    # anyway, even with '//' or '..'. Left off as defence in depth, but this is NOT what
    # protects the signature. See ../README.md, section 7.
    merge_slashes off;

    upstream remoted_nodes_http {
        server 127.0.0.1:1517;

        # Keep up to 32 connections to the backend OPEN and reusable instead of opening and
        # closing one per request. Saves a full TLS handshake per event. Requires the
        # 'proxy_http_version' and 'proxy_set_header Connection ""' directives below, or it has
        # no effect.
        keepalive 32;
    }

    server {
        # -----------------------------------------------------------------------------------
        # CONNECTION 1: what NGINX offers TO THE AGENT.
        # These directives have no 'proxy_' prefix.
        # -----------------------------------------------------------------------------------

        # Serve 8443, and decrypt here: that is what the 'ssl' keyword means.
        listen 8443 ssl;

        # Name of this site. Irrelevant with a single 'server' block; needed when several sites
        # share a port and are told apart by the name the client asked for.
        server_name wazuh-lb.test;

        # The certificate the AGENT sees, and its private key. In this topology the agent trusts
        # the load balancer, not remoted, so this certificate's SAN must contain the name the
        # agents connect to.
        ssl_certificate     /lab/certs/load_balancer.crt;
        ssl_certificate_key /lab/certs/load_balancer.key;

        # TLS versions accepted FROM THE AGENT. We can be permissive here: this is a different
        # connection from the one to remoted (which does require 1.3 as a minimum).
        ssl_protocols TLSv1.2 TLSv1.3;

        # [!] Maximum body size accepted. nginx defaults to 1 MB while remoted accepts 20 MB:
        # without raising this, nginx answers 413 to events remoted would have accepted, and the
        # module's real limit is never exercised.
        client_max_body_size 20m;

        # Rule for requests whose URL starts with '/'. That is, all of them.
        location / {

            # -----------------------------------------------------------------------------
            # CONNECTION 2: what NGINX opens TOWARDS REMOTED.
            # All of these directives carry the 'proxy_' prefix.
            # -----------------------------------------------------------------------------

            # [!] THE MOST IMPORTANT LINE IN THIS FILE.
            #
            # 'https://' because remoted only speaks TLS (re-encryption is mandatory).
            # 'remoted_nodes_http' is the destination group declared above.
            #
            # And the critical part: there is NOTHING after the group name. No trailing slash,
            # no path. When 'proxy_pass' has no URI component, nginx forwards the ORIGINAL
            # request target exactly as the agent sent it. Add anything, and nginx REWRITES it.
            #
            # The request signature COVERS THE TARGET, so a rewritten target means a signature
            # that no longer matches, which means 401 on every request. Measured:
            #     location /wazuh/ + proxy_pass https://backend/;   ->  401
            # Consequence: remoted cannot be published under a path prefix.
            proxy_pass https://remoted_nodes_http;

            # Speak HTTP/1.1 to the backend. nginx defaults to 1.0, which cannot reuse
            # connections. Without this, the 'keepalive 32' above does nothing.
            proxy_http_version 1.1;

            # Clear the 'Connection' header sent to the backend. Otherwise nginx sends
            # 'Connection: close' and the backend closes after each request, again defeating
            # keepalive. These two directives always accompany 'keepalive'.
            proxy_set_header Connection "";

            # [!] remoted requires TLS 1.3 as a MINIMUM. Setting TLSv1.2 here would make the
            # handshake with remoted fail and the client would see 502.
            proxy_ssl_protocols TLSv1.3;

            # [!] 'proxy_ssl_ciphers' MUST NOT BE USED HERE.
            # The natural thing is to copy the cipher list remoted documents, but that directive
            # talks to an OpenSSL function that only covers TLS 1.2 and below. With TLS 1.3
            # cipher suites NGINX FAILS TO START:
            #     [emerg] SSL_CTX_set_cipher_list("TLS_AES_256_GCM_SHA384:...") failed
            #             (SSL: error:0A0000B9 ... no cipher match)
            # Omitted on purpose: OpenSSL's TLS 1.3 defaults already include all three suites
            # remoted accepts. To pin them explicitly the correct directive is (nginx >= 1.19.4):
            #     proxy_ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;

            # Do we verify remoted's certificate? Yes. Here nginx acts as a TLS client, so it
            # performs the same checks an agent would.
            #   'trusted_certificate' -> the CA used to validate that its certificate is genuine
            #   'verify on'           -> enable the check (the default is 'off')
            #   'verify_depth'        -> how many chain links are accepted
            proxy_ssl_trusted_certificate /lab/certs/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;

            # [!] WHICH NAME remoted's certificate is checked against.
            # Without this line nginx checks against the literal upstream name
            # ('remoted_nodes_http'), which is in no certificate's SAN, and fails. It must be a
            # name that IS in the node certificate's SAN.
            #
            # IMPORTANT: this only works if remoted's certificate HAS a SAN. The one generated by
            # the installer does not, so it must be replaced first (see ../README.md, section 7).
            proxy_ssl_name localhost;

            # Send the server name during the handshake (known as SNI). Required if the backend
            # served several certificates; good practice regardless.
            proxy_ssl_server_name on;

            # The CLIENT certificate NGINX presents to remoted, for when remoted has mTLS enabled
            # (verification_mode = certificate or full).
            #
            # NOTE, THIS IS THE MAIN SECURITY FINDING: this is NGINX's identity, NOT the agent's.
            # With this in place, remoted accepts the request even when the agent presented no
            # certificate at all. Measured: 202. So 'verification_mode=certificate' in this
            # topology does NOT authenticate the agent — it authenticates the balancer.
            # DELIBERATELY ABSENT: nginx presents no client certificate here.
            # proxy_ssl_certificate     /lab/certs/proxy_client.crt;
            # proxy_ssl_certificate_key /lab/certs/proxy_client.key;

            # Informational headers carrying the agent's real IP.
            # Adding headers is SAFE: the signature does not cover them, so it cannot break.
            # (remoted reads neither of these today, so they are purely informational. Reading
            # them is one of the proposed improvements.)
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # [!] When to retry a request on ANOTHER node.
            #
            # Whatever is listed gets retried; anything else is returned to the client as-is.
            # 'error timeout' are network failures. 502/503 mean "this node cannot serve now".
            #
            # NEVER add http_401, http_400 or http_413: those are deterministic client faults
            # (bad signature, malformed body, oversized body). Retrying them on another node
            # produces the very same error and only multiplies load.
            #
            # And there is a TRADE-OFF with no good answer, measured in ../README.md section 7:
            #   with this line -> no requests are lost, but DUPLICATE DELIVERY is possible
            #                     (the same request reaches two nodes)
            #   with 'off'     -> no duplicates, but one request is LOST per node-failure window
            proxy_next_upstream error timeout http_502 http_503;

            # How long to wait for remoted to accept the connection...
            proxy_connect_timeout 5s;
            # ...and how long to wait for its answer. remoted has a 30 s internal budget per
            # request, so anything lower would cut it off before remoted gives up.
            proxy_read_timeout 30s;
        }
    }
}
