# ===========================================================================================
#  TERMINATION WITH HTTP/2 TOWARDS THE AGENT -- what an AWS ALB does
#
#  An ALB negotiates HTTP/2 with clients that offer it (via TLS ALPN) while speaking HTTP/1.1
#  to its targets. This config reproduces exactly that split with NGINX, so the two questions
#  an ALB deployment raises can be measured locally:
#
#    1. Does an h2 client's signed request survive the h2 -> HTTP/1.1 conversion?
#       It should: the AES-CMAC canonical string covers method, target, agent id, timestamp
#       and body -- all of which exist identically in both HTTP versions. Framing is not
#       signed, exactly like transfer encoding.
#    2. Does a client that only speaks HTTP/1.1 (today's agent) still work against an
#       h2-enabled listener? It should: ALPN falls back to HTTP/1.1.
#
#  Reproduce (the signature comes from the probe, the h2 request from curl):
#      ./start_load_balancer.sh termination_http2
#      BODY='H {"wazuh":{"agent":{"id":"1001"}}}'$'\n''E 1:/var/log/syslog:h2 test'
#      AUTH=$(./send_signed_request.py --print-auth --body "$BODY")
#      curl -sk --http2 -H "protocol-version: 1" -H "Authorization: $AUTH" \
#           --data-binary "$BODY" https://127.0.0.1:8443/stateless
#  Expected: 202 over HTTP/2 (curl -w '%{http_version}' prints "2"), and the probe (HTTP/1.1
#  only) still gets 202 against the same port.
#
#  Derived from both_topologies.conf (topology B), which is the one commented in full.
# ===========================================================================================

worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx-lb.pid;

events {
    worker_connections 1024;
}

http {
    #   $server_protocol -> which HTTP version the CLIENT spoke: HTTP/1.1 or HTTP/2.0.
    #   The upstream side is always HTTP/1.1 (proxy_http_version below), like an ALB.
    log_format lb7 '[termination-h2] client=$remote_addr proto=$server_protocol "$request" -> '
                   'upstream=$upstream_addr status=$status node_status=$upstream_status '
                   'duration=$request_time s';

    access_log /dev/stdout lb7;

    merge_slashes off;

    upstream remoted_nodes_http {
        server 127.0.0.1:1517;
        keepalive 32;
    }

    server {
        listen 8443 ssl;

        # [!] THE LINE THIS CONFIG EXISTS FOR. Offers h2 through TLS ALPN: a client that asks
        # for it (curl --http2) gets HTTP/2, one that does not (the probe, today's agent) keeps
        # HTTP/1.1 on the very same port. This is the ALB behaviour.
        http2 on;

        server_name wazuh-lb.test;
        ssl_certificate     /lab/certs/load_balancer.crt;
        ssl_certificate_key /lab/certs/load_balancer.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 20m;

        location / {
            # No URI component: the signed target is forwarded verbatim (see both_topologies).
            proxy_pass https://remoted_nodes_http;

            # The backend side stays HTTP/1.1 regardless of what the client spoke -- NGINX has
            # no proxy_http_version 2, and an ALB behaves the same way towards its targets.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_ssl_protocols TLSv1.3;
            proxy_ssl_trusted_certificate /lab/certs/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name localhost;
            proxy_ssl_server_name on;
            proxy_ssl_certificate     /lab/certs/proxy_client.crt;
            proxy_ssl_certificate_key /lab/certs/proxy_client.key;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
