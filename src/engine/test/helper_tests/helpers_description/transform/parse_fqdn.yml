# Name of the helper function
name: parse_fqdn

metadata:
  description: |
    Checks that the input string is a fully qualified domain name and stores it in the target field.

    Behavior:
    - Accepts one or more characters from `A-Z`, `a-z`, `0-9`, `.` and `-`, at most 253 characters in
      total, not starting with `.` and without two consecutive dots.
    - Label length (63) and leading or trailing hyphens are not checked; underscores are not accepted.
    - The whole input must match; the string is stored unchanged and replaces the target field.

    Build errors:
    - `input` is not a reference, or references a schema field that is not a string.
    - A number of arguments other than 1.
    - The target field is a schema field that is not text-like (text, keyword, wildcard and the like).

    Notes:
    - `parse_uri` extracts the domain of a URL.
  group: parse
  fails_when:
    - The input field does not exist or is not a string.
    - The input has a character outside the accepted set, starts with a dot, has two consecutive dots or
      is longer than 253 characters.

helper_type: transform

# Indicates whether the helper function supports a variable number of arguments
is_variadic: false

# Arguments expected by the helper function
arguments:
  input:
    type: string
    generate: string
    source: reference

# string generation is random, and the previous value of the target is replaced whatever its type
skipped:
  - success_cases
  - different_target_field_type

target_field:
  type: string
  generate: string

test:
  - arguments:
      input: www.someurl.co
    target_field: any_value
    should_pass: true
    expected: www.someurl.co
    description: A domain name is stored unchanged
  - arguments:
      input: www.some~url.com
    target_field: any_value
    should_pass: false
    expected: any_value
    description: Fails on a character outside the accepted set
  - arguments:
      input: .example.com
    target_field: any_value
    should_pass: false
    expected: any_value
    description: Fails on a leading dot
  - arguments:
      input: www..example.com
    target_field: any_value
    should_pass: false
    expected: any_value
    description: Fails on two consecutive dots
  - arguments:
      input: www.some~url.com
    target_field: [any_value]
    should_pass: false
    expected: [any_value]
    description: An array target is left unchanged when the input is not a domain name
  - arguments:
      input: www.some~url.com
    target_field:
      key: value
    should_pass: false
    expected:
      key: value
    description: An object target is left unchanged when the input is not a domain name
