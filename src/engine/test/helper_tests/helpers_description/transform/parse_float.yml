# Name of the helper function
name: parse_float

metadata:
  description: |
    Converts the input string to a 32-bit floating-point number and stores it in the target field.

    Behavior:
    - The input must match `-?[0-9]+(.[0-9]*)?([eE][+-]?[0-9]+)?`: an optional minus sign, digits, an
      optional fraction and an optional exponent; no plus sign, no leading `.`, no `inf` or `nan`, no
      surrounding spaces.
    - The value is stored with 32-bit precision, so `23.45234` becomes `23.45233917236328`.
    - The number replaces the target field.

    Build errors:
    - `input` is not a reference, or references a schema field that is not a string.
    - A number of arguments other than 1.
    - The target field is a schema field that is not float, half_float, scaled_float or double.

    Notes:
    - `parse_double` keeps 64-bit precision.
  group: parse
  fails_when:
    - The input field does not exist or is not a string.
    - The input is not a number in the accepted syntax.

helper_type: transform

# Indicates whether the helper function supports a variable number of arguments
is_variadic: false

# Arguments expected by the helper function
arguments:
  input:
    type: string
    generate: string
    source: reference

# string generation is random, and the previous value of the target is replaced whatever its type
skipped:
  - success_cases
  - different_target_field_type

target_field:
  type: number
  generate: double

test:
  - arguments:
      input: "23.45234"
    target_field: any_value
    should_pass: true
    expected: 23.45233917236328
    description: The value is stored with 32-bit precision
  - arguments:
      input: hello
    target_field: any_value
    should_pass: false
    expected: any_value
    description: Fails on a string that is not a number
  - arguments:
      input: hello
    target_field: [any_value]
    should_pass: false
    expected: [any_value]
    description: An array target is left unchanged when the input is not a number
  - arguments:
      input: hello
    target_field:
      key: value
    should_pass: false
    expected:
      key: value
    description: An object target is left unchanged when the input is not a number
