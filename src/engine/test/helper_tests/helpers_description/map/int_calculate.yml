# Name of the helper function
name: int_calculate

metadata:
  description: |
    Applies an arithmetic operator to two or more integer operands, from left to right, and maps the
    64-bit integer result to the target field.

    Behavior:
    - `operator` is one of the literals `sum`, `sub`, `mul` and `div`; it is applied to the first two
      operands, then to that result and the next operand, and so on.
    - An operand literal must be a JSON integer; an operand reference must hold an integer at runtime.
    - `sum`, `sub` and `mul` fail when the result overflows the signed 64-bit range.
    - `div` is integer division truncating toward zero: `7 / 2` gives `3` and `-7 / 2` gives `-3`;
      `-2^63 / -1` fails.

    Build errors:
    - `operator` is not a literal or is not one of the four names.
    - An operand literal that is not an integer (`1.0`, `1.1` or `true`).
    - An operand schema field whose type is not `integer`, `short` or `long` (`byte`,
      `unsigned_long` and `float` are rejected).
    - With `div`, a literal `0` in any position after the first operand.

    Notes:
    - The result is an integer: a `float` or `double` target rejects it at runtime.
    - `float_calculate` computes in double precision and accepts floating-point operands.
  group: number
  fails_when:
    - "an operand reference is missing or does not hold an integer"
    - "a divisor read from a reference is 0"
    - "the result overflows the signed 64-bit range"

helper_type: map

is_variadic: true

arguments:
  operator:
    type: string
    source: value
    generate: string
    restrictions:
      allowed:
        - mul
        - div
        - sub
        - sum
  operand_left:
    type: number
    generate: integer
    source: both
  operand_right:
    type: number
    generate: integer
    source: both

skipped:
  - different_type
  - success_cases # the generator can generate a 0 in the numerator

general_restrictions:
  - arguments:
      operator: div
      operand_right: 0
    details: Division by zero is not allowed (the function will fail).
  - details: The limit for a 64-bit integer is 2^63-1 and -2^63.

output:
  type: number
  subset: integer

test:
  - arguments:
      operator: sum
      operand_left: 1
      operand_right: 9223372036854775807
    should_pass: false
    description: Fail on a sum that overflows the 64-bit integer limit
  - arguments:
      operator: sum
      operand_left: -1
      operand_right: -9223372036854775808
    should_pass: false
    description: Fail on a sum that overflows the 64-bit integer limit
  - arguments:
      operator: sub
      operand_left: 9223372036854775807
      operand_right: -1
    should_pass: false
    description: Fail on a subtraction that overflows the 64-bit integer limit
  - arguments:
      operator: sub
      operand_left: -9223372036854775808
      operand_right: 1
    should_pass: false
    description: Fail on a subtraction that overflows the 64-bit integer limit
  - arguments:
      operator: mul
      operand_left: 4611686018427387904
      operand_right: 2
    should_pass: false
    description: Fail on a multiplication that overflows the 64-bit integer limit
  - arguments:
      operator: mul
      operand_left: 3074457345618258603
      operand_right: -3
    should_pass: false
    description: Fail on a multiplication that overflows the 64-bit integer limit
  - arguments:
      operator: div
      operand_left: 0
      operand_right: 8
    should_pass: true
    expected: 0
    description: Divide a zero numerator, which gives zero as long as the divisor is not zero
  - arguments:
      operator: div
      operand_left: 5
      operand_right: 0
    should_pass: false
    description: Fail on a division by zero
  - arguments:
      operator: div
      operand_left: 7
      operand_right: 2
    should_pass: true
    expected: 3
    description: Truncate the quotient of a positive division toward zero
  - arguments:
      operator: div
      operand_left: -7
      operand_right: 2
    should_pass: true
    expected: -3
    description: Truncate the quotient of a negative division toward zero
  - arguments:
      operator: div
      operand_left: -9223372036854775808
      operand_right: -1
    should_pass: false
    description: Fail on the division of the minimum integer by -1, which overflows
  - arguments:
      operator: sum
      operand_left: 1
      operand_right: 2
      operand_right_1: 3
    should_pass: true
    expected: 6
    description: Apply the operator from left to right over more than two operands
