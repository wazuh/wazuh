# Name of the helper function
name: decode_base16

metadata:
  description: |
    The operation transforms a string of hexa digits into an ASCII string. The result of the operation is mapped to “field”.
    If the “field” already exists, then it will be replaced. In case of errors “field” will not be modified.
    A string is valid when it has an even number of hexadecimal digits ([0-9A-Fa-f]) and every decoded byte is ASCII
    (0x00-0x7F); otherwise the operation fails.
    The reference can also be an array. Then “field” receives an array of the same length where every string element
    that is valid hexadecimal is decoded and every other element (plain text, invalid hexadecimal, non-ASCII result,
    non-string) is kept unchanged; the operation does not fail on them. An empty array produces an empty array.
    The helper cannot tell plain text that happens to be valid hexadecimal (for example "1234" or "4142") from an encoded
    value: such an element is decoded. Use the array form only on values that a source encodes in hexadecimal, such as
    the unquoted auditd EXECVE arguments.
  keywords:
    - undefined

helper_type: map

# Indicates whether the helper function supports a variable number of arguments
is_variadic: False

# Arguments expected by the helper function
arguments:
  hex:
    type:
      - string
      - array
    generate: hexadecimal
    source: reference # Includes only references (their names start with $)

skipped:
  - success_cases

output:
  type:
    - string
    - array

test:
  - arguments:
      hex: 48656C6C6F20776F726C6421
    should_pass: true
    expected: "Hello world!"
    description: Convert base 16 to decimal
  - arguments:
      hex: 48656C6C6F20776F726C64
    should_pass: true
    expected: "Hello world"
    description: Convert base 16 to ASCII
  - arguments:
      hex: 48656C6C6F20776F726C6
    should_pass: false
    description: Fail on an odd number of hexadecimal digits
  - arguments:
      hex: 48656C6C6G
    should_pass: false
    description: Fail on a character that is not a hexadecimal digit
  - arguments:
      hex: CAFE
    should_pass: false
    description: Fail when a decoded byte is not ASCII
  - arguments:
      hex: ["/usr/bin/sudo", "grep", "6B65793D226172742D7465737422", "/var/log/audit/audit.log"]
    should_pass: true
    expected: ["/usr/bin/sudo", "grep", "key=\"art-test\"", "/var/log/audit/audit.log"]
    description: Decode only the hexadecimal elements of an array (auditd EXECVE arguments)
  - arguments:
      hex: ["2F746D702F612062", "6B65793D226172742D7465737422"]
    should_pass: true
    expected: ["/tmp/a b", "key=\"art-test\""]
    description: Decode an array whose elements are all hexadecimal
  - arguments:
      hex: ["/usr/bin/sudo", "grep", "-r", "CAFE", "41G2"]
    should_pass: true
    expected: ["/usr/bin/sudo", "grep", "-r", "CAFE", "41G2"]
    description: Keep an array without valid hexadecimal elements unchanged
  - arguments:
      hex: []
    should_pass: true
    expected: []
    description: An empty array produces an empty array
  - arguments:
      hex: [1, "4142", true, {"key": "4142"}]
    should_pass: true
    expected: [1, "AB", true, {"key": "4142"}]
    description: Keep the elements that are not strings unchanged
