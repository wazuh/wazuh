# Name of the helper function
name: concat_any

metadata:
  description: |
    Concatenates two or more values in argument order, without a separator, skipping the references
    that are missing, and maps the resulting string to the target field.

    Behavior:
    - Every argument is a literal or a reference of type string, number or object.
    - A missing reference contributes nothing; the other arguments are concatenated as `concat`
      does: strings as is, literal numbers and objects as compact JSON, referenced integers in
      decimal, referenced doubles with 6 fixed decimals and referenced objects as compact JSON.
    - At least one argument must resolve: a literal always does.

    Build errors:
    - Fewer than 2 arguments.
    - A literal that is a boolean, an array or `null`.
    - A referenced schema field whose type is not string, number or object.

    Notes:
    - `concat` fails as soon as one reference is missing; both give the same result when every
      reference exists.
    - `array_append_any` is the array counterpart: it skips missing references too.
  group: string
  fails_when:
    - "every argument is a reference and all of them are missing"
    - "a referenced field that exists is a boolean, an array, `null` or an integer above 2^63-1"

helper_type: map

is_variadic: true

arguments:
  value:
    type:
      - string
      - number
      - object
    source: both

# The generator builds a call with one argument per declared argument, below the minimum of two
skipped:
  - success_cases

output:
  type: string
  subset: string

test:
  - arguments:
      value: "hello"
      value_1: " "
      value_2: "yes"
    should_pass: true
    expected: hello yes
    description: Concatenate several strings in argument order
  - arguments:
      value:
        source: reference
        value: null
      value_1:
        source: reference
        value: "hello"
    should_pass: true
    expected: hello
    description: Skip a missing reference and keep the one that exists
  - arguments:
      value:
        source: reference
        value: null
      value_1:
        source: value
        value: "hello"
    should_pass: true
    expected: hello
    description: Skip a missing reference and keep the literal
  - arguments:
      value:
        source: reference
        value: null
      value_1:
        source: reference
        value: null
    should_pass: false
    description: Fail when every argument is a missing reference
  - arguments:
      value:
        source: reference
        value: true
      value_1:
        source: value
        value: "hello"
    should_pass: false
    description: Fail when a referenced field exists but is a boolean
