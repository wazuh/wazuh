# Name of the helper function
name: epoch_to_date

metadata:
  description: |
    Converts a number of seconds since the Unix epoch to a UTC date string and maps it to the target
    field.

    Behavior:
    - `epoch` is a reference to a number, an integer or a double, read as seconds; negative values and
      fractions are accepted.
    - The result has the form `YYYY-MM-DDTHH:MM:SS.ffffffZ`, always with 6 fractional digits: `0`
      gives `1970-01-01T00:00:00.000000Z` and `1727218980.597629` gives
      `2024-09-24T23:03:00.597629Z`.

    Build errors:
    - `epoch` is a literal.
    - `epoch` is a schema field whose type is not a number.

    Notes:
    - `now` writes the current time with no fractional part; `parse_date` writes 3 fractional digits.
    - `date_to_epoch` is the inverse conversion and returns a double.
  group: date
  fails_when:
    - '`epoch` is missing or is not a number (a numeric string such as "1706172785" fails)'
    - "`epoch` is above 2^63-1"

helper_type: map

is_variadic: false

arguments:
  epoch:
    type: number
    generate:
      - integer
      - float
      - double
    source: reference

output:
  type: string
  subset: string

test:
  - arguments:
      epoch: 0
    should_pass: true
    expected: '1970-01-01T00:00:00.000000Z'
    description: Convert the epoch start
  - arguments:
      epoch: 1715958658
    should_pass: true
    expected: '2024-05-17T15:10:58.000000Z'
    description: Convert an integer number of seconds
  - arguments:
      epoch: 1727218980.597629
    should_pass: true
    expected: '2024-09-24T23:03:00.597629Z'
    description: Keep the fraction of a double number of seconds, with 6 digits
  - arguments:
      epoch: -1
    should_pass: true
    expected: '1969-12-31T23:59:59.000000Z'
    description: Convert a negative number of seconds, before the epoch
  - arguments:
      epoch: "1715958658"
    should_pass: false
    description: Fail on a string, even when it holds a number
