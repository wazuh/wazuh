# Name of the helper function
name: is_string

metadata:
  description: |
    Checks whether the target field holds a JSON string.

    Behavior:
    - True when the target exists and its JSON type is string; the string may be empty.
    - A missing target gives false.
    - No arguments are accepted.

    Build errors:
    - The target is neither a schema field nor a temporary field rooted at `_`.
    - Any argument is given.

    Notes:
    - `is_not_string` is not the negation of this helper: both are false for a missing field.
  group: type
  fails_when:
    - The target field does not exist.
    - The target field is not a string.

helper_type: check

# Indicates whether the helper function supports a variable number of arguments
is_variadic: false

target_field:
  type: string
  generate: string

test:
  - target_field:
      key: value
    should_pass: false
    description: The target field is an object, not a string.
  - target_field: [1,2,3,4]
    should_pass: false
    description: The target field is an array, not a string.
  - target_field: 42
    should_pass: false
    description: The target field is a number, not a string.
  - target_field: hello
    should_pass: true
    description: The target field is a string.
  - target_field: ""
    should_pass: true
    description: An empty string is a string.
