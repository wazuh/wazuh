# Name of the helper function
name: is_array

metadata:
  description: |
    Checks whether the target field holds a JSON array.

    Behavior:
    - True when the target exists and its JSON type is array; the array may be empty.
    - A missing target gives false.
    - No arguments are accepted.

    Build errors:
    - The target is neither a schema field nor a temporary field rooted at `_`.
    - Any argument is given.

    Notes:
    - `array_length_eq` additionally checks the number of elements.
    - `is_not_array` is not the negation of this helper: both are false for a missing field.
  group: type
  fails_when:
    - The target field does not exist.
    - The target field is not an array.

helper_type: check

# Indicates whether the helper function supports a variable number of arguments
is_variadic: false

target_field:
  type: array
  generate: all

test:
  - target_field: [1,2,3,4]
    should_pass: true
    description: The target field is an array.
  - target_field: false
    should_pass: false
    description: The target field is a boolean, not an array.
  - target_field: "false"
    should_pass: false
    description: The target field is a string, not an array.
  - target_field:
      key: value
    should_pass: false
    description: The target field is an object, not an array.
