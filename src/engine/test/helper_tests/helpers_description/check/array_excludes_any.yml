# Name of the helper function
name: array_excludes_any

metadata:
  description: |
    Checks whether at least one argument is not an element of the target array.

    Behavior:
    - Variadic: from 1 to 150 arguments of any JSON type, literals or references.
    - Each argument is compared with the elements using deep JSON equality: the types must match (`"1"` is not
      `1`), numbers compare by value (`1` equals `1.0`), strings byte by byte, arrays element by element in
      order, and objects member by member regardless of the member order.
    - A reference whose value is an array is matched as a single element; it is not spread.
    - True as soon as one argument that resolves is absent from the array, that is, when not all of the
      arguments are present. References that do not exist are skipped: they do not count as absent.

    Build errors:
    - No argument is given, or more than 150.

    Notes:
    - `array_excludes_all` requires that none of the arguments is present; with one argument the two helpers
      are identical.
    - Not the negation of `array_contains_all`: both are false for a missing or non-array target and when the
      only arguments are references that do not exist.
  group: array
  fails_when:
    - The target field does not exist.
    - The target field is not an array.
    - Every argument that resolves is an element of the array.
    - Every argument is a reference that does not exist.

helper_type: check

# Indicates whether the helper function supports a variable number of arguments
is_variadic: true

# Arguments expected by the helper function
arguments:
  element:
    type:
      - object
      - array
      - number
      - string
      - boolean
    source: both # includes values or references (their names start with $)

# the generated success cases are not meaningful for this check
skipped:
  - success_cases

target_field:
  type: array
  generate: all

test:
  - arguments:
      element:
        source: value
        value: iscsi
      element_1:
        source: reference
        value: null
    target_field:
      - dracut
      - lvm2
    should_pass: true
    description: A reference that does not exist is skipped, and the other element is absent from the array.
  - arguments:
      element:
        source: reference
        value: null
    target_field:
      - dracut
      - lvm2
    should_pass: false
    description: The only argument is a reference that does not exist, which does not count as absent.
  - arguments:
      element: dracut
      element_1: vz-start
      element_2: thin-provisioning-tools
    target_field:
      - mkinitramfs
      - cryptroot
      - framebuffer
      - dracut
      - thin-provisioning-tools
      - lvm2
      - vz-start
    should_pass: false
    description: All the specified strings are elements of the array.
  - arguments:
      element: dracut
      element_1: vz-start
      element_2: iscsi
    target_field:
      - mkinitramfs
      - cryptroot
      - framebuffer
      - dracut
      - thin-provisioning-tools
      - lvm2
      - vz-start
    should_pass: true
    description: One of the specified strings ("iscsi") is not an element of the array.
  - arguments:
      element: 2
      element_1: 1
      element_2: 5
    target_field:
      - 1
      - 2
      - 3
      - 4
      - 5
    should_pass: false
    description: All the specified numbers are elements of the array.
  - arguments:
      element: iscsi
    target_field: dracut
    should_pass: false
    description: The target field is a string, not an array.
  - arguments:
      element:
        key: value
      element_1:
        key1: value1
      element_2:
        key2: value2
    target_field:
      - key: value
      - key1: value1
      - key2: value2
    should_pass: false
    description: All the specified objects are elements of the array.
  - arguments:
      element:
        key: value
      element_1:
        key-non-exists: value-non-exists
      element_2:
        keyn: valuen
    target_field:
      - key: value
      - key1: value1
      - key2: value2
    should_pass: true
    description: Two of the specified objects are not elements of the array.
  - arguments:
      element:
        key: value
      element_1: 1
      element_2: value
    target_field:
      - key: value
      - 1
      - value
    should_pass: false
    description: The specified object, number and string are all elements of the array.
