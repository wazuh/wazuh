# Name of the helper function
name: number_eq

metadata:
  description: |
    Checks whether the target number is equal to `value`.

    Behavior:
    - Two integers are compared exactly as 64-bit integers, whatever their magnitude: `9007199254740993` and
      `9007199254740992` are different numbers.
    - When either operand is a floating-point number, both are compared as doubles: `2` equals `2.0` and `3` is
      greater than `2.9`. Nothing is rounded or truncated.
    - Integers are exact from -2^63 to 2^64-1; an integer beyond that range is read as a double.
    - An integer compared with a floating-point number is exact only up to 2^53 (the precision of a double); above
      that the integer loses its low bits in the conversion. Keep large counters and epoch timestamps (milliseconds
      or nanoseconds) as integers on both sides.
    - `value` is a literal integer or floating-point number, or a reference to a numeric field.
    - Strings, booleans and null are never numbers, not even `"2"`: the check fails.

    Build errors:
    - `value` is a literal that is not a number (a quoted number, a boolean or null).
    - `value` is a reference to a schema field whose type is not numeric.
    - The target is a schema field whose type is not numeric.

    Notes:
    - The `==` operator (`$field == 2`) is the generic `filter`, which compares JSON values: `2` and `2.0` are equal there
      too, but an unsigned 64-bit integer and the negative integer with the same bit pattern compare equal. This helper
      is the form to use when the right side is a reference or the integers are large.
    - `one_of` compares the target against several candidates.
    - `number_ne` is not the negation of this helper: both are false for a missing or non-number target.
  group: comparison
  fails_when:
    - The target field does not exist.
    - The target field is not a number.
    - The reference given as `value` does not exist or is not a number.
    - The two numbers differ.

helper_type: check

# Indicates whether the helper function supports a variable number of arguments
is_variadic: false

# Arguments expected by the helper function
arguments:
  value:
    type: number
    generate:
      - integer
      - float
      - double
    source: both # includes values or references (their names start with $)

# do not compare with target field to avoid failure
skipped:
  - success_cases

target_field:
  type: number
  generate: number

test:
  - arguments:
      value: 2
    target_field: 2.0
    should_pass: true
    description: An integer and a floating-point number with the same value are equal.
  - arguments:
      value: 2.9
    target_field: 3
    should_pass: false
    description: An integer and a floating-point number that differ are not equal; nothing is rounded.
  - arguments:
      value: 9007199254740992
    target_field: 9007199254740993
    should_pass: false
    description: Two integers above 2^53 are compared exactly, so they differ.
  - arguments:
      value: 9007199254740993
    target_field: 9007199254740993
    should_pass: true
    description: Two equal integers above 2^53 are equal.
  - arguments:
      value: 18446744073709551615
    target_field: 18446744073709551615
    should_pass: true
    description: Unsigned 64-bit integers are compared exactly.
  - arguments:
      value: 2.5
    target_field: 2.5
    should_pass: true
    description: The two floating-point numbers are equal.
  - arguments:
      value: 2
    target_field: "2"
    should_pass: false
    description: The target field is a string, not a number.
