# Name of the helper function
name: is_number

metadata:
  description: |
    Checks whether the target field holds a JSON number.

    Behavior:
    - True when the target exists and its JSON type is number: integers and floating-point values both qualify.
    - A string holding digits is not a number.
    - A missing target gives false.
    - No arguments are accepted.

    Build errors:
    - The target is neither a schema field nor a temporary field rooted at `_`.
    - Any argument is given.

    Notes:
    - There is no integer-only type check: `2` and `2.0` are both numbers, and the `number_*` comparisons treat
      them as equal.
    - `is_not_number` is not the negation of this helper: both are false for a missing field.
  group: type
  fails_when:
    - The target field does not exist.
    - The target field is not a number.

helper_type: check

# Indicates whether the helper function supports a variable number of arguments
is_variadic: false

target_field:
  type: number
  generate: number

test:
  - target_field:
      key: value
    should_pass: false
    description: The target field is an object, not a number.
  - target_field: [1,2,3,4]
    should_pass: false
    description: The target field is an array, not a number.
  - target_field: hello
    should_pass: false
    description: The target field is a string, not a number.
  - target_field: "23"
    should_pass: false
    description: A string holding digits is not a number.
  - target_field: true
    should_pass: false
    description: The target field is a boolean, not a number.
  - target_field: 23
    should_pass: true
    description: The target field is an integer.
  - target_field: 23.23
    should_pass: true
    description: The target field is a floating-point number.
