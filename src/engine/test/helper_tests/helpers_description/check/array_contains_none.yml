# Name of the helper function
name: array_contains_none

metadata:
  description: |
    Checks whether none of the arguments is an element of the target array.

    Behavior:
    - Variadic: from 1 to 150 arguments of any JSON type, literals or references.
    - Each argument is compared with the elements using deep JSON equality: the types must match (`"1"` is not
      `1`), numbers compare by value (`1` equals `1.0`), strings byte by byte, arrays element by element in
      order, and objects member by member regardless of the member order.
    - A reference whose value is an array is matched as a single element; it is not spread.
    - True only when every argument is absent from the array. A reference that does not exist cannot be
      proven absent, so it makes the check fail.

    Build errors:
    - No argument is given, or more than 150.

    Notes:
    - `array_contains_any` is the positive counterpart; both are false for a missing or non-array target, so
      neither is the `NOT` of the other.
    - Not the negation of `array_contains_any`: both are false for a missing or non-array target and for a
      reference that does not exist.
  group: array
  fails_when:
    - The target field does not exist.
    - The target field is not an array.
    - Any argument is an element of the array.
    - Any reference argument does not exist.

helper_type: check

# Indicates whether the helper function supports a variable number of arguments
is_variadic: true

# Arguments expected by the helper function
arguments:
  element:
    type:
      - object
      - array
      - number
      - string
      - boolean
    source: both # includes values or references (their names start with $)

# the generated success cases are not meaningful for this check
skipped:
  - success_cases

target_field:
  type: array
  generate: all

test:
  - arguments:
      element:
        source: value
        value: iscsi
      element_1:
        source: reference
        value: null
    target_field:
      - dracut
      - lvm2
    should_pass: false
    description: A reference that does not exist cannot be proven absent, so the check fails although the other element is absent.
  - arguments:
      element: dracut
      element_1: vz-start
      element_2: thin-provisioning-tools
    target_field:
      - mkinitramfs
      - cryptroot
      - framebuffer
      - dracut
      - thin-provisioning-tools
      - lvm2
      - vz-start
    should_pass: false
    description: All the specified strings are elements of the array.
  - arguments:
      element: dracut
      element_1: hello
      element_2: wazuh
    target_field:
      - mkinitramfs
      - cryptroot
      - framebuffer
      - dracut
      - thin-provisioning-tools
      - lvm2
      - vz-start
    should_pass: false
    description: One of the specified strings ("dracut") is an element of the array.
  - arguments:
      element: 7
      element_1: 1
      element_2: 8
    target_field:
      - 1
      - 2
      - 3
      - 4
      - 5
    should_pass: false
    description: One of the specified numbers (1) is an element of the array.
  - arguments:
      element: iscsi
    target_field: dracut
    should_pass: false
    description: The target field is a string, not an array.
  - arguments:
      element:
        key: value
      element_1:
        key-non-exists: value-non-exists
      element_2:
        keyn: valuen
    target_field:
      - key: value
      - key1: value1
      - key2: value2
    should_pass: false
    description: One of the specified objects is an element of the array.
  - arguments:
      element:
        keyn: valuen
      element_1: 1000
      element_2: valuen
    target_field:
      - key: value
      - 1000
      - value
    should_pass: false
    description: One of the specified values (1000) is an element of the array.
  - arguments:
      element:
        key1: value1
      element_1: 10
      element_2: valuen
    target_field:
      - key: value
      - 1000
      - value
    should_pass: true
    description: None of the specified values is an element of the array.
