# Name of the helper function
name: is_not_null

metadata:
  description: |
    Checks whether the target field exists and holds a value other than `null`.

    Behavior:
    - True when the target exists and its value is not the JSON literal `null`; `""`, `0`, `false`, `[]` and
      `{}` all qualify.
    - A missing target gives false, so this is not the same as `NOT is_null(...)`, which is true for a
      missing field.
    - No arguments are accepted.

    Build errors:
    - The target is neither a schema field nor a temporary field rooted at `_`.
    - Any argument is given.

    Notes:
    - `exists` also accepts a null value; this helper is the stricter check.
  group: type
  fails_when:
    - The target field does not exist.
    - The target field is null.

helper_type: check

# Indicates whether the helper function supports a variable number of arguments
is_variadic: false

target_field:
  type:
    - number
    - string
    - boolean
    - array
    - object

test:
  - target_field: null
    should_pass: false
    description: The target field is present with the value null.
  - target_field: "hello"
    should_pass: true
    description: A string value is not null.
  - target_field: 0
    should_pass: true
    description: The number 0 is not null.
  - target_field: true
    should_pass: true
    description: A boolean value is not null.
  - target_field: [1]
    should_pass: true
    description: An array value is not null.
  - target_field:
      key: value
    should_pass: true
    description: An object value is not null.
