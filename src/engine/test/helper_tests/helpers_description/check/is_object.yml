# Name of the helper function
name: is_object

metadata:
  description: |
    Checks whether the target field holds a JSON object.

    Behavior:
    - True when the target exists and its JSON type is object.
    - A missing target gives false.
    - No arguments are accepted.

    Build errors:
    - The target is neither a schema field nor a temporary field rooted at `_`.
    - Any argument is given.

    Notes:
    - `has_only_keys` additionally restricts the keys an object may carry.
    - `is_not_object` is not the negation of this helper: both are false for a missing field.
  group: type
  fails_when:
    - The target field does not exist.
    - The target field is not an object.

helper_type: check

# Indicates whether the helper function supports a variable number of arguments
is_variadic: false

target_field:
  type: object
  generate: object

test:
  - target_field:
      key: value
    should_pass: true
    description: The target field is an object.
  - target_field: [1,2,3,4]
    should_pass: false
    description: The target field is an array, not an object.
  - target_field: hello
    should_pass: false
    description: The target field is a string, not an object.
  - target_field: 7
    should_pass: false
    description: The target field is a number, not an object.
