# Name of the helper function
name: is_not_number

metadata:
  description: |
    Checks whether the target field exists and does not hold a JSON number.

    Behavior:
    - True when the target exists and its JSON type is anything but number; `null` and a string holding
      digits count as "not a number".
    - A missing target gives false, so this is not the same as `NOT is_number(...)`, which is true for a
      missing field.
    - No arguments are accepted.

    Build errors:
    - The target is neither a schema field nor a temporary field rooted at `_`.
    - Any argument is given.

    Notes:
    - Integers and floating-point values are both numbers.
  group: type
  fails_when:
    - The target field does not exist.
    - The target field is a number.

helper_type: check

# Indicates whether the helper function supports a variable number of arguments
is_variadic: false

target_field:
  type:
    - string
    - boolean
    - array
    - object

test:
  - target_field: "hello"
    should_pass: true
    description: The target field is a string, not a number.
  - target_field: true
    should_pass: true
    description: The target field is a boolean, not a number.
  - target_field: [1]
    should_pass: true
    description: The target field is an array, not a number.
  - target_field:
      key: value
    should_pass: true
    description: The target field is an object, not a number.
  - target_field: 0
    should_pass: false
    description: The target field is an integer.
  - target_field: 2.5
    should_pass: false
    description: The target field is a floating-point number.
