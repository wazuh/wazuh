# Name of the helper function
name: parse_alphanumeric

metadata:
  description: |
    Checks if an input matches an alphanumeric string, and if so, it evaluates to true and the matched string
    is stored in the output field; otherwise, it evaluates to false.
    After `field_to_parse` it accepts one optional value: a string with additional characters to accept
    besides letters and digits.
  keywords:
    - parser

helper_type: transformation

# Indicates whether the helper function supports a variable number of arguments
is_variadic: false

# Arguments expected by the helper function
arguments:
  field_to_parse:
    type: string  # Accept only string
    generate: string
    source: reference # includes only references (their names start with $)

skipped:
  - different_target_field_type # target_field not used

target_field:
  type: string
  generate: string

test:
  - arguments:
      field_to_parse: Hello2024
    target_field: any_value
    should_pass: true
    expected: Hello2024
    description: Success alphanumeric parse
  - arguments:
      field_to_parse: Not{isalphanum}
    target_field: any_value
    should_pass: false
    expected: any_value
    description: Failure alphanumeric parse
