<!--
  Wazuh - Manager - Default configuration.
  More info at: https://documentation.wazuh.com
  Mailing list: https://groups.google.com/forum/#!forum/wazuh
-->

<wazuh_config>
  <global>
    <agents_disconnection_time>15m</agents_disconnection_time>
  </global>

  <!-- Source-tree placeholder values, read only by the Python framework when run from a checkout.
       Never installed: the installer generates the configuration from etc/templates/config (random
       cluster key, real indexer hosts) or stops with an error. The key below is public; replace it
       before running a cluster node from the checkout. -->
  <cluster>
    <key>0123456789abcdef0123456789abcdef</key>
  </cluster>

  <indexer>
    <hosts>
      <host>https://127.0.0.1:9200</host>
    </hosts>
  </indexer>

  <!-- Choose between plain or json format (or both) for internal logs -->
  <logging>
    <log_format>plain</log_format>
  </logging>

  <remote>
    <https>
      <port>1517</port>
      <bind_addr>0.0.0.0</bind_addr>
      <global_prefix>/wazuh-manager/</global_prefix>
      <certificate>/etc/wazuh-manager/certs/remoted.pem</certificate>
      <key>/etc/wazuh-manager/certs/remoted-key.pem</key>
      <ca_certificate>/etc/wazuh-manager/certs/root-ca.pem</ca_certificate>
    </https>

    <legacy>
      <enabled>yes</enabled>
      <port>1514</port>
      <protocol>tcp</protocol>
      <local_ip>0.0.0.0</local_ip>
    </legacy>

    <agents>
      <allow_higher_versions>no</allow_higher_versions>
    </agents>
  </remote>

  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>yes</use_password>
    <!-- <ssl_agent_ca></ssl_agent_ca> -->
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>/etc/wazuh-manager/certs/remoted.pem</ssl_manager_cert>
    <ssl_manager_key>/etc/wazuh-manager/certs/remoted-key.pem</ssl_manager_key>
  </auth>

</wazuh_config>
