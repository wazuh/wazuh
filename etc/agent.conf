<!--
  Shared agent configuration of this group.

  Every agent in the group applies the settings in this file after its local
  ossec.conf. They use the same elements as ossec.conf, inside <agent_config>.
  A block that only some systems understand goes in its own
  <agent_config os="Linux"> (or os="Windows", os="Darwin") element.

  To use an example below, copy it out of this comment, into the
  <agent_config> it shows, and adapt it. Agents apply a saved change within a
  few minutes.

  Reference: https://documentation.wazuh.com/current/user-manual/reference/centralized-configuration.html

  1. Collect a log file:

    <agent_config>
      <localfile>
        <location>/var/log/example.log</location>
        <log_format>syslog</log_format>
      </localfile>
    </agent_config>

  2. Watch the folders users download files to, in real time, so new files
     are checked for malware as soon as they appear (file integrity
     monitoring; * matches every user):

    <agent_config os="Linux">
      <syscheck>
        <directories realtime="yes">/home/*/Downloads</directories>
      </syscheck>
    </agent_config>

    <agent_config os="Windows">
      <syscheck>
        <directories realtime="yes">C:\Users\*\Downloads</directories>
      </syscheck>
    </agent_config>

  3. Monitor Docker on Linux hosts that run it. The host also needs the
     "docker" Python package for python3 (pip3 install docker):

    <agent_config os="Linux">
      <wodle name="docker-listener">
        <disabled>no</disabled>
        <run_on_start>yes</run_on_start>
        <interval>10m</interval>
      </wodle>
    </agent_config>

  4. Protect Linux agents from being uninstalled (anti-tampering): in an
     <agent_config os="Linux"> element, add an anti_tampering block whose
     package_uninstallation option is yes. Removing the agent package then
     needs a validation token: see "Anti-tampering" in the documentation.
     It is not written out here because the agent's
     uninstaller reads this file as text, and the block would take effect
     even inside this comment.
-->

<agent_config>

</agent_config>
