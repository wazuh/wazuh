<agent_config>

  <!--
    Shared agent configuration. Every agent in this group applies the
    settings in this file after its local ossec.conf. They use the same
    elements as ossec.conf.

    Example: collect a log file on every agent of the group. Copy this
    block outside the comment and change the path.

    <localfile>
      <location>/var/log/example.log</location>
      <log_format>syslog</log_format>
    </localfile>
  -->

</agent_config>
