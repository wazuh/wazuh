# -----------------------
# Server configuration
# -----------------------
server.host: 0.0.0.0
server.port: 5601

server.ssl.enabled: true
server.ssl.certificate: /tmp/certs/wazuh.dashboard.pem
server.ssl.key: /tmp/certs/wazuh.dashboard-key.pem

# -----------------------
# OpenSearch (Indexer)
# -----------------------
opensearch.hosts:
  - https://wazuh.indexer:9200

opensearch.username: admin
opensearch.password: admin

opensearch.ssl.verificationMode: certificate
opensearch.ssl.certificateAuthorities:
  - /tmp/certs/root-ca.pem

opensearch.requestHeadersAllowlist:
  - securitytenant
  - Authorization

# Security plugin settings
opensearch_security.multitenancy.enabled: false
opensearch_security.readonly_mode.roles:
  - kibana_read_only

# -----------------------
# UI
# -----------------------
uiSettings.overrides.defaultRoute: /app/wz-home

# -----------------------
# Overwatch SIEM branding
# Images are served from the dashboard's built-in /ui/ static path.
# Place the files in: <dashboard-install>/src/core/server/core_app/assets/
# -----------------------
opensearchDashboards.branding:
  applicationTitle: 'Overwatch SIEM'
  logo:
    defaultUrl: '/ui/overwatch-logo-light.svg'
    darkModeUrl: '/ui/overwatch-logo-dark.svg'
  loadingLogo:
    defaultUrl: '/ui/overwatch-icon.svg'
    darkModeUrl: '/ui/overwatch-icon.svg'
  mark:
    defaultUrl: '/ui/overwatch-icon.svg'
    darkModeUrl: '/ui/overwatch-icon.svg'
  faviconUrl: '/ui/overwatch-icon.svg'

# -----------------------
# Session settings
# -----------------------
opensearch_security.cookie.ttl: 900000
opensearch_security.session.ttl: 900000
opensearch_security.session.keepalive: true

# -----------------------
# Wazuh API configuration
# -----------------------
wazuh_core.hosts:
  default:
    url: https://host-gateway
    port: 55000
    username: wazuh-wui
    password: wazuh-wui
    run_as: false
