USER_LANGUAGE="en"
USER_INSTALL_TYPE="manager"
USER_DIR="/var/wazuh-manager"
USER_ENABLE_EMAIL="n"
USER_ENABLE_AUTHD="y"
USER_AUTO_START="n"
# One image serves the master and both workers, and api/configuration/security is not volume-mounted
# -- so a credential resolved at build time is baked into the layer and identical on all three, with
# nothing able to change it afterwards (step 0 of the ladder leaves a seeded rbac.db alone). The
# entrypoint and the first start resolve per container instead.
USER_RESOLVE_CREDENTIALS="n"
