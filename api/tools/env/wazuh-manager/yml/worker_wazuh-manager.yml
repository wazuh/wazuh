# Manager configuration of the worker nodes of the development environment (api/tools/env), deep-merged into
# etc/wazuh-manager.yml by the entrypoint (yml/yaml_merge.py), which then sets cluster.node_name to the hostname.
cluster:
  name: wazuh
  node_name: worker
  node_type: worker
  key: 9d273b53510fef702b54a92e9cffc82e
  port: 1516
  bind_addr: 0.0.0.0
  nodes:
    - wazuh.manager
  hidden: false

indexer:
  hosts:
    - https://wazuh.indexer:9200
  ssl:
    certificate_authorities:
      - /var/wazuh-manager/etc/certs/root-ca.pem
    certificate: /var/wazuh-manager/etc/certs/wazuh.manager.pem
    key: /var/wazuh-manager/etc/certs/wazuh.manager-key.pem

auth:
  use_source_ip: false

remote:
  legacy:
    protocol:
      - tcp
