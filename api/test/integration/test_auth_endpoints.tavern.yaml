        - ["PUT", "/agents/001/group/default"]
        - ["GET", "/agents/001/key"]
        - ["PUT", "/agents/001/restart"]
        - ["PUT", "/agents/001/reload"]
        - ["PUT", "/agents/upgrade"]
        - ["PUT", "/agents/upgrade_custom"]
        - ["GET", "/agents/uninstall"]
        - ["DELETE", "/agents/group"]
        - ["PUT", "/agents/group"]
        - ["PUT", "/agents/group/default/restart"]
        - ["PUT", "/agents/group/default/reload"]
        - ["POST", "/agents/insert"]
        - ["POST", "/agents/insert/quick"]
        - ["POST", "/agents/enrollment-tokens"]
        - ["GET", "/agents/enrollment-tokens"]
        - ["DELETE", "/agents/enrollment-tokens"]
        - ["DELETE", "/agents/enrollment-tokens/AAECAwQFBgcICQoLDA0ODw"]
        - ["GET", "/agents/no_group"]
        - ["GET", "/agents/outdated"]
        - ["PUT", "/agents/reload"]
        - ["PUT", "/agents/restart"]
        - ["PUT", "/agents/scan/vulnerability"]
        - ["GET", "/agents/stats/distinct"]
        - ["GET", "/agents/summary"]
        - ["GET", "/agents/summary/os"]
        - ["GET", "/agents/summary/status"]
        - ["DELETE", "/groups"]
        - ["GET", "/groups"]
        - ["POST", "/groups"]
        - ["GET", "/groups/default/agents"]
        - ["GET", "/groups/default/configuration"]
        - ["PUT", "/groups/default/configuration"]
        - ["GET", "/groups/default/files"]
        - ["GET", "/groups/default/files/agent.conf"]
        - ["GET", "/cluster/local/info"]
        - ["GET", "/cluster/local/config"]
        - ["GET", "/cluster/nodes"]
        - ["GET", "/cluster/healthcheck"]
        - ["GET", "/cluster/status"]
        - ["GET", "/cluster/api/config"]
        - ["GET", "/cluster/worker1/status"]
        - ["GET", "/cluster/worker1/info"]
        - ["GET", "/cluster/worker1/configuration"]
        - ["PUT", "/cluster/worker1/configuration"]
