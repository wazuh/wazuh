        - ["GET", "/cluster/worker1/configuration/wmodules/wmodules"]
        - ["GET", "/mitre/groups"]
        - ["GET", "/mitre/metadata"]
        - ["GET", "/mitre/mitigations"]
        - ["GET", "/mitre/references"]
        - ["GET", "/mitre/software"]
        - ["GET", "/mitre/tactics"]
        - ["GET", "/mitre/techniques"]
        - ["DELETE", "/security/user/authenticate"]
        - ["GET", "/security/users/me"]
        - ["GET", "/security/users/me/policies"]
        - ["PUT", "/security/user/revoke"]
        - ["PUT", "/security/users/1/run_as"]
        - ["GET", "/security/actions"]
        - ["GET", "/security/resources"]
        - ["GET", "/security/users"]
        - ["POST", "/security/users"]
