test_name: 415 on every body operation

marks:
  - parametrize:
      key: [method, path, content_type]
      vals:
        - ["POST", "/agents", "text/plain"]
        - ["POST", "/agents/insert", "text/plain"]
        - ["POST", "/agents/enrollment-tokens", "text/plain"]
        - ["POST", "/groups", "text/plain"]
        - ["PUT", "/groups/default/configuration", "application/json"]
        - ["PUT", "/cluster/worker1/configuration", "application/json"]
        - ["POST", "/security/users", "text/plain"]
        - ["PUT", "/security/users/1", "text/plain"]
        - ["POST", "/security/roles", "text/plain"]
        - ["PUT", "/security/roles/1", "text/plain"]
        - ["POST", "/security/rules", "text/plain"]
        - ["PUT", "/security/rules/1", "text/plain"]
        - ["POST", "/security/policies", "text/plain"]
        - ["PUT", "/security/policies/1", "text/plain"]
        - ["PUT", "/security/config", "text/plain"]

stages:
  - name: A content-type the operation does not accept
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}{path}"
      method: "{method}"
      headers:
        Authorization: "Bearer {test_login_token}"
        Content-Type: "{content_type}"
      data: "x"
    response: &unsupported_media_type
      status_code: 415
      json:
        title: Unsupported Media Type
      verify_response_with:
        - function: tavern_utils:test_no_internal_details

