---
test_name: pretty and wait_for_complete on one operation per tag

marks:
  - parametrize:
      key: path
      vals:
        - /agents
        - /groups
        - /cluster/nodes
        - /mitre/metadata
        - /overview/agents
        - /security/users/me

stages:
  - name: Both flags accepted, output indented
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}{path}"
      method: GET
      headers:
        Authorization: "Bearer {test_login_token}"
      params:
        pretty: true
        wait_for_complete: true
    response:
      status_code: 200
      verify_response_with:
        - function: tavern_utils:test_pretty_format
