test_name: 404 on routes the spec does not declare

marks:
  - parametrize:
      key: path
      vals:
        - /nope
        - /agents/001/nope
        # connexion's generated UI and spec are disabled (serve_spec=False)
        - /ui
        - /openapi.json
        - /openapi.yaml
        # An encoded slash is decoded before routing: it reaches no route instead of a parent directory
        - /groups/default/files/..%2Fagent.conf
        - /groups/..%2F..%2Fetc/files
        - /cluster/..%2F..%2Fetc/info

stages:
  - name: With a token
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}{path}"
      method: GET
      headers:
        Authorization: "Bearer {test_login_token}"
    response: &not_found
      status_code: 404
      json:
        title: Not Found
      verify_response_with:
        - function: tavern_utils:test_no_internal_details

  - name: Without a token, the same answer
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}{path}"
      method: GET
    response:
      <<: *not_found

---
test_name: Security headers on success and error responses

stages:
  - name: On a 200
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/"
      method: GET
      headers:
        Authorization: "Bearer {test_login_token}"
    response:
      status_code: 200
      headers: &security_headers
        x-content-type-options: nosniff
        x-frame-options: deny
        content-security-policy: none
        cache-control: no-store
        referrer-policy: no-referrer, strict-origin-when-cross-origin
        strict-transport-security: max-age=63072000; includeSubdomains

  - name: On a 400
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/agents?limit=0"
      method: GET
      headers:
        Authorization: "Bearer {test_login_token}"
    response:
      status_code: 400
      headers:
        <<: *security_headers

  - name: On a 401
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/"
      method: GET
    response:
      status_code: 401
      headers:
        <<: *security_headers

  - name: On a 404
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/nope"
      method: GET
      headers:
        Authorization: "Bearer {test_login_token}"
    response:
      status_code: 404
      headers:
        <<: *security_headers

---
test_name: A user's tokens stop working when the user changes

stages:
  - name: Create the user
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/users"
      method: POST
      headers:
        Authorization: "Bearer {test_login_token}"
      json:
        username: lifecycle_user
        password: "Lifecycle1A!extra"
    response:
      status_code: 200
      json:
        data:
          total_affected_items: 1
      save:
        json:
          lifecycle_user_id: data.affected_items[0].id

  - name: Give it the administrator role
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/users/{lifecycle_user_id}/roles"
      method: POST
      headers:
        Authorization: "Bearer {test_login_token}"
      params:
        role_ids: 1
    response:
      status_code: 200
      json:
        data:
          total_affected_items: 1
    delay_after: 1

  - name: Log in as the user
    request: &user_login
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/user/authenticate"
      method: POST
      auth: ["lifecycle_user", "Lifecycle1A!extra"]
    response:
      status_code: 200
      save:
        json:
          user_token: data.token

  - name: The token works
    request: &user_me
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/users/me"
      method: GET
      headers:
        Authorization: "Bearer {user_token}"
    response:
      status_code: 200
      json:
        data:
          affected_items:
            - username: lifecycle_user

  # An administrator that is not a reserved user (id above 99) cannot take over a reserved one
  - name: The user, an administrator, cannot change the password of the reserved user 1
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/users/1"
      method: PUT
      headers:
        Authorization: "Bearer {user_token}"
      json:
        password: "HackedAdmin1!extra"
    response:
      status_code: 400
      json:
        error: 5011

  - name: Nor the run_as flag of the reserved user 2
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/users/2/run_as"
      method: PUT
      headers:
        Authorization: "Bearer {user_token}"
      params:
        allow_run_as: false
    response:
      status_code: 400
      json:
        error: 5011

  - name: Change the password
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/users/{lifecycle_user_id}"
      method: PUT
      headers:
        Authorization: "Bearer {test_login_token}"
      json:
        password: "Lifecycle2A!extra"
    response:
      status_code: 200
      json:
        data:
          total_affected_items: 1
    delay_after: 1

  - name: The token issued before the password change is refused
    request:
      <<: *user_me
    response: &revoked
      status_code: 401
      json:
        title: Unauthorized

  - name: The old password is refused
    request:
      <<: *user_login
    response:
      status_code: 401

  - name: Log in with the new password
    request: &user_login_new
      <<: *user_login
      auth: ["lifecycle_user", "Lifecycle2A!extra"]
    response:
      status_code: 200
      save:
        json:
          user_token: data.token

  - name: Remove its role
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/users/{lifecycle_user_id}/roles"
      method: DELETE
      headers:
        Authorization: "Bearer {test_login_token}"
      params:
        role_ids: 1
    response:
      status_code: 200
      json:
        data:
          total_affected_items: 1
    delay_after: 1

  - name: The token issued before the role change is refused
    request:
      <<: *user_me
    response:
      <<: *revoked

  - name: Log in again
    request:
      <<: *user_login_new
    response:
      status_code: 200
      save:
        json:
          user_token: data.token

  - name: Log out
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/user/authenticate"
      method: DELETE
      headers:
        Authorization: "Bearer {user_token}"
    response:
      status_code: 200
    delay_after: 1

  - name: The token is refused after the logout
    request:
      <<: *user_me
    response:
      <<: *revoked

  - name: Log in once more
    request:
      <<: *user_login_new
    response:
      status_code: 200
      save:
        json:
          user_token: data.token

  - name: Delete the user
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/users"
      method: DELETE
      headers:
        Authorization: "Bearer {test_login_token}"
      params:
        user_ids: "{lifecycle_user_id}"
    response:
      status_code: 200
      json:
        data:
          total_affected_items: 1
    delay_after: 1

  - name: The token of a deleted user is refused
    request:
      <<: *user_me
    response:
      <<: *revoked

  - name: A deleted user cannot log in
    request:
      <<: *user_login_new
    response:
      status_code: 401

---
test_name: Changing the security configuration revokes every token

stages:
  - name: Update the configuration, same values
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/config"
      method: PUT
      headers:
        Authorization: "Bearer {test_login_token}"
      json:
        auth_token_exp_timeout: 900
        rbac_mode: white
    response:
      status_code: 200
    delay_after: 1

  - name: The token issued before is refused
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/users/me"
      method: GET
      headers:
        Authorization: "Bearer {test_login_token}"
    response:
      status_code: 401

  - name: Log in again
    request: &login
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/user/authenticate"
      method: POST
      auth: ["{user}", "{pass}"]
    response:
      status_code: 200
      save:
        json:
          new_token: data.token

  - name: Restore the default configuration
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/config"
      method: DELETE
      headers:
        Authorization: "Bearer {new_token}"
    response:
      status_code: 200
    delay_after: 1

  - name: The token issued before the restore is refused
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/security/users/me"
      method: GET
      headers:
        Authorization: "Bearer {new_token}"
    response:
      status_code: 401

  - name: A new login works
    request:
      <<: *login
    response:
      status_code: 200

