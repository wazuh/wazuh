stages:
  - name: No Authorization header
    request: &request
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}{path}"
      method: "{method}"
    response: &unauthorized
      status_code: 401
      json:
        title: Unauthorized
      verify_response_with:
        - function: tavern_utils:test_no_internal_details

  - name: Not a JWT
    request:
      <<: *request
      headers:
        Authorization: "Bearer garbage"
    response:
      <<: *unauthorized

  - name: Valid header and payload, forged signature
    request:
      <<: *request
      headers:
        Authorization: "Bearer {test_tampered_token}"
    response:
      <<: *unauthorized

  - name: Payload claiming more roles, original signature
    request:
      <<: *request
      headers:
        Authorization: "Bearer {test_forged_payload_token}"
    response:
      <<: *unauthorized

  - name: Unsigned token (alg none)
    request:
      <<: *request
      headers:
        Authorization: "Bearer {test_unsigned_token}"
    response:
      <<: *unauthorized

  - name: Basic credentials instead of a token
    request:
      <<: *request
      headers:
        Authorization: "Basic {basic_auth}"
    response:
      <<: *unauthorized

---
test_name: 401 on the login endpoints

marks:
  - parametrize:
      key: path
      vals:
        - /security/user/authenticate
        - /security/user/authenticate/run_as

stages:
  - name: No Authorization header
    request: &login_request
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}{path}"
      method: POST
    response: &login_unauthorized
      status_code: 401
      json:
        title: Unauthorized
        detail: Invalid credentials
      verify_response_with:
        - function: tavern_utils:test_no_internal_details

  - name: Wrong password
    request:
      <<: *login_request
      auth: ["{user}", "not-the-password"]
    response:
      <<: *login_unauthorized

  - name: Unknown user
    request:
      <<: *login_request
      auth: ["no-such-user", "{pass}"]
    response:
      <<: *login_unauthorized

  - name: A token instead of Basic credentials
    request:
      <<: *login_request
      headers:
        Authorization: "Bearer {test_login_token}"
    response:
      <<: *login_unauthorized

