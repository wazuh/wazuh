      json:
        error: 1006

  - name: A hidden group file
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/groups/default/files/.agent.conf"
      method: GET
      headers:
        Authorization: "Bearer {test_login_token}"
    response:
      status_code: 400
      json:
        error: 1006

  - name: A group named ..
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/groups/%2e%2e/files"
      method: GET
      headers:
        Authorization: "Bearer {test_login_token}"
    response:
      status_code: 400
      json:
        title: Bad Request

  - name: Upload the configuration of a group named ..
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/groups/%2e%2e/configuration"
      method: PUT
      headers:
        Authorization: "Bearer {test_login_token}"
        Content-Type: application/xml
      data: "{file_xml:s}"
    response:
      status_code: 400
      json:
        title: Bad Request

  - name: A node named ..
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/cluster/%2e%2e/info"
      method: GET
      headers:
        Authorization: "Bearer {test_login_token}"
    response:
      status_code: 404

  - name: A relative WPK path outside the upgrade directory
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/agents/upgrade_custom"
      method: PUT
      headers:
        Authorization: "Bearer {test_login_token}"
      params:
        agents_list: "001"
        file_path: "../../etc/passwd"
    response:
      status_code: 400
      json:
        title: Bad Request

  - name: An absolute path that is not a WPK
    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/agents/upgrade_custom"
      method: PUT
      headers:
        Authorization: "Bearer {test_login_token}"
      params:
        agents_list: "001"
        file_path: "/etc/passwd"
    response:
      status_code: 400
      json:
        title: Bad Request

