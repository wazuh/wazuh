    request:
      verify: False
      url: "{protocol:s}://{host:s}:{balanced_port:d}/agents"
      method: GET
      timeout: 10
      headers:
        Authorization: "Bearer {test_login_token}"
      params:
        limit: 500
        sort: "-os.name,version,id"
        select: "id,name,os.name,version,status"
