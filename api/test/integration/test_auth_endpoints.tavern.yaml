# Authentication, method, content-type and input-hardening checks common to every endpoint.
#
# The 401, 405 and 415 matrices below list every operation, path and body operation of
# api/api/spec/spec.yaml; mapping/endpoint_coverage.py fails when a new one is missing from them.
# Path parameters use values that pass request validation, so each case reaches the check it is about.

---
