host: [0.0.0.0]
port: 55000

# Advanced configuration

https:
 enabled: yes
 key: "apid-key.pem"
 cert: "apid.pem"
 use_ca: False
 ca: "root-ca.pem"

# Logging configuration
# Values for API log level: disabled, info, warning, error, debug, debug2 (each level includes the previous level).
logs:
 level: "info"
 format: "plain"

# Cross-origin resource sharing: https://github.com/aio-libs/aiohttp-cors#usage
cors:
 enabled: no
 source_route: "*"
 expose_headers: "*"
 allow_headers: "*"
 allow_credentials: no

# Access parameters
# Limits of test_ratelimit_endpoints.tavern.yaml. They count per client address; see the header of
# that file for which address each test uses and why.
access:
  max_login_attempts: 3
  block_time: 60
  max_request_per_minute: 5
  max_unauthenticated_request_per_minute: 5

# Drop privileges (Run as wazuh-manager user)
drop_privileges: yes

# Uploadable Wazuh configuration sections (allow all for testing)
upload_configuration:
  agents:
    allow_higher_versions:
      allow: yes
  indexer:
    allow: yes
