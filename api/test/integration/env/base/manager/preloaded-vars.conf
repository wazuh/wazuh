USER_LANGUAGE="en"
USER_INSTALL_TYPE="manager"
USER_DIR="/var/wazuh-manager"
USER_ENABLE_EMAIL="n"
USER_ENABLE_AUTHD="y"
USER_AUTO_START="n"
# This tree becomes an image layer every container shares, and api/configuration/security is a named
# volume Docker seeds from it -- so a credential resolved here is baked in once and identical
# everywhere, and step 0 of the ladder would then make every container ignore the passwords
# entrypoint.sh exports. The entrypoint resolves them per container instead, at start.
USER_RESOLVE_CREDENTIALS="n"
