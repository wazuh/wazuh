name: 5.X - macOS - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - "src/**"
      - ".github/workflows/5_testunit_macos.yml"
      # Manager-only trees: src/CMakeLists.txt:276-293 and src/wazuh_modules/CMakeLists.txt:97-102
      # add them only when TARGET is not an agent. Their include/ directories stay: agent code
      # compiles against them (shared/src/agent_op.c -> os_auth/include/auth.h,
      # shared/src/agent_validate_op.c -> wazuh_db/include/wdb.h, and
      # wazuh_modules/src/wm_{content_manager,inventory_sync_server,keystore_server,
      # vulnerability_scanner}.c, globbed for every target at wazuh_modules/CMakeLists.txt:110-119,
      # -> each module's include/).
      - "!src/engine/**"
      - "!src/remoted/**"
      # Except the two headers the remoted test wrappers include (agent_metadata_wrappers.h:15,
      # netbuffer_wrappers.h:15 under src/unit_tests/wrappers/wazuh/remoted/), which TEST=1 compiles
      # into libwazuh_test on Darwin too (src/shared/CMakeLists.txt:164-165, Darwin branch)
      - "src/remoted/include/remoted.h"
      - "src/remoted/src/agent_metadata_db.h"
      - "!src/util/**"
      - "!src/shared_modules/ca_bundle/**"
      - "!src/shared_modules/indexer_connector/**"
      - "!src/shared_modules/keystore/**"
      - "!src/shared_modules/manager_certs/**"
      - "!src/shared_modules/manager_config/**"
      - "!src/shared_modules/metrics/**"
      - "!src/shared_modules/uds_http_server/**"
      - "!src/os_auth/**"
      - "src/os_auth/include/**"
      - "!src/wazuh_db/**"
      - "src/wazuh_db/include/**"
      - "!src/shared_modules/content_manager/**"
      - "src/shared_modules/content_manager/include/**"
      - "!src/wazuh_modules/inventory_sync_server/**"
      - "src/wazuh_modules/inventory_sync_server/include/**"
      - "!src/wazuh_modules/keystore_server/**"
      - "src/wazuh_modules/keystore_server/include/**"
      - "!src/wazuh_modules/task_manager/**"
      - "src/wazuh_modules/task_manager/include/**"
      - "!src/wazuh_modules/vulnerability_scanner/**"
      - "src/wazuh_modules/vulnerability_scanner/include/**"
      # Installer scripts (the manager's credential ladder included) and their shell suites:
      # neither make nor ctest reads src/init
      - "!src/init/**"
      # Windows-only, never built for the macOS agent
      - "!src/win32/**"
      # Prose: nothing compiles Markdown (last, so it wins over the re-included include/)
      - "!src/**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-sonoma:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      - name: Install cmocka 1.1.7 and lcov
        run: |
          brew install lcov

          CMOCKA_TARBALL="cmocka-1.1.7.tar.xz"
          CMOCKA_URL="https://cmocka.org/files/1.1/cmocka-1.1.7.tar.xz"
          CMOCKA_MIRROR_URL="https://gitlab.com/cmocka/cmocka/-/archive/cmocka-1.1.7/cmocka-cmocka-1.1.7.tar.gz"

          if ! curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 300 -o "$CMOCKA_TARBALL" "$CMOCKA_URL" \
             || ! tar -tf "$CMOCKA_TARBALL" >/dev/null 2>&1; then
            echo "Primary CMocka download failed or returned an invalid archive. Falling back to the GitLab mirror (same upstream tag, cmocka 1.1.7)..."
            CMOCKA_TARBALL="cmocka-1.1.7.tar.gz"
            if ! curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 300 -o "$CMOCKA_TARBALL" "$CMOCKA_MIRROR_URL"; then
              echo "Error during download. Exiting..."
              exit 1
            fi
          fi

          tar -xf "$CMOCKA_TARBALL"
          # The GitLab mirror's archive extracts to cmocka-cmocka-1.1.7/ rather than cmocka-1.1.7/;
          # normalize it so the rest of this step doesn't care which source was actually used.
          extracted_dir="$(tar -tf "$CMOCKA_TARBALL" | head -1 | cut -d/ -f1)"
          if [ "$extracted_dir" != "cmocka-1.1.7" ]; then
            mv "$extracted_dir" cmocka-1.1.7
          fi

          cd cmocka-1.1.7
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local
          make -j$(sysctl -n hw.ncpu)
          sudo make install
      - name: Build wazuh agent for macOS 15 with tests flags
        env:
            CMAKE_POLICY_VERSION_MINIMUM: 3.5
        run: |
          make deps -C src TARGET=agent -j3
          C_INCLUDE_PATH=$C_INCLUDE_PATH:/opt/homebrew/include LIBRARY_PATH=/usr/local/lib:/opt/homebrew/lib make -C src TARGET=agent -j3 TEST=1
      - name: Run wazuh unit tests for macOS 15
        run: |
          export DYLD_LIBRARY_PATH=/usr/local/lib:$DYLD_LIBRARY_PATH
          cd src/build
          # Every test the agent's TEST=1 tree registers (src/CMakeLists.txt adds the agent module
          # subtrees, each adding its tests/ only under UNIT_TEST). --no-tests=error: an empty
          # registration (a broken UNIT_TEST configure) must fail instead of exiting 0.
          ctest -V --no-tests=error
