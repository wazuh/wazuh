name: 5.X - Indexer Connector - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_indexerconnector.yml"
      # indexer_connector_utest compiles tests/unit/*.cpp plus src/indexerTransport.cpp
      # (tests/unit/CMakeLists.txt:11-12) and instantiates the Impl templates of src/ and include/.
      # Every CMakeLists.txt of the module is on the configure path (CMakeLists.txt:61,64).
      - "src/shared_modules/indexer_connector/**/CMakeLists.txt"
      - "src/shared_modules/indexer_connector/include/**"
      - "src/shared_modules/indexer_connector/src/**"
      - "src/shared_modules/indexer_connector/tests/unit/**"
      # Linked: keystore (tests/unit/CMakeLists.txt:33; also built standalone by
      # build_external_deps/action.yml:45-53, testtool included) -- not its qa/ suite.
      - "src/shared_modules/keystore/**"
      - "!src/shared_modules/keystore/qa/**"
      # Headers from shared_modules/utils (CMakeLists.txt:32; loggerHelper.h, secureCommunication.hpp,
      # ...) and common/commonDefs.h (included by utils/loggerHelper.h:15). utils/flatbuffers is
      # built by build_external_deps/action.yml:55-63. utils' own tests and benchmark are another
      # component's tree; only their CMakeLists.txt are on the configure path (utils/CMakeLists.txt).
      - "src/shared_modules/utils/**"
      - "!src/shared_modules/utils/tests/**"
      - "!src/shared_modules/utils/benchmark/**"
      - "src/shared_modules/utils/tests/CMakeLists.txt"
      - "src/shared_modules/utils/benchmark/CMakeLists.txt"
      - "src/shared_modules/common/**"
      # Configure path: build_target_cpp configures all of src/ as one tree
      # (build_target_cpp/action.yml:57) -- src/CMakeLists.txt (src/cmake/*.cmake at :86-87,
      # VERSION.json at :128) and src/external/CMakeLists.txt (ext_* targets, wazuhext at :1474).
      - "src/CMakeLists.txt"
      - "src/cmake/**"
      - "src/external/CMakeLists.txt"
      - "VERSION.json"
      # build_external_deps runs make deps/build-external (src/Makefile:610, ref list from
      # tools/get_git_refs.sh at src/Makefile:708) and builds http-request (action.yml:35-43), which
      # this test also links as urlrequest (tests/unit/CMakeLists.txt:16). http-request is a
      # submodule: a bump changes only the gitlink path, which no '/**' pattern matches.
      - "src/Makefile"
      - "tools/get_git_refs.sh"
      - "src/shared_modules/http-request"
      # Result-affecting actions both jobs execute (setup-sccache wraps the compilers).
      # upload_s3_artifact is left out on purpose: coverage_cpp calls it with continue-on-error
      # (coverage_cpp/action.yml:112-121), so it only reports, and the agent package lanes
      # exercise it on PRs.
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/coverage_cpp/**"
      - ".github/actions/test_cpp/**"
      - ".github/actions/setup-sccache/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  indexerconnector-modules:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@master
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Compilation cache (issue 38139). Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/5.0.0
      - name: Project dependencies
        uses: ./.github/actions/build_external_deps
      - name: Indexer connector - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "indexer_connector_utest"
          test: "true"
          asan: "false"

      # Valgrind off: test_cpp's valgrind branch wraps only the ctest driver (no
      # --trace-children=yes, test_cpp/action.yml), so it never instrumented the test binary.
      # The ASAN job below is the memory gate.
      - name: Indexer connector - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "false"
          target: "indexer_connector_utest"

      - name: Indexer connector - Coverage
        uses: ./.github/actions/coverage_cpp
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          path: src/shared_modules/indexer_connector
          id: indexer_connector
          validate_function_coverage: "false"
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true

  indexerconnector-asan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Compilation cache (issue 38139). Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/5.0.0
      - name: Project dependencies
        uses: ./.github/actions/build_external_deps
      - name: Indexer connector - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "indexer_connector_utest"
          test: "true"
          asan: "true"

      - name: Indexer connector - Run tests
        uses: ./.github/actions/test_cpp
        with:
          target: "indexer_connector_utest"
          valgrind: "false"
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true
