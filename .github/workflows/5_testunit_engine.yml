name: 5.X - Engine - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - 'src/engine/**'
      - '.github/actions/reinstall_cmake/**'
      - '.github/workflows/5_testunit_engine.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: ${{github.workspace}}/src/build
  ENGINE_CMAKE: src/engine/CMakeLists.txt

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Build Manager
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        uses: ./.github/actions/reinstall_cmake
      # Compilation cache (issue 38139). Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/5.0.0
      - name: Force ENGINE_ENABLE_ASAN=ON in CMakeLists

        run: |
          file="${ENGINE_CMAKE}"
          grep -qE 'option\(\s*ENGINE_ENABLE_ASAN\b' "$file" || {
            echo "ERROR: ENGINE_ENABLE_ASAN option not found in ${file}"; exit 1; }

          sed -i -E 's/^(option\(\s*ENGINE_ENABLE_ASAN\b[^)]*\b)OFF(\b[^)]*\))/\1ON\2/' "$file" || {
            echo "ERROR: sed failed setting ENGINE_ENABLE_ASAN=ON"; exit 1; }

          grep -nE 'option\(\s*ENGINE_ENABLE_ASAN\b.*\bON\b' "$file" || {
            echo "ERROR: ENGINE_ENABLE_ASAN not set to ON in ${file}"; exit 1; }

      - name: Build Wazuh manager
        run: |
          make deps -C src TARGET=manager -j$(nproc)
          make -C src TARGET=manager ENGINE_TEST=y -j$(nproc)

      - name: Unit Test
        # Run unit tests using CTest
        working-directory: ${{env.BUILD_DIR}}/engine
        env:
          ASAN_OPTIONS: malloc_context_size=8:print_stats=0:fast_unwind_on_malloc=1:log_path=${{ runner.temp }}/asan
          LSAN_OPTIONS: report_objects=0:log_path=${{ runner.temp }}/asan
        run: MALLOC_CHECK_=2 ctest -T test --output-on-failure -j$(nproc)

      - name: Upload ASAN/LSAN logs
        if: always()
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: sanitizer-logs
          path: |
            ${{ runner.temp }}/asan*
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true
