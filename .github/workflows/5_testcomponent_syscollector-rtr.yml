name: 5.X - Running RTR. Module syscollector and its dependencies for agent/winagent targets

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - "src/ci/**"
      - "src/build.py"
      - "src/data_provider/**"
      - "src/shared_modules/**"
      - "src/wazuh_modules/syscollector/**"
      - "src/Makefile"
      - ".github/workflows/5_testcomponent_syscollector-rtr.yml"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  rtr:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
          fail-fast: false
          matrix:
              module: [wazuh_modules/syscollector, shared_modules/dbsync, data_provider]
              target: [agent, winagent]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: "Install dependencies"
        uses: ./.github/actions/install_build_deps
        with:
          target: ${{ matrix.target }}
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: ".github/workflows/.python-version"
          architecture: x64
      - name: "Install a compatible CMake"
        uses: ./.github/actions/reinstall_cmake
      # Compilation cache. Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/5.0.0
      - name: Run RTR for module ${{ matrix.module }} and target ${{ matrix.target }}
        run: |
          cd src/
          python build.py --target ${{ matrix.target }} --readytoreview ${{ matrix.module }}
      - name: "Compilation cache statistics"
        if: always()
        # grep filters the "Cache location" line: it carries the bucket name,
        # which secret masking does not cover once the s3:// scheme is stripped.
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true
      - name: Creating a valid artifact name
        if: always()
        run: |
          name="${{ matrix.module }}"
          name=$(echo $name | sed -e 's*/*-*g')
          echo "ARTIFACT_NAME=$name" >> $GITHUB_ENV
      - name: Uploading coverage report
        if: always()
        uses: ./.github/actions/upload_s3_artifact
        with:
          aws_region: ${{ secrets.CI_AWS_REGION }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          name: coverage_report ${{ env.ARTIFACT_NAME }} ${{ matrix.target }}
          path: ./**/coverage_report/**
