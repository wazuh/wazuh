name: 4.X - Framework - Unit tests

on:
  workflow_dispatch:
    inputs:
      generate_report:
        description: 'Generate test report'
        required: false
        type: boolean
        default: false
      qa_branch:
        description: 'QA repository branch'
        required: false
        default: 'main'
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - '.github/workflows/4_testunit_framework.yml'
      - 'framework/**'
      - 'api/**'

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
    env:
      PYTHONPATH: ${{ github.workspace }}/api:${{ github.workspace }}/framework
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'framework/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r framework/requirements-dev.txt --no-build-isolation

      - name: Run Framework tests
        env:
          TEST_REPORT_PATH: ${{ runner.temp }}/test_report.txt
        run: |
          set -o pipefail
          python -m pytest framework -vv --ignore=tests --cov=framework | tee "${TEST_REPORT_PATH}"

      - name: Generate test report
        if: inputs.generate_report
        env:
          INPUT_QA_BRANCH: ${{ inputs.qa_branch }}
          TEST_REPORT_PATH: ${{ runner.temp }}/test_report.txt
        run: |
          git clone -b "$INPUT_QA_BRANCH" --single-branch https://github.com/wazuh/qa-integration-framework.git
          python qa-integration-framework/src/wazuh_testing/scripts/pytest_results_parser.py -f "${TEST_REPORT_PATH}"
