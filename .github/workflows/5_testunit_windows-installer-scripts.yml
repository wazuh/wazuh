name: 5.X - Windows installer scripts - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_windows-installer-scripts.yml"
      # The Windows twin of src/init/tests/test_enrollment_token.sh (5_testunit_agent-installer-scripts.yml):
      # the suite loads InstallerScripts.vbs (test_installer_scripts.vbs:31,119-131) and runs its
      # custom actions against a throwaway install directory with a stubbed wazuh-agent, so
      # nothing is built or installed.
      - "src/win32/InstallerScripts.vbs"
      - "src/win32/tests/test_installer_scripts.vbs"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installer-scripts-tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The suite prints one line per check, then "<N> checks, <M> failed", and exits 1 on any
      # failure (test_installer_scripts.vbs:386-388). The exit code alone is not trusted: Windows
      # Script Host can end a script on an unhandled run-time error (InstallerScripts.vbs failing
      # to load, for one) without a failing exit code, so the summary of a run that reached its
      # end with at least one check and no failure is required too.
      - name: MSI custom actions (InstallerScripts.vbs)
        shell: pwsh
        working-directory: src/win32/tests
        run: |
          $out = cscript //nologo test_installer_scripts.vbs 2>&1 | ForEach-Object { "$_" }
          $rc = $LASTEXITCODE
          $out
          if ($rc -ne 0) { exit $rc }
          if (-not ($out -match '^[1-9][0-9]* checks, 0 failed\s*$')) {
            Write-Host "::error::test_installer_scripts.vbs did not finish with '<N> checks, 0 failed' (N >= 1)"
            exit 1
          }
