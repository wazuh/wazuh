name: 5.X - Check external dependencies inventory

# packages/externals/dependencies.json must list exactly the EXTERNAL_RES of every
# target, match the README table, and match the manifest.json of the published set
# that src/Makefile's DEPS_VERSION points at; the embedded Python set (PYTHON_DEPS_VERSION)
# must carry the same cpython and wheels and have been built against DEPS_VERSION.

on:
  pull_request:
    paths:
      - "packages/externals/**"
      - "src/Makefile"
      - "README.md"
      - "framework/requirements.txt"
      - "framework/.python-version"
      - ".github/workflows/5_codequality_externals-drift.yml"

permissions:
  contents: read

jobs:
  check-inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # src/Makefile only resolves the winagent dependency list with the MinGW compiler present.
      - name: Install the MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686

      - name: Check the inventory against EXTERNAL_RES
        run: python3 packages/externals/deps.py check

      - name: Check the README table
        run: python3 packages/externals/deps.py readme --check

      - name: Check the inventory against the published set manifests
        run: python3 packages/externals/deps.py drift
