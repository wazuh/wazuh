name: 5.X - Check external dependencies

# packages/externals/dependencies.json must list exactly the EXTERNAL_RES of every
# target; src/deps.lock.mk must be the one it generates,
# and every ref in it must be published in the pool with the inputs it was keyed on,
# so a lock is merged only with its refs published. Once they are, the committed
# THIRD-PARTY-NOTICES is checked against the license files of those refs.
# The paths are the ones `deps.py key-paths` prints, which a test keeps in sync, plus the notices.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "framework/.python-version"
      - "framework/cpython/**"
      - "framework/requirements.txt"
      - "packages/externals/**"
      - "src/CMakeLists.txt"
      - "src/Makefile"
      - "src/deps.lock.mk"
      - "src/external/CMakeLists.txt"
      - "src/cmake/WazuhExternalFlags.cmake"
      - "src/syscheckd/src/ebpf/src/modern.bpf.c"
      - "src/engine/tools/third-party-notices/**"
      - "THIRD-PARTY-NOTICES"
      - ".github/workflows/5_codequality_externals.yml"
      # Workflows the tool tests check.
      - ".github/workflows/5_builderpackage_externals.yml"
      - ".github/workflows/5_codeanalysis_externals-vulns.yml"

permissions:
  contents: read

jobs:
  check-externals:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # src/Makefile only resolves the winagent dependency list with the MinGW compiler present.
      - name: Install the MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686

      - name: Run the inventory tool tests
        run: pipx run pytest packages/externals/tests -q

      - name: Check the inventory against EXTERNAL_RES
        run: python3 packages/externals/deps.py check

      - name: Check the lock
        run: python3 packages/externals/deps.py lock --check

      - name: Check the lock against the pool
        run: python3 packages/externals/deps.py pool-check

      # Precompiled, as the manager package takes them: external/cpython.tar.gz is then the installed
      # interpreter whose site-packages the notices list.
      - name: Download the manager dependencies from the pool
        run: make -C src deps TARGET=manager -j"$(nproc)"

      - name: Check the third-party notices
        run: python3 src/engine/tools/third-party-notices/generate.py check --external src/external
