name: 5.X - Shared Modules - Utils - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_shared_modules_utils.yml"
      # The headers under test, tests/ (incl. input_files, copied at tests/CMakeLists.txt:81) and
      # flatbuffers/, which build_external_deps compiles (action.yml:55-63).
      - "src/shared_modules/utils/**"
      # utils_utest links FileIO (tests/CMakeLists.txt:167), defined in file_helper/CMakeLists.txt:35-40
      # from file_io/src and exporting file_io/include; linuxInfoHelper.h includes file_io_utils.hpp (:15).
      - "src/shared_modules/file_helper/CMakeLists.txt"
      - "src/shared_modules/file_helper/file_io/include/**"
      - "src/shared_modules/file_helper/file_io/src/**"
      # Headers outside utils/ that the compiled ones include: commonDefs.h (msgDispatcher.h:18,
      # threadDispatcher.h:21, ...) and logging_helper.h (asyncFlushController.hpp:22), both on the
      # test's include path (tests/CMakeLists.txt:140-141).
      - "src/shared_modules/common/commonDefs.h"
      - "src/shared/include/logging_helper.h"
      # Configure path: build_target_cpp configures src/ as one tree -- src/CMakeLists.txt (registers
      # this module at :246, includes src/cmake/*.cmake at :85-87, reads VERSION.json at :128) and
      # src/external/CMakeLists.txt, which defines the rocksdb/crypto/zlib/minizip targets linked here.
      - "src/CMakeLists.txt"
      - "src/cmake/**"
      - "src/external/CMakeLists.txt"
      - "VERSION.json"
      # build_external_deps runs `make deps`/`make build-external` (src/Makefile; its ref list comes
      # from tools/get_git_refs.sh, src/Makefile:708) and builds the http-request submodule
      # (action.yml:35-43, also configured at src/CMakeLists.txt:244). A submodule bump changes only
      # the gitlink path, which `http-request/**` would never match.
      - "src/Makefile"
      - "tools/get_git_refs.sh"
      - "src/shared_modules/http-request"
      # Result-affecting actions this workflow executes (reinstall_cmake runs the devContainer script,
      # reinstall_cmake/action.yml:29). upload_s3_artifact is left out on purpose: coverage_cpp calls
      # it with continue-on-error (coverage_cpp/action.yml:112-121), so it can only report, and the
      # agent package and -rtr lanes exercise it on PRs.
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/coverage_cpp/**"
      - ".github/actions/test_cpp/**"
      - ".github/actions/reinstall_cmake/**"
      - "tools/devContainer/reinstall-cmake.sh"
      - ".github/actions/setup-sccache/**"
      # Not compiled into utils_utest: the benchmark is a separate target (benchmark/CMakeLists.txt,
      # label `utils`, not selected here), no test includes jwt/ or mocks/.
      - "!src/shared_modules/utils/benchmark/**"
      - "!src/shared_modules/utils/jwt/**"
      - "!src/shared_modules/utils/mocks/**"
      # ...but the benchmark's CMakeLists.txt is on this lane's configure path: utils/CMakeLists.txt
      # add_subdirectory(benchmark) whenever UNIT_TEST is on (utils/CMakeLists.txt:13-20), so a broken
      # one fails the configure here and no other lane fires on it.
      - "src/shared_modules/utils/benchmark/CMakeLists.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  shared_modules_utils-modules:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@master
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install a compatible CMake
        uses: ./.github/actions/reinstall_cmake
      # Compilation cache (issue 38139). Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/5.0.0
      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Shared modules utils - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "utils_utest"
          test: "true"
          asan: "false"

      # Valgrind is deliberately off: test_cpp runs `valgrind ctest` without --trace-children=yes
      # (test_cpp/action.yml:43), which instruments ctest itself and never the test binary, so the
      # leg cost time and checked nothing. The ASAN job below is the memory gate.
      - name: Shared modules utils - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "false"
          target: "utils_utest"

      - name: Shared modules utils - Coverage
        uses: ./.github/actions/coverage_cpp
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          path: src/shared_modules/utils
          id: utils_utest
          validate_function_coverage: "false"
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true

  shared_modules_utils-asan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install a compatible CMake
        uses: ./.github/actions/reinstall_cmake
      # Compilation cache (issue 38139). Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/5.0.0
      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Shared modules utils - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "utils_utest"
          test: "true"
          asan: "true"

      - name: Shared modules utils - Run tests
        uses: ./.github/actions/test_cpp
        with:
          target: "utils_utest"
          valgrind: "false"
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true
