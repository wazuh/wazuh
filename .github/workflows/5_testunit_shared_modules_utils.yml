name: 5.X - Shared Modules - Utils - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_shared_modules_utils.yml"
      - "src/shared_modules/utils/**"
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/coverage_cpp/**"
      - ".github/actions/test_cpp/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  shared_modules_utils-modules:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # NOTE: deliberately NOT downsized to a `small` instance, and neither is -asan below.
    # utils_utest contains AsyncValueDispatcherTest.CancelFunctionality, which waits for its
    # counter to reach 5, cancels, then asserts 10 — items 6..10 are unsynchronised, so the
    # outcome depends on when the worker thread is scheduled. Measured on 2 vCPU: this job
    # failed 10/10 and -asan failed 1/23, against zero failures on that test at this size.
    # The race is in the test, not in valgrind; running under valgrind only makes it
    # near-deterministic. Revisit once the test synchronises on all 10 items.
    # Data: https://github.com/wazuh/wazuh/pull/38215#issuecomment-5205906176
    runs-on: codebuild-github-actions-codebuild-runner-server-amd-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 60
    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@master
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install a compatible CMake
        uses: ./.github/actions/reinstall_cmake

      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Shared modules utils - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "utils_utest"
          test: "true"
          asan: "false"

      - name: Shared modules utils - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "true"
          target: "utils_utest"

      - name: Shared modules utils - Coverage
        uses: ./.github/actions/coverage_cpp
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          path: src/shared_modules/utils
          id: utils_utest
          validate_function_coverage: "false"

  shared_modules_utils-asan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # NOTE: not downsized — see the AsyncValueDispatcherTest note on the job above.
    runs-on: codebuild-github-actions-codebuild-runner-server-amd-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install a compatible CMake
        uses: ./.github/actions/reinstall_cmake

      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Shared modules utils - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "utils_utest"
          test: "true"
          asan: "true"

      - name: Shared modules utils - Run tests
        uses: ./.github/actions/test_cpp
        with:
          target: "utils_utest"
          valgrind: "false"
