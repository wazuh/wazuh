name: 5.X - Shared Modules - Utils - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_shared_modules_utils.yml"
      # The headers under test, tests/ (incl. input_files, copied by file(COPY input_files ...) in
      # tests/CMakeLists.txt) and flatbuffers/, which build_external_deps compiles (its "Build
      # flatbuffer schemas" step).
      - "src/shared_modules/utils/**"
      # utils_utest links FileIO (target_link_libraries in tests/CMakeLists.txt), defined in
      # file_helper/CMakeLists.txt (add_library(FileIO ...)) from file_io/src and exporting
      # file_io/include; linuxInfoHelper.h includes file_io_utils.hpp.
      - "src/shared_modules/file_helper/CMakeLists.txt"
      - "src/shared_modules/file_helper/file_io/include/**"
      - "src/shared_modules/file_helper/file_io/src/**"
      # Headers outside utils/ that the compiled ones include: commonDefs.h (msgDispatcher.h,
      # threadDispatcher.h, loggerHelper.h, ...) and logging_helper.h (asyncFlushController.hpp), both
      # on the test's include path (include_directories(.../shared_modules/common) and
      # (.../shared/include) in tests/CMakeLists.txt).
      - "src/shared_modules/common/commonDefs.h"
      - "src/shared/include/logging_helper.h"
      # Configure path: build_target_cpp configures src/ as one tree -- src/CMakeLists.txt (registers
      # this module with add_subdirectory(shared_modules/utils), includes src/cmake/*.cmake by
      # include(WazuhRpath)/include(WazuhJemalloc), reads VERSION.json into VERSION_JSON) and
      # src/external/CMakeLists.txt, which defines the rocksdb/crypto/zlib/minizip targets linked here
      # and includes src/cmake/WazuhExternalFlags.cmake.
      - "src/CMakeLists.txt"
      - "src/cmake/**"
      - "src/external/CMakeLists.txt"
      - "VERSION.json"
      # build_external_deps runs `make deps`/`make build-external` (src/Makefile, which includes
      # deps.lock.mk; its ref list comes from tools/get_git_refs.sh, GIT_REFS_LIST in src/Makefile) and
      # builds the http-request submodule (its "Build http-request" step, also configured by
      # add_subdirectory(shared_modules/http-request) in src/CMakeLists.txt). A submodule bump changes
      # only the gitlink path, which `http-request/**` would never match.
      # Not listed on purpose: the action's standalone shared_modules/keystore build. utils_utest
      # links none of its output, and a change that breaks it is caught on its own PR by
      # 5_testcomponent_keystore.yml, which fires on that tree and runs this same action.
      - "src/Makefile"
      - "src/deps.lock.mk"
      - "tools/get_git_refs.sh"
      - "src/shared_modules/http-request"
      # Result-affecting actions this workflow executes (reinstall_cmake runs the devContainer script,
      # reinstall_cmake/action.yml:29). upload_s3_artifact is left out on purpose: coverage_cpp calls
      # it with continue-on-error (coverage_cpp/action.yml:112-121), so it can only report, and the
      # agent package and -rtr lanes exercise it on PRs.
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/coverage_cpp/**"
      - ".github/actions/test_cpp/**"
      - ".github/actions/reinstall_cmake/**"
      - "tools/devContainer/reinstall-cmake.sh"
      - ".github/actions/setup-sccache/**"
      # Not compiled into utils_utest: the benchmark is a separate, manual target (benchmark/CMakeLists.txt,
      # label `utils_benchmark`, not selected here), and no source of utils_utest includes, even transitively,
      # a header of jwt/ or mocks/ (tests/mocks/ is another directory and stays in).
      - "!src/shared_modules/utils/benchmark/**"
      - "!src/shared_modules/utils/jwt/**"
      - "!src/shared_modules/utils/mocks/**"
      # Prose: no build or test reads it.
      - "!src/shared_modules/utils/COPYING"
      # ...but the benchmark's CMakeLists.txt is on this lane's configure path: utils/CMakeLists.txt
      # runs add_subdirectory(benchmark) whenever UNIT_TEST is on and the build is not an agent's, so
      # a broken one fails the configure here and no other lane fires on it.
      - "src/shared_modules/utils/benchmark/CMakeLists.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  shared_modules_utils-modules:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install a compatible CMake
        uses: ./.github/actions/reinstall_cmake
      # Compilation cache. Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/5.0.0
      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Shared modules utils - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "utils_utest"
          test: "true"
          asan: "false"

      # Valgrind is off: this leg never had a working valgrind run (test_cpp used to wrap only the
      # ctest driver, so it cost time and checked nothing; its branch now traces the test binaries,
      # but turning it on needs a trial run). The ASAN job below is the memory gate.
      - name: Shared modules utils - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "false"
          target: "utils_utest"

      - name: Shared modules utils - Coverage
        uses: ./.github/actions/coverage_cpp
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          path: src/shared_modules/utils
          id: utils_utest
          validate_function_coverage: "false"
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true

  shared_modules_utils-asan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install a compatible CMake
        uses: ./.github/actions/reinstall_cmake
      # Compilation cache. Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/5.0.0
      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Shared modules utils - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "utils_utest"
          test: "true"
          asan: "true"

      - name: Shared modules utils - Run tests
        uses: ./.github/actions/test_cpp
        with:
          target: "utils_utest"
          valgrind: "false"
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true
