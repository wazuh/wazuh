run-name: Check changelog on PR ${{ github.event.pull_request.number }}
name: 5.X - Check changelog

on:
  # No `paths`: every PR owes a CHANGELOG.md entry or the `no-changelog` label. `unlabeled` re-runs
  # the check when that label is removed (otherwise the green it granted stays); `reopened` re-runs
  # it on a PR whose last run predates its closing.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # Enforces the update of a changelog file on every pull request
  verify-changelog:
    if: ${{ !github.event.pull_request.draft && github.repository == 'wazuh/wazuh' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify changelog
        uses: dangoslen/changelog-enforcer@v3
        id: verify-changelog
        with:
          skipLabels: "no-changelog"
          changeLogPath: "CHANGELOG.md"
