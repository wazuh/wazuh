name: "5.X - Keystore - Integration tests"
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testintegration_keystore.yml"
      # The suite (qa/test_keystore.py) runs the wazuh-manager-keystore CLI (src/main.cpp,
      # CMakeLists.txt:41-49) and wazuh-keystore-testtool (testtool/CMakeLists.txt:26,31), both
      # linking the keystore library (src/keyStore.cpp, include/). That is the whole module except the
      # component tests' sources.
      - "src/shared_modules/keystore/**"
      - "!src/shared_modules/keystore/tests/**"
      - "src/shared_modules/keystore/tests/**/CMakeLists.txt"
      # Headers from shared_modules/utils and common/commonDefs.h (included by
      # utils/loggerHelper.h:15). utils/flatbuffers is built by build_external_deps/action.yml:55-63.
      # utils' own tests and benchmark are another component's tree; only their CMakeLists.txt are on
      # the configure path (utils/CMakeLists.txt).
      - "src/shared_modules/utils/**"
      - "!src/shared_modules/utils/tests/**"
      - "!src/shared_modules/utils/benchmark/**"
      - "src/shared_modules/utils/tests/CMakeLists.txt"
      - "src/shared_modules/utils/benchmark/CMakeLists.txt"
      - "src/shared_modules/common/**"
      # Configure path: build_target_cpp configures all of src/ as one tree
      # (build_target_cpp/action.yml:57) -- src/CMakeLists.txt (src/cmake/*.cmake at :86-87,
      # VERSION.json at :128) and src/external/CMakeLists.txt (ext_* targets, wazuhext at :1474).
      - "src/CMakeLists.txt"
      - "src/cmake/**"
      - "src/external/CMakeLists.txt"
      - "VERSION.json"
      # build_external_deps runs make deps/build-external (src/Makefile:610, ref list from
      # tools/get_git_refs.sh at src/Makefile:708) and builds the http-request submodule
      # (action.yml:35-43). A submodule bump changes only the gitlink path, which no '/**'
      # pattern matches.
      - "src/Makefile"
      - "tools/get_git_refs.sh"
      - "src/shared_modules/http-request"
      # Result-affecting actions and scripts (reinstall_cmake runs tools/devContainer/reinstall-cmake.sh).
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/reinstall_cmake/**"
      - "tools/devContainer/reinstall-cmake.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  keystore-integration:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compatible CMake
        uses: ./.github/actions/reinstall_cmake

      - name: Build external dependencies
        uses: ./.github/actions/build_external_deps

      # wazuh-manager-keystore is defined only when UNIT_TEST is off (keystore/CMakeLists.txt:41),
      # and build_external_deps leaves UNIT_TEST=ON cached in src/build (`make build-external TEST=1`),
      # which test: "false" alone does not clear.
      - name: Keystore - CLI
        uses: ./.github/actions/build_target_cpp
        with:
          target: "wazuh-manager-keystore"
          test: "false"
          asan: "false"
          flags: "-DUNIT_TEST=OFF"

      - name: Keystore - Test tool
        uses: ./.github/actions/build_target_cpp
        with:
          target: "wazuh-keystore-testtool"
          test: "false"
          asan: "false"

      - name: Install dependencies
        run: |
          pip install -r src/shared_modules/keystore/qa/requirements.txt

      # The suite chdirs to src/ and runs ./wazuh-manager-keystore and ./wazuh-keystore-testtool
      # from there (qa/test_keystore.py:12-13,120). Symlinks keep each binary's $ORIGIN rpath valid.
      # The testtool opens queue/keystore relative to its cwd (src/), while the CLI moves to its home
      # directory first (src/main.cpp, Utils::findHomeDirectory); WAZUH_MANAGER_HOME points that home
      # at src/ too, so both read and write the same database.
      - name: Run integration QA
        run: |
          ln -sf "${GITHUB_WORKSPACE}/src/build/bin/wazuh-manager-keystore" src/wazuh-manager-keystore
          ln -sf "${GITHUB_WORKSPACE}/src/build/bin/wazuh-keystore-testtool" src/wazuh-keystore-testtool
          cd src/shared_modules/keystore/qa
          WAZUH_MANAGER_HOME="${GITHUB_WORKSPACE}/src" python -m pytest -vv --log-cli-level=INFO
