name: 5.X - Scan build
on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    # The union of the four builds' closures; detect-targets below decides which ones a change needs.
    # Each job runs `make TARGET=<t> DEBUG=1` (no TEST) under scan-build: it analyses every
    # translation unit of that target's daemons and libraries, so the blanket src/** is the real
    # closure once the trees no such build compiles are taken out below.
    paths:
      - "src/**"
      - ".github/workflows/5_codeanalysis_scanbuild.yml"
      - ".github/actions/reinstall_cmake/**"
      # Run by reinstall_cmake (reinstall_cmake/action.yml:29)
      - "tools/devContainer/reinstall-cmake.sh"
      # .github/actions/upload_s3_artifact only uploads the report of a failed analysis and cannot
      # change the result; 5_builderpackage_manager-multiples.yml exercises it on every pull request.
      # Read by every configure (src/CMakeLists.txt:140, the VERSION define) and by `make deps`:
      # src/Makefile:729 runs get_git_refs.sh (which reads VERSION.json too) to choose the ref the
      # indexer templates of every TARGET are downloaded from (src/Makefile:596-614)
      - "VERSION.json"
      - "tools/get_git_refs.sh"
      # `make TARGET=winagent` converts both into src/win32 (src/Makefile:375-376)
      - "etc/internal_options.conf"
      - "etc/local_internal_options-win.conf"
      # Installer scripts: make never reads src/init.
      - "!src/init/**"
      # Inputs of the agent build tooling (src/build.py), never run here
      - "!src/ci/**"
      # Test trees. The cmocka project and the wrappers src/shared/CMakeLists.txt:111-256 compiles
      # are UNIT_TEST-only, as is every add_subdirectory of a tests/, test/ or integrationTests/
      # directory (the engine's: ENGINE_BUILD_TEST, src/engine/CMakeLists.txt:40-46); no job here
      # sets either. The one exception is a source src/syscheckd/src/ebpf/CMakeLists.txt:30 names
      # outside that gate (EXCLUDE_FROM_ALL, but its absence fails the configure).
      - "!src/unit_tests/**"
      - "!src/**/tests/**"
      - "!src/**/test/**"
      - "!src/**/integrationTests/**"
      - "src/syscheckd/src/ebpf/tests/syscalls/**"
      # qa/ harnesses are pytest suites driving test tools, run by their own workflows
      - "!src/**/qa/**"
      # Test-tool inputs and a docker demo no CMake file references
      - "!src/**/smokeTests/**"
      - "!src/client-agent/https_client/demo/**"
      # Engine trees no CMake or make file references (python tools, the ruleset, packaging):
      # src/engine/CMakeLists.txt adds only source/ (:299-330) and docs/
      - "!src/engine/internal_packages/**"
      - "!src/engine/ruleset/**"
      - "!src/engine/standalone/**"
      - "!src/engine/tools/**"
      # MSI-only inputs (src/win32/wazuh-installer.wxs:64-71,300,726 and the upgrade scripts): no
      # CMake or make rule reads them; 5_testcomponent_windows-installer-upgrade.yml builds the MSI
      - "!src/win32/wazuh-installer*"
      - "!src/win32/*.vbs"
      - "!src/win32/do_upgrade.ps1"
      - "!src/win32/upgrade.bat"
      - "!src/win32/license.rtf"
      - "!src/win32/vista_sec.txt"
      - "!src/win32/ui/*.jpg"
      # Request drivers and a docker lab (python, shell) no CMake file references
      - "!src/remoted/remoted_module/tools/**"
      - "!src/wazuh_modules/inventory_sync_server/tools/**"
      # Python: no CMake or make rule of the four builds runs any (src/build.py, module tools)
      - "!src/**/*.py"
      # Prose and pictures: nothing compiles them
      - "!src/**/*.md"
      - "!src/**/COPYING"
      - "!src/engine/COPYING-engine"
      - "!src/engine/LICENSE-engine"
      - "!src/shared_modules/dbsync/images/**"
      - "!src/Doxyfile"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  # A matrix leg cannot carry its own `paths`, so this job applies each build's closure to the pull
  # request's diff: a manager-only change (the engine, remoted, wazuh-db, ...) must not run the
  # agent, mingw and macOS analyses, and an agent-only change must not run the manager one.
  detect-targets:
    name: Select scan-build targets
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      linux: ${{ steps.select.outputs.linux }}
      winagent: ${{ steps.select.outputs.winagent }}
      macos: ${{ steps.select.outputs.macos }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select targets from the changed files
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import json, os, re, subprocess

          def to_regex(glob):
              # GitHub `paths` semantics: `**` spans directories (and `**/` may match none),
              # `*` and `?` stay inside one path segment.
              out, i = "", 0
              while i < len(glob):
                  if glob.startswith("**/", i):
                      out, i = out + "(?:.*/)?", i + 3
                  elif glob.startswith("**", i):
                      out, i = out + ".*", i + 2
                  elif glob[i] == "*":
                      out, i = out + "[^/]*", i + 1
                  elif glob[i] == "?":
                      out, i = out + "[^/]", i + 1
                  else:
                      out, i = out + re.escape(glob[i]), i + 1
              return re.compile(out + r"\Z")

          def fires(path, patterns):
              # Ordered like a `paths` list: the last matching pattern decides.
              hit = False
              for pattern in patterns:
                  negated = pattern.startswith("!")
                  if to_regex(pattern.lstrip("!")).match(path):
                      hit = not negated
              return hit

          # Out of every build; the same negations as the workflow-level `paths`, justified there.
          SRC = [
              "src/**", "!src/init/**", "!src/ci/**",
              "!src/unit_tests/**", "!src/**/tests/**", "!src/**/test/**", "!src/**/integrationTests/**",
              "src/syscheckd/src/ebpf/tests/syscalls/**",
              "!src/**/qa/**", "!src/**/smokeTests/**", "!src/client-agent/https_client/demo/**",
              "!src/engine/internal_packages/**", "!src/engine/ruleset/**", "!src/engine/standalone/**",
              "!src/engine/tools/**",
              "!src/remoted/remoted_module/tools/**", "!src/wazuh_modules/inventory_sync_server/tools/**",
              "!src/win32/wazuh-installer*", "!src/win32/*.vbs", "!src/win32/do_upgrade.ps1",
              "!src/win32/upgrade.bat", "!src/win32/license.rtf", "!src/win32/vista_sec.txt",
              "!src/win32/ui/*.jpg",
          ]
          # Last in every build, so they win over the re-included include/ directories.
          PROSE = [
              "!src/**/*.py", "!src/**/*.md", "!src/**/COPYING", "!src/engine/COPYING-engine",
              "!src/engine/LICENSE-engine", "!src/shared_modules/dbsync/images/**", "!src/Doxyfile",
          ]
          # Manager-only trees: src/CMakeLists.txt:346-362 and src/wazuh_modules/CMakeLists.txt:97-102
          # add them only when TARGET is not an agent. The include/ directories stay in the agent
          # closure: agent code compiles against them (shared/src/agent_op.c ->
          # os_auth/include/auth.h, shared/src/agent_validate_op.c -> wazuh_db/include/wdb.h, and
          # wazuh_modules/src/wm_{content_manager,inventory_sync_server,keystore_server,task_manager,
          # vulnerability_scanner}.c, globbed for every target at wazuh_modules/CMakeLists.txt:110-119,
          # -> each module's include/).
          MANAGER_ONLY = [
              "!src/engine/**",
              "!src/remoted/**",
              "!src/util/**",
              "!src/shared_modules/ca_bundle/**",
              "!src/shared_modules/indexer_connector/**",
              "!src/shared_modules/keystore/**",
              "!src/shared_modules/manager_certs/**",
              "!src/shared_modules/manager_config/**",
              "!src/shared_modules/metrics/**",
              "!src/shared_modules/uds_http_server/**",
              "!src/os_auth/**", "src/os_auth/include/**",
              "!src/wazuh_db/**", "src/wazuh_db/include/**",
              "!src/shared_modules/content_manager/**", "src/shared_modules/content_manager/include/**",
              "!src/wazuh_modules/inventory_sync_server/**", "src/wazuh_modules/inventory_sync_server/include/**",
              "!src/wazuh_modules/keystore_server/**", "src/wazuh_modules/keystore_server/include/**",
              "!src/wazuh_modules/task_manager/**", "src/wazuh_modules/task_manager/include/**",
              "!src/wazuh_modules/vulnerability_scanner/**", "src/wazuh_modules/vulnerability_scanner/include/**",
              # Parsers config/CMakeLists.txt:46-55 removes from the agent's libconfig
              "!src/config/src/authd-config.c", "!src/config/src/global-config.c",
              "!src/config/src/indexer-config.c", "!src/config/src/mconf-config.c",
              "!src/config/src/remote-config.c", "!src/config/src/wazuh_db-config.c",
              "!src/config/src/wmodules-task-manager.c", "!src/config/src/wmodules-vulnerability-detection.c",
          ]
          # Agent-only trees (src/CMakeLists.txt:327-343, src/wazuh_modules/CMakeLists.txt:103-108).
          # Their include/ directories stay in the manager closure: shared/include/shared.h ->
          # dbsync/include, shared/include/syscheck_op.h -> syscheckd/include, shared/src/agent_op.c
          # -> data_provider/include, shared/src/log_builder.c -> client-agent/include,
          # util/src/verify-agent-conf.c -> logcollector/include, wm_{agent_info,sca,syscollector}.c
          # -> each module's include/ -> sync_protocol/include. active-response stays whole:
          # shared/CMakeLists.txt:89 compiles active-response/src/active_responses.c for every target.
          AGENT_ONLY = [
              "!src/rootcheck/**",
              "!src/addagent/**",
              "!src/os_execd/**",
              "!src/client-agent/**", "src/client-agent/include/**",
              "!src/data_provider/**", "src/data_provider/include/**",
              "!src/logcollector/**", "src/logcollector/include/**",
              "!src/syscheckd/**", "src/syscheckd/include/**",
              "!src/shared_modules/agent_metadata/**", "src/shared_modules/agent_metadata/include/**",
              "!src/shared_modules/dbsync/**", "src/shared_modules/dbsync/include/**",
              "!src/shared_modules/sync_protocol/**", "src/shared_modules/sync_protocol/include/**",
              "!src/wazuh_modules/agent_info/**", "src/wazuh_modules/agent_info/include/**",
              "!src/wazuh_modules/sca/**", "src/wazuh_modules/sca/include/**",
              "!src/wazuh_modules/syscollector/**", "src/wazuh_modules/syscollector/include/**",
              # src/Makefile:166-168 forces USE_SELINUX=no for the manager
              "!src/selinux/**",
          ]
          # Windows-only: src/CMakeLists.txt:340-342 adds win32 only for winagent.
          WINDOWS_ONLY = ["!src/win32/**"]
          # Linux-only eBPF (src/syscheckd/CMakeLists.txt:124-127); its include/ is on every
          # platform's include path (:44) and syscheckd sources include ebpf_whodata.h.
          NO_EBPF = ["!src/syscheckd/src/ebpf/**", "src/syscheckd/src/ebpf/include/**"]
          # The SELinux policy hangs off the `agent` make target only (src/Makefile:351-365).
          NO_SELINUX = ["!src/selinux/**"]
          # Read by every build: the workflow, the VERSION define (src/CMakeLists.txt:140) and
          # the ref list of `make deps` (src/Makefile:729).
          EVERY = [".github/workflows/5_codeanalysis_scanbuild.yml", "VERSION.json", "tools/get_git_refs.sh"]
          # Not run by the macOS job
          CMAKE = [".github/actions/reinstall_cmake/**", "tools/devContainer/reinstall-cmake.sh"]
          # `make TARGET=winagent` converts both into src/win32 (src/Makefile:375-376).
          WINAGENT_INPUTS = ["etc/internal_options.conf", "etc/local_internal_options-win.conf"]
          BUILDS = {
              "agent":    SRC + MANAGER_ONLY + WINDOWS_ONLY + PROSE + EVERY + CMAKE,
              "manager":  SRC + AGENT_ONLY + WINDOWS_ONLY + PROSE + EVERY + CMAKE,
              "winagent": SRC + MANAGER_ONLY + NO_SELINUX + NO_EBPF + PROSE + EVERY + CMAKE + WINAGENT_INPUTS,
              "macos":    SRC + MANAGER_ONLY + WINDOWS_ONLY + NO_EBPF + PROSE + EVERY,
          }

          event_name = os.environ.get("EVENT_NAME", "")
          base_sha = os.environ.get("BASE_SHA", "").strip()
          head_sha = os.environ.get("HEAD_SHA", "").strip()

          selected = set(BUILDS)
          if event_name == "pull_request" and base_sha and head_sha:
              # --no-renames: a rename counts as a deletion plus an addition, like the two paths
              # GitHub's own `paths` filter sees; the default lists only the new name, which would
              # skip the build the file was moved out of.
              diff = subprocess.run(["git", "diff", "--name-only", "--no-renames",
                                     f"{base_sha}...{head_sha}"],
                                    capture_output=True, text=True)
              if diff.returncode == 0:
                  changed = [line for line in diff.stdout.splitlines() if line]
                  selected = {build for build, patterns in BUILDS.items()
                              if any(fires(path, patterns) for path in changed)}
              else:
                  print("::warning::Could not diff the pull request; running every build.")

          linux = [t for t in ("agent", "manager") if t in selected]
          print(f"Linux: {linux}; mingw: {'winagent' in selected}; macOS: {'macos' in selected}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"linux={json.dumps(linux)}\n")
              out.write(f"winagent={str('winagent' in selected).lower()}\n")
              out.write(f"macos={str('macos' in selected).lower()}\n")

  scan-build-linux:
    needs: detect-targets
    if: >
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.detect-targets.outputs.linux != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-targets.outputs.linux) }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools-14
      - name: "Install a compatible CMake"
        uses: ./.github/actions/reinstall_cmake
      - name: Build
        id: build_step
        continue-on-error: true
        run: |
          cd src
          make deps TARGET=${{matrix.target}} -j$(nproc)
          scan-build-14 --status-bugs --force-analyze-debug-code -o scan-build-report --exclude external/ make TARGET=${{ matrix.target }} DEBUG=1 -j$(nproc)
      - name: Upload scan-build report
        if: steps.build_step.outcome == 'failure'
        uses: ./.github/actions/upload_s3_artifact
        with:
          aws_region: ${{ secrets.CI_AWS_REGION }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          name: linux-${{ matrix.target }}-scan-build-report
          path: src/scan-build-report/
      - name: Fail job if build failed
        if: steps.build_step.outcome == 'failure'
        run: exit 1

  scan-build-ubuntu-mingw-windows:
    needs: detect-targets
    if: >
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.detect-targets.outputs.winagent == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools-14 gcc-mingw-w64 g++-mingw-w64-i686 g++-mingw-w64-x86-64 -y
      - name: "Install a compatible CMake"
        uses: ./.github/actions/reinstall_cmake
      - name: Build
        id: build_step
        continue-on-error: true
        run: |
          cd src
          make deps TARGET=winagent -j$(nproc)
          make TARGET=winagent DEBUG=1 -j$(nproc)
          make clean-internals
          scan-build-14 --status-bugs --use-cc=/usr/bin/i686-w64-mingw32-gcc --use-c++=/usr/bin/i686-w64-mingw32-g++-posix --analyzer-target=i686-w64-mingw32 --force-analyze-debug-code -o scan-build-report --exclude external/ --exclude syscheckd/src/registry/ make TARGET=winagent DEBUG=1 -j$(nproc)
      - name: Upload scan-build report
        if: steps.build_step.outcome == 'failure'
        uses: ./.github/actions/upload_s3_artifact
        with:
          aws_region: ${{ secrets.CI_AWS_REGION }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          name: windows-agent-scan-build-report
          path: src/scan-build-report/
      - name: Fail job if build failed
        if: steps.build_step.outcome == 'failure'
        run: exit 1

  scan-build-macos-agent:
    needs: detect-targets
    if: >
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.detect-targets.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew install llvm@14
      - name: Build
        id: build_step
        continue-on-error: true
        run: |
          cd src
          make deps TARGET=agent -j3
          /opt/homebrew/opt/llvm@14/bin/scan-build --status-bugs --force-analyze-debug-code -o scan-build-report --exclude external/ make TARGET=agent DEBUG=1 -j3
      - name: Upload scan-build report
        if: steps.build_step.outcome == 'failure'
        uses: ./.github/actions/upload_s3_artifact
        with:
          aws_region: ${{ secrets.CI_AWS_REGION }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          name: macos-agent-scan-build-report
          path: src/scan-build-report/
      - name: Fail job if build failed
        if: steps.build_step.outcome == 'failure'
        run: exit 1
