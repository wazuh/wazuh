name: 5.X - macOS compilation test

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - "src/**"
      - ".github/workflows/5_testcomponent_build-macos.yml"
      # Manager-only trees: src/CMakeLists.txt:276-293 and src/wazuh_modules/CMakeLists.txt:97-102
      # add them only when TARGET is not an agent. Their include/ directories stay: agent code
      # compiles against them (shared/src/agent_op.c -> os_auth/include/auth.h,
      # shared/src/agent_validate_op.c -> wazuh_db/include/wdb.h, and
      # wazuh_modules/src/wm_{content_manager,inventory_sync_server,keystore_server,
      # vulnerability_scanner}.c, globbed for every target at wazuh_modules/CMakeLists.txt:110-119,
      # -> each module's include/).
      - "!src/engine/**"
      - "!src/remoted/**"
      - "!src/util/**"
      - "!src/shared_modules/ca_bundle/**"
      - "!src/shared_modules/indexer_connector/**"
      - "!src/shared_modules/keystore/**"
      - "!src/shared_modules/manager_certs/**"
      - "!src/shared_modules/manager_config/**"
      - "!src/shared_modules/metrics/**"
      - "!src/shared_modules/uds_http_server/**"
      - "!src/os_auth/**"
      - "src/os_auth/include/**"
      - "!src/wazuh_db/**"
      - "src/wazuh_db/include/**"
      - "!src/shared_modules/content_manager/**"
      - "src/shared_modules/content_manager/include/**"
      - "!src/wazuh_modules/inventory_sync_server/**"
      - "src/wazuh_modules/inventory_sync_server/include/**"
      - "!src/wazuh_modules/keystore_server/**"
      - "src/wazuh_modules/keystore_server/include/**"
      - "!src/wazuh_modules/task_manager/**"
      - "src/wazuh_modules/task_manager/include/**"
      - "!src/wazuh_modules/vulnerability_scanner/**"
      - "src/wazuh_modules/vulnerability_scanner/include/**"
      # Installer scripts (the manager's credential ladder included) and their shell suites:
      # neither make nor ctest reads src/init
      - "!src/init/**"
      # Windows-only, never built for the macOS agent
      - "!src/win32/**"
      # Test trees: UNIT_TEST-gated, never built by this workflow
      - "!src/unit_tests/**"
      - "!src/**/tests/**"
      - "!src/**/integrationTests/**"
      - "!src/**/qa/**"
      # Prose: nothing compiles Markdown (last, so it wins over the re-included include/)
      - "!src/**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sonoma:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      - name: Build wazuh agent for macOS 14
        run: |
          make deps -C src TARGET=agent -j3
          make -C src TARGET=agent -j3
