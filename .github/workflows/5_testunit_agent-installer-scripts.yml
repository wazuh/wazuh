name: 5.X - Agent installer scripts - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_agent-installer-scripts.yml"
      # register_configure_agent.sh and pkg_installer.sh. Each of their suites runs its target in a
      # throwaway install directory with stubbed binaries (wazuh-agentd --show-token, curl, rpm), so
      # nothing else is built, installed or sourced.
      - "src/init/register_configure_agent.sh"
      - "src/init/pkg_installer.sh"
      - "src/init/tests/test_enrollment_token.sh"
      - "src/init/tests/test_register_configure_agent.sh"
      - "src/init/tests/test_pkg_installer_ca.sh"
      - "src/init/tests/test_pkg_installer_state.sh"
      # The default <localfile> blocks the packages add to ossec.conf: add_localfiles.sh and the
      # scripts it sources, run on a copy of them and of the localfile-logs templates.
      - "src/init/inst-functions.sh"
      - "src/init/add_localfiles.sh"
      - "src/init/shared.sh"
      - "src/init/template-select.sh"
      - "etc/templates/config/generic/localfile-logs/**"
      - "src/init/tests/test_write_logs.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-installer-shell-tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Each suite prints one line per check and exits non-zero on any failure. They run
      # unprivileged on purpose: the packages call these scripts as root, but every case is built so
      # that an unprivileged run reaches the decision it asserts.
      - name: Enrollment token handling (register_configure_agent.sh)
        run: bash src/init/tests/test_enrollment_token.sh

      - name: ossec.conf rewriting (register_configure_agent.sh)
        run: bash src/init/tests/test_register_configure_agent.sh

      # Needs openssl on PATH to mint its test CA; the runner image ships it.
      - name: Manager-delivered CA (pkg_installer.sh)
        run: bash src/init/tests/test_pkg_installer_ca.sh

      - name: Agent state file (pkg_installer.sh)
        run: bash src/init/tests/test_pkg_installer_state.sh

      # The deb postinst runs it under dash, the rpm %post under bash.
      - name: Default log files under dash (inst-functions.sh WriteLogs, add_localfiles.sh)
        if: ${{ !cancelled() }}
        run: sh src/init/tests/test_write_logs.sh

      - name: Default log files under bash (inst-functions.sh WriteLogs, add_localfiles.sh)
        if: ${{ !cancelled() }}
        run: bash src/init/tests/test_write_logs.sh
