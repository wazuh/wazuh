name: 5.X - Indexer client library - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_indexer_client.yml"
      # The library and its tests include nothing in-tree outside the module: asio, nlohmann, curl's
      # headers, googletest and cpp-httplib come from src/external, and curl/OpenSSL are linked through
      # wazuhext (src/external/CMakeLists.txt, listed below).
      - "src/shared_modules/indexer_client/**"
      # Configure path: build_target_cpp configures src/ as one tree -- src/CMakeLists.txt (includes
      # src/cmake/*.cmake, reads VERSION.json, registers this module) and src/external/CMakeLists.txt,
      # which defines ext_asio and ext_httplib linked here.
      - "src/CMakeLists.txt"
      - "src/cmake/**"
      - "src/external/CMakeLists.txt"
      - "VERSION.json"
      # build_external_deps runs `make deps`/`make build-external` (src/Makefile; its ref list comes
      # from tools/get_git_refs.sh) and builds the http-request submodule; a submodule bump changes
      # only the gitlink path, which `http-request/**` would never match.
      - "src/Makefile"
      - "tools/get_git_refs.sh"
      - "src/shared_modules/http-request"
      # Result-affecting actions this workflow executes (upload_s3_artifact only reports, see the
      # uds_http_server workflow).
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/coverage_cpp/**"
      - ".github/actions/test_cpp/**"
      # Prose: no build or test reads it.
      - "!src/shared_modules/indexer_client/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  indexerclient-modules:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      # The library is pinned to C++17 (its headers must build in strict-C++17 consumers), so a
      # C++20-ism fails here, not in a consumer's build.
      - name: Indexer client - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "indexer_client_utest"
          test: "true"
          asan: "false"

      # Valgrind is off: the runtime tests start and join real thread pools and asio loops against
      # deadlines; under Valgrind's serialized execution they time out for the wrong reason. The
      # ASAN job below covers the memory-safety surface (teardown order of the runtime threads).
      - name: Indexer client - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "false"
          target: "indexer_client_utest"

      - name: Indexer client - Build component tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "indexer_client_component_test"
          test: "true"
          asan: "false"

      # The component suite drives the curl transport against an in-process fake over real sockets.
      - name: Indexer client - Run component tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "false"
          target: "indexer_client_component_test"

      - name: Indexer client - Coverage
        uses: ./.github/actions/coverage_cpp
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          path: src/shared_modules/indexer_client
          test_directory: src/shared_modules/indexer_client
          id: indexer_client
          validate_function_coverage: "false"

  indexerclient-asan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Indexer client - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "indexer_client_utest"
          test: "true"
          asan: "true"

      # The shutdown and restart tests are only real regression checks under a sanitizer: a thread
      # left running past shutdown(), or a task touching a destroyed runtime, usually still passes
      # without one.
      - name: Indexer client - Run tests
        uses: ./.github/actions/test_cpp
        with:
          target: "indexer_client_utest"
          valgrind: "false"

      - name: Indexer client - Build component tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "indexer_client_component_test"
          test: "true"
          asan: "true"

      # The *Long load cases (~90 s of wall clock each run) only measure rates: the normal job runs them, ASAN adds nothing.
      - name: Indexer client - Run component tests
        uses: ./.github/actions/test_cpp
        env:
          GTEST_FILTER: "-*Long"
        with:
          target: "indexer_client_component_test"
          valgrind: "false"
