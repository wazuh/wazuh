name: 5.X - Remoted Module - Component tests

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testcomponent_remoted_module.yml"
      - "src/remoted/remoted_module/**"
      - "src/shared_modules/utils/**"
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/test_cpp/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  remoted-module-tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - test_type: valgrind
            asan_enabled: "false"
            valgrind_enabled: "true"
          - test_type: asan
            asan_enabled: "true"
            valgrind_enabled: "false"
    name: Run tests (${{ matrix.test_type }})

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/build_external_deps

      - uses: ./.github/actions/build_target_cpp
        with:
          target: "remoted_module_utest"
          test: "true"
          asan: ${{ matrix.asan_enabled }}

      - uses: ./.github/actions/test_cpp
        with:
          target: "remoted_module_utest"
          valgrind: ${{ matrix.valgrind_enabled }}
