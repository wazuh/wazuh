name: 5.X - Indexer Connector - Component tests

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testcomponent_indexer-connector.yml"
      # indexer_connector_ctests compiles tests/component/*.cpp and links the indexer_connector
      # library (tests/component/CMakeLists.txt:7,20), built from src/ and include/
      # (CMakeLists.txt:45-53). Every CMakeLists.txt of the module is on the configure path
      # (CMakeLists.txt:61,64).
      - "src/shared_modules/indexer_connector/**/CMakeLists.txt"
      - "src/shared_modules/indexer_connector/include/**"
      - "src/shared_modules/indexer_connector/src/**"
      - "src/shared_modules/indexer_connector/tests/component/**"
      # Linked: keystore (CMakeLists.txt:52-53, tests/component/CMakeLists.txt:21; also built
      # standalone by build_external_deps/action.yml:45-53, testtool included) -- not its qa/ suite.
      - "src/shared_modules/keystore/**"
      - "!src/shared_modules/keystore/qa/**"
      # Headers from shared_modules/utils (CMakeLists.txt:32) and common/commonDefs.h (included by
      # utils/loggerHelper.h:15). utils/flatbuffers is built by build_external_deps/action.yml:55-63.
      # utils' own tests and benchmark are another component's tree; only their CMakeLists.txt are on
      # the configure path (utils/CMakeLists.txt).
      - "src/shared_modules/utils/**"
      - "!src/shared_modules/utils/tests/**"
      - "!src/shared_modules/utils/benchmark/**"
      - "src/shared_modules/utils/tests/CMakeLists.txt"
      - "src/shared_modules/utils/benchmark/CMakeLists.txt"
      - "src/shared_modules/common/**"
      # Configure path: build_target_cpp configures all of src/ as one tree
      # (build_target_cpp/action.yml:57) -- src/CMakeLists.txt (src/cmake/*.cmake at :86-87,
      # VERSION.json at :128) and src/external/CMakeLists.txt (ext_* targets, wazuhext at :1474).
      - "src/CMakeLists.txt"
      - "src/cmake/**"
      - "src/external/CMakeLists.txt"
      - "VERSION.json"
      # build_external_deps runs make deps/build-external (src/Makefile:610, ref list from
      # tools/get_git_refs.sh at src/Makefile:708) and builds http-request (action.yml:35-43), linked
      # here as urlrequest (CMakeLists.txt:52). A submodule bump changes only the gitlink path.
      - "src/Makefile"
      - "tools/get_git_refs.sh"
      - "src/shared_modules/http-request"
      # Result-affecting actions and scripts this workflow executes (setup-sccache wraps the
      # compilers; reinstall_cmake runs tools/devContainer/reinstall-cmake.sh).
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/reinstall_cmake/**"
      - "tools/devContainer/reinstall-cmake.sh"
      - ".github/actions/setup-sccache/**"
      - ".github/actions/test_cpp/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  indexer-connector-tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # This leg keeps its name (check names) but no longer wraps ctest in valgrind: test_cpp's
          # valgrind branch never instrumented the test binary (no --trace-children=yes,
          # test_cpp/action.yml), so it is the plain, non-sanitized build of the suite. The asan
          # leg is the memory gate.
          - test_type: valgrind
            asan_enabled: "false"
            valgrind_enabled: "false"
          - test_type: asan
            asan_enabled: "true"
            valgrind_enabled: "false"
    name: Run tests (${{ matrix.test_type }})

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compatible CMake
        uses: ./.github/actions/reinstall_cmake
      # Compilation cache (issue 38139). Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/5.0.0
      - name: Build external dependencies
        uses: ./.github/actions/build_external_deps

      - name: Indexer Connector - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          test: "true"
          asan: "${{ matrix.asan_enabled }}"
          target: "indexer_connector_ctests"

      - name: Indexer Connector - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "${{ matrix.valgrind_enabled }}"
          target: "indexer_connector_ctests"
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true
