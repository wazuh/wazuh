name: 5.X - Developer tools - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_dev-tools.yml"
      # Benchmark scrapers and monitor (tests/ imports bench_samples, bench_collect and monitor)
      # and the run collator, which imports bench_samples from there.
      - "tools/devContainer/scripts/*.py"
      - "tools/devContainer/scripts/tests/**"
      - "tools/manager_benchmark/result_summary.py"
      # test_scripts.py runs the shell helpers it covers.
      - "tools/manager_benchmark/*.sh"
      - "tools/manager_benchmark/tests/**"
      # Dashboard capture tool: the tests read capture.py, capture_logic.py and views.json.
      - "tools/devContainer/e2e/dashboard/*.py"
      - "tools/devContainer/e2e/dashboard/views.json"
      # The Go sender: its sources and module files, its tests' testdata, the scenarios/ its scenario
      # test loads, the schema `make generate` compiles and the lock that pins flatc.
      - "tools/manager_benchmark/tool_simulator/**"
      - "!tools/manager_benchmark/tool_simulator/docu/**"
      - "tools/manager_benchmark/scenarios/**"
      - "src/shared_modules/utils/flatbuffers/schemas/inventorySync.fbs"
      - "src/deps.lock.mk"
      # test_jwt_vectors_mirror.py compares the simulator's jwt_vectors.json with this header.
      - "src/shared_modules/utils/jwt/testVectors.hpp"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark-tooling:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pandas and matplotlib are optional at runtime (only projections and graphs need them), and
      # the suites skip the cases that use them when absent -- installed here so nothing skips.
      - name: Install dependencies
        run: python -m pip install pytest psutil pandas matplotlib

      # -rs plus the grep: a case that skips here would be a case this lane never ran.
      - name: Scrapers and monitor
        working-directory: tools/devContainer/scripts
        run: |
          set -o pipefail
          python -m pytest -vv -rs tests | tee /tmp/scripts.log
          if grep -Eq '^=+ .*[0-9]+ skipped' /tmp/scripts.log; then
            echo "::error::tools/devContainer/scripts tests skipped cases"; exit 1
          fi

      - name: Benchmark run collator
        working-directory: tools/manager_benchmark
        run: |
          set -o pipefail
          python -m pytest -vv -rs tests | tee /tmp/benchmark.log
          if grep -Eq '^=+ .*[0-9]+ skipped' /tmp/benchmark.log; then
            echo "::error::tools/manager_benchmark tests skipped cases"; exit 1
          fi

  benchmark-sender:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/manager_benchmark/tool_simulator/go.mod
          cache-dependency-path: tools/manager_benchmark/tool_simulator/go.sum

      # `make generate` runs src/external/flatbuffers/build/flatc (the bindings are never committed).
      # Only that one dependency is fetched, through the same src/Makefile rule `make deps` uses: the
      # pool's precompiled tree when it has one for this platform (src/external/CMakeLists.txt treats a
      # tree holding build/flatc as precompiled), otherwise the sources, from which flatc is built with
      # the options that file passes.
      - name: Obtain flatc
        run: |
          make -C src TARGET=manager external/flatbuffers.tar.gz
          if [ ! -x src/external/flatbuffers/build/flatc ]; then
            cmake -S src/external/flatbuffers -B src/external/flatbuffers/build \
              -DFLATBUFFERS_BUILD_TESTS=0 -DFLATBUFFERS_INSTALL=0
            cmake --build src/external/flatbuffers/build --target flatc -j"$(nproc)"
          fi
          src/external/flatbuffers/build/flatc --version

      - name: Generate the FlatBuffers bindings and run the Go tests
        run: make -C tools/manager_benchmark/tool_simulator generate test

  dashboard-capture:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Built the way the tool's own --setup builds it (capture.py): a venv holding the pinned
      # playwright (layout moves with the browser), with Chromium under <venv>/browsers.
      # test_capture_dom skips every case unless DASHBOARD_VENV is an existing directory, and it
      # SETS PLAYWRIGHT_BROWSERS_PATH to <venv>/browsers (capture_logic.browsers_env), so a
      # playwright installed into the runner's Python with browsers in the default cache is
      # invisible to it.
      - name: Create the dashboard venv with playwright and Chromium
        run: |
          venv="${RUNNER_TEMP}/venv-dashboard"
          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install playwright==1.63.0
          PLAYWRIGHT_BROWSERS_PATH="${venv}/browsers" "${venv}/bin/python" -m playwright install --with-deps chromium
          echo "DASHBOARD_VENV=${venv}" >> "${GITHUB_ENV}"

      - name: Capture logic and DOM extraction
        working-directory: tools/devContainer/e2e/dashboard
        run: |
          set -o pipefail
          "${DASHBOARD_VENV}/bin/python" -m unittest -v test_capture_logic test_capture_dom 2>&1 | tee /tmp/dashboard.log
          if grep -q 'skipped=' /tmp/dashboard.log; then
            echo "::error::dashboard capture tests skipped cases"; exit 1
          fi
