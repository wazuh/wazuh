name: 4.X - Inventory Harvester - Unit tests

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
  # Pull request events
    types: [synchronize, opened, reopened, ready_for_review]
  # Path filtering
    paths:
      - ".github/workflows/4_testunit_inventory-harvester.yml"
      - "src/shared_modules/utils/**"
      - "src/wazuh_modules/inventory_harvester/**"

permissions:
  id-token: write
  contents: read

jobs:
  inventory-harvester-modules:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@master
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system build dependencies
        # TODO: Remove when added to CodeBuild base images
        run: sudo apt-get update && sudo apt-get install -y cmake python3-pip
      - name: Project dependencies
        uses: ./.github/actions/vulnerability_scanner_deps

      # Compilation cache (issue 38139). Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/4.14.8
      - name: Inventory harvester - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "inventory_harvester_utest"
          test: "true"
          asan: "false"

      - name: Inventory harvester - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "true"
          target: "inventory_harvester_utest"

      - name: Inventory harvester - Coverage
        uses: ./.github/actions/coverage_cpp
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          path: src/wazuh_modules/inventory_harvester
          id: inventory_harvester
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true

  inventory-harvester-asan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      matrix:
        os: [ ubuntu-24.04, ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Project dependencies
        uses: ./.github/actions/vulnerability_scanner_deps

      # Compilation cache (issue 38139). Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/4.14.8
      - name: Inventory harvester - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "inventory_harvester_utest"
          test: "true"
          asan: "true"

      - name: Inventory harvester - Run tests
        uses: ./.github/actions/test_cpp
        with:
          target: "inventory_harvester_utest"
          valgrind: "false"
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true
