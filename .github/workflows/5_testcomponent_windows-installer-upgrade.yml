name: 5.X - Windows upgrade test

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - "src/**"
      - ".github/workflows/5_testcomponent_windows-installer-upgrade.yml"
      - ".github/actions/reinstall_cmake/**"
      # Wraps every compiler of the winagent build (setup-sccache, PATH masquerade)
      - ".github/actions/setup-sccache/**"
      # Hands the built binaries to the Windows test job, which runs against what it fetches
      # The build job hands its binaries to the test job through S3: upload_s3_artifact and
      # download_s3_artifact are both on the result path.
      - ".github/actions/upload_s3_artifact/**"
      - ".github/actions/download_s3_artifact/**"
      # MSI inputs outside src/: the test builds the installer from the zipped tree, and
      # src/win32/wazuh-installer.wxs:340-414 packages these; src/Makefile:366-370 converts the
      # options files, LICENSE and VERSION.json into src/win32/ for it
      - "etc/internal_options.conf"
      - "etc/local_internal_options-win.conf"
      - "etc/wpk_root.pem"
      - "etc/templates/config/windows/**"
      - "ruleset/sca/windows/**"
      - "LICENSE"
      - "VERSION.json"
      # Manager-only trees: src/CMakeLists.txt:276-293 and src/wazuh_modules/CMakeLists.txt:97-102
      # add them only when TARGET is not an agent. Their include/ directories stay: agent code
      # compiles against them (shared/src/agent_op.c -> os_auth/include/auth.h,
      # shared/src/agent_validate_op.c -> wazuh_db/include/wdb.h, and
      # wazuh_modules/src/wm_{content_manager,inventory_sync_server,keystore_server,
      # vulnerability_scanner}.c, globbed for every target at wazuh_modules/CMakeLists.txt:110-119,
      # -> each module's include/).
      - "!src/engine/**"
      - "!src/remoted/**"
      - "!src/util/**"
      - "!src/shared_modules/ca_bundle/**"
      - "!src/shared_modules/indexer_connector/**"
      - "!src/shared_modules/keystore/**"
      - "!src/shared_modules/manager_certs/**"
      - "!src/shared_modules/manager_config/**"
      - "!src/shared_modules/metrics/**"
      - "!src/shared_modules/uds_http_server/**"
      - "!src/os_auth/**"
      - "src/os_auth/include/**"
      - "!src/wazuh_db/**"
      - "src/wazuh_db/include/**"
      - "!src/shared_modules/content_manager/**"
      - "src/shared_modules/content_manager/include/**"
      - "!src/wazuh_modules/inventory_sync_server/**"
      - "src/wazuh_modules/inventory_sync_server/include/**"
      - "!src/wazuh_modules/keystore_server/**"
      - "src/wazuh_modules/keystore_server/include/**"
      - "!src/wazuh_modules/task_manager/**"
      - "src/wazuh_modules/task_manager/include/**"
      - "!src/wazuh_modules/vulnerability_scanner/**"
      - "src/wazuh_modules/vulnerability_scanner/include/**"
      # The manager's credential ladder: an install-time script, never built
      - "!src/init/credentials/**"
      # Test trees: UNIT_TEST-gated, never built by this workflow
      - "!src/unit_tests/**"
      - "!src/**/tests/**"
      - "!src/**/integrationTests/**"
      # qa/ suites run in other workflows; win32/qa stays (executed here)
      - "!src/data_provider/qa/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install mingw
        run: |
          sudo apt-get update
          sudo apt install gcc-mingw-w64 g++-mingw-w64-i686 g++-mingw-w64-x86-64 make -y
      - uses: actions/checkout@v3
      - name: "Install a compatible CMake"
        uses: ./.github/actions/reinstall_cmake
      # Compilation cache (issue 38139). Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/5.0.0
      - name: make deps
        run: make -C src deps TARGET=winagent -j2
      - name: make
        run: make -C src TARGET=winagent -j2
      - name: Avoid signing files and pause
        run: |
          sed -i 's+signtool+::signtool+g' src/win32/wazuh-installer-build-msi.bat
          sed -i 's+pause+::pause+g' src/win32/wazuh-installer-build-msi.bat
      - name: Removing not required files
        run: rm -rf src/external/* .git/
      - name: Compress folder
        run: 7z a win-agent-base.zip ./*
      - name: Upload base branch folder
        uses: ./.github/actions/upload_s3_artifact
        with:
          aws_region: ${{ secrets.CI_AWS_REGION }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          name: win-agent-base.zip
          path: win-agent-base.zip
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true

  check_upgrade_result:
    strategy:
          matrix:
              wazuh_version: [4.14.0-1]
    runs-on: windows-2025
    timeout-minutes: 30
    needs: build
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: ".github/workflows/.python-version"
          architecture: x64
      - name: Install dependencies
        run: |
          pip install -r src/win32/qa/requirements.txt
      - name: Download released .msi
        run: |
          mkdir C:\win-agent-released
          python -m wget https://packages.wazuh.com/4.x/windows/wazuh-agent-${{ matrix.wazuh_version }}.msi -o C:\win-agent-released
      - name: Download base folder
        uses: ./.github/actions/download_s3_artifact
        with:
          aws_region: ${{ secrets.CI_AWS_REGION }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          name: win-agent-base.zip
          path: C:\win-agent-base
      - name: Unzip base folder
        run: 7z x C:\win-agent-base\win-agent-base.zip -oC:\win-agent-base
      - name: Create .msi package
        run: |
          cd C:\win-agent-base\src\win32
          $VERSION_FILE = "..\..\VERSION.json"
          if (Test-Path $VERSION_FILE) {
              $json = Get-Content $VERSION_FILE | ConvertFrom-Json
              $VERSION = $json.version
          } else {
              Write-Host "Error: VERSION.json not found."
              exit 1
          }
          .\wazuh-installer-build-msi.bat $VERSION 0
          cp *.msi C:\win-agent-base\
      - name: Run tests
        run: |
          cd src/win32/qa
          python -m pytest -vv ./test_win_upgrade.py
      - name: Upload release installation log
        if: always()
        uses: ./.github/actions/upload_s3_artifact
        with:
          aws_region: ${{ secrets.CI_AWS_REGION }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          name: release_log
          path: C:\win-agent-released\win-agent-released.log
      - name: Upload base installation log
        if: always()
        uses: ./.github/actions/upload_s3_artifact
        with:
          aws_region: ${{ secrets.CI_AWS_REGION }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          name: base_log
          path: C:\win-agent-base\win-agent-base.log
