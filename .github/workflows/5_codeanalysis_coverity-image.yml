name: 5.X - Coverity Docker image - Create and publish

on:
  workflow_dispatch:
    inputs:
      docker_image_tag:
        description: |
          Tag name of the Docker image to be uploaded.
          Use only '-', '_', '.' and alphanumeric characters.
          Default is '5.x'.
        required: false
        default: '5.x'
  # Publishes the shared `coverity-scan:5.x` image, so only the release-line branches may push it:
  # without `branches`, every feature-branch (and tag) push touching the Dockerfile republished 5.x
  # from unmerged code. Unlike the VERSION.json-tagged package images, the tag here is the fixed
  # '5.x', so only the 5.x release branches publish it; `main` (5.1.0 today, but it moves to the next
  # major and would then republish '5.x' from 6.x code) is left out deliberately. No pull_request: the build
  # needs the Coverity token and pushes; 5_codeanalysis_coverity.yml consumes the image.
  push:
    branches:
      - '5.[0-9]+.[0-9]+'
    paths:
      - 'tools/testing/coverity/**'
      - '.github/workflows/5_codeanalysis_coverity-image.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wazuh/coverity-scan

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    env:
      PROJECT: wazuh/wazuh

    steps:
      - uses: actions/checkout@v4

      - name: Download Coverity tarball
        env:
          COVERITY_TOKEN: ${{ secrets.COVERITY_SCAN_WAZUH_TOKEN }}
        run: |
          wget -q https://scan.coverity.com/download/linux64 \
            --post-data "token=${COVERITY_TOKEN}&project=${PROJECT//\//%2F}" \
            -O tools/testing/coverity/coverity_tool.tgz

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: tools/testing/coverity
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.docker_image_tag || '5.x' }}
