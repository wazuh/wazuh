name: 5.X - UDS HTTP Server library - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_uds_http_server.yml"
      - "src/shared_modules/uds_http_server/**"
      # The only in-tree headers outside the module that the library and its test compile: the
      # library adds shared_modules/utils for loggerHelper.h and proc.hpp (CMakeLists.txt:50; the
      # test the same, test/CMakeLists.txt:36), and loggerHelper.h includes commonDefs.h
      # (loggerHelper.h:15) from shared_modules/common (on the include path, src/CMakeLists.txt:167).
      # The rest of utils/ (its tests, benchmark, jwt, flatbuffers) is not in this closure.
      - "src/shared_modules/utils/loggerHelper.h"
      - "src/shared_modules/utils/proc.hpp"
      - "src/shared_modules/common/commonDefs.h"
      # Configure path: build_target_cpp configures src/ as one tree -- src/CMakeLists.txt (includes
      # src/cmake/*.cmake at :85-87, reads VERSION.json at :128; this module itself is registered by
      # the first consumer's `if(NOT TARGET wazuh_uds_http_server)` guard, see :247-251) and
      # src/external/CMakeLists.txt, which defines ext_asio/ext_llhttp linked here.
      - "src/CMakeLists.txt"
      - "src/cmake/**"
      - "src/external/CMakeLists.txt"
      - "VERSION.json"
      # build_external_deps runs `make deps`/`make build-external` (src/Makefile; its ref list comes
      # from tools/get_git_refs.sh, src/Makefile:708) and builds the http-request submodule
      # (action.yml:35-43, also configured at src/CMakeLists.txt:244). A submodule bump changes only
      # the gitlink path, which `http-request/**` would never match.
      - "src/Makefile"
      - "tools/get_git_refs.sh"
      - "src/shared_modules/http-request"
      # Result-affecting actions this workflow executes. upload_s3_artifact is left out on purpose:
      # coverage_cpp calls it with continue-on-error (coverage_cpp/action.yml:112-121), so it can only
      # report, and the agent package and -rtr lanes exercise it on PRs.
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/coverage_cpp/**"
      - ".github/actions/test_cpp/**"
      # Prose: no build or test reads it.
      - "!src/shared_modules/uds_http_server/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  udshttpserver-modules:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@master
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      # The test target is pinned to C++17: this job is what enforces the library's dual-standard
      # floor (its consumers include a strict-C++17 module), so a C++20-ism fails here, not in a
      # consumer's build.
      - name: UDS HTTP server - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "uds_http_server_utest"
          test: "true"
          asan: "false"

      # Valgrind is deliberately off, same reasoning as the inventory sync server suite this
      # transport was extracted from: the tests drive a real Unix-domain-socket server with
      # concurrent connections and timing-sensitive shutdown cases; under Valgrind's serialized
      # execution those exceed their deadlines and fail for the wrong reason. The ASAN job below
      # covers the memory-safety surface, which is the one that matters (teardown ORDER, not leaks).
      - name: UDS HTTP server - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "false"
          target: "uds_http_server_utest"

      - name: UDS HTTP server - Coverage
        uses: ./.github/actions/coverage_cpp
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          path: src/shared_modules/uds_http_server
          test_directory: src/shared_modules/uds_http_server
          id: uds_http_server
          validate_function_coverage: "false"

  udshttpserver-asan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: UDS HTTP server - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "uds_http_server_utest"
          test: "true"
          asan: "true"

      # This job is the point of the workflow, not a redundant second run: the shutdown tests are
      # only real regression checks under a sanitizer. Without one, an asio object destroyed while
      # the reactor is being torn down -- or a responder touching a freed session -- usually still
      # passes.
      - name: UDS HTTP server - Run tests
        uses: ./.github/actions/test_cpp
        with:
          target: "uds_http_server_utest"
          valgrind: "false"
