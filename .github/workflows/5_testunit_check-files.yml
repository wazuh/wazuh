name: 5.X - check_files action - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - '.github/workflows/5_testunit_check-files.yml'
      # The matcher every package lane's installed-file inventory depends on, and its suite
      # (test_check_files.py:11 imports check_files.path_match; pandas is stubbed at :9).
      - '.github/actions/check_files/check_files.py'
      - '.github/actions/check_files/test_check_files.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pytest

      - name: Run check_files tests
        working-directory: .github/actions/check_files
        run: python -m pytest -vv test_check_files.py
