name: 5.X - Credential resolver - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_credentials.yml"
      # The two halves under test (the README is prose and runs nothing).
      - "src/init/credentials/*.sh"
      # The Python resolver that replaces them, and its suite.
      - "src/init/credentials/**/*.py"
      # setup-python reads it below.
      - "framework/.python-version"
      - "src/init/tests/test_resolve_credentials.sh"
      - "src/init/tests/test-wazuh-helpers.sh"
      # The shared half of the ladder is downloaded from wazuh-installation-assistant, so the rule
      # that fetches it is part of what these suites exercise: src/Makefile's CREDENTIALS_LIB rule
      # walks the refs tools/get_git_refs.sh prints, which include the branch and tag derived from
      # VERSION.json (get_git_refs.sh:188-196).
      - "src/Makefile"
      - "tools/get_git_refs.sh"
      - "VERSION.json"
      # Read by the syntax check below. The other callers of the ladder (install.sh,
      # inst-functions.sh InstallServer, the DEB maintainer scripts, the RPM spec) are not executed
      # here; they are built and installed by 5_builderpackage_manager-multiples.yml, whose
      # manager_control integration module also starts the packaged manager through the resolver.
      - "src/init/wazuh-server.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  credentials-shell-tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # wazuh-credentials.sh is not in this repository -- it is the half of the ladder the manager,
      # the indexer and the dashboard must agree on exactly, owned by wazuh-installation-assistant.
      # Fetched through the same make rule a build uses, rather than a curl transcribed here, so
      # this job fails when the rule or its ref fallback breaks. Only this one target: `deps` would
      # pull every external library for a suite that needs one shell script.
      - name: Fetch the shared credential library
        run: make -C src external/wazuh-credentials/wazuh-credentials.sh TARGET=manager

      # Both suites require euid 0: the helpers refuse a base directory that is not root-owned.
      - name: Credential helpers
        run: |
          sudo sh src/init/tests/test-wazuh-helpers.sh
          sudo env TEST_SHELL=/bin/bash TEST_PIPEFAIL=1 sh src/init/tests/test-wazuh-helpers.sh

      - name: Credential resolver
        run: sudo bash src/init/tests/test_resolve_credentials.sh

      # wazuh-manager-control is the caller of --prestart and --check. Its behaviour belongs to the
      # manager integration tests under tests/integration/test_manager_control; here it is only parsed
      # by /bin/sh, which is dash on the runner as on the Debian packages.
      - name: Control script syntax
        run: sh -n src/init/wazuh-server.sh && sh -n src/init/credentials/resolve-credentials.sh

  # The Python resolver (src/init/credentials/wazuh-manager-resolve-credentials.py), which replaces the two shell
  # halves above once it is complete; until then it is built and tested beside them, not installed. The suite runs
  # as root and refuses to run otherwise, so a case it could not run is a failure, never a skip. cryptography is
  # pinned to the version the manager's bundled interpreter ships (framework/requirements.txt).
  credentials-python-tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "framework/.python-version"

      - name: Install the test dependencies
        run: python -m pip install "cryptography==50.0.1" "pytest==7.3.1"

      - name: Compile the resolver
        run: python -I -c "import py_compile, sys; py_compile.compile(sys.argv[1], cfile='/tmp/resolver.pyc', doraise=True)" src/init/credentials/wazuh-manager-resolve-credentials.py

      - name: Credential resolver (Python)
        run: sudo env "PATH=$PATH" python -m pytest -p no:cacheprovider -q src/init/credentials/tests
