name: 5.X - Credential resolver - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_credentials.yml"
      - "src/init/credentials/**"
      - "src/init/tests/test_resolve_credentials.sh"
      - "src/init/tests/test-wazuh-helpers.sh"
      # The shared half of the ladder is downloaded from wazuh-installation-assistant, so the rule
      # that fetches it is part of what these suites exercise.
      - "src/Makefile"
      - "tools/get_git_refs.sh"
      # The callers of the ladder: where it is installed from, where it is invoked, and the removal
      # paths that repeat the shared helper's file format.
      - "install.sh"
      - "src/init/inst-functions.sh"
      - "packages/debs/SPECS/wazuh-manager/debian/postinst"
      - "packages/debs/SPECS/wazuh-manager/debian/postrm"
      - "packages/rpms/SPECS/wazuh-manager.spec"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  credentials-shell-tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # wazuh-credentials.sh is not in this repository -- it is the half of the ladder the manager,
      # the indexer and the dashboard must agree on exactly, owned by wazuh-installation-assistant.
      # Fetched through the same make rule a build uses, rather than a curl transcribed here, so
      # this job fails when the rule or its ref fallback breaks. Only this one target: `deps` would
      # pull every external library for a suite that needs one shell script.
      - name: Fetch the shared credential library
        run: make -C src external/wazuh-credentials/wazuh-credentials.sh TARGET=manager

      # The DEB's postrm cannot source the helper -- dpkg has already removed the package's files by
      # the time `purge` runs -- so it repeats wazuh_env_unset's effect inline, hardcoding the
      # managed block markers and the lock filename. Nothing else detects a divergence: if upstream
      # renames a marker, purge silently stops removing the manager's keys and leaves plaintext
      # passwords behind on a host with no Wazuh on it. Assert the literals still match both sides.
      - name: The DEB purge path still matches the shared helper
        run: |
          set -eu
          helper=src/external/wazuh-credentials/wazuh-credentials.sh
          postrm=packages/debs/SPECS/wazuh-manager/debian/postrm
          status=0
          # Written with printf so the em dash in the markers survives the YAML round trip.
          printf '%s\n' \
            '# >>> wazuh generated — do not edit <<<' \
            '# >>> end wazuh generated <<<' \
            '.credentials.lock' \
            'credentials.env' > /tmp/credential-literals
          while IFS= read -r literal; do
            grep -qF -- "${literal}" "${helper}" || {
              echo "::error file=${postrm}::'${literal}' is hardcoded in the DEB postrm but no longer appears in ${helper}"
              status=1
            }
            grep -qF -- "${literal}" "${postrm}" || {
              echo "::error file=${postrm}::'${literal}' is missing from the DEB postrm"
              status=1
            }
          done < /tmp/credential-literals
          exit "${status}"

      # Both suites require euid 0: the helpers refuse a base directory that is not root-owned.
      - name: Credential helpers
        run: |
          sudo sh src/init/tests/test-wazuh-helpers.sh
          sudo env TEST_SHELL=/bin/bash TEST_PIPEFAIL=1 sh src/init/tests/test-wazuh-helpers.sh

      - name: Credential resolver
        run: sudo bash src/init/tests/test_resolve_credentials.sh
