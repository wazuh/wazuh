name: 5.X - Credential resolver - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_credentials.yml"
      # The resolver and its suite (the README is prose and runs nothing).
      - "src/init/credentials/**/*.py"
      # setup-python reads it below.
      - "framework/.python-version"
      # The parity test reads the Server API's password rule and the seeding module's generator as
      # text, so a change on either side reruns it.
      - "framework/wazuh/security.py"
      - "framework/wazuh/rbac/orm.py"
      # The versions of cryptography and PyYAML the suite installs come from here, so a bump reruns it.
      - "framework/requirements.txt"
      # Parsed by the syntax check below. Its calls to --check and --prestart run in the
      # manager_control integration module, which starts the packaged manager.
      - "src/init/wazuh-server.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The resolver installed as bin/wazuh-manager-resolve-credentials. The suite runs as root and refuses to run
  # otherwise, so a case it could not run is a failure, never a skip. cryptography and PyYAML are installed at the
  # versions the manager's bundled interpreter ships, taken from framework/requirements.txt as constraints rather
  # than repeated here.
  credentials-python-tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "framework/.python-version"

      - name: Install the test dependencies
        run: python -m pip install -c framework/requirements.txt cryptography PyYAML "pytest==7.3.1"

      - name: Compile the resolver
        run: python -I -c "import py_compile, sys; py_compile.compile(sys.argv[1], cfile='/tmp/resolver.pyc', doraise=True)" src/init/credentials/wazuh-manager-resolve-credentials.py

      - name: Credential resolver (Python)
        run: sudo env "PATH=$PATH" python -m pytest -p no:cacheprovider -q src/init/credentials/tests

      # wazuh-manager-control is the caller of --check and --prestart. Its behaviour belongs to the
      # manager integration tests under tests/integration/test_manager_control; here it is only parsed
      # by /bin/sh, which is dash on the runner as on the Debian packages.
      - name: Control script syntax
        run: sh -n src/init/wazuh-server.sh
