name: 5.X - Wazuh Metrics library - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_metrics.yml"
      # wazuh_metrics_utest links only wazuh_metrics + gtest/gmock (test/CMakeLists.txt:13-24); the
      # library links only ext_rapidjson (CMakeLists.txt:22): the module is its whole in-tree closure.
      - "src/shared_modules/metrics/**"
      # Configure path: build_target_cpp configures src/ as one tree -- src/CMakeLists.txt (registers
      # this module at :290, includes src/cmake/*.cmake at :85-87, reads VERSION.json at :128) and
      # src/external/CMakeLists.txt, which defines the ext_rapidjson target linked here.
      - "src/CMakeLists.txt"
      - "src/cmake/**"
      - "src/external/CMakeLists.txt"
      - "VERSION.json"
      # build_external_deps runs `make deps`/`make build-external` (src/Makefile; its ref list comes
      # from tools/get_git_refs.sh, src/Makefile:708) and builds the http-request submodule
      # (action.yml:35-43, also configured at src/CMakeLists.txt:244). A submodule bump changes only
      # the gitlink path, which `http-request/**` would never match.
      - "src/Makefile"
      - "src/deps.lock.mk"
      - "tools/get_git_refs.sh"
      - "src/shared_modules/http-request"
      # Result-affecting actions this workflow executes. upload_s3_artifact is left out on purpose:
      # coverage_cpp calls it with continue-on-error (coverage_cpp/action.yml:112-121), so it can only
      # report, and the agent package and -rtr lanes exercise it on PRs.
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/coverage_cpp/**"
      - ".github/actions/test_cpp/**"
      # Prose: no build or test reads it.
      - "!src/shared_modules/metrics/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  metrics-modules:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Mandatory even though the library itself is STL-only: the test target links gtest/gmock
      # from src/external/googletest/lib (produced by `make build-external TARGET=manager TEST=1`)
      # and jsonDump.cpp needs ext_rapidjson, which only exists after `make deps`.
      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      # No -DTARGET is passed, so IS_AGENT stays FALSE and the server-only branch that owns
      # add_subdirectory(shared_modules/metrics) is the one configured. The library only declares
      # `cxx_std_17` as a PUBLIC floor for its strict-C++17 consumers; it is not pinned, so this job
      # compiles it and its test as C++20 (the tree default) and cannot catch a C++20-ism.
      - name: Wazuh Metrics - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "wazuh_metrics_utest"
          test: "true"
          asan: "false"

      # Valgrind is deliberately off. Three reasons: (1) test_cpp runs `valgrind ctest` without
      # --trace-children=yes, so the test binary is not instrumented anyway; (2)
      # slidingWindowRate_test.cpp asserts over wall-clock windows and valgrind's serialization
      # shifts the increments out of the window under test; (3) realisticScenarios_test.cpp is
      # 16 threads x 100k atomic adds, which valgrind turns from seconds into minutes. The leak
      # surface valgrind would cover is covered by the ASAN job below, which compiles with
      # -fsanitize=leak.
      - name: Wazuh Metrics - Run tests
        uses: ./.github/actions/test_cpp
        with:
          target: "wazuh_metrics_utest"
          valgrind: "false"

      # Function coverage is not gated: include/ is ~1.4k lines of headers of which iMetric.hpp
      # and iManager.hpp are pure interfaces, so FNF is dominated by implicit virtual destructors
      # and per-TU inline instantiations that no test can drive. Line coverage over src/ +
      # include/ is the meaningful gate here.
      - name: Wazuh Metrics - Coverage
        uses: ./.github/actions/coverage_cpp
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          path: src/shared_modules/metrics
          test_directory: src/shared_modules/metrics
          id: wazuh_metrics
          validate_function_coverage: "false"

  metrics-asan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Wazuh Metrics - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "wazuh_metrics_utest"
          test: "true"
          asan: "true"

      # This job is not a redundant second run of the same tests: build_target_cpp's asan mode
      # compiles with -fsanitize=address,undefined,leak, and UBSAN is the one that matters for
      # this library. atomicHistogram.hpp computes shift counts from an octave, casts a double
      # percentile rank to uint64, and indexes a 128-entry std::array by a computed bucket. An
      # off-by-one there produces a plausible number and a green test without a sanitizer.
      - name: Wazuh Metrics - Run tests
        uses: ./.github/actions/test_cpp
        with:
          target: "wazuh_metrics_utest"
          valgrind: "false"
