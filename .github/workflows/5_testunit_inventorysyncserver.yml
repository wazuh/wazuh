name: 5.X - Inventory Sync Server - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_inventorysyncserver.yml"
      # inventory_sync_server_utest (test/CMakeLists.txt:14,37) links the inventory_sync_server
      # library built from src/ and include/ (CMakeLists.txt:12) and indexer_connector. Every
      # CMakeLists.txt of the module is on the configure path (CMakeLists.txt:69,74). Not
      # testtool/main.cpp, tools/ or qa/ (the integration lane's), nor README.md.
      - "src/wazuh_modules/inventory_sync_server/**/CMakeLists.txt"
      - "src/wazuh_modules/inventory_sync_server/include/**"
      - "src/wazuh_modules/inventory_sync_server/src/**"
      - "src/wazuh_modules/inventory_sync_server/test/**"
      # Linked: vulnerability_scanner (inventory_sync_server/CMakeLists.txt:61), built from src/ and
      # include/ plus the flatbuffers headers it generates from schemas/
      # (vulnerability_scanner/CMakeLists.txt:72-118,126). Not its tests, testtool sources, qa/ or doc/.
      - "src/wazuh_modules/vulnerability_scanner/**/CMakeLists.txt"
      - "src/wazuh_modules/vulnerability_scanner/include/**"
      - "src/wazuh_modules/vulnerability_scanner/src/**"
      - "src/wazuh_modules/vulnerability_scanner/schemas/**"
      # ...which links content_manager, indexer_connector, urlrequest, schema_validator,
      # wazuh_uds_http_server and wazuh_metrics (vulnerability_scanner/CMakeLists.txt:156-167;
      # indexer_connector is also linked directly, inventory_sync_server/CMakeLists.txt:61).
      # schema_validator embeds the indexer templates `make deps` downloads (its CMakeLists.txt:25-27),
      # covered by src/Makefile and tools/get_git_refs.sh below.
      - "src/shared_modules/content_manager/**/CMakeLists.txt"
      - "src/shared_modules/content_manager/include/**"
      - "src/shared_modules/content_manager/src/**"
      - "src/shared_modules/indexer_connector/**/CMakeLists.txt"
      - "src/shared_modules/indexer_connector/include/**"
      - "src/shared_modules/indexer_connector/src/**"
      - "src/shared_modules/schema_validator/**/CMakeLists.txt"
      - "src/shared_modules/schema_validator/include/**"
      - "src/shared_modules/schema_validator/src/**"
      - "src/shared_modules/uds_http_server/**/CMakeLists.txt"
      - "src/shared_modules/uds_http_server/include/**"
      - "src/shared_modules/uds_http_server/src/**"
      - "src/shared_modules/metrics/**/CMakeLists.txt"
      - "src/shared_modules/metrics/include/**"
      - "src/shared_modules/metrics/src/**"
      # keystore: built standalone with everything in it by build_external_deps/action.yml:45-53
      # (wazuh-manager-keystore, testtool) -- not its qa/ suite.
      - "src/shared_modules/keystore/**"
      - "!src/shared_modules/keystore/qa/**"
      # shared/include headers the scanner's public headers pull in
      # (vulnerability_scanner/include/vulnerabilityScanner.hpp, src/scanOrchestrator/factory/eventSendReport.hpp).
      - "src/shared/include/defs.h"
      - "src/shared/include/logging_helper.h"
      # The test also compiles uds_http_server's test client fixture (test/CMakeLists.txt:47).
      - "src/shared_modules/uds_http_server/test/unit/udsTestClient.hpp"
      # Headers from shared_modules/utils and common/commonDefs.h (included by
      # utils/loggerHelper.h:15). utils/flatbuffers is built by build_external_deps/action.yml:55-63.
      # utils' own tests and benchmark are another component's tree; only their CMakeLists.txt are on
      # the configure path (utils/CMakeLists.txt).
      - "src/shared_modules/utils/**"
      - "!src/shared_modules/utils/tests/**"
      - "!src/shared_modules/utils/benchmark/**"
      - "src/shared_modules/utils/tests/CMakeLists.txt"
      - "src/shared_modules/utils/benchmark/CMakeLists.txt"
      - "src/shared_modules/common/**"
      # Configure path: build_target_cpp configures all of src/ as one tree
      # (build_target_cpp/action.yml:57) -- src/CMakeLists.txt (src/cmake/*.cmake at :86-87,
      # VERSION.json at :128) and src/external/CMakeLists.txt (ext_* targets, wazuhext at :1474).
      - "src/CMakeLists.txt"
      - "src/cmake/**"
      - "src/external/CMakeLists.txt"
      - "VERSION.json"
      # This module's parent on the configure path (src/CMakeLists.txt:255).
      - "src/wazuh_modules/CMakeLists.txt"
      # build_external_deps runs make deps/build-external (src/Makefile:610, ref list from
      # tools/get_git_refs.sh at src/Makefile:708) and builds the http-request submodule
      # (action.yml:35-43). A submodule bump changes only the gitlink path, which no '/**'
      # pattern matches.
      - "src/Makefile"
      - "src/deps.lock.mk"
      - "tools/get_git_refs.sh"
      - "src/shared_modules/http-request"
      # Result-affecting actions. upload_s3_artifact is left out on purpose: coverage_cpp calls it
      # with continue-on-error (coverage_cpp/action.yml:112-121), so it only reports, and the agent
      # package lanes exercise it on PRs.
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/coverage_cpp/**"
      - ".github/actions/test_cpp/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  inventorysyncserver-modules:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Inventory sync server - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "inventory_sync_server_utest"
          test: "true"
          asan: "false"

      # Valgrind is deliberately off for this suite. It drives a real Unix-domain-socket server with
      # hundreds of concurrent connections and several timing-sensitive shutdown tests; under
      # Valgrind's serialized execution those exceed their deadlines and fail for the wrong reason.
      # The sanitizer job below is what covers the memory-safety surface, and it is the one that
      # matters here because the risk is teardown ORDER, not leaks.
      - name: Inventory sync server - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "false"
          target: "inventory_sync_server_utest"

      - name: Inventory sync server - Coverage
        uses: ./.github/actions/coverage_cpp
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          path: src/wazuh_modules/inventory_sync_server
          test_directory: src/wazuh_modules/inventory_sync_server
          id: inventory_sync_server
          validate_function_coverage: "false"

  inventorysyncserver-asan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Inventory sync server - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "inventory_sync_server_utest"
          test: "true"
          asan: "true"

      # This job is the point of the workflow, not a redundant second run: the shutdown tests are
      # only real regression checks under a sanitizer. Without one, an asio object destroyed while
      # the reactor is being torn down -- or a responder touching a freed session -- usually still
      # passes.
      - name: Inventory sync server - Run tests
        uses: ./.github/actions/test_cpp
        with:
          target: "inventory_sync_server_utest"
          valgrind: "false"
