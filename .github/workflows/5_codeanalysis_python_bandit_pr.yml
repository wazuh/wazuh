run-name: Python static code analysis on PR ${{ github.event.pull_request.number }}
name: 5.X - Python static code analysis on PR

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_codeanalysis_python_bandit_pr.yml"
      - 'framework/**/*.py'
      - 'api/**/*.py'
      - 'wodles/**/*.py'
      # setup-python reads it below
      - 'framework/.python-version'
      # Both scans exclude the test trees (-x '**/test/**,**/tests/**')
      - '!**/test/**'
      - '!**/tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DIRS: "api wodles framework"

jobs:
  bandit-scan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "framework/.python-version"

      - name: Install bandit
        run: |
          pip install bandit

      - name: Generate baseline from target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin ${BASE_REF}:baseline_branch
          git checkout baseline_branch
          bandit -r ${{ env.PYTHON_DIRS }} -f json -o bandit_baseline.json -x '**/test/**,**/tests/**' --exit-zero

      - name: Run bandit scan on PR changes
        env:
          # The commit actions/checkout fetched (the merge commit on a pull request): the head
          # branch name does not resolve in this clone when the PR comes from a fork
          HEAD_SHA: ${{ github.sha }}
        run: |
          git checkout ${HEAD_SHA}
          bandit -r ${{ env.PYTHON_DIRS }} -x '**/test/**,**/tests/**' --baseline bandit_baseline.json
