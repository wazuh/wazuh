run-name: Python static code analysis on PR ${{ github.event.pull_request.number }}
name: 5.X - Python static code analysis on PR

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_codeanalysis_python_bandit_pr.yml"
      - 'framework/**/*.py'
      - 'api/**/*.py'
      - 'wodles/**/*.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DIRS: "api wodles framework"

jobs:
  bandit-scan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # `small` instance (2 vCPU, 3.0 GiB usable): single-process Python static analysis.
    # The `-small` suffix keeps this job at one label — read the note in
    # 5_testcomponent_keystore.yml before switching to a separate `instance-size:` label.
    runs-on: codebuild-github-actions-codebuild-runner-server-amd-${{ github.run_id }}-${{ github.run_attempt }}-small
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "framework/.python-version"

      - name: Install bandit
        run: |
          pip install bandit

      - name: Generate baseline from target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin ${BASE_REF}:baseline_branch
          git checkout baseline_branch
          bandit -r ${{ env.PYTHON_DIRS }} -f json -o bandit_baseline.json -x '**/test/**,**/tests/**' --exit-zero

      - name: Run bandit scan on PR changes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git checkout ${HEAD_REF}
          bandit -r ${{ env.PYTHON_DIRS }} -x '**/test/**,**/tests/**' --baseline bandit_baseline.json
