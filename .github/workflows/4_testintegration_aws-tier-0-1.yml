name: 4.X - AWS - Integration tests - Tier 0 and 1

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch'
        required: true
        default: 'main'
      base_qa_it_fw_branch:
        description: 'Base qa-integration-framework branch'
        required: true
        default: 'main'
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/4_testintegration_aws-tier-0-1.yml"
      - "wodles/aws/**"

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    permissions:
      id-token: write  # Required for OIDC token generation (aws-actions/configure-aws-credentials)
      contents: read
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      BRANCH_BASE: ${{ github.base_ref || inputs.base_branch }}
      QA_IT_FW_BRANCH: ${{ github.base_ref || inputs.base_qa_it_fw_branch }}
      AWS_VPC_ID: ${{ secrets.IT_AWS_VPC_ID }}
      AWS_BUCKET_NAME: ${{ secrets.IT_AWS_BUCKET_NAME }}
      # Manifest of every S3 key the tests upload, so the always() cleanup step can delete them
      # even if the job is cancelled before pytest teardown runs.
      AWS_IT_CLEANUP_MANIFEST: ${{ github.workspace }}/aws_it_uploaded_keys.txt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install system build dependencies
        # TODO: Remove when added to CodeBuild base images
        run: sudo apt-get update && sudo apt-get install -y python3-pip
      - name: Detect modified files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            parser:
              - 'wodles/aws/aws_s3.py'
              - 'wodles/aws/aws_tools.py'
            integration:
              - 'wodles/aws/wazuh_integration.py'
            bucket:
              - 'wodles/aws/buckets_s3/aws_bucket.py'
            config:
              - 'wodles/aws/buckets_s3/config.py'
            guardduty:
              - 'wodles/aws/buckets_s3/guardduty.py'
            cloudtrail:
              - 'wodles/aws/buckets_s3/cloudtrail.py'
            loadbalancers:
              - 'wodles/aws/buckets_s3/load_balancers.py'
            serveraccess:
              - 'wodles/aws/buckets_s3/server_access.py'
            umbrella:
              - 'wodles/aws/buckets_s3/umbrella.py'
            vpcflow:
              - 'wodles/aws/buckets_s3/vpcflow.py'
            waf:
              - 'wodles/aws/buckets_s3/waf.py'
            cloudwatch:
              - 'wodles/aws/services/cloudwatchlogs.py'
              - 'wodles/aws/services/aws_service.py'
            inspector:
              - 'wodles/aws/services/inspector.py'
              - 'wodles/aws/services/aws_service.py'
            custom_bucket:
              - 'wodles/aws/subscribers/**'

      - name: Debug filters
        run: echo "${{ toJson(steps.filter.outputs) }}"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version-file: ".github/workflows/.python-version-it"
          architecture: x64

      # Download and install integration tests framework.
      - name: Download and install integration tests framework
        run: |
          if [ "X`git ls-remote https://github.com/wazuh/qa-integration-framework.git ${BRANCH_BASE}`" != "X" ]; then
              QA_BRANCH=${BRANCH_BASE}
          elif [ "X`git ls-remote https://github.com/wazuh/qa-integration-framework.git ${QA_IT_FW_BRANCH}`" != "X" ]; then
              QA_BRANCH=${QA_IT_FW_BRANCH}
          else
              QA_BRANCH="main"
          fi
          git clone -b ${QA_BRANCH} --single-branch https://github.com/wazuh/qa-integration-framework.git
          sudo pip install --ignore-installed --break-system-packages qa-integration-framework/
          sudo rm -rf qa-integration-framework/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IT_AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 7200

      - name: Write default AWS profile for integration tests
        run: |
          # Write 'default' profile (us-east-1) from the OIDC temporary credentials.
          # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_SESSION_TOKEN are injected as
          # environment variables by the preceding 'Configure AWS credentials via OIDC' step.
          # The 'inspector_tests' profile is NOT built here: it is assembled right before the
          # Inspector tests run (see 'Run Inspector tests'), because role chaining caps the
          # session at 1h and the full suite runs >1h, so a profile built at job start would
          # expire before the Inspector tests execute late in the suite.
          sudo aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile default
          sudo aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile default
          sudo aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile default
          sudo aws configure set region us-east-1 --profile default

      - name: "Install a compatible CMake"
        uses: ./.github/actions/reinstall_cmake

      # Compilation cache (issue 38139). Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/4.14.8
      # Build wazuh server for linux.
      - name: Build wazuh server for linux
        run: |
          make deps -C src TARGET=server -j2
          make -C src TARGET=server -j2

      # Install wazuh server for linux.
      - name: Install wazuh server for linux
        run: |
          echo 'USER_LANGUAGE="en"' > ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_NO_STOP="y"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_INSTALL_TYPE="server"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo "USER_DIR=/var/ossec" >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_EMAIL="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_SYSCHECK="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_ROOTCHECK="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_SYSCOLLECTOR="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_SCA="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_WHITE_LIST="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_SYSLOG="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_AUTHD="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_UPDATE_CHECK="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_AUTO_START="y"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          sudo sh install.sh
          rm ./etc/preloaded-vars.conf

      # Run AWS integration tests
      - name: Run Parser related tests
        if: steps.filter.outputs.parser == 'true'
        run: |
          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 test_aws/test_parser.py

      - name: Run every test due to base WazuhIntegration class change or manual dispatch
        if: steps.filter.outputs.integration == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd tests/integration
          # Inspector is excluded here and run in its own step ('Run Inspector tests') that
          # re-assumes the chained role right before, so its 1h-capped session stays fresh.
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_VPC_ID="${AWS_VPC_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k "not inspector" test_aws/

      - name: Run Custom Buckets tests
        if: steps.filter.outputs.bucket == 'true'
        run: |
          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k kms test_aws/
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k macie test_aws/
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k trusted_advisor test_aws/

      - name: Run Config tests
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.bucket == 'true'
        run: |
          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k config test_aws/

      - name: Run GuardDuty tests
        if: steps.filter.outputs.guardduty == 'true' || steps.filter.outputs.bucket == 'true'
        run: |
          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k guardduty test_aws/

      - name: Run CloudTrail tests
        if: steps.filter.outputs.cloudtrail == 'true' || steps.filter.outputs.bucket == 'true'
        run: |
          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k cloudtrail test_aws/

      - name: Run Load Balancers tests
        if: steps.filter.outputs.loadbalancers == 'true' || steps.filter.outputs.bucket == 'true'
        run: |
          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k alb test_aws/
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k clb test_aws/
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k nlb test_aws/

      - name: Run Server Access tests
        if: steps.filter.outputs.serveraccess == 'true' || steps.filter.outputs.bucket == 'true'
        run: |
          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k server_access test_aws/

      - name: Run Umbrella tests
        if: steps.filter.outputs.umbrella == 'true' || steps.filter.outputs.bucket == 'true'
        run: |
          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k cisco test_aws/

      - name: Run VPC Flow tests
        if: steps.filter.outputs.vpcflow == 'true' || steps.filter.outputs.bucket == 'true'
        run: |
          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_VPC_ID="${AWS_VPC_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k vpc test_aws/

      - name: Run WAF tests
        if: steps.filter.outputs.waf == 'true' || steps.filter.outputs.bucket == 'true'
        run: |
          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k waf test_aws/

      - name: Run CloudWatch tests
        if: steps.filter.outputs.cloudwatch == 'true'
        run: |
          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k cloudwatch test_aws/

      - name: Run Inspector tests
        # !cancelled() overrides the implicit success() so this step still runs when an
        # unrelated earlier test step fails (e.g. the preexisting log_groups failure);
        # otherwise the Inspector tests would be skipped and never reported.
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.inspector == 'true' || steps.filter.outputs.integration == 'true') }}
        run: |
          # Re-assume the Inspector role right before running its tests. Role chaining is
          # capped at 1h by AWS regardless of MaxSessionDuration, and the full suite runs
          # >1h, so a session assumed at job start would already be expired here. Re-assuming
          # now yields a fresh 1h session, plenty for the quick Inspector tests.
          # The base OIDC credentials (role-duration-seconds: 7200) are still valid at this
          # point, so this chained assume-role succeeds.
          STS_ERROR_FILE=$(mktemp)
          STS_OUTPUT=$(aws sts assume-role \
            --role-arn "${{ secrets.IT_AWS_INSPECTOR_ROLE_ARN }}" \
            --role-session-name "github-actions-inspector-tests" \
            --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
            --output text 2>"$STS_ERROR_FILE") || {
              echo "::error::Failed to assume Inspector role: $(cat $STS_ERROR_FILE)"
              rm -f "$STS_ERROR_FILE"
              exit 1
            }
          rm -f "$STS_ERROR_FILE"

          read -r INSPECTOR_KEY INSPECTOR_SECRET INSPECTOR_TOKEN <<< "$STS_OUTPUT"

          if [ -z "$INSPECTOR_KEY" ] || [ -z "$INSPECTOR_SECRET" ] || [ -z "$INSPECTOR_TOKEN" ]; then
            echo "::error::Inspector role credentials are empty"
            exit 1
          fi

          sudo aws configure set aws_access_key_id "$INSPECTOR_KEY" --profile inspector_tests
          sudo aws configure set aws_secret_access_key "$INSPECTOR_SECRET" --profile inspector_tests
          sudo aws configure set aws_session_token "$INSPECTOR_TOKEN" --profile inspector_tests
          sudo aws configure set region us-east-2 --profile inspector_tests

          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 -k inspector test_aws/

      - name: Run Custom Bucket tests
        if: steps.filter.outputs.custom_bucket == 'true'
        run: |
          cd tests/integration
          sudo GITHUB_RUN_ID="${GITHUB_RUN_ID}" AWS_BUCKET_NAME="${AWS_BUCKET_NAME}" AWS_IT_CLEANUP_MANIFEST="${AWS_IT_CLEANUP_MANIFEST}" python3 -m pytest -vvv --tier 0 --tier 1 test_aws/test_custom_bucket.py

      - name: Clean up uploaded S3 test artifacts
        # always() so this runs even when the job is CANCELLED - the dominant source of orphan
        # objects, since pytest teardown does not run on a hard cancel. The manifest lists every key
        # the tests uploaded (recorded at upload time); we delete each one, skipping permanent seeds.
        if: always()
        run: |
          MANIFEST="${AWS_IT_CLEANUP_MANIFEST}"
          if [ ! -f "$MANIFEST" ]; then
            echo "No cleanup manifest found; nothing to delete."
            exit 0
          fi
          # Permanent DevOps seeds that must never be deleted (belt-and-suspenders; the manifest never
          # records them, but guard here in case a future test key ever matches one).
          SEED_CLOUDTRAIL="AWSLogs/819751203818/CloudTrail/us-east-1/2022/11/20/819751203818_CloudTrail_us-east-1_20221120T0000Z_372406355707169122.json"
          SEED_ELB="AWSLogs/819751203818/elasticloadbalancing/us-east-1/2022/11/20/819751203818_elasticloadbalancing_us-east-1_net.qatests_20221120T0000Z_1412953514070675864_29.145.39.119.log"
          sudo sort -u "$MANIFEST" | while IFS= read -r key; do
            [ -z "$key" ] && continue
            if [ "$key" = "$SEED_CLOUDTRAIL" ] || [ "$key" = "$SEED_ELB" ]; then
              echo "Skipping permanent seed: $key"
              continue
            fi
            echo "Deleting s3://${AWS_BUCKET_NAME}/${key}"
            sudo aws s3 rm "s3://${AWS_BUCKET_NAME}/${key}" --profile default || true
          done
          sudo rm -f "$MANIFEST" || true
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true
