name: 5.X - Package - Build external dependencies

# Builds the pool refs of src/deps.lock.mk that packages.wazuh.com/deps/pool/ does
# not have yet, tests them and publishes them. A ref is <name>/<version>-<key>,
# where the key hashes everything that decides its bytes (`deps.py key` prints
# it), so a change to the inventory, a patch, the build recipe or a builder image
# gives new refs, and only those are built:
#
#   check        the lock is the one the inventory generates; `deps.py plan` lists the
#                entries whose ref is not published
#   build        the build legs, building only those entries (DEPS_BUILD); make deps
#                takes the others from the pool
#   build-ebpf   libbpf-bootstrap, when its ref is new
#   consolidate  one pool tree with a manifest.json per new ref (consolidate.sh)
#   cpython      the embedded Python of each Linux architecture, linked against the
#                pool tree of this run (framework/cpython/compile.sh)
#   pool         consolidate + cpython: the pool-new artifact
#   smoke        agent, manager and windows agent builds against pool-new + the pool
#   publish      pool-new to s3://<bucket>/deps/pool/, with the approval of the
#                deps-publish environment; disabled until the DEPS_POOL_PUBLISH
#                repository variable is 'true'
#   verify       every published ref, through packages.wazuh.com
#
# Builder images are pulled by the digest of packages/externals/builder-images.json,
# which is part of the keys; macOS builds use the Xcode pinned there.
#
# Build legs: rpm amd64/arm64 with the agent image (centos:6, glibc 2.12, whose
# binaries run everywhere) and with the manager image (centos:7, for what the
# agent toolchain cannot build); macOS intel64/arm64 natively; windows i686
# cross-compiled in compile_windows_agent. Where two legs compiled the same
# dependency, consolidate.sh keeps the agent copy. To re-run a broken leg, use
# "Re-run failed jobs".

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Every path that goes into a pool key (`deps.py key-paths`, kept in sync by a test).
    paths:
      - "framework/.python-version"
      - "framework/cpython/compile.sh"
      - "framework/cpython/custom/**"
      - "framework/requirements.txt"
      - "packages/externals/build_external.sh"
      - "packages/externals/builder-images.json"
      - "packages/externals/consolidate.sh"
      - "packages/externals/dependencies.json"
      - "packages/externals/ebpf/build_ebpf.sh"
      - "packages/externals/generate_external.sh"
      - "packages/externals/overlay/**"
      - "packages/externals/patches/**"
      - "src/CMakeLists.txt"
      - "src/Makefile"
      - "src/deps.lock.mk"
      - "src/external/CMakeLists.txt"
      - "src/syscheckd/src/ebpf/src/modern.bpf.c"
      - ".github/workflows/5_builderpackage_externals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Draft pull requests skip the whole workflow: every other job needs this one.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      missing: ${{ steps.plan.outputs.missing }}
      legs: ${{ steps.plan.outputs.legs }}
      ebpf: ${{ steps.plan.outputs.ebpf }}
      cpython: ${{ steps.plan.outputs.cpython }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the lock
        run: python3 packages/externals/deps.py lock --check

      - name: Plan the refs to build
        id: plan
        run: |
          set -euo pipefail
          missing="$(python3 packages/externals/deps.py plan)"
          echo "refs to build: ${missing:-none}"
          # cpython and libbpf-bootstrap have their own jobs; the legs build the rest.
          rest=" ${missing} "
          for name in cpython libbpf-bootstrap; do rest="${rest// ${name} / }"; done
          has() { [[ " ${missing} " == *" $1 "* ]] && echo true || echo false; }
          {
            echo "missing=${missing}"
            echo "legs=$([ -n "${rest// /}" ] && echo true || echo false)"
            echo "ebpf=$(has libbpf-bootstrap)"
            echo "cpython=$(has cpython)"
          } >> "${GITHUB_OUTPUT}"

  build-externals:
    needs: check
    if: needs.check.outputs.legs == 'true'
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: rpm,     architecture: amd64,   runner: wz-linux-amd64, leg: rpm-amd64,     target: agent }
          - { system: rpm,     architecture: arm64,   runner: wz-linux-arm64, leg: rpm-arm64,     target: agent }
          - { system: macos,   architecture: intel64, runner: macos-14-large, leg: macos-intel64, target: agent }
          - { system: macos,   architecture: arm64,   runner: macos-14,       leg: macos-arm64,   target: agent }
          - { system: windows, architecture: i686,    runner: wz-linux-amd64, leg: windows-i686,  target: agent }
          - { system: rpm,     architecture: amd64,   runner: wz-linux-amd64, leg: rpm-amd64,     target: manager }
          - { system: rpm,     architecture: arm64,   runner: wz-linux-arm64, leg: rpm-arm64,     target: manager }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    name: Build externals (${{ matrix.leg }}-${{ matrix.target }})

    steps:
      - uses: actions/checkout@v4

      - name: Pull the pinned builder image
        if: matrix.system != 'macos'
        env:
          GHCR_TOKEN: ${{ secrets.CI_WAZUH_AGENT_PACKAGES_CLASSIC }}
        run: |
          if [ "${{ matrix.system }}" = "windows" ]; then
            bash packages/externals/pull_builder_image.sh compile_windows_agent windows agent
          else
            bash packages/externals/pull_builder_image.sh "pkg_${{ matrix.system }}_${{ matrix.target }}_builder_${{ matrix.architecture }}" \
              linux "${{ matrix.target }}" "${{ matrix.architecture }}"
          fi

      - name: Install build tools and select the pinned Xcode (macOS leg)
        if: matrix.system == 'macos'
        # gnu-tar provides `gtar`. The system /usr/bin/tar (BSD) rejects
        # --owner/--group/--no-same-owner, which keep the packed tarballs
        # reproducible across runners.
        run: |
          brew install bash automake gnu-tar
          xcode="$(python3 packages/externals/deps.py builder-image darwin xcode)"
          sudo xcode-select -s "/Applications/Xcode_${xcode}.app"
          xcodebuild -version

      - name: Build externals
        timeout-minutes: 60
        working-directory: packages
        env:
          DEPS_BUILD: ${{ needs.check.outputs.missing }}
        run: |
          jobs="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          bash externals/generate_external.sh \
            --system "${{ matrix.system }}" \
            --architecture "${{ matrix.architecture }}" \
            --target "${{ matrix.target }}" \
            --tag "${BUILDER_TAG:-}" \
            --jobs "${jobs}" \
            --verbose

      - name: List produced artifacts
        if: always()
        run: |
          ls -lh packages/output_externals/externals-*.tar.gz 2>/dev/null || echo "no per-leg tarball produced"
          find packages/output_externals/pool -name '*.tar.gz' 2>/dev/null || echo "no pool/ tree"

      - name: Upload per-leg tarball
        if: always()
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: externals-${{ matrix.leg }}-${{ matrix.target }}
          path: packages/output_externals/externals-*.tar.gz
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

  build-ebpf:
    needs: check
    if: needs.check.outputs.ebpf == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and Zig
        run: |
          sudo apt-get update
          sudo apt-get install -y libelf-dev zlib1g-dev
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 20
          zig_version="$(sed -n 's/^ZIG_VERSION="\(.*\)"/\1/p' packages/externals/ebpf/build_ebpf.sh)"
          curl -fsSL "https://ziglang.org/download/${zig_version}/zig-x86_64-linux-${zig_version}.tar.xz" | tar -xJ -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/zig-x86_64-linux-${zig_version}" >> "${GITHUB_PATH}"

      - name: Build libbpf-bootstrap
        run: bash packages/externals/ebpf/build_ebpf.sh

      # Recorded in the manifests by consolidate.sh, like the toolchain of the legs.
      - name: Record the toolchain
        run: |
          {
            echo "leg: build-ebpf"
            echo "runner image: ${ImageOS:-} ${ImageVersion:-}"
            echo "clang-20: $(clang-20 --version | head -n1)"
            echo "zig: $(zig version)"
            dpkg-query -W -f='${Package} ${Version}\n' libelf-dev zlib1g-dev
          } > output/toolchain.txt

      - name: Upload libbpf-bootstrap tarballs
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: libbpf-bootstrap
          path: output
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

  consolidate:
    # Merge the legs and the libbpf-bootstrap build into one pool tree with the
    # manifest.json of every ref in it (consolidate.sh). Output: externals-all.
    needs: [check, build-externals, build-ebpf]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.check.outputs.legs == 'true' || needs.check.outputs.ebpf == 'true') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all per-leg tarballs
        if: needs.check.outputs.legs == 'true'
        uses: ./.github/actions/download_package
        with:
          build_run_id: ${{ github.run_id }}
          producer_workflow: 5_builderpackage_externals
          name_regexp: 'externals-(rpm|deb|macos|windows)-.*'
          path: per-leg
          extract_into_name_subdir: 'true'
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Download libbpf-bootstrap tarballs
        if: needs.check.outputs.ebpf == 'true'
        uses: ./.github/actions/download_s3_artifact
        with:
          name: libbpf-bootstrap
          path: libbpf-bootstrap
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Merge the legs into one pool tree and write the manifests
        run: bash packages/externals/consolidate.sh per-leg libbpf-bootstrap consolidated "${{ github.event.pull_request.head.sha || github.sha }}" "${{ github.run_id }}"

      - name: Pack consolidated tarball
        run: |
          tar -czf externals-all.tar.gz --owner=0 --group=0 --no-same-owner -C consolidated pool toolchain
          ls -lh externals-all.tar.gz

      - name: Upload consolidated tarball
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: externals-all
          path: externals-all.tar.gz
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

  cpython:
    # The embedded Python and its wheels, built against the refs of this run
    # (externals-all) and the published pool; its own ref is left out of make deps.
    needs: [check, build-externals, build-ebpf, consolidate]
    if: >-
      always() && needs.check.outputs.cpython == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { architecture: amd64, runner: wz-linux-amd64, archive: x86_64, platform: linux/amd64 }
          - { architecture: arm64, runner: wz-linux-arm64, archive: arm64,  platform: linux/aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    name: Build cpython (${{ matrix.architecture }})
    steps:
      - uses: actions/checkout@v4

      - name: Pull the pinned builder image
        env:
          GHCR_TOKEN: ${{ secrets.CI_WAZUH_AGENT_PACKAGES_CLASSIC }}
        run: bash packages/externals/pull_builder_image.sh "pkg_rpm_manager_builder_${{ matrix.architecture }}" linux manager "${{ matrix.architecture }}"

      - name: Download the refs built by this run
        if: needs.consolidate.result == 'success'
        uses: ./.github/actions/download_s3_artifact
        with:
          name: externals-all
          path: ${{ runner.temp }}/consolidated
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Lay out the dependencies of the manager
        run: |
          set -euo pipefail
          local_pool=()
          if [ -f "${RUNNER_TEMP}/consolidated/externals-all.tar.gz" ]; then
            tar -xzf "${RUNNER_TEMP}/consolidated/externals-all.tar.gz" -C "${RUNNER_TEMP}/consolidated"
            local_pool=(--local "${RUNNER_TEMP}/consolidated/pool")
          fi
          python3 packages/externals/deps.py mirror "${local_pool[@]}" --target manager \
            --platform "${{ matrix.platform }}" --without cpython --dest "${RUNNER_TEMP}/deps/pool"

      - name: Build cpython
        timeout-minutes: 75
        run: |
          mkdir -p "${RUNNER_TEMP}/cpython-output"
          docker run --rm \
            -e ARCH="${{ matrix.archive }}" \
            -e DEPS_POOL_URL="file:///deps/pool" \
            -v "${GITHUB_WORKSPACE}:/wazuh_host" \
            -v "${RUNNER_TEMP}/deps:/deps:ro" \
            -v "${RUNNER_TEMP}/cpython-output:/output" \
            --entrypoint bash "pkg_rpm_manager_builder_${{ matrix.architecture }}:${BUILDER_TAG}" \
            /wazuh_host/framework/cpython/compile.sh --build-cpython --build-deps

      - name: Lay out the cpython ref
        run: |
          set -euo pipefail
          ref="$(sed -n 's/^DEP_REF_cpython := //p' src/deps.lock.mk)"
          out="${RUNNER_TEMP}/cpython-out"
          mkdir -p "${out}/pool/${ref}/sources" "${out}/pool/${ref}/${{ matrix.platform }}" "${out}/toolchain"
          cp "${RUNNER_TEMP}/cpython-output/cpython_${{ matrix.archive }}.tar.gz" "${out}/pool/${ref}/sources/"
          cp "${RUNNER_TEMP}/cpython-output/cpython.tar.gz" "${out}/pool/${ref}/${{ matrix.platform }}/"
          cp "${RUNNER_TEMP}/cpython-output/toolchain.txt" "${out}/toolchain/cpython-${{ matrix.architecture }}.txt"
          tar -czf "cpython-${{ matrix.architecture }}.tar.gz" --owner=0 --group=0 --no-same-owner -C "${out}" pool toolchain
          ls -lh "cpython-${{ matrix.architecture }}.tar.gz"

      - name: Upload the cpython ref
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: cpython-${{ matrix.architecture }}
          path: cpython-${{ matrix.architecture }}.tar.gz
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

  pool:
    # Every ref this run built, with its manifest.json: what smoke tests and publish uploads.
    needs: [check, build-externals, build-ebpf, consolidate, cpython]
    if: >-
      always() && needs.check.result == 'success' && needs.check.outputs.missing != '' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the consolidated refs
        if: needs.consolidate.result == 'success'
        uses: ./.github/actions/download_s3_artifact
        with:
          name: externals-all
          path: downloaded
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Download the amd64 cpython ref
        if: needs.cpython.result == 'success'
        uses: ./.github/actions/download_s3_artifact
        with:
          name: cpython-amd64
          path: downloaded
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Download the arm64 cpython ref
        if: needs.cpython.result == 'success'
        uses: ./.github/actions/download_s3_artifact
        with:
          name: cpython-arm64
          path: downloaded
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Merge and write the cpython manifest
        run: |
          set -euo pipefail
          mkdir -p pool-new/pool pool-new/toolchain cpython-toolchain
          find downloaded -name 'externals-all.tar.gz' -exec tar -xzf {} -C pool-new \;
          while IFS= read -r tarball; do
            tar -xzf "${tarball}" -C pool-new
            tar -xzf "${tarball}" -C cpython-toolchain --strip-components=1 toolchain
          done < <(find downloaded -name 'cpython-*.tar.gz' | sort)
          if [ "${{ needs.cpython.result }}" = "success" ]; then
            python3 packages/externals/deps.py manifest --pool pool-new/pool --only cpython \
              --platforms linux/amd64,linux/aarch64 --toolchain cpython-toolchain \
              --wazuh-commit "${{ github.event.pull_request.head.sha || github.sha }}" --workflow-run "${{ github.run_id }}"
          fi
          echo "pool refs:"
          (cd pool-new/pool && find . -name manifest.json | sed 's|^\./||; s|/manifest.json$||' | sort)
          tar -czf pool-new.tar.gz --owner=0 --group=0 --no-same-owner -C pool-new pool toolchain
          ls -lh pool-new.tar.gz

      - name: Upload the new refs
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: pool-new
          path: pool-new.tar.gz
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

  smoke-build:
    # Build the agent and the manager against pool-new and the published pool
    # inside the pinned builder images, to confirm the new refs link. No package
    # is produced. The windows agent build runs in compile_windows_agent so the
    # host-side tools shipped under windows/ (flatbuffers' flatc) run on the
    # glibc the windows agent build sees. The log is uploaded; the analysis step
    # flags a dependency recompiled from source, the sign of a binary packed at
    # the wrong path.
    needs: [check, pool]
    if: always() && needs.pool.result == 'success'
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { architecture: amd64, runner: wz-linux-amd64, target: agent,    image: pkg_rpm_agent_builder_amd64,   platform: linux/amd64 }
          - { architecture: amd64, runner: wz-linux-amd64, target: manager,  image: pkg_rpm_manager_builder_amd64, platform: linux/amd64 }
          - { architecture: arm64, runner: wz-linux-arm64, target: agent,    image: pkg_rpm_agent_builder_arm64,   platform: linux/aarch64 }
          - { architecture: arm64, runner: wz-linux-arm64, target: manager,  image: pkg_rpm_manager_builder_arm64, platform: linux/aarch64 }
          - { architecture: i686,  runner: wz-linux-amd64, target: winagent, image: compile_windows_agent,         platform: windows }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    name: Smoke build (${{ matrix.target }}-${{ matrix.architecture }})

    steps:
      - uses: actions/checkout@v4

      - name: Pull the pinned builder image
        env:
          GHCR_TOKEN: ${{ secrets.CI_WAZUH_AGENT_PACKAGES_CLASSIC }}
        run: |
          case "${{ matrix.target }}" in
            winagent) bash packages/externals/pull_builder_image.sh "${{ matrix.image }}" windows agent ;;
            *)        bash packages/externals/pull_builder_image.sh "${{ matrix.image }}" linux "${{ matrix.target }}" "${{ matrix.architecture }}" ;;
          esac

      - name: Download the new refs
        uses: ./.github/actions/download_s3_artifact
        with:
          name: pool-new
          path: consolidated-deps
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Build ${{ matrix.target }} against the new refs
        timeout-minutes: 75
        run: |
          set -o pipefail
          mkdir -p smoke-logs
          log="smoke-logs/smoke-build-${{ matrix.target }}-${{ matrix.architecture }}.log"

          # The builder images have no python3, so the tree is laid out here.
          tar -xzf consolidated-deps/pool-new.tar.gz -C consolidated-deps
          rm -f consolidated-deps/pool-new.tar.gz
          python3 packages/externals/deps.py mirror --local consolidated-deps/pool \
            --target "${{ matrix.target }}" --platform "${{ matrix.platform }}" --dest smoke-deps/pool

          jobs="$(nproc 2>/dev/null || echo 2)"
          # The working tree is mounted read-write: the build writes into
          # src/external/ and src/build/. smoke-deps/ is inside it.
          docker run --rm -t \
            -v "${GITHUB_WORKSPACE}:/wazuh-local-src:Z" \
            -e BUILD_TARGET="${{ matrix.target }}" \
            -e ARCHITECTURE_TARGET="${{ matrix.architecture }}" \
            -e DEPS_DIR="/wazuh-local-src/smoke-deps" \
            -e JOBS="${jobs}" \
            -e WAZUH_VERBOSE="yes" \
            --entrypoint /bin/bash \
            "${{ matrix.image }}:${BUILDER_TAG}" \
            /wazuh-local-src/packages/externals/smoke_build.sh 2>&1 | tee "${log}"

      - name: Analyze dependency usage
        if: always()
        run: |
          log="smoke-logs/smoke-build-${{ matrix.target }}-${{ matrix.architecture }}.log"
          if [ ! -f "${log}" ]; then
            echo "::warning::no build log produced — the build step likely failed before running"
            exit 0
          fi
          echo "## Precompiled dependencies consumed"
          # src/external/CMakeLists.txt prints this when an if(EXISTS ...)
          # short-circuit finds a prebuilt archive in the source tree.
          grep -nE 'Using precompiled' "${log}" || echo "  (none found — unexpected for a precompiled-deps build)"
          echo
          echo "## Dependencies COMPILED from source"
          # A dependency that wasn't consumed precompiled shows up two ways in
          # src/external/CMakeLists.txt, so check both:
          #  - ExternalProject deps (rocksdb, lzma, flatbuffers, openssl, ...):
          #    a real run emits "Creating directories for '<dep>_external'" and
          #    "Performing build step for '<dep>_external'". The precompiled
          #    short-circuit instead defines a no-op add_custom_target — no
          #    such lines.
          #  - "pattern B" deps (cJSON, sqlite, procps): the fallback is
          #    add_library(ext_<dep> STATIC <dep>.c), which compiles into
          #    ext_<dep>.dir/. (wazuhext is Wazuh's own aggregation lib, not a
          #    dep — its target is `wazuhext`, never `ext_<name>`, so the
          #    \bext_ word boundary below does not match it.)
          # Both should be empty, except for the entries the pool only has as sources.
          ep="$(grep -nE "(Performing build step for|Creating directories for) '[^']+_external'" "${log}" || true)"
          pb="$(grep -nE 'Building (C|CXX) object .*\bext_[a-z0-9_]+\.dir/' "${log}" || true)"
          if [ -n "${ep}${pb}" ]; then
            [ -n "${ep}" ] && printf '%s\n' "${ep}"
            [ -n "${pb}" ] && printf '%s\n' "${pb}"
            echo "::warning::one or more external dependencies were recompiled from source — check whether their precompiled archive was packed at the path src/external/CMakeLists.txt expects"
          else
            echo "  (none — every external dependency was consumed precompiled)"
          fi
          echo
          echo "## Build errors (first 50)"
          grep -niE 'error:|fatal error|undefined reference|No rule to make target|recipe for target .* failed' "${log}" | head -50 \
            || echo "  (none)"

      - name: Upload smoke build log
        if: always()
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: smoke-build-${{ matrix.target }}-${{ matrix.architecture }}
          path: smoke-logs/
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

  publish:
    # Whoever approves the deps-publish environment reviews the whole diff of the
    # PR, this file included, at the SHA being published. Publishing is
    # idempotent per ref (publish_pool.sh), so runs queue instead of cancelling.
    needs: [check, pool, smoke-build]
    if: vars.DEPS_POOL_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment: deps-publish
    concurrency:
      group: deps-pool-publish
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download the new refs
        uses: ./.github/actions/download_s3_artifact
        with:
          name: pool-new
          path: pool-new
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Check every file against its manifest
        run: |
          tar -xzf pool-new/pool-new.tar.gz -C pool-new
          python3 packages/externals/deps.py verify --local pool-new/pool --pool "file://${PWD}/pool-new/pool"

      # Assumed after the downloads: from here on only the publishing role is in use.
      - name: Assume the publishing role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.DEPS_POOL_ROLE_ARN }}
          aws-region: ${{ vars.DEPS_POOL_REGION || 'us-west-1' }}

      - name: Publish the new refs
        run: bash packages/externals/publish_pool.sh pool-new/pool "${{ secrets.DEPS_POOL_BUCKET }}"

  verify:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the new refs
        uses: ./.github/actions/download_s3_artifact
        with:
          name: pool-new
          path: pool-new
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Verify the published refs through packages.wazuh.com
        run: |
          tar -xzf pool-new/pool-new.tar.gz -C pool-new
          python3 packages/externals/deps.py verify --local pool-new/pool
