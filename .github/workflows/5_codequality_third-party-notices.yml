name: 5.X - Check THIRD-PARTY-NOTICES

# THIRD-PARTY-NOTICES is generated by src/engine/tools/third-party-notices/generate.py from
# components.json and the license files the `deps` download puts under src/external, and both
# packages ship it as is. The SPDX workflow checks only the README table (no src/external there),
# so this one checks the file itself against what `deps` fetches.
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_codequality_third-party-notices.yml"
      - "THIRD-PARTY-NOTICES"
      - "src/engine/tools/third-party-notices/**"
      # What `deps` downloads into src/external, and therefore the license files read.
      - "src/Makefile"
      - "src/deps.lock.mk"
      - "tools/get_git_refs.sh"
      - "src/external/CMakeLists.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-notices:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the external dependencies
        run: make -C src deps TARGET=manager -j2

      - name: Check THIRD-PARTY-NOTICES
        run: python3 src/engine/tools/third-party-notices/generate.py check --external src/external
