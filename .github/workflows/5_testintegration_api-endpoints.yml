name: 5.X - API endpoints - Integration tests

on:
  workflow_dispatch:
    inputs:
      pytest_extra_args:
        description: 'Extra arguments to pass to pytest'
        required: false
        default: ''
      test_list:
        description: 'List of tests to run, separated by commas (without test_ prefix and .tavern.yaml suffix). If empty or not set, all tests will be run.'
        required: false
        default: ''

  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    # The environment compiles the manager and the 5.x agents from the tree with install.sh, so
    # every source it builds is here. What each change then runs is decided by
    # api/test/integration/mapping/selection_rules.yaml; its tests fail when these paths and the
    # rules disagree, so change both together.
    paths:
      - ".github/workflows/5_testintegration_api-endpoints.yml"
      - "api/**"
      - "framework/**"
      - "src/**"
      - "etc/**"
      - "install.sh"
      - "VERSION.json"
      - "tools/mitre/**"
      - "tools/devContainer/scripts/wazuh-certs-tool.sh"
      # .github/actions/upload_s3_artifact only uploads logs on failure: it tests nothing, and a
      # broken upload fails the job visibly; 5_builderpackage_manager-multiples.yml lists it and
      # exercises it on every pull request it runs.
      # Unit tests, docs and dev tools of those trees never reach the environment
      - "!api/api/**/test/**"
      - "!api/tools/**"
      - "!framework/**/tests/**"
      - "!framework/examples/**"
      - "!src/win32/**"
      - "!src/unit_tests/**"
      - "!src/**/tests/**"
      - "!src/**/qa/**"
      - "!src/**/integrationTests/**"
      - "!src/**/testtool/**"
      - "!src/engine/test/**"
      - "!src/engine/docs/**"
      - "!**/*.md"
      # ...but not the generated report the setup job diffs (`endpoint_coverage.py --check` fails when
      # it is out of date): a hand edit must run that check
      - "api/test/integration/mapping/COVERAGE.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The images docker compose builds (api/test/integration/env/docker-compose.yml); save, load and the
  # presence check iterate this list, so a missing image fails the job instead of being silently skipped
  IT_IMAGES: integration_test_wazuh-manager integration_test_wazuh-agent integration_test_wazuh-agent_old integration_test_haproxy-lb
  # Where the build job leaves the image set for the test jobs of the same run: the private packages
  # ghcr.io/wazuh/api-its-<image>, tagged by the build job (IT_TAG), kept 4 days for "Re-run failed jobs" and then
  # deleted by 5_testintegration_api-endpoints-images-cleanup.yml, or earlier when their pull request is closed. The
  # token of a fork (a pull request from a fork, or a run in the fork itself) cannot push there, so those runs use a
  # run artifact instead
  IT_STORE: ${{ github.repository == 'wazuh/wazuh' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ghcr' || 'artifact' }}
  IT_REGISTRY: ghcr.io/wazuh/api-its-

jobs:
  api_endpoints_integration_tests_setup:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      custom_matrix: ${{ steps.test_files.outputs.files }}
    name: Generate execution matrix for API endpoints integration tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The selection diffs against the merge-base with the base branch
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version-file: "framework/.python-version"

      - name: Install dependencies
        run: pip install PyYAML==6.0.3 pytest==7.3.1

      - name: Check the selection rules and the endpoint coverage
        run: |
          cd api/test/integration/mapping
          python -m pytest -q tests
          python select_tests.py --check
          python endpoint_coverage.py --check

      - name: Select the test files
        id: test_files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          TEST_LIST: ${{ github.event.inputs.test_list }}
        run: |
          cd api/test/integration/mapping
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${BASE_REF}"
            files=$(python select_tests.py --base FETCH_HEAD)
          elif [[ -n "${TEST_LIST}" ]]; then
            files=$(python select_tests.py --test-list "${TEST_LIST}")
          else
            files=$(python select_tests.py --all)
          fi
          echo "Selected tests: ${files}"
          echo "files=${files}" >> "$GITHUB_OUTPUT"
        shell: bash

  build_docker_images:
    needs: api_endpoints_integration_tests_setup
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Build and cache Docker images for integration tests
    permissions:
      contents: read
      packages: write
    outputs:
      it_tag: ${{ steps.tag.outputs.it_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pr<number>-<run id>-<attempt> on a pull request (e.g. pr40009-38808554294-1), run-<run id>-<attempt> otherwise.
      # Only this job of this attempt pushes it, so no other run (a workflow_dispatch of the same head, a new merge
      # commit of the same head) can overwrite the set the test jobs pull. Set once and passed to the test jobs, so
      # "Re-run failed jobs" reuses it; "Re-run all jobs" is a new attempt and builds a new set. The pr<number>- prefix
      # lets 5_testintegration_api-endpoints-images-cleanup.yml delete the sets of a pull request when it is closed
      - name: Set the image tag
        id: tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tag="${PR_NUMBER:+pr${PR_NUMBER}}"
          tag="${tag:-run}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "it_tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "IT_TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: |
          sudo apt-get install docker-compose-v2 zstd -y

      - name: Log in to ghcr.io
        if: ${{ env.IT_STORE == 'ghcr' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and store Docker images
        run: |
          cd api/test/integration/env
          # An image left out of IT_IMAGES would not be stored, and docker compose up would rebuild it in every
          # test job without WAZUH_BRANCH; images compose pulls from a registry are not stored
          built=$(docker compose config --format json | jq -r '.services[] | select(.build) | .image' | sort -u)
          listed=$(printf '%s\n' ${IT_IMAGES} | sort -u)
          if [ "${built}" != "${listed}" ]; then
            echo "::error::IT_IMAGES ($(echo ${listed})) does not match the images docker compose builds ($(echo ${built}))"
            exit 1
          fi
          # The commit under test: on a pull request, the merge commit, which the tarball
          # endpoint also serves for a fork
          docker compose build --build-arg WAZUH_BRANCH=${{ github.sha }} --no-cache
          # ghcr.io answers 4 pushes at once: a transient error must not fail the build
          retry() { for n in 1 2 3; do "$@" && return 0; [ "${n}" -lt 3 ] && { echo "::warning::'$*' failed (attempt ${n}/3), retrying in $((n * 15)) s"; sleep $((n * 15)); }; done; return 1; }
          mkdir -p /tmp/docker-images
          pids=(); names=()
          for image in ${IT_IMAGES}; do
            docker image inspect "${image}:latest" >/dev/null 2>&1 || { echo "::error::compose did not build ${image}:latest"; exit 1; }
            if [ "${IT_STORE}" = ghcr ]; then
              docker tag "${image}:latest" "${IT_REGISTRY}${image}:${IT_TAG}"
              retry docker push --quiet "${IT_REGISTRY}${image}:${IT_TAG}" &
            else
              ( set -o pipefail; docker save "${image}:latest" | zstd -T0 -o "/tmp/docker-images/${image}.tar.zst" ) &
            fi
            pids+=("$!"); names+=("${image}")
          done
          rc=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || { echo "::error::could not store ${names[$i]} (${IT_STORE})"; rc=1; }
          done
          exit "${rc}"

      # The run artifact expires after 1 day, so on a fork "Re-run failed jobs" only works the first day
      - name: Upload Docker images
        if: ${{ env.IT_STORE == 'artifact' }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/docker-images
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  smoke_test:
    needs: [api_endpoints_integration_tests_setup, build_docker_images]
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Run smoke test for API endpoints
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      IT_TAG: ${{ needs.build_docker_images.outputs.it_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version-file: "framework/.python-version"

      - name: Install dependencies
        run: |
          pip install -r framework/requirements-dev.txt
          sudo apt-get install docker-compose-v2 -y

      - name: Log in to ghcr.io
        if: ${{ env.IT_STORE == 'ghcr' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Docker images
        if: ${{ env.IT_STORE == 'artifact' }}
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/docker-images

      - name: Load Docker images
        run: |
          # ghcr.io answers 27 jobs at once: a transient error must not fail a job
          retry() { for n in 1 2 3; do "$@" && return 0; [ "${n}" -lt 3 ] && { echo "::warning::'$*' failed (attempt ${n}/3), retrying in $((n * 15)) s"; sleep $((n * 15)); }; done; return 1; }
          pids=(); names=()
          if [ "${IT_STORE}" = ghcr ]; then
            # Retagged to the names docker-compose.yml uses
            for image in ${IT_IMAGES}; do
              ( retry docker pull --quiet "${IT_REGISTRY}${image}:${IT_TAG}" &&
                docker tag "${IT_REGISTRY}${image}:${IT_TAG}" "${image}:latest" ) &
              pids+=("$!"); names+=("${IT_REGISTRY}${image}:${IT_TAG}")
            done
          else
            shopt -s nullglob
            files=(/tmp/docker-images/*.tar.zst)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::no Docker images to load in /tmp/docker-images (the image set of this run is missing)"
              exit 1
            fi
            for f in "${files[@]}"; do docker load --input "${f}" & pids+=("$!"); names+=("${f}"); done
          fi
          rc=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || { echo "::error::could not load ${names[$i]} (the image set of this run is missing or expired)"; rc=1; }
          done
          for image in ${IT_IMAGES}; do
            docker image inspect "${image}:latest" >/dev/null 2>&1 || { echo "::error::image ${image}:latest is not loaded"; rc=1; }
          done
          exit "${rc}"

      - name: Run smoke test
        run: |
          cd api/test/integration
          pytest --nobuild -vvv _test_smoke.tavern.yaml

      - name: Upload manager/cluster/agent logs on failure
        if: failure()
        uses: ./.github/actions/upload_s3_artifact
        with:
          aws_region: ${{ secrets.CI_AWS_REGION }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          name: integration-logs-smoke-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: api/test/integration/_test_results/logs/

  api_endpoints_integration_tests_execution:
    needs: [api_endpoints_integration_tests_setup, build_docker_images, smoke_test]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.api_endpoints_integration_tests_setup.outputs.custom_matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.api_endpoints_integration_tests_setup.outputs.custom_matrix) }}
    name: Run integration tests for API endpoints
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      IT_TAG: ${{ needs.build_docker_images.outputs.it_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version-file: "framework/.python-version"

      - name: Install dependencies
        run: |
          pip install -r framework/requirements-dev.txt
          sudo apt-get install docker-compose-v2 -y

      - name: Log in to ghcr.io
        if: ${{ env.IT_STORE == 'ghcr' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Docker images
        if: ${{ env.IT_STORE == 'artifact' }}
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/docker-images

      - name: Load Docker images
        run: |
          # ghcr.io answers 27 jobs at once: a transient error must not fail a job
          retry() { for n in 1 2 3; do "$@" && return 0; [ "${n}" -lt 3 ] && { echo "::warning::'$*' failed (attempt ${n}/3), retrying in $((n * 15)) s"; sleep $((n * 15)); }; done; return 1; }
          pids=(); names=()
          if [ "${IT_STORE}" = ghcr ]; then
            # Retagged to the names docker-compose.yml uses
            for image in ${IT_IMAGES}; do
              ( retry docker pull --quiet "${IT_REGISTRY}${image}:${IT_TAG}" &&
                docker tag "${IT_REGISTRY}${image}:${IT_TAG}" "${image}:latest" ) &
              pids+=("$!"); names+=("${IT_REGISTRY}${image}:${IT_TAG}")
            done
          else
            shopt -s nullglob
            files=(/tmp/docker-images/*.tar.zst)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::no Docker images to load in /tmp/docker-images (the image set of this run is missing)"
              exit 1
            fi
            for f in "${files[@]}"; do docker load --input "${f}" & pids+=("$!"); names+=("${f}"); done
          fi
          rc=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || { echo "::error::could not load ${names[$i]} (the image set of this run is missing or expired)"; rc=1; }
          done
          for image in ${IT_IMAGES}; do
            docker image inspect "${image}:latest" >/dev/null 2>&1 || { echo "::error::image ${image}:latest is not loaded"; rc=1; }
          done
          exit "${rc}"

      - name: Run tests
        env:
          TEST_FILE: ${{ matrix.test_file }}
          EXTRA_ARGS: ${{ github.event.inputs.pytest_extra_args }}
        run: |
          cd api/test/integration
          # A rerun of these files would start with the limits they exhaust already spent
          case "${TEST_FILE}" in
            test_ratelimit_*|test_hardening_*) reruns="" ;;
            *) reruns="--reruns 3 --reruns-delay 5" ;;
          esac
          pytest --nobuild -vvv ${reruns} ${EXTRA_ARGS} "${TEST_FILE}"

      - name: Upload manager/cluster/agent logs on failure
        if: failure()
        uses: ./.github/actions/upload_s3_artifact
        with:
          aws_region: ${{ secrets.CI_AWS_REGION }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          name: integration-logs-${{ matrix.test_file }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: api/test/integration/_test_results/logs/
