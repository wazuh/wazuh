run-name: Package 5.X - Upload Docker package building images
name: 5.X - Package - Upload Docker package building images

on:
  push:
    branches:
      - '5.[0-9]+.[0-9]+'
      - 'main'
    # The union of the image filters below (packages/ inputs of each builder image), plus what the
    # manager images are built with outside packages/: retry.sh is ADDed from
    # .github/scripts/run_with_retry.sh, and the dispatched workflow and its build script push them.
    # Other packages/ trees (SPECS, externals, macos, binutils/gcc images) dispatch nothing here.
    paths:
      - 'packages/build.sh'
      - 'packages/generate_package.sh'
      - 'packages/debs/*/manager/**'
      - 'packages/debs/*/agent/**'
      - 'packages/debs/utils/**'
      - 'packages/rpms/*/manager/**'
      - 'packages/rpms/*/agent/**'
      - 'packages/rpms/utils/**'
      - 'packages/windows/**'
      - 'packages/wpk/wpkpack.py'
      - 'packages/wpk/run.sh'
      - 'packages/wpk/generate_wpk_package.sh'
      - 'packages/wpk/common/**'
      - '.github/scripts/run_with_retry.sh'
      - '.github/actions/ghcr-pull-and-push/build_and_push_image_to_ghcr.sh'
      - '.github/workflows/5_builderprecompiled_docker-images-upload-manager.yml'
      - '.github/workflows/5_builderprecompiled_docker-images-upload.yml'

jobs:
  Upload-package-building-images:
    runs-on: ubuntu-24.04
    permissions:
      actions: write

    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout wazuh/wazuh repository
        uses: actions/checkout@v4

      - name: Get changed files
        uses: dorny/paths-filter@v2
        id: changes
        with:
          # Manager images: the build context is packages/<system>s/<arch>/manager plus the files the
          # dispatched workflow copies into it (packages/build.sh, packages/<system>s/utils/*,
          # .github/scripts/run_with_retry.sh as retry.sh). generate_package.sh runs on the host
          # (5_builderpackage_manager.yml), never inside the image, so it rebuilds no manager image.
          # The agent images are built in wazuh/wazuh-agent-packages from this ref; their filters
          # are kept as that repository expects.
          filters: |
            pkg_deb_manager_builder_amd64:
              - 'packages/build.sh'
              - 'packages/debs/amd64/manager/**'
              - 'packages/debs/utils/**'
              - '.github/scripts/run_with_retry.sh'
              - '.github/actions/ghcr-pull-and-push/build_and_push_image_to_ghcr.sh'
              - '.github/workflows/5_builderprecompiled_docker-images-upload-manager.yml'
            pkg_deb_manager_builder_arm64:
              - 'packages/build.sh'
              - 'packages/debs/arm64/manager/**'
              - 'packages/debs/utils/**'
              - '.github/scripts/run_with_retry.sh'
              - '.github/actions/ghcr-pull-and-push/build_and_push_image_to_ghcr.sh'
              - '.github/workflows/5_builderprecompiled_docker-images-upload-manager.yml'
            pkg_rpm_manager_builder_amd64:
              - 'packages/build.sh'
              - 'packages/rpms/amd64/manager/**'
              - 'packages/rpms/utils/**'
              - '.github/scripts/run_with_retry.sh'
              - '.github/actions/ghcr-pull-and-push/build_and_push_image_to_ghcr.sh'
              - '.github/workflows/5_builderprecompiled_docker-images-upload-manager.yml'
            pkg_rpm_manager_builder_arm64:
              - 'packages/build.sh'
              - 'packages/rpms/arm64/manager/**'
              - 'packages/rpms/utils/**'
              - '.github/scripts/run_with_retry.sh'
              - '.github/actions/ghcr-pull-and-push/build_and_push_image_to_ghcr.sh'
              - '.github/workflows/5_builderprecompiled_docker-images-upload-manager.yml'
            pkg_deb_agent_builder_amd64:
              - 'packages/build.sh'
              - 'packages/generate_package.sh'
              - 'packages/debs/amd64/agent/**'
              - 'packages/debs/utils/**'
            pkg_rpm_agent_builder_amd64:
              - 'packages/build.sh'
              - 'packages/generate_package.sh'
              - 'packages/rpms/amd64/agent/**'
              - 'packages/rpms/utils/**'
            pkg_deb_agent_builder_arm64:
              - 'packages/build.sh'
              - 'packages/generate_package.sh'
              - 'packages/debs/arm64/agent/**'
              - 'packages/debs/utils/**'
            pkg_rpm_agent_builder_arm64:
              - 'packages/build.sh'
              - 'packages/generate_package.sh'
              - 'packages/rpms/arm64/agent/**'
              - 'packages/rpms/utils/**'
            compile_windows_agent:
              - 'packages/windows/**'
            commom_wpk_builder:
              - 'packages/wpk/wpkpack.py'
              - 'packages/wpk/run.sh'
              - 'packages/wpk/generate_wpk_package.sh'
              - 'packages/wpk/common/**'

      - name: Set TAG and WAZUH_AGENT_PACKAGES_BRANCH
        run: |
          VERSION="$(grep '"version"' VERSION.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          echo "TAG=$VERSION" >> $GITHUB_ENV;

      - name: Request pkg_deb_manager_builder_amd64 update
        if: steps.changes.outputs.pkg_deb_manager_builder_amd64 == 'true'
        run: |
          gh workflow run 5_builderprecompiled_docker-images-upload-manager.yml -r ${{ github.ref_name }} -f architecture=amd64 -f docker_image_tag=${{ env.TAG }} -f system=deb -f source_reference=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Request pkg_rpm_manager_builder_amd64 update
        if: steps.changes.outputs.pkg_rpm_manager_builder_amd64 == 'true'
        run: |
          gh workflow run 5_builderprecompiled_docker-images-upload-manager.yml -r ${{ github.ref_name }} -f architecture=amd64 -f docker_image_tag=${{ env.TAG }} -f system=rpm -f source_reference=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Request pkg_deb_manager_builder_arm64 update
        if: steps.changes.outputs.pkg_deb_manager_builder_arm64 == 'true'
        run: |
          gh workflow run 5_builderprecompiled_docker-images-upload-manager.yml -r ${{ github.ref_name }} -f architecture=arm64 -f docker_image_tag=${{ env.TAG }} -f system=deb -f source_reference=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Request pkg_rpm_manager_builder_arm64 update
        if: steps.changes.outputs.pkg_rpm_manager_builder_arm64 == 'true'
        run: |
          gh workflow run 5_builderprecompiled_docker-images-upload-manager.yml -r ${{ github.ref_name }} -f architecture=arm64 -f docker_image_tag=${{ env.TAG }} -f system=rpm -f source_reference=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Request pkg_deb_agent_builder_amd64 update
        if: steps.changes.outputs.pkg_deb_agent_builder_amd64 == 'true'
        run: |
          gh workflow run 5_builderpackage_upload-images-amd.yml --repo wazuh/wazuh-agent-packages -r ${{ github.ref_name }} -f docker_image_tag=${{ env.TAG }} -f system=deb -f architecture=amd64 -f source_reference=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.CI_WAZUH_AGENT_PACKAGES }}

      - name: Request pkg_rpm_agent_builder_amd64 update
        if: steps.changes.outputs.pkg_rpm_agent_builder_amd64 == 'true'
        run: |
          gh workflow run 5_builderpackage_upload-images-amd.yml --repo wazuh/wazuh-agent-packages -r ${{ github.ref_name }} -f docker_image_tag=${{ env.TAG }} -f system=rpm -f architecture=amd64 -f source_reference=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.CI_WAZUH_AGENT_PACKAGES }}

      - name: Request pkg_deb_agent_builder_arm64 update
        if: steps.changes.outputs.pkg_deb_agent_builder_arm64 == 'true'
        run: |
          gh workflow run 5_builderpackage_upload-images-arm.yml --repo wazuh/wazuh-agent-packages -r ${{ github.ref_name }} -f docker_image_tag=${{ env.TAG }} -f system=deb -f architecture=arm64 -f source_reference=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.CI_WAZUH_AGENT_PACKAGES }}

      - name: Request pkg_rpm_agent_builder_arm64 update
        if: steps.changes.outputs.pkg_rpm_agent_builder_arm64 == 'true'
        run: |
          gh workflow run 5_builderpackage_upload-images-arm.yml --repo wazuh/wazuh-agent-packages -r ${{ github.ref_name }} -f docker_image_tag=${{ env.TAG }} -f system=rpm -f architecture=arm64 -f source_reference=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.CI_WAZUH_AGENT_PACKAGES }}

      - name: Request compile_windows_agent update
        if: steps.changes.outputs.compile_windows_agent == 'true'
        run: |
          gh workflow run 5_builderpackage_upload-images-amd.yml --repo wazuh/wazuh-agent-packages -r ${{ github.ref_name }} -f docker_image_tag=${{ env.TAG }} -f system=windows -f architecture=i386 -f source_reference=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.CI_WAZUH_AGENT_PACKAGES }}

      - name: Request commom_wpk_builder update
        if: steps.changes.outputs.commom_wpk_builder == 'true'
        run: |
          gh workflow run 5_builderpackage_upload-images-wpk.yml --repo wazuh/wazuh-agent-packages -r ${{ github.ref_name }} -f docker_image_tag=${{ env.TAG }} -f source_reference=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.CI_WAZUH_AGENT_PACKAGES }}
