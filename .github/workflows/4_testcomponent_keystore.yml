name: 4.X - Wazuh Keystore - Component tests
on:
  workflow_dispatch:
  pull_request:
    # Pull request events
    types: [synchronize, opened, reopened, ready_for_review]
    # Path filtering
    paths:
      - ".github/workflows/4_testcomponent_keystore.yml"
      - "src/shared_modules/keystore/**"
      - "src/shared_modules/utils/**"

jobs:
  wazuh-keystore-qa:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: "Install a compatible CMake"
        uses: ./.github/actions/reinstall_cmake

      # Compilation cache (issue 38139). Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/4.14.8
      - name: Compile keystore
        run: |
          make deps TARGET=server -j2 -C src/
          make libwazuhext.so TARGET=server -j2 -C src/
          mkdir -p src/shared_modules/keystore/build
          cmake -S src/shared_modules/keystore -B  src/shared_modules/keystore/build -DSRC_FOLDER=$(pwd)/src
          cmake --build src/shared_modules/keystore/build -j2
          find . -name "wazuh-keystore-testtool" -exec mv {} src/ \;

      - name: Install dependencies
        run: |
          pip install -r src/shared_modules/keystore/qa/requirements.txt

      - name: Run tests
        run: |
          python -m pytest -vv src/shared_modules/keystore/qa/ --log-cli-level=DEBUG
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true
