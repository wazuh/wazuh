name: 4.X - macOS compilation test

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/4_testcomponent_build-macos.yml"

jobs:
  build-sequoia:
    runs-on: macos-15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      - name: Build wazuh agent for macOS 15
        run: |
          make deps -C src TARGET=agent -j3
          make -C src TARGET=agent -j3
