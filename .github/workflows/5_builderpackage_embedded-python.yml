name: 5.X - Package - Build Wazuh manager embedded Python

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Comma-separated architecture. Example: "amd64,arm64"'
        type: string
        default: "amd64,arm64"
        required: true
      build_cpython:
        description: Whether to build embedded Python or not.
        type: boolean
        default: true
        required: false
      build_deps:
        description: Whether to build embedded Python dependencies or not.
          Enabling build_cpython will enable this option automatically.
        type: boolean
        default: true
        required: false
      python_deps_version:
        description: |
          Set this build will be published as, 5/python/<number> (e.g. 5/python/2
          for packages.wazuh.com/deps/5/python/2/). Written into manifest.json.
        type: string
        default: ""
        required: false

jobs:
  pick-architecture:
    name: Get architectures to build
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate dynamic matrix
        id: set-matrix
        env:
          INPUT_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          JSON_ARRAY=$(
            echo "$INPUT_ARCHITECTURE" \
            | tr ',' '\n' \
            | while read -r raw_arch; do
                arch=$(echo "$raw_arch" | xargs)

                case "$arch" in
                  arm64|aarch64)
                    IMG_ARCH="arm64"
                    ;;
                  amd64|x86_64)
                    IMG_ARCH="amd64"
                    ;;
                  "")
                    continue
                    ;;
                  *)
                    echo "Unsupported architecture: $arch" >&2
                    exit 1
                    ;;
                esac

                jq -c -n --arg arch "$IMG_ARCH" '{architecture: $arch}'
              done
          )
      
          JSON_ARRAY=$(echo "$JSON_ARRAY" | jq -c -s 'unique | {include: .}')
          echo "Picked architectures: $JSON_ARRAY"
          echo "matrix=$JSON_ARRAY" >> "$GITHUB_OUTPUT"

  build-embedded-python:
    name: Build Wazuh manager embedded Python
    needs: pick-architecture
    strategy:
      matrix: ${{ fromJSON(needs.pick-architecture.outputs.matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.architecture == 'arm64' && 'wz-linux-arm64' || 'ubuntu-24.04' }}
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:

      - name: Checkout Wazuh repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set ARCH and PACKAGE_ARCH
        run: |
          case "${{ matrix.architecture }}" in
              x86_64|amd64)
                arch="amd64"
                pkg_arch="x86_64"
                ;;
              aarch64|arm64)
                arch="arm64"
                pkg_arch="arm64"
                ;;
          esac

          echo "ARCH=$arch" >> $GITHUB_ENV
          echo "PACKAGE_ARCH=$pkg_arch" >> $GITHUB_ENV

      - name: Set TAG and CONTAINER_NAME
        run: |
          VERSION=$(jq -r '.version' $GITHUB_WORKSPACE/VERSION.json)
          echo "TAG=$VERSION" >> $GITHUB_ENV
          echo "CONTAINER_NAME=pkg_rpm_manager_builder_${ARCH}" >> $GITHUB_ENV

      - name: Pull builder container image
        run: |
          bash $GITHUB_WORKSPACE/.github/actions/ghcr-pull-and-push/pull_image_from_ghcr.sh "${{ secrets.GITHUB_TOKEN }}" "${{ github.actor }}" "$CONTAINER_NAME" "$TAG"

      - name: Run embedded Python compilation
        working-directory: framework/cpython
        run: |
          docker run --env ARCH="$PACKAGE_ARCH" \
            -v $GITHUB_WORKSPACE:/wazuh_host -v /tmp:/output \
            --entrypoint=bash "$CONTAINER_NAME:$TAG" \
            /wazuh_host/framework/cpython/compile.sh \
              ${{ inputs.build_cpython == true && '--build-cpython' || '' }} \
              ${{ inputs.build_deps == true && '--build-deps' || '' }}

      - name: Upload Wazuh manager embedded Python sources to GitHub
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: ${{ env.ARCH }}-sources
          path: /tmp/cpython_${{ env.PACKAGE_ARCH }}.tar.gz
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Upload Wazuh manager out-of-the-box embedded Python to GitHub
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: ${{ env.ARCH }}-compiled
          path: /tmp/cpython.tar.gz
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

  python-set:
    # Lay out both architectures as packages.wazuh.com/deps/5/python/<n>/ with its
    # manifest.json; `make deps` reads these paths through PYTHON_DEPS_VERSION.
    name: Assemble the embedded Python set
    needs: build-embedded-python
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Wazuh repository
        uses: actions/checkout@v4

      - name: Download amd64 sources
        uses: ./.github/actions/download_s3_artifact
        with:
          name: amd64-sources
          path: downloaded/amd64-sources
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Download amd64 compiled
        uses: ./.github/actions/download_s3_artifact
        with:
          name: amd64-compiled
          path: downloaded/amd64-compiled
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Download arm64 sources
        uses: ./.github/actions/download_s3_artifact
        with:
          name: arm64-sources
          path: downloaded/arm64-sources
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Download arm64 compiled
        uses: ./.github/actions/download_s3_artifact
        with:
          name: arm64-compiled
          path: downloaded/arm64-compiled
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Lay out the set
        run: |
          set -euo pipefail
          # <artifact arch>:<cpython_ archive suffix>:<PRECOMPILED_RES arch>
          for spec in amd64:x86_64:amd64 arm64:arm64:aarch64; do
            IFS=: read -r arch archive_arch res_arch <<< "${spec}"
            sources="$(find "downloaded/${arch}-sources" -name "cpython_${archive_arch}.tar.gz" 2>/dev/null | head -n1 || true)"
            compiled="$(find "downloaded/${arch}-compiled" -name cpython.tar.gz 2>/dev/null | head -n1 || true)"
            if [ -z "${sources}" ] || [ -z "${compiled}" ]; then
              echo "::error::${arch} artifacts missing: a Python set needs both architectures"
              exit 1
            fi
            mkdir -p set/libraries/sources "set/libraries/linux/${res_arch}"
            cp "${sources}" set/libraries/sources/
            cp "${compiled}" "set/libraries/linux/${res_arch}/cpython.tar.gz"
          done

      - name: Write the set manifest
        env:
          PYTHON_DEPS_VERSION_INPUT: ${{ inputs.python_deps_version }}
        run: |
          set -euo pipefail
          built_against="$(sed -n 's/^DEPS_VERSION[[:space:]]*=[[:space:]]*\([^[:space:]]*\).*/\1/p' src/Makefile | head -n1)"
          python3 packages/externals/deps.py manifest --python \
            --deps-version "${PYTHON_DEPS_VERSION_INPUT:-unassigned}" --built-against "${built_against}" \
            --wazuh-commit "${{ github.sha }}" --workflow-run "${{ github.run_id }}" \
            --files set > manifest.json
          mv manifest.json set/manifest.json
          tar -czf python-all.tar.gz --owner=0 --group=0 --no-same-owner -C set manifest.json libraries
          ls -lh python-all.tar.gz

      - name: Upload the embedded Python set
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: python-all
          path: python-all.tar.gz
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}
