name: 4.X - Ruleset - Integration tests

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
        - ".github/workflows/4_testintegration_ruleset.yml"
        - "ruleset/**"
        - "src/analysisd/**"
        - "src/config/rules-config.*"
        - "src/config/decoder-config.*"
        - "src/Makefile"

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: codebuild-github-actions-codebuild-runner-server-amd-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      - name: Install system build dependencies
        # TODO: Remove when added to CodeBuild base images
        run: sudo apt-get update && sudo apt-get install -y python3-pip
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: ".github/workflows/.python-version-it"
          architecture: x64
      - name: "Install a compatible CMake"
        uses: ./.github/actions/reinstall_cmake
      # Build wazuh server for linux.
      - name: Build wazuh server for linux
        run: |
          make deps -C src TARGET=server -j2
          make -C src TARGET=server -j2
      # Install wazuh server for linux.
      - name: Install wazuh server for linux
        run: |
          echo 'USER_LANGUAGE="en"' > ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_NO_STOP="y"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_INSTALL_TYPE="server"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo "USER_DIR=/var/ossec" >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_EMAIL="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_SYSCHECK="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_ROOTCHECK="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_SYSCOLLECTOR="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_SCA="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_WHITE_LIST="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_SYSLOG="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_ENABLE_AUTHD="n"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          echo 'USER_AUTO_START="y"' >> ./etc/preloaded-vars.conf
          echo "" >> ./etc/preloaded-vars.conf
          sudo sh install.sh
          rm ./etc/preloaded-vars.conf
      # Wait for analysisd to finish loading the ruleset and open the logtest
      # socket before running tests against it. wazuh-control/systemctl only
      # confirm the daemons were launched, not that they finished initializing,
      # so without this wait the first few wazuh-logtest calls can race the
      # daemon startup and fail with a connection error instead of a real result.
      - name: Wait for Wazuh manager to be ready
        run: |
          sudo python3 - <<'EOF'
          import socket
          import sys
          import time

          SOCKET_PATH = "/var/ossec/queue/sockets/logtest"
          TIMEOUT_SECONDS = 90
          POLL_INTERVAL_SECONDS = 2

          deadline = time.time() + TIMEOUT_SECONDS
          while True:
              try:
                  s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  s.connect(SOCKET_PATH)
                  s.close()
                  print("Wazuh manager logtest socket is ready.")
                  sys.exit(0)
              except OSError as e:
                  if time.time() >= deadline:
                      print(f"::error::Timed out after {TIMEOUT_SECONDS}s waiting for "
                            f"the logtest socket ({SOCKET_PATH}) to become available: {e}",
                            file=sys.stderr)
                      sys.exit(1)
                  time.sleep(POLL_INTERVAL_SECONDS)
          EOF
      # Run ruleset integration tests.
      - name: Run ruleset integration tests
        run: |
          cd ruleset/testing
          sudo python runtests.py --path /var/ossec
