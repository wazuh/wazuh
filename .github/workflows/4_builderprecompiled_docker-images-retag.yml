name: 4.X - Package - Retag Docker images
on:
  workflow_dispatch:
    inputs:
      old_version:
        description: |
          Tag name refering old tag
          (Use a version name. Ex 4.8.0)
        required: false
        default: none
      new_version:
        description: |
          Retagging tag
          (Use a version name. Ex 4.8.0
          Must be newer than old one.)
        required: false
        default: none
      single_docker_image:
        description: |
          Docker image name. Used to retag only
          the provided image.
        required: false
        default: ""
  push:
    branches:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "main"
    paths:
      - "VERSION.json"

jobs:
  Upload-package-building-images:
    runs-on: codebuild-github-actions-codebuild-runner-server-amd-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 20
    name: Package - Retag Docker images

    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@master
        with:
          cancel_others: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: "false"

      - name: Checkout repository previous commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: git checkout HEAD^

      - name: Get old version from VERSION.json
        run: |
          VERSION_FILE="$GITHUB_WORKSPACE/VERSION.json"

          if [[ -f "$VERSION_FILE" ]]; then
            VERSION="$(grep '"version"' $GITHUB_WORKSPACE/VERSION.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          else
            echo "Error: No version file found." >&2
            exit 1
          fi

          echo "OLD_VERSION=$VERSION" >> $GITHUB_ENV;

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get new version from VERSION.json
        run: |
          VERSION="$(grep '"version"' $GITHUB_WORKSPACE/VERSION.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV;

      - name: Run retag script
        env:
          INPUT_EVENT_NAME: ${{ github.event_name }}
          INPUT_NEW_VERSION: ${{ inputs.new_version }}
          INPUT_OLD_VERSION: ${{ inputs.old_version }}
          INPUT_SINGLE_DOCKER_IMAGE: ${{ inputs.single_docker_image }}
          INPUT_CI_WAZUH_AGENT_PACKAGES_CLASSIC: ${{ secrets.CI_WAZUH_AGENT_PACKAGES_CLASSIC }}
          INPUT_GITHUB_ACTOR: ${{ github.actor }}
        run: |
          if [ "$INPUT_EVENT_NAME" == "workflow_dispatch" ]; then
            new_version=$(sed 's|[/\\]|--|g' <<< "$INPUT_NEW_VERSION")
            old_version=$(sed 's|[/\\]|--|g' <<< "$INPUT_OLD_VERSION")
          else
            new_version="$NEW_VERSION"
            old_version="$OLD_VERSION"
          fi
          bash "$GITHUB_WORKSPACE/.github/actions/ghcr-pull-and-push/retag_image.sh" "$INPUT_CI_WAZUH_AGENT_PACKAGES_CLASSIC" "$INPUT_GITHUB_ACTOR" "$old_version" "$new_version" "$INPUT_SINGLE_DOCKER_IMAGE"
