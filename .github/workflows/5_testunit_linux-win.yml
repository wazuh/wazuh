name: 5.X - Wazuh - Legacy Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    # The union of the three legs' closures; detect-targets below decides which legs a change needs.
    # Each leg builds the whole src/ tree for its TARGET with TEST=1 (legacy_unit_tests.sh
    # build_wazuh_test_flags) and then the src/unit_tests cmocka project for it.
    paths:
        - "src/**"
        - ".github/workflows/5_testunit_linux-win.yml"
        - ".github/actions/build_test_flags/**"
        - ".github/actions/install_build_deps/**"
        - ".github/actions/legacy_unit_tests.sh"
        - ".github/actions/legacy_unit_tests_build/**"
        - ".github/actions/legacy_unit_tests_run/**"
        - ".github/actions/reinstall_cmake/**"
        # Wraps every compiler of the build (setup-sccache action.yml, PATH masquerade)
        - ".github/actions/setup-sccache/**"
        # .github/actions/upload_s3_artifact only uploads the coverage report: it tests nothing, and a
        # broken upload fails the job visibly; 5_builderpackage_manager-multiples.yml exercises it on every pull request it runs.
        # Installer scripts and their shell suites (5_testunit_credentials.yml): neither make nor the
        # cmocka project reads src/init.
        - "!src/init/**"
        # Agent build tooling (src/build.py and its src/ci/ helpers), never run here
        - "!src/build.py"
        - "!src/ci/**"
        # qa/ harnesses are pytest suites driving test tools, run by their own workflows
        - "!src/**/qa/**"
        # Prose: nothing compiles Markdown
        - "!src/**/*.md"
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch'
        required: true
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # A matrix leg cannot carry its own `paths`, so this job applies the per-leg closures to the
  # pull request's diff and emits only the legs it needs: a manager-only change (the engine,
  # remoted, wazuh-db, ...) must not build and run the agent and winagent legs, and an agent-only
  # change still runs all three because the manager build compiles against agent headers.
  detect-targets:
    name: Select legacy unit-test targets
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select targets from the changed files
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import json, os, re, subprocess

          def to_regex(glob):
              # GitHub `paths` semantics: `**` spans directories (and `**/` may match none),
              # `*` and `?` stay inside one path segment.
              out, i = "", 0
              while i < len(glob):
                  if glob.startswith("**/", i):
                      out, i = out + "(?:.*/)?", i + 3
                  elif glob.startswith("**", i):
                      out, i = out + ".*", i + 2
                  elif glob[i] == "*":
                      out, i = out + "[^/]*", i + 1
                  elif glob[i] == "?":
                      out, i = out + "[^/]", i + 1
                  else:
                      out, i = out + re.escape(glob[i]), i + 1
              return re.compile(out + r"\Z")

          def fires(path, patterns):
              # Ordered like a `paths` list: the last matching pattern decides.
              hit = False
              for pattern in patterns:
                  negated = pattern.startswith("!")
                  if to_regex(pattern.lstrip("!")).match(path):
                      hit = not negated
              return hit

          # Result-affecting plumbing: every leg.
          PLUMBING = [
              ".github/workflows/5_testunit_linux-win.yml",
              ".github/actions/build_test_flags/**",
              ".github/actions/install_build_deps/**",
              ".github/actions/legacy_unit_tests.sh",
              ".github/actions/legacy_unit_tests_build/**",
              ".github/actions/legacy_unit_tests_run/**",
              ".github/actions/reinstall_cmake/**",
              ".github/actions/setup-sccache/**",
          ]
          SRC = ["src/**", "!src/init/**", "!src/build.py", "!src/ci/**", "!src/**/qa/**"]

          # Manager-only trees: src/CMakeLists.txt:276-293 and src/wazuh_modules/CMakeLists.txt:97-102
          # add them only when TARGET is not an agent, and the cmocka project adds their suites only
          # from server.cmake:52-57 / unit_tests/wazuh_modules/CMakeLists.txt:9-14,39-41. The include/
          # directories stay in the agent closure: agent code compiles against them
          # (shared/src/agent_op.c -> os_auth/include/auth.h, shared/src/agent_validate_op.c and
          # config/src/wazuh_db-config.c -> wazuh_db/include/wdb.h, and
          # wazuh_modules/src/wm_{content_manager,inventory_sync_server,keystore_server,
          # vulnerability_scanner}.c, globbed for every target at wazuh_modules/CMakeLists.txt:110-119,
          # -> each module's include/). unit_tests/wrappers/wazuh/{os_auth,remoted,wazuh_db} stay too:
          # shared/CMakeLists.txt:145-166 compiles them into the test library for every target.
          MANAGER_ONLY = [
              "!src/engine/**",
              # Except the two headers the remoted test wrappers (compiled into the test library for
              # every target, shared/CMakeLists.txt:164-165) include: agent_metadata_wrappers.h:15
              # and netbuffer_wrappers.h:15 under unit_tests/wrappers/wazuh/remoted/.
              "!src/remoted/**", "src/remoted/include/remoted.h", "src/remoted/src/agent_metadata_db.h",
              "!src/util/**",
              "!src/shared_modules/ca_bundle/**",
              "!src/shared_modules/indexer_connector/**",
              "!src/shared_modules/keystore/**",
              "!src/shared_modules/manager_certs/**",
              "!src/shared_modules/manager_config/**",
              "!src/shared_modules/metrics/**",
              "!src/shared_modules/uds_http_server/**",
              "!src/os_auth/**", "src/os_auth/include/**",
              "!src/wazuh_db/**", "src/wazuh_db/include/**",
              "!src/shared_modules/content_manager/**", "src/shared_modules/content_manager/include/**",
              "!src/wazuh_modules/inventory_sync_server/**", "src/wazuh_modules/inventory_sync_server/include/**",
              "!src/wazuh_modules/keystore_server/**", "src/wazuh_modules/keystore_server/include/**",
              "!src/wazuh_modules/task_manager/**", "src/wazuh_modules/task_manager/include/**",
              "!src/wazuh_modules/vulnerability_scanner/**", "src/wazuh_modules/vulnerability_scanner/include/**",
              "!src/unit_tests/server.cmake",
              "!src/unit_tests/os_auth/**",
              "!src/unit_tests/remoted/**",
              "!src/unit_tests/util/**",
              "!src/unit_tests/wazuh_db/**",
              "!src/unit_tests/wazuh_modules/control/**",
              "!src/unit_tests/wazuh_modules/database/**",
              # The scheduling suite is manager-only, but its helpers are compiled into the agent's
              # aws/azure/command/docker/github/ms_graph/office365 suites (e.g.
              # unit_tests/wazuh_modules/aws/CMakeLists.txt:15-16).
              "!src/unit_tests/wazuh_modules/scheduling/**",
              "src/unit_tests/wazuh_modules/scheduling/wmodules_scheduling_helpers.*",
              "!src/unit_tests/wazuh_modules/vulnerability_detection/**",
          ]
          # Windows-only: src/CMakeLists.txt:271-273 adds win32 only for winagent, and the cmocka
          # project reaches win32/ and its toolchain only from winagent.cmake.
          WINDOWS_ONLY = [
              "!src/win32/**",
              "!src/unit_tests/win32/**",
              "!src/unit_tests/winagent.cmake",
              "!src/unit_tests/Toolchain-win32.cmake",
          ]
          MD = ["!src/**/*.md"]
          # The manager leg keeps the agent trees: the manager build compiles against their headers
          # and active-response/src (shared/CMakeLists.txt:89), the TEST=1 build compiles test
          # trees that link agent code, and the cmocka project puts client-agent/src on every
          # target's include path (unit_tests/CMakeLists.txt:18).
          LEGS = {
              "agent":    SRC + MANAGER_ONLY + WINDOWS_ONLY + MD,
              "winagent": SRC + MANAGER_ONLY + ["!src/unit_tests/agent.cmake"] + MD,
              "manager":  SRC + WINDOWS_ONLY + ["!src/unit_tests/agent.cmake"] + MD,
          }

          event_name = os.environ.get("EVENT_NAME", "")
          base_sha = os.environ.get("BASE_SHA", "").strip()
          head_sha = os.environ.get("HEAD_SHA", "").strip()

          selected = list(LEGS)
          if event_name == "pull_request" and base_sha and head_sha:
              diff = subprocess.run(["git", "diff", "--name-only", f"{base_sha}...{head_sha}"],
                                    capture_output=True, text=True)
              if diff.returncode == 0:
                  changed = [line for line in diff.stdout.splitlines() if line]
                  if not any(fires(path, PLUMBING) for path in changed):
                      selected = [leg for leg, patterns in LEGS.items()
                                  if any(fires(path, patterns) for path in changed)]
              else:
                  print("::warning::Could not diff the pull request; running every target.")

          print(f"Selected targets: {selected}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"targets={json.dumps(selected)}\n")

  Unit-Tests:
    needs: detect-targets
    permissions:
      id-token: write
      contents: read
    if: >
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.detect-targets.outputs.targets != '[]'
    strategy:
          fail-fast: false
          matrix:
              target: ${{ fromJSON(needs.detect-targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    # Halving the build parallelism to avoid OOM (see legacy_unit_tests.sh) roughly doubles the
    # engine unit-test compile phase, which alone approaches the old 90-minute cap.
    timeout-minutes: 130
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - name: "Install dependencies"
        uses: ./.github/actions/install_build_deps
        with:
          target: ${{ matrix.target }}
      - name: "Install a compatible CMake"
        uses: ./.github/actions/reinstall_cmake
      - name: "Install gcc 14.3"
        run: |
          echo "Download GCC 14.3 package"
          cd /tmp
          for i in {1..3}; do
            if wget --timeout=30 --tries=3 https://packages.wazuh.com/utils/gcc/gcc_14.3-1_amd64.deb; then
              break
            fi
            echo "Download attempt $i failed, retrying..."
            sleep 2
          done

          echo "Verify download succeeded"
          if [ ! -f gcc_14.3-1_amd64.deb ]; then
            echo "Failed to download GCC package after 3 attempts"
            exit 1
          fi

          sudo dpkg -i gcc_14.3-1_amd64.deb || {
            echo "Package installation failed, trying to fix dependencies"
            sudo apt-get update && sudo apt-get install -f -y
            sudo dpkg -i gcc_14.3-1_amd64.deb
          }

          # Create symlinks with backup of original
          sudo mv /usr/bin/gcc /usr/bin/gcc.bak 2>/dev/null || true
          sudo mv /usr/bin/g++ /usr/bin/g++.bak 2>/dev/null || true
          sudo mv /usr/bin/c++ /usr/bin/c++.bak 2>/dev/null || true
          sudo mv /usr/bin/gcov /usr/bin/gcov.bak 2>/dev/null || true
          sudo ln -sf /opt/gcc-14/bin/gcc /usr/bin/gcc
          sudo ln -sf /opt/gcc-14/bin/g++ /usr/bin/g++
          sudo ln -sf /opt/gcc-14/bin/g++ /usr/bin/c++
          sudo ln -sf /opt/gcc-14/bin/gcov /usr/bin/gcov

          # Verify compiler works
          gcc --version
          g++ --version
          gcov --version
      # Compilation cache. Placed after the gcc 14.3 install so the wrappers
      # resolve the final compilers. Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/5.0.0
      - name: "Build wazuh"
        uses: ./.github/actions/build_test_flags
        with:
          target: ${{ matrix.target }}
      - name: "Build wazuh legacy unit tests"
        uses: ./.github/actions/legacy_unit_tests_build
        with:
          target: ${{ matrix.target }}
      - name: "Run wazuh legacy unit tests"
        uses: ./.github/actions/legacy_unit_tests_run
        with:
          target: ${{ matrix.target }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}
      - name: "Compilation cache statistics"
        if: always()
        # grep filters the "Cache location" line: it carries the bucket name,
        # which secret masking does not cover once the s3:// scheme is stripped.
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true
