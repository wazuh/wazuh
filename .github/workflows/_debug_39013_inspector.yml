name: DEBUG 39013 - Inspector root cause check (throwaway, do not merge)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-22.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.IT_AWS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.IT_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install boto3
        run: pip install boto3==1.34.135

      - name: Which AWS account do the static test credentials belong to?
        run: aws sts get-caller-identity

      - name: Raw Inspector v2 API check - us-east-1
        run: aws inspector2 list-findings --region us-east-1 --max-results 5
        continue-on-error: true

      - name: Raw Inspector v2 API check - us-east-2
        run: aws inspector2 list-findings --region us-east-2 --max-results 5
        continue-on-error: true

      - name: Run patched wodle directly - us-east-1
        working-directory: wodles/aws
        run: timeout 60 python3 aws_s3.py --service inspector --regions us-east-1 --only_logs_after 20230112 --debug 2
        continue-on-error: true

      - name: Run patched wodle directly - us-east-2
        working-directory: wodles/aws
        run: timeout 60 python3 aws_s3.py --service inspector --regions us-east-2 --only_logs_after 20230112 --debug 2
        continue-on-error: true
