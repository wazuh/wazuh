name: 5.X - Python vulnerability checks
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  pick-branches:
    name: Get branches to analyze
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate dynamic matrix
        id: set-matrix
        run: |
          VERSIONED_BRANCHES_REGEX="^main$|^[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}$"

          # A branch without commits for 120 days is no longer maintained (4.7.0, 6.0.0, ...).
          CUTOFF=$(date -d '120 days ago' +%s)
          BRANCHES=$(git branch -r | awk '{print $1}' | sed 's|origin/||' | grep -E "$VERSIONED_BRANCHES_REGEX" \
            | while read -r ref; do
                if [ "$(git log -1 --format=%ct "origin/$ref")" -ge "$CUTOFF" ]; then
                  echo "$ref"
                else
                  echo "::notice::skipping $ref: no commits in 120 days" >&2
                fi
              done)
          if [ -z "$BRANCHES" ]; then
            echo "::error::no versioned branch with commits in 120 days"
            exit 1
          fi

          JSON_ARRAY=$(printf '%s\n' "$BRANCHES" | while read -r ref; do
            sha=$(git rev-parse "origin/$ref")
            jq -c -n --arg ref "$ref" --arg sha "$sha" '{ref: $ref, sha: $sha}'
          done | jq -c -s '{include: .}')

          echo "matrix=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          echo Picked branches: $JSON_ARRAY

  checking-py-vulns:
    needs: pick-branches
    name: Checking Python vulnerabilies
    runs-on: ubuntu-24.04
    strategy:
      # One branch failing to build its SBOM must not cancel the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.pick-branches.outputs.matrix) }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Download and decompress prebuilt embedded Python
        run:
          make -C src external/cpython.tar.gz && tar -xzf src/external/cpython.tar.gz -C src/external --one-top-level

      - name: Scan prebuilt embedded Python
        uses: anchore/scan-action@v6
        id: scan
        with:
          path: "src/external/cpython"
          fail-build: false

      - name: Upload scan results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          ref: refs/heads/${{ matrix.ref }}
          sha: ${{ matrix.sha }}
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: python-vulns-${{ matrix.ref }}
