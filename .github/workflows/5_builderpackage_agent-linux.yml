run-name: Build Wazuh agent Linux - ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }} - ${{ inputs.system || 'deb,rpm' }} - ${{ inputs.architecture || 'amd64' }}
name: 5.X - Build Wazuh agent Linux (DEB/RPM)

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      # ---- Sources of the agent package -------------------------------------------------------------
      # `src/**` is the base because TARGET=agent/winagent compiles most of the tree
      # (src/CMakeLists.txt:304-343). Every `!` below is a tree the agent configure never enters, or a
      # file no step of this workflow builds, installs or runs. Ordered: the last matching pattern wins,
      # so each re-include follows the negation it narrows. The http-request submodule is the gitlink
      # src/shared_modules/http-request, which `src/**` matches.
      - "src/**"
      # Server-only subtrees: add_subdirectory under `if(NOT IS_AGENT)` (src/CMakeLists.txt:346-362) and
      # the server branch of src/wazuh_modules/CMakeLists.txt:99-104. uds_http_server is registered only
      # by those server consumers (src/CMakeLists.txt:316-323).
      - "!src/engine/**"
      - "!src/remoted/**"
      - "!src/util/**"
      - "!src/shared_modules/ca_bundle/**"
      - "!src/shared_modules/indexer_connector/**"
      - "!src/shared_modules/keystore/**"
      - "!src/shared_modules/manager_certs/**"
      - "!src/shared_modules/manager_config/**"
      - "!src/shared_modules/metrics/**"
      - "!src/shared_modules/uds_http_server/**"
      # wm_task_manager.c is wholly `#ifndef CLIENT` (line 25), so the agent never sees task_manager.h.
      - "!src/wazuh_modules/task_manager/**"
      # Server-only subtrees whose public headers the agent still compiles against -- keep `include/`:
      #   os_auth/include/auth.h             <- src/shared/src/agent_op.c:17
      #   wazuh_db/include/wdb.h             <- src/shared/src/agent_validate_op.c:14, shared/include/wazuhdb_queries_op.h:14
      #   content_manager.h, inventory_sync_server.h, keystore_server.h, vulnerability_scanner.h
      #                                      <- the wm_*.c shims of the same name: the agent branch globs every
      #                                         src/wazuh_modules/src/*.c (src/wazuh_modules/CMakeLists.txt:112-116)
      - "!src/os_auth/**"
      - "src/os_auth/include/**"
      - "!src/wazuh_db/**"
      - "src/wazuh_db/include/**"
      - "!src/shared_modules/content_manager/**"
      - "src/shared_modules/content_manager/include/**"
      - "!src/wazuh_modules/inventory_sync_server/**"
      - "src/wazuh_modules/inventory_sync_server/include/**"
      - "!src/wazuh_modules/keystore_server/**"
      - "src/wazuh_modules/keystore_server/include/**"
      - "!src/wazuh_modules/vulnerability_scanner/**"
      - "src/wazuh_modules/vulnerability_scanner/include/**"
      # Test trees and developer tooling. The package build passes no TEST flag, so UNIT_TEST is off:
      # every add_subdirectory(tests) of an agent tree sits under if(UNIT_TEST), the cmocka wrappers are
      # globbed under it too (src/shared/CMakeLists.txt:111-113) and included only under
      # WAZUH_UNIT_TESTING. testtool/ and example/ are NOT excluded: several are built unconditionally
      # (e.g. src/data_provider/CMakeLists.txt:264, src/shared_modules/dbsync/CMakeLists.txt:82-86).
      # build.py and ci/ drive only the -rtr component lanes.
      - "!src/unit_tests/**"
      - "!src/**/tests/**"
      - "!src/**/qa/**"
      - "!src/shared_modules/utils/benchmark/**"
      - "!src/ci/**"
      - "!src/build.py"
      - "!src/Doxyfile"
      # ...except this one: ebpf_syscalls_test is declared outside if(UNIT_TEST)
      # (src/syscheckd/src/ebpf/CMakeLists.txt:30), so the Linux configure needs its source.
      - "src/syscheckd/src/ebpf/tests/syscalls/**"
      # The manager's credential resolver: only InstallServer installs it (src/init/inst-functions.sh:1733);
      # an agent package carries at most an inert copy that nothing here runs or checks.
      - "!src/init/credentials/**"
      # Windows-only: add_subdirectory(win32) is winagent-only (src/CMakeLists.txt:340-342) and every other
      # reference to src/win32 sits in a Windows branch (src/CMakeLists.txt:192-205,
      # src/client-agent/CMakeLists.txt:53-56, src/client-agent/src/agent_auth_cli.c:17-19).
      - "!src/win32/**"
      # install.sh reads the templates, internal options and wpk_root.pem from etc/ (src/init/inst-functions.sh
      # InstallCommon/InstallAgent, src/init/gen_wazuh.sh); the three files below are read only for a manager
      # (inst-functions.sh:901-905, 1282-1285, 1703-1707).
      - "etc/**"
      - "!etc/wazuh-manager.conf"
      - "!etc/wazuh-manager-internal-options.conf"
      - "!etc/agent.conf"
      # SCA policies and wodles the package installs (debian/rules:117, wazuh-agent.spec:105,
      # inst-functions.sh:157-158 and 1771-1826), the installer and the version it stamps (inst-functions.sh:934).
      - "ruleset/sca/**"
      - "wodles/**"
      - "!wodles/**/tests/**"
      - "install.sh"
      - "VERSION.json"
      # `make deps` resolves the indexer-template ref with it (src/Makefile:729).
      - "tools/get_git_refs.sh"
      # ---- Packaging: generate_package.sh -> build.sh -> {debs,rpms}/utils -> SPECS/wazuh-agent ------
      # Out: the other products' and platforms' packaging, the arm64 builder Dockerfiles
      # (the builder image is pulled, never built here: --dont-build-docker), the external-dependency
      # pool tooling (it reads src/Makefile, not the reverse) and the WPK tooling no lane runs.
      - "packages/**"
      - "!packages/macos/**"
      - "!packages/windows/**"
      - "!packages/wpk/**"
      - "!packages/externals/**"
      - "!packages/debs/SPECS/wazuh-manager/**"
      - "!packages/rpms/SPECS/wazuh-manager.spec"
      - "!packages/debs/*/manager/**"
      - "!packages/rpms/*/manager/**"
      - "!packages/debs/arm64/**"
      - "!packages/rpms/arm64/**"
      # ---- Integration suites selected through .github/test_modules_linux.json ------------------------
      # Out: the manager's suites (test_modules_manager.json) and test_msgraph, which has its own lane.
      - "tests/integration/**"
      - "!tests/integration/test_api/**"
      - "!tests/integration/test_authd/**"
      - "!tests/integration/test_manager_control/**"
      - "!tests/integration/test_remoted/**"
      - "!tests/integration/test_wazuh_db/**"
      - "!tests/integration/test_msgraph/**"
      - ".github/test_modules_linux.json"
      - ".github/workflows/.python-version-it"
      - ".github/actions/5_testintegration_detect-changes/**"
      # ---- CI plumbing that decides the result -------------------------------------------------------
      - ".github/workflows/5_builderpackage_agent-linux.yml"
      - ".github/workflows/5_testintegration_agent-start.yml"
      - ".github/workflows/5_testintegration_linux-integration-tests.yml"
      # Run by 5_testintegration_agent-start.yml (run-test/action.yml, smoke_startup_test.sh).
      - ".github/actions/5_testintegration_agent-start/**"
      # check_files: this lane compares against {deb,rpm}_linux_agent_amd64.csv only.
      - ".github/actions/check_files/**"
      - "!.github/actions/check_files/manager_base.csv"
      - "!.github/actions/check_files/macos_agent_*.csv"
      - "!.github/actions/check_files/windows_agent_base.csv"
      - "!.github/actions/check_files/test_check_files.py"
      # The package travels build -> S3 -> test/integration through these two.
      - ".github/actions/upload_s3_artifact/**"
      - ".github/actions/download_package/**"
      # Builder image pull (and the retry wrapper it execs; generate_package.sh:71 also copies it).
      - ".github/actions/ghcr-pull-and-push/pull_image_from_ghcr.sh"
      - ".github/scripts/run_with_retry.sh"
      # Entrypoint of the "Test install package" container.
      - ".github/actions/test-install-components/install_component.sh"
      - ".github/actions/5_builderpackage_get-last-stable-version/**"
      - ".github/actions/5_builderpackage_get-upgrade-test-package-url/**"
      - ".github/actions/5_builderpackage_linux-smoke-uninstall-test/**"
      - ".github/actions/5_builderpackage_linux-smoke-upgrade-test/**"
      # Prose is never built, installed or run by this workflow.
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      architecture:
        type: choice
        description: Package architecture [x86_64, amd64].
        required: true
        default: amd64
        options:
          - x86_64
          - amd64
      system:
        type: choice
        description: Package OS [deb, rpm].
        required: true
        default: deb
        options:
          - deb
          - rpm
      revision:
        description: |
          Package revision (name and metadata).
          Default is '0'.
        required: false
        default: '0'
      debug:
        type: boolean
        description: |
          Build the binaries as debug (without optimizations).
          Default is 'false'.
        required: false
        default: false
      checksum:
        type: boolean
        description: |
          Generate package checksum.
          Default is 'false'.
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Granted at the workflow level so the reusable smoke-test / integration-test
# calls (which run S3 uploads/downloads over OIDC) can request id-token.
permissions:
  id-token: write
  contents: read

jobs:
  # ===================== DEB JOBS =====================
  build-deb:
    permissions:
      id-token: write
      contents: read
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || inputs.system == 'deb'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Build DEB ${{ matrix.arch }} package
    strategy:
      matrix:
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON(format('["{0}"]', inputs.architecture == 'x86_64' && 'amd64' || inputs.architecture)) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set ARCH
        id: set-arch
        run: |
          arch="${{ matrix.arch }}"
          echo "ARCH=$arch" >> $GITHUB_ENV
          echo "arch=$arch" >> $GITHUB_OUTPUT

      - name: Set VERSION and CONTAINER_NAME
        run: |
          VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' VERSION.json)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$VERSION" >> $GITHUB_ENV
          echo "CONTAINER_NAME=pkg_deb_agent_builder_${ARCH}" >> $GITHUB_ENV
          echo "SYSTEM=deb" >> $GITHUB_ENV

      - name: Builder image compatibility fixes
        run: |
          # actions/checkout on newer git writes repositoryformatversion=1, which the
          # older git inside the builder Docker images cannot read. Not runner-specific.
          git config core.repositoryformatversion 0
          # Self-skipping guards: GitHub-hosted images ship both, so these no-op there.
          if ! command -v uuidgen >/dev/null 2>&1; then
            sudo apt-get install -y uuid-runtime
          fi
          if ! python3 -m pip --version >/dev/null 2>&1; then
            sudo apt-get install -y python3-pip
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CI_WAZUHCI_DOCKERHUB_USER }}
          password: ${{ secrets.CI_WAZUHCI_DOCKERHUB_TOKEN }}

      - name: Download docker image for package building
        run: |
          bash .github/actions/ghcr-pull-and-push/pull_image_from_ghcr.sh "${{ secrets.CI_WAZUH_AGENT_PACKAGES_CLASSIC }}" "${{ github.actor }}" "$CONTAINER_NAME" "$TAG"

      - name: Append short commit to VERSION file
        run: |
          SHORT_COMMIT=$(git rev-parse --short=7 HEAD)
          if [ -z "$SHORT_COMMIT" ]; then echo "No commit found"; exit 1; fi
          echo "Found commit: $SHORT_COMMIT"
          sed -i '/"stage":/s/$/,/; /"stage":/a \    "commit": "'"$SHORT_COMMIT"'"' VERSION.json || exit 1
          cat VERSION.json

      - name: Build DEB ${{ env.ARCH }} package
        id: build
        env:
          INPUT_REVISION: ${{ inputs.revision || '0' }}
        run: |
          REVISION="$INPUT_REVISION"
          FLAGS="--verbose -t agent -s /tmp --dont-build-docker -j $(nproc) "
          FLAGS+="-r $REVISION "
          if [ "${{ inputs.checksum }}" == "true" ]; then FLAGS+="--checksum "; fi
          if [ "${{ inputs.debug }}" == "true" ]; then FLAGS+="--debug "; fi
          echo "generate_package.sh -a $ARCH --tag $TAG --system $SYSTEM $FLAGS"
          bash packages/generate_package.sh -a "$ARCH" --tag "$TAG" --system "$SYSTEM" $FLAGS

          PACKAGE_NAME=$(find /tmp -maxdepth 1 -type f -name *agent*.deb -exec basename {} 2>/dev/null \;| grep -v -E "^wazuh-agent-dbg")
          PACKAGE_SYMBOLS_NAME=$(find /tmp -maxdepth 1 -type f -name *agent*.deb -exec basename {} 2>/dev/null \;| grep -E "^wazuh-agent-dbg")

          echo "package-name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "package-symbols-name=$PACKAGE_SYMBOLS_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "container-name=$CONTAINER_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload package as artifact
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: ${{ steps.build.outputs.package-name }}
          path: /tmp/${{ steps.build.outputs.package-name }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Upload debug symbols as artifact
        if: steps.build.outputs.package-symbols-name != ''
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: ${{ steps.build.outputs.package-symbols-name }}
          path: /tmp/${{ steps.build.outputs.package-symbols-name }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Upload checksums as artifacts
        if: inputs.checksum == true
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: ${{ steps.build.outputs.package-name }}-checksums
          path: |
            /tmp/${{ steps.build.outputs.package-name }}.sha512
            /tmp/${{ steps.build.outputs.package-symbols-name }}.sha512
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

  test-deb:
    permissions:
      id-token: write
      contents: read
    needs: build-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Test DEB ${{ matrix.arch }} package
    strategy:
      matrix:
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON(format('["{0}"]', inputs.architecture == 'x86_64' && 'amd64' || inputs.architecture)) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get build outputs
        id: build-info
        run: |
          # Los outputs de jobs con matriz no están disponibles directamente
          # Usamos los nombres de artefactos construidos dinámicamente
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "SYSTEM=deb" >> $GITHUB_ENV

      - name: Download package artifacts
        uses: ./.github/actions/download_package
        with:
          build_run_id: ${{ github.run_id }}
          producer_workflow: 5_builderpackage_agent-linux
          name_regexp: 'wazuh-agent.*${{ matrix.arch }}.*\.deb'
          path: /tmp
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Set PACKAGE_NAME from downloaded files
        run: |
          PACKAGE_NAME=$(find /tmp -maxdepth 1 -type f -name "wazuh-agent*${{ matrix.arch }}*.deb" -exec basename {} \; | grep -v -E "^wazuh-agent-dbg" | head -n 1)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "No package found for ${{ matrix.arch }}!"
            exit 1
          fi
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          VERSION=$(echo $PACKAGE_NAME | grep -oP '\d+\.\d+\.\d+' | head -n 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CONTAINER_NAME=pkg_deb_agent_builder_${{ matrix.arch }}" >> $GITHUB_ENV
          echo "TAG=$VERSION" >> $GITHUB_ENV

      - name: Builder image compatibility fixes
        run: |
          # actions/checkout on newer git writes repositoryformatversion=1, which the
          # older git inside the builder Docker images cannot read. Not runner-specific.
          git config core.repositoryformatversion 0
          # Self-skipping guards: GitHub-hosted images ship both, so these no-op there.
          if ! command -v uuidgen >/dev/null 2>&1; then
            sudo apt-get install -y uuid-runtime
          fi
          if ! python3 -m pip --version >/dev/null 2>&1; then
            sudo apt-get install -y python3-pip
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CI_WAZUHCI_DOCKERHUB_USER }}
          password: ${{ secrets.CI_WAZUHCI_DOCKERHUB_TOKEN }}

      - name: Download docker image for testing
        run: |
          bash .github/actions/ghcr-pull-and-push/pull_image_from_ghcr.sh "${{ secrets.CI_WAZUH_AGENT_PACKAGES_CLASSIC }}" "${{ github.actor }}" "$CONTAINER_NAME" "$TAG"

      - name: Test install package
        run: |
          TESTS_PATH=$GITHUB_WORKSPACE/.github/actions/test-install-components/
          if [ -z "$PACKAGE_NAME" ]; then
            echo "No package found!"
            exit 1
          fi
          sudo docker run \
            -v $TESTS_PATH/:/tests \
            -v /tmp/:/packages \
            -v /var/ossec:/var/ossec \
            -e ARCH="$ARCH" \
            -e SYSTEM="$SYSTEM" \
            --entrypoint '/tests/install_component.sh' \
            "$CONTAINER_NAME:$TAG" \
            "$PACKAGE_NAME" agent
          if grep -iq " installed.*wazuh-agent" /tmp/status.log ; then
            echo "Installation successfully."
          else
            echo "The installation could not be completed."
            exit 1
          fi
          echo "WAZUH_UID=$(cat $TESTS_PATH/wazuh_uid)" | tee -a $GITHUB_ENV
          echo "WAZUH_GID=$(cat $TESTS_PATH/wazuh_gid)" | tee -a $GITHUB_ENV

      - name: CSV filename Formation
        run: |
          echo "CSV_FILENAME=${SYSTEM}_linux_agent_${{ matrix.arch }}.csv" | tee -a $GITHUB_ENV

      - name: Check installed files
        uses: ./.github/actions/check_files
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          expected_files: ${{ env.CSV_FILENAME }}
          installation_directory: /var/ossec
          wazuh_uid: ${{ env.WAZUH_UID }}
          wazuh_gid: ${{ env.WAZUH_GID }}

      - name: Test uninstall package
        uses: ./.github/actions/5_builderpackage_linux-smoke-uninstall-test
        with:
          tested_docker: "${{ env.CONTAINER_NAME }}:${{ env.TAG }}"

      - name: Get last stable version
        id: last-stable-version
        uses: ./.github/actions/5_builderpackage_get-last-stable-version
        with:
          repo_owner: wazuh
          repo_name: wazuh
          testing_version: ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package url of the last stable version
        id: upgrade-package-url
        uses: ./.github/actions/5_builderpackage_get-upgrade-test-package-url
        with:
          component: agent
          os: linux
          system: ${{ env.SYSTEM }}
          version: ${{ steps.last-stable-version.outputs.latest_stable_version }}
          architecture: ${{ env.ARCH }}

      - name: Prepare package for upgrade test
        run: |
          mkdir -p /tmp/upgrade_test
          cp "/tmp/$PACKAGE_NAME" /tmp/upgrade_test/

      - name: Test upgrade from ${{ steps.last-stable-version.outputs.latest_stable_version }} to ${{ env.VERSION }}
        uses: ./.github/actions/5_builderpackage_linux-smoke-upgrade-test
        with:
          old_package_url: ${{ steps.upgrade-package-url.outputs.testing_package_url }}
          expected_upgrade_version: ${{ env.VERSION }}
          tested_docker: "${{ env.CONTAINER_NAME }}:${{ env.TAG }}"
          package_path: /tmp/upgrade_test

  upload-deb-to-s3:
    permissions:
      id-token: write
      contents: read
    needs: [build-deb, test-deb]
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Upload DEB ${{ matrix.arch }} to S3
    strategy:
      matrix:
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON(format('["{0}"]', inputs.architecture == 'x86_64' && 'amd64' || inputs.architecture)) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts for this architecture
        uses: ./.github/actions/download_package
        with:
          build_run_id: ${{ github.run_id }}
          producer_workflow: 5_builderpackage_agent-linux
          name_regexp: '.*${{ matrix.arch }}.*'
          path: /tmp
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_INTERNAL_DEVELOPMENT_BUCKET_USER_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.CI_INTERNAL_DEVELOPMENT_BUCKET_USER_SECRET_KEY }}
          aws-region: ${{ secrets.CI_AWS_REGION }}

      - name: Find and upload packages to S3
        run: |
          S3_URI="s3://xdrsiem-packages-dev-internal/development/wazuh/5.x/main/packages"

          # Find and upload main package
          PACKAGE_NAME=$(find /tmp -maxdepth 1 -type f -name "wazuh-agent*${{ matrix.arch }}*.deb" -exec basename {} \; | grep -v -E "^wazuh-agent-dbg" | head -n 1)
          if [ -n "$PACKAGE_NAME" ] && [ -s "/tmp/$PACKAGE_NAME" ]; then
            aws s3 cp /tmp/$PACKAGE_NAME $S3_URI/
            echo "S3 URI: $S3_URI/$PACKAGE_NAME"

            # Upload checksum if exists
            if [ -s "/tmp/$PACKAGE_NAME.sha512" ]; then
              aws s3 cp /tmp/$PACKAGE_NAME.sha512 $S3_URI/
            fi
          else
            echo "Package file not found or empty."
            exit 1
          fi

          # Find and upload debug symbols
          SYMBOLS_NAME=$(find /tmp -maxdepth 1 -type f -name "wazuh-agent-dbg*${{ matrix.arch }}*.deb" -exec basename {} \; | head -n 1)
          if [ -n "$SYMBOLS_NAME" ] && [ -s "/tmp/$SYMBOLS_NAME" ]; then
            aws s3 cp /tmp/$SYMBOLS_NAME $S3_URI/
            echo "Uploaded debug symbols: $SYMBOLS_NAME"

            # Upload debug symbols checksum if exists
            if [ -s "/tmp/$SYMBOLS_NAME.sha512" ]; then
              aws s3 cp /tmp/$SYMBOLS_NAME.sha512 $S3_URI/
            fi
          fi
          S3_URI="s3://xdrsiem-packages-dev-internal/development/wazuh/5.x/main/packages"
          if [ -s "/tmp/$SYMBOLS_NAME.sha512" ]; then
            aws s3 cp /tmp/$SYMBOLS_NAME.sha512 $S3_URI/
          else
            echo "Warning: Debug symbols checksum file not found, skipping"
          fi

  # ===================== RPM JOBS =====================
  build-rpm:
    permissions:
      id-token: write
      contents: read
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || inputs.system == 'rpm'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Build RPM ${{ matrix.arch }} package
    strategy:
      matrix:
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON(format('["{0}"]', inputs.architecture == 'x86_64' && 'amd64' || inputs.architecture)) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set ARCH
        id: set-arch
        run: |
          arch="${{ matrix.arch }}"
          # Map to RPM architecture naming (only amd64→x86_64)
          rpm_arch="$arch"
          if [ "$arch" = "amd64" ]; then
            rpm_arch="x86_64"
          fi
          echo "ARCH=$arch" >> $GITHUB_ENV
          echo "RPM_ARCH=$rpm_arch" >> $GITHUB_ENV
          echo "arch=$arch" >> $GITHUB_OUTPUT
          echo "rpm_arch=$rpm_arch" >> $GITHUB_OUTPUT

      - name: Set VERSION and CONTAINER_NAME
        run: |
          VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' VERSION.json)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$VERSION" >> $GITHUB_ENV
          echo "CONTAINER_NAME=pkg_rpm_agent_builder_${ARCH}" >> $GITHUB_ENV
          echo "SYSTEM=rpm" >> $GITHUB_ENV

      - name: Builder image compatibility fixes
        run: |
          # actions/checkout on newer git writes repositoryformatversion=1, which the
          # older git inside the builder Docker images cannot read. Not runner-specific.
          git config core.repositoryformatversion 0
          # Self-skipping guards: GitHub-hosted images ship both, so these no-op there.
          if ! command -v uuidgen >/dev/null 2>&1; then
            sudo apt-get install -y uuid-runtime
          fi
          if ! python3 -m pip --version >/dev/null 2>&1; then
            sudo apt-get install -y python3-pip
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CI_WAZUHCI_DOCKERHUB_USER }}
          password: ${{ secrets.CI_WAZUHCI_DOCKERHUB_TOKEN }}

      - name: Download docker image for package building
        run: |
          bash .github/actions/ghcr-pull-and-push/pull_image_from_ghcr.sh "${{ secrets.CI_WAZUH_AGENT_PACKAGES_CLASSIC }}" "${{ github.actor }}" "$CONTAINER_NAME" "$TAG"

      - name: Append short commit to VERSION file
        run: |
          SHORT_COMMIT=$(git rev-parse --short=7 HEAD)
          if [ -z "$SHORT_COMMIT" ]; then echo "No commit found"; exit 1; fi
          echo "Found commit: $SHORT_COMMIT"
          sed -i '/"stage":/s/$/,/; /"stage":/a \    "commit": "'"$SHORT_COMMIT"'"' VERSION.json || exit 1
          cat VERSION.json

      - name: Build RPM ${{ env.ARCH }} package
        id: build
        env:
          INPUT_REVISION: ${{ inputs.revision || '0' }}
        run: |
          REVISION="$INPUT_REVISION"
          FLAGS="--verbose -t agent -s /tmp --dont-build-docker -j $(nproc) "
          FLAGS+="-r $REVISION "
          if [ "${{ inputs.checksum }}" == "true" ]; then FLAGS+="--checksum "; fi
          if [ "${{ inputs.debug }}" == "true" ]; then FLAGS+="--debug "; fi
          echo "generate_package.sh -a $ARCH --tag $TAG --system $SYSTEM $FLAGS"
          bash packages/generate_package.sh -a "$ARCH" --tag "$TAG" --system "$SYSTEM" $FLAGS

          PACKAGE_NAME=$(find /tmp -maxdepth 1 -type f -name *agent*.rpm -exec basename {} 2>/dev/null \;| grep -v -E "^wazuh-agent-debuginfo")
          PACKAGE_SYMBOLS_NAME=$(find /tmp -maxdepth 1 -type f -name *agent*.rpm -exec basename {} 2>/dev/null \;| grep -E "^wazuh-agent-debuginfo")

          echo "package-name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "package-symbols-name=$PACKAGE_SYMBOLS_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "container-name=$CONTAINER_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload package as artifact
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: ${{ steps.build.outputs.package-name }}
          path: /tmp/${{ steps.build.outputs.package-name }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Upload debug symbols as artifact
        if: steps.build.outputs.package-symbols-name != ''
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: ${{ steps.build.outputs.package-symbols-name }}
          path: /tmp/${{ steps.build.outputs.package-symbols-name }}
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Upload checksums as artifacts
        if: inputs.checksum == true
        uses: ./.github/actions/upload_s3_artifact
        with:
          name: ${{ steps.build.outputs.package-name }}-checksums
          path: |
            /tmp/${{ steps.build.outputs.package-name }}.sha512
            /tmp/${{ steps.build.outputs.package-symbols-name }}.sha512
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

  test-rpm:
    permissions:
      id-token: write
      contents: read
    needs: build-rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Test RPM ${{ matrix.arch }} package
    strategy:
      matrix:
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON(format('["{0}"]', inputs.architecture == 'x86_64' && 'amd64' || inputs.architecture)) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get build outputs
        id: build-info
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "SYSTEM=rpm" >> $GITHUB_ENV

      - name: Map architecture for RPM
        id: map-arch
        run: |
          RPM_ARCH="${{ matrix.arch }}"
          if [ "$RPM_ARCH" = "amd64" ]; then
            RPM_ARCH="x86_64"
          fi
          echo "rpm_arch=$RPM_ARCH" >> $GITHUB_OUTPUT

      - name: Download package artifacts
        uses: ./.github/actions/download_package
        with:
          build_run_id: ${{ github.run_id }}
          producer_workflow: 5_builderpackage_agent-linux
          name_regexp: '.*${{ steps.map-arch.outputs.rpm_arch }}.*\.rpm'
          path: /tmp
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Set PACKAGE_NAME from downloaded files
        run: |
          RPM_ARCH="${{ steps.map-arch.outputs.rpm_arch }}"
          PACKAGE_NAME=$(find /tmp -maxdepth 1 -type f -name "wazuh-agent*${RPM_ARCH}*.rpm" -exec basename {} \; | grep -v -E "^wazuh-agent-debuginfo" | head -n 1)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "No package found for ${{ matrix.arch }} (searched for ${RPM_ARCH})!"
            exit 1
          fi
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          VERSION=$(echo $PACKAGE_NAME | grep -oP '\d+\.\d+\.\d+' | head -n 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CONTAINER_NAME=pkg_rpm_agent_builder_${{ matrix.arch }}" >> $GITHUB_ENV
          echo "TAG=$VERSION" >> $GITHUB_ENV

      - name: Builder image compatibility fixes
        run: |
          # actions/checkout on newer git writes repositoryformatversion=1, which the
          # older git inside the builder Docker images cannot read. Not runner-specific.
          git config core.repositoryformatversion 0
          # Self-skipping guards: GitHub-hosted images ship both, so these no-op there.
          if ! command -v uuidgen >/dev/null 2>&1; then
            sudo apt-get install -y uuid-runtime
          fi
          if ! python3 -m pip --version >/dev/null 2>&1; then
            sudo apt-get install -y python3-pip
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CI_WAZUHCI_DOCKERHUB_USER }}
          password: ${{ secrets.CI_WAZUHCI_DOCKERHUB_TOKEN }}

      - name: Download docker image for testing
        run: |
          bash .github/actions/ghcr-pull-and-push/pull_image_from_ghcr.sh "${{ secrets.CI_WAZUH_AGENT_PACKAGES_CLASSIC }}" "${{ github.actor }}" "$CONTAINER_NAME" "$TAG"

      - name: Test install package
        run: |
          TESTS_PATH=$GITHUB_WORKSPACE/.github/actions/test-install-components/
          if [ -z "$PACKAGE_NAME" ]; then
            echo "No package found!"
            exit 1
          fi
          sudo docker run \
            -v $TESTS_PATH/:/tests \
            -v /tmp/:/packages \
            -v /var/ossec:/var/ossec \
            -e ARCH="$ARCH" \
            -e SYSTEM="$SYSTEM" \
            --entrypoint '/tests/install_component.sh' \
            "$CONTAINER_NAME:$TAG" \
            "$PACKAGE_NAME" agent
          if grep -iq " installed.*wazuh-agent" /tmp/status.log ; then
            echo "Installation successfully."
          else
            echo "The installation could not be completed."
            exit 1
          fi
          echo "WAZUH_UID=$(cat $TESTS_PATH/wazuh_uid)" | tee -a $GITHUB_ENV
          echo "WAZUH_GID=$(cat $TESTS_PATH/wazuh_gid)" | tee -a $GITHUB_ENV

      - name: CSV filename Formation
        run: |
          echo "CSV_FILENAME=${SYSTEM}_linux_agent_${{ matrix.arch }}.csv" | tee -a $GITHUB_ENV

      - name: Check installed files
        uses: ./.github/actions/check_files
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          expected_files: ${{ env.CSV_FILENAME }}
          installation_directory: /var/ossec
          wazuh_uid: ${{ env.WAZUH_UID }}
          wazuh_gid: ${{ env.WAZUH_GID }}

      - name: Test uninstall package
        uses: ./.github/actions/5_builderpackage_linux-smoke-uninstall-test
        with:
          tested_docker: "${{ env.CONTAINER_NAME }}:${{ env.TAG }}"

      - name: Get last stable version
        id: last-stable-version
        uses: ./.github/actions/5_builderpackage_get-last-stable-version
        with:
          repo_owner: wazuh
          repo_name: wazuh
          testing_version: ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package url of the last stable version
        id: upgrade-package-url
        uses: ./.github/actions/5_builderpackage_get-upgrade-test-package-url
        with:
          component: agent
          os: linux
          system: ${{ env.SYSTEM }}
          version: ${{ steps.last-stable-version.outputs.latest_stable_version }}
          architecture: ${{ env.ARCH }}

      - name: Prepare package for upgrade test
        run: |
          mkdir -p /tmp/upgrade_test
          cp "/tmp/$PACKAGE_NAME" /tmp/upgrade_test/

      - name: Test upgrade from ${{ steps.last-stable-version.outputs.latest_stable_version }} to ${{ env.VERSION }}
        uses: ./.github/actions/5_builderpackage_linux-smoke-upgrade-test
        with:
          old_package_url: ${{ steps.upgrade-package-url.outputs.testing_package_url }}
          expected_upgrade_version: ${{ env.VERSION }}
          tested_docker: "${{ env.CONTAINER_NAME }}:${{ env.TAG }}"
          package_path: /tmp/upgrade_test

  upload-rpm-to-s3:
    permissions:
      id-token: write
      contents: read
    needs: [build-rpm, test-rpm]
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Upload RPM ${{ matrix.arch }} to S3
    strategy:
      matrix:
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON(format('["{0}"]', inputs.architecture == 'x86_64' && 'amd64' || inputs.architecture)) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Map architecture for artifact download
        id: map-arch
        run: |
          RPM_ARCH="${{ matrix.arch }}"
          if [ "$RPM_ARCH" = "amd64" ]; then
            RPM_ARCH="x86_64"
          fi
          echo "rpm_arch=$RPM_ARCH" >> $GITHUB_OUTPUT

      - name: Download all artifacts for this architecture
        uses: ./.github/actions/download_package
        with:
          build_run_id: ${{ github.run_id }}
          producer_workflow: 5_builderpackage_agent-linux
          name_regexp: '.*${{ steps.map-arch.outputs.rpm_arch }}.*'
          path: /tmp
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws_region: ${{ secrets.CI_AWS_REGION }}

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_INTERNAL_DEVELOPMENT_BUCKET_USER_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.CI_INTERNAL_DEVELOPMENT_BUCKET_USER_SECRET_KEY }}
          aws-region: ${{ secrets.CI_AWS_REGION }}

      - name: Find and upload packages to S3
        run: |
          S3_URI="s3://xdrsiem-packages-dev-internal/development/wazuh/5.x/main/packages"
          RPM_ARCH="${{ steps.map-arch.outputs.rpm_arch }}"

          # Find and upload main package
          PACKAGE_NAME=$(find /tmp -maxdepth 1 -type f -name "wazuh-agent*${RPM_ARCH}*.rpm" -exec basename {} \; | grep -v -E "^wazuh-agent-debuginfo" | head -n 1)
          if [ -n "$PACKAGE_NAME" ] && [ -s "/tmp/$PACKAGE_NAME" ]; then
            aws s3 cp /tmp/$PACKAGE_NAME $S3_URI/
            echo "S3 URI: $S3_URI/$PACKAGE_NAME"

            # Upload checksum if exists
            if [ -s "/tmp/$PACKAGE_NAME.sha512" ]; then
              aws s3 cp /tmp/$PACKAGE_NAME.sha512 $S3_URI/
            fi
          else
            echo "Package file not found or empty."
            exit 1
          fi

          # Find and upload debug symbols
          SYMBOLS_NAME=$(find /tmp -maxdepth 1 -type f -name "wazuh-agent-debuginfo*${RPM_ARCH}*.rpm" -exec basename {} \; | head -n 1)
          if [ -n "$SYMBOLS_NAME" ] && [ -s "/tmp/$SYMBOLS_NAME" ]; then
            aws s3 cp /tmp/$SYMBOLS_NAME $S3_URI/
            echo "Uploaded debug symbols: $SYMBOLS_NAME"

            # Upload debug symbols checksum if exists
            if [ -s "/tmp/$SYMBOLS_NAME.sha512" ]; then
              aws s3 cp /tmp/$SYMBOLS_NAME.sha512 $S3_URI/
            fi
          fi

  smoke-test-linux:
    needs: [upload-deb-to-s3, upload-rpm-to-s3]
    if: success()
    uses: ./.github/workflows/5_testintegration_agent-start.yml
    with:
      base_branch: ''
      platform: 'linux'
    secrets: inherit

  detect-changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Detect changed Linux test modules
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any_matched: ${{ steps.detect.outputs.any_matched }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: detect
        uses: ./.github/actions/5_testintegration_detect-changes
        with:
          modules-config: .github/test_modules_linux.json
          none-matrix: '{"include":[{"name":"none","shard_name":"none","pytest_target":"","pytest_extra_args":"","pytest_tier_args":"","pre_install":"","setup_aws_credentials":false,"timeout_minutes":1}]}'
          field-defaults: '{"pytest_extra_args":"","pre_install":"","setup_aws_credentials":false,"timeout_minutes":150}'

  run-integration-tests:
    needs: [upload-deb-to-s3, detect-changes]
    if: >
      needs.upload-deb-to-s3.result == 'success' &&
      needs.detect-changes.result == 'success'
    # Required so that the reusable workflow can obtain an OIDC token for AWS authentication.
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    name: ${{ matrix.name == 'none' && 'Skipped IT Linux - no relevant changes' || format('IT Linux - {0} ({1})', matrix.name, matrix.shard_name) }}
    uses: ./.github/workflows/5_testintegration_linux-integration-tests.yml
    with:
      base_branch: ${{ github.event.pull_request.base.ref }}
      build_run_id: ${{ github.run_id }}
      module_name: ${{ matrix.name }}
      shard_name: ${{ matrix.shard_name }}
      pytest_target: ${{ matrix.pytest_target }}
      pytest_extra_args: ${{ matrix.pytest_extra_args }}
      pytest_tier_args: ${{ matrix.pytest_tier_args }}
      pre_install: ${{ matrix.pre_install }}
      setup_aws_credentials: ${{ matrix.setup_aws_credentials || false }}
      timeout_minutes: ${{ matrix.timeout_minutes }}
    secrets: inherit
