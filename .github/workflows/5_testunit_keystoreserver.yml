name: 5.X - Keystore Server - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_keystoreserver.yml"
      - "src/wazuh_modules/keystore_server/**"
      - "src/shared_modules/keystore/**"
      - "src/shared_modules/utils/**"
      - "src/shared_modules/common/**"
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/coverage_cpp/**"
      - ".github/actions/test_cpp/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  keystoreserver-modules:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@master
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Also configures shared_modules/keystore standalone, which keystore_server links.
      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Keystore server - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "keystore_server_utest"
          test: "true"
          asan: "false"

      # Valgrind is off, as for the other socket-server suites: `valgrind ctest` without
      # --trace-children=yes never instruments the test binary, so it would gate nothing. The
      # sanitizer job below is the memory gate.
      - name: Keystore server - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "false"
          target: "keystore_server_utest"

      # Threshold 0 on purpose: this suite had no CI lane before this workflow, so there is no
      # measured number to pin a floor to. The job reports coverage from its first run; replace the
      # 0 with that number (or the 90 default, if it is reached) once it has a history.
      - name: Keystore server - Coverage
        uses: ./.github/actions/coverage_cpp
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          path: src/wazuh_modules/keystore_server
          test_directory: src/wazuh_modules/keystore_server
          id: keystore_server
          threshold: "0"
          validate_function_coverage: "false"

  keystoreserver-asan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Keystore server - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "keystore_server_utest"
          test: "true"
          asan: "true"

      - name: Keystore server - Run tests
        uses: ./.github/actions/test_cpp
        with:
          target: "keystore_server_utest"
          valgrind: "false"
