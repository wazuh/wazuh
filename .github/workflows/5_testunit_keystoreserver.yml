name: 5.X - Keystore Server - Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testunit_keystoreserver.yml"
      - "src/wazuh_modules/keystore_server/**"
      # Configure path of the module (src/wazuh_modules/CMakeLists.txt:100).
      - "src/wazuh_modules/CMakeLists.txt"
      # Linked: keystore (keystore_server/CMakeLists.txt:24; in-tree
      # target of src/build) -- not its qa/ suite.
      - "src/shared_modules/keystore/**"
      - "!src/shared_modules/keystore/qa/**"
      # ...nor its component tests, compiled only into keystore_ctests (keystore/tests/component/
      # CMakeLists.txt), which this workflow does not build; their CMakeLists.txt stay on the
      # configure path (keystore/CMakeLists.txt, if(UNIT_TEST)).
      - "!src/shared_modules/keystore/tests/**"
      - "src/shared_modules/keystore/tests/**/CMakeLists.txt"
      # Headers from shared_modules/utils and common (keystore_server/CMakeLists.txt:17-18).
      # utils/flatbuffers is built by build_external_deps, step "Build flatbuffer schemas". utils' own tests and
      # benchmark are another component's tree; only their CMakeLists.txt are on the configure path.
      - "src/shared_modules/utils/**"
      - "!src/shared_modules/utils/tests/**"
      - "!src/shared_modules/utils/benchmark/**"
      - "src/shared_modules/utils/tests/CMakeLists.txt"
      - "src/shared_modules/utils/benchmark/CMakeLists.txt"
      # utils/jwt (the agent token profile headers) is included by nothing this workflow builds;
      # its consumers are remoted_module, inventory_sync_server and vulnerability_scanner.
      - "!src/shared_modules/utils/jwt/**"
      - "src/shared_modules/common/**"
      # Licence texts, not build inputs.
      - "!src/shared_modules/*/COPYING"
      # Configure path: build_target_cpp configures all of src/ as one tree
      # (build_target_cpp/action.yml:57) -- src/CMakeLists.txt (src/cmake/*.cmake,
      # VERSION.json) and src/external/CMakeLists.txt (ext_* targets,
      # wazuhext).
      - "src/CMakeLists.txt"
      - "src/cmake/**"
      - "src/external/CMakeLists.txt"
      - "VERSION.json"
      # build_external_deps runs make deps/build-external (src/Makefile `deps`, ref list from
      # tools/get_git_refs.sh, GIT_REFS_LIST) and builds the http-request submodule
      # (step "Build http-request"). A submodule bump changes only the gitlink path.
      - "src/Makefile"
      - "src/deps.lock.mk"
      - "tools/get_git_refs.sh"
      - "src/shared_modules/http-request"
      # Result-affecting actions. upload_s3_artifact is left out on purpose: coverage_cpp calls it
      # with continue-on-error (coverage_cpp/action.yml, "Uploading coverage report"), so it only reports, and the agent
      # package lanes exercise it on PRs.
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/coverage_cpp/**"
      - ".github/actions/test_cpp/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  keystoreserver-modules:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Also configures shared_modules/keystore standalone, which keystore_server links.
      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Keystore server - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "keystore_server_utest"
          test: "true"
          asan: "false"

      # Valgrind is off, as for the other socket-server suites: none of them ever had a working
      # valgrind run (test_cpp used to wrap only the ctest driver; its branch now traces the test
      # binaries, but turning it on needs a trial run). The sanitizer job below is the memory gate.
      - name: Keystore server - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "false"
          target: "keystore_server_utest"
          allowed_skips: "0"

      # Threshold 0 on purpose: this suite had no CI lane before this workflow, so there is no
      # measured number to pin a floor to. The job reports coverage from its first run; replace the
      # 0 with that number (or the 90 default, if it is reached) once it has a history.
      - name: Keystore server - Coverage
        uses: ./.github/actions/coverage_cpp
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          aws_role: ${{ secrets.CI_OIDC_ROLE_ARN }}
          path: src/wazuh_modules/keystore_server
          test_directory: src/wazuh_modules/keystore_server
          id: keystore_server
          threshold: "0"
          validate_function_coverage: "false"

  keystoreserver-asan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Project dependencies
        uses: ./.github/actions/build_external_deps

      - name: Keystore server - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          target: "keystore_server_utest"
          test: "true"
          asan: "true"

      - name: Keystore server - Run tests
        uses: ./.github/actions/test_cpp
        with:
          target: "keystore_server_utest"
          allowed_skips: "0"
          valgrind: "false"
