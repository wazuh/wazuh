name: 5.X - Keystore - Component tests

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testcomponent_keystore.yml"
      - "src/shared_modules/keystore/**"
      - "src/shared_modules/utils/**"
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/reinstall_cmake/**"
      - ".github/actions/test_cpp/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  keystore-tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # `small` instance (2 vCPU, 3.0 GiB usable): build_target_cpp runs `cmake --build`
    # without --parallel and build_external_deps caps its make at -j2, so this job never
    # uses more than two cores. Measured 10/10 passes per matrix leg, peak 1.4 GiB.
    #
    # The `-small` suffix form is deliberate: a separate `instance-size:small` label would
    # give this job a different label count than its siblings, and per the AWS docs a job
    # with fewer labels can be picked up by a runner created for a job with more, leaving
    # that job without a runner. Keep the size inside the single label.
    # https://docs.aws.amazon.com/codebuild/latest/userguide/sample-github-action-runners-update-labels.html
    runs-on: ${{ format('codebuild-github-actions-codebuild-runner-server-amd-{0}-{1}-small', github.run_id, github.run_attempt) }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - test_type: valgrind
            asan_enabled: "false"
            valgrind_enabled: "true"
          - test_type: asan
            asan_enabled: "true"
            valgrind_enabled: "false"
    name: Run tests (${{ matrix.test_type }})

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compatible CMake
        uses: ./.github/actions/reinstall_cmake

      - name: Build external dependencies
        uses: ./.github/actions/build_external_deps

      - name: Keystore - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          test: "true"
          asan: "${{ matrix.asan_enabled }}"
          target: "keystore_ctests"

      - name: Keystore - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "${{ matrix.valgrind_enabled }}"
          target: "keystore_ctests"
          preload: "true"
