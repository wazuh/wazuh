name: 5.X - Keystore - Component tests

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/5_testcomponent_keystore.yml"
      # keystore_ctests links the keystore library (tests/component/CMakeLists.txt:7,19; library
      # from src/keyStore.cpp and include/, CMakeLists.txt:15,37). build_external_deps also builds
      # the module standalone with everything in it -- wazuh-manager-keystore (src/main.cpp) and the
      # testtool (build_external_deps/action.yml:45-53). Not the qa/ suite, which has its own lane
      # (5_testintegration_keystore.yml).
      - "src/shared_modules/keystore/**"
      - "!src/shared_modules/keystore/qa/**"
      # Headers from shared_modules/utils (CMakeLists.txt:30; rocksDBWrapper.hpp, loggerHelper.h)
      # and common/commonDefs.h (CMakeLists.txt:31, utils/loggerHelper.h:15). utils/flatbuffers is
      # built by build_external_deps/action.yml:55-63. utils' own tests and benchmark are another
      # component's tree; only their CMakeLists.txt are on the configure path (utils/CMakeLists.txt).
      - "src/shared_modules/utils/**"
      - "!src/shared_modules/utils/tests/**"
      - "!src/shared_modules/utils/benchmark/**"
      - "src/shared_modules/utils/tests/CMakeLists.txt"
      - "src/shared_modules/utils/benchmark/CMakeLists.txt"
      - "src/shared_modules/common/**"
      # Configure path: build_target_cpp configures all of src/ as one tree
      # (build_target_cpp/action.yml:57) -- src/CMakeLists.txt (src/cmake/*.cmake at :86-87,
      # VERSION.json at :128, this module at :287) and src/external/CMakeLists.txt (ext_* targets,
      # wazuhext at :1474).
      - "src/CMakeLists.txt"
      - "src/cmake/**"
      - "src/external/CMakeLists.txt"
      - "VERSION.json"
      # build_external_deps runs make deps/build-external (src/Makefile:610, ref list from
      # tools/get_git_refs.sh at src/Makefile:708) and builds the http-request submodule
      # (action.yml:35-43). A submodule bump changes only the gitlink path.
      - "src/Makefile"
      - "tools/get_git_refs.sh"
      - "src/shared_modules/http-request"
      # Result-affecting actions and scripts this workflow executes (setup-sccache wraps the
      # compilers; reinstall_cmake runs tools/devContainer/reinstall-cmake.sh).
      - ".github/actions/build_external_deps/**"
      - ".github/actions/build_target_cpp/**"
      - ".github/actions/reinstall_cmake/**"
      - "tools/devContainer/reinstall-cmake.sh"
      - ".github/actions/setup-sccache/**"
      - ".github/actions/test_cpp/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  keystore-tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # This leg keeps its name (check names) but no longer wraps ctest in valgrind: test_cpp's
          # valgrind branch never instrumented the test binary (no --trace-children=yes,
          # test_cpp/action.yml), so it is the plain, non-sanitized build of the suite. The asan
          # leg is the memory gate.
          - test_type: valgrind
            asan_enabled: "false"
            valgrind_enabled: "false"
          - test_type: asan
            asan_enabled: "true"
            valgrind_enabled: "false"
    name: Run tests (${{ matrix.test_type }})

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compatible CMake
        uses: ./.github/actions/reinstall_cmake
      # Compilation cache (issue 38139). Skipped on fork PRs (no credentials).
      - name: "Configure AWS credentials for the compilation cache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-duration-seconds: 7200
      - name: "Set up sccache"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-sccache
        with:
          bucket: ${{ secrets.CI_INTERNAL_S3_BUCKET }}
          region: ${{ secrets.CI_AWS_REGION }}
          key-prefix: sccache/5.0.0
      - name: Build external dependencies
        uses: ./.github/actions/build_external_deps

      - name: Keystore - Build tests
        uses: ./.github/actions/build_target_cpp
        with:
          test: "true"
          asan: "${{ matrix.asan_enabled }}"
          target: "keystore_ctests"

      - name: Keystore - Run tests
        uses: ./.github/actions/test_cpp
        with:
          valgrind: "${{ matrix.valgrind_enabled }}"
          target: "keystore_ctests"
          # Preload libasan only into the ASAN build; the plain leg ran under the valgrind branch,
          # which ignores preload, and must stay uninstrumented.
          preload: "${{ matrix.asan_enabled }}"
      - name: "Compilation cache statistics"
        if: always()
        run: sccache --show-stats 2>/dev/null | grep -viE "cache location|bucket" || true
