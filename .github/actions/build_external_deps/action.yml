name: "Build external dependencies"
description: "Build the external dependencies for the project"

# The three standalone builds below configure sub-projects outside src/build. The http-request and
# keystore outputs are consumed only through link_directories(): http-request/build by
# indexer_connector, vulnerability_scanner and data_provider, keystore/build by indexer_connector
# (their CMakeLists.txt). The flatbuffers step generates the schema headers several modules include.
# A lane whose target needs none of an output can opt out, which also takes that sub-project out
# of its trigger closure. Defaults keep today's behaviour; opt a lane out only after a green trial
# run (nothing here was built to prove which lanes can).
inputs:
  build_http_request:
    description: "Build shared_modules/http-request standalone"
    required: false
    default: "true"
  build_keystore:
    description: "Build shared_modules/keystore standalone"
    required: false
    default: "true"
  build_flatbuffer_schemas:
    description: "Compile the flatbuffers schemas (shared_modules/utils/flatbuffers)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
      - name: Dependencies for local execution
        if: env.ACT # Only run for local execution
        shell: bash
        run: |

          # Obtain a copy of the signing key
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null

          # Add the repository to your sources list
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' | sudo tee /etc/apt/sources.list.d/kitware.list >/dev/null

          # Update packages
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: General dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dbg

      - name: Build external deps
        run: |
          cd src
          make deps TARGET=manager -j2
          make build-external TARGET=manager TEST=1 -j2
        shell: bash

      - name: Build http-request
        if: inputs.build_http_request != 'false'
        run: |
          cd src
          SRC_FOLDER=$(pwd)

          cd shared_modules/http-request
          mkdir -p build && cd build
          cmake .. -DCMAKE_PROJECT_NAME=http-request -DSRC_FOLDER=${SRC_FOLDER} && make -j2
        shell: bash

      - name: Build keystore
        if: inputs.build_keystore != 'false'
        run: |
          cd src
          SRC_FOLDER=$(pwd)

          cd shared_modules/keystore
          mkdir -p build && cd build
          cmake .. -DCMAKE_PROJECT_NAME=keystore -DSRC_FOLDER=${SRC_FOLDER} && make -j2
        shell: bash

      - name: Build flatbuffer schemas
        if: inputs.build_flatbuffer_schemas != 'false'
        run: |
          cd src
          SRC_FOLDER=$(pwd)

          cd shared_modules/utils/flatbuffers
          mkdir -p build && cd build
          cmake .. -DCMAKE_PROJECT_NAME=flatbuffer_tool -DSRC_FOLDER=${SRC_FOLDER} && make compile_schemas_input -j2
        shell: bash
