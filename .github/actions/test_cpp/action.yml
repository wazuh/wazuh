name: "Run target test"
description: "Run target test"

inputs:
  target:
    required: true
    description: "Target to test"
    default: none
  valgrind:
    required: false
    description: "Run test using valgrind"
    default: "false"
  preload:
    required: false
    description: "Preload ASAN library for tests. Only used when valgrind is disabled."
    default: "false"

runs:
  using: "composite"
  steps:
      # Dependencies for testing:
      # - valgrind
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: valgrind
          version: 1.0

      # Dependencies for coverage:
      # - lcov
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: lcov
          version: 1.0

      # `--no-tests=error`: `-L` is a regex over the registered labels, and ctest exits 0 with
      # "No tests were found!!!" when it matches nothing (a renamed label, a test not registered
      # under this configuration). Without it such a job is green having run nothing.
      #
      # The valgrind branch wraps only the ctest driver: without --trace-children=yes the test
      # binaries do not run under valgrind, and without --error-exitcode a memcheck error would not
      # fail the job anyway. The ASAN jobs are the memory gate; making this one real is an owner
      # decision (it needs suppressions and a timeout budget for the slowed-down suites).
      - name: Test
        run: |
          SRC_FOLDER=$(pwd)/src
          cd $SRC_FOLDER/build

          if [[ "${{ inputs.valgrind }}" != "false" ]]; then
            valgrind ctest --output-on-failure --no-tests=error -L ${{ inputs.target }}
          else
            if [[ "${{ inputs.preload }}" != "false" ]]; then
              ASAN_LIB=$(gcc -print-file-name=libasan.so)
              LD_PRELOAD="${ASAN_LIB}" ASAN_OPTIONS=alloc_dealloc_mismatch=0 ctest --output-on-failure --no-tests=error -L ${{ inputs.target }}
            else
              ASAN_OPTIONS=alloc_dealloc_mismatch=0 ctest --output-on-failure --no-tests=error -L ${{ inputs.target }}
            fi
          fi
        shell: bash
