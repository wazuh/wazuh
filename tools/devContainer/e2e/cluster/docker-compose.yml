# Worker managers for the e2e cluster. The master is the manager running on the
# host; this project only adds worker container(s) that join it. There is no load
# balancer. Drive it with cluster.sh, not with docker compose directly:
#
#   ./cluster/init.sh                  # worker manager artifact + cluster key (cluster/.env)
#   sudo ./cluster/setup-master.sh     # turn the host manager into the cluster master
#   ./cluster/cluster.sh up [-n N]     # secrets, published ports, workers
#   ./cluster/cluster.sh down          # removes the workers only
#
# It is its own compose project (dev-env-cluster) on the base stack's network
# (dev-env-engine_default, external here): it holds no indexer or dashboard
# definition, so no up/down of this project can recreate or remove them.
#
# Secrets travel as files (secrets:, mounted under /run/secrets), never through
# environment:, so docker inspect and docker compose config show their paths only.
# cluster.sh writes the two files (0600, cluster/.secrets/, gitignored): the
# cluster key from cluster/.env and WAZUH_INDEXER_MANAGER_PASSWORD, the only key
# the worker needs, from ../.credentials.env.
name: dev-env-cluster

services:
  wazuh-worker:
    build:
      context: ./node
    image: dev-wazuh-node
    pull_policy: build
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CLUSTER_NAME: "${WAZUH_CLUSTER_NAME:?run ./cluster/cluster.sh up}"
      NODE_TYPE: "worker"
      MASTER_ADDR: "host.docker.internal"
      INDEXER_HOST: "wazuh-indexer"
      INDEXER_USER: "wazuh-manager"
    secrets:
      - cluster_key
      - indexer_password
    # Published on the host so that agents in other compose projects can be pinned
    # to a worker through host.docker.internal (a SAN of the shared listener
    # certificate): 5.x agents through the HTTPS listener, 4.x agents through the
    # legacy agent port and authd. cluster.sh sets one port per worker (a range
    # when scaled) and prints which worker got which.
    ports:
      - "${WAZUH_WORKER_HTTPS_PORTS:-15171}:1517"
      - "${WAZUH_WORKER_AGENT_PORTS:-15141}:1514"
      - "${WAZUH_WORKER_AUTHD_PORTS:-15151}:1515"
    # Time for the entrypoint to run wazuh-manager-control stop on docker stop.
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 3
    volumes:
      - ../certs:/certs:ro

networks:
  default:
    name: dev-env-engine_default
    external: true

secrets:
  cluster_key:
    file: ./.secrets/cluster_key
  indexer_password:
    file: ./.secrets/indexer_password
