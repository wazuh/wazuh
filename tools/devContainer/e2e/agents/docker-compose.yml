name: dev-env-engine-agents

# WAZUH_REGISTRATION_PASSWORD must be set to the manager's enrollment password
# (its etc/authd.pass) before building. 5.x agents bake it in at install time;
# 4.x agents use it at runtime via agent-auth.

x-agent-defaults: &agent_defaults
  pull_policy: build
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  agent_4x_centos:
    <<: *agent_defaults
    build:
      context: .
      dockerfile: centos/4.x/Dockerfile
      network: host
    container_name: wazuh-agent-4x-centos
    hostname: wazuh-agent-4x-centos
    environment:
      MANAGER_HOST: "host.docker.internal"
      MANAGER_PORT: "1514"
      AUTHD_PORT: "1515"
      AGENT_NAME: "agent-4x-centos"
      AUTHD_PASSWORD: "${WAZUH_REGISTRATION_PASSWORD:-}"
    volumes:
      - agent_4x_centos_var:/var/ossec

  agent_4x_ubuntu:
    <<: *agent_defaults
    build:
      context: .
      dockerfile: ubuntu/4.x/Dockerfile
      network: host
    container_name: wazuh-agent-4x-ubuntu
    hostname: wazuh-agent-4x-ubuntu
    environment:
      MANAGER_HOST: "host.docker.internal"
      MANAGER_PORT: "1514"
      AUTHD_PORT: "1515"
      AGENT_NAME: "agent-4x-ubuntu"
      AUTHD_PASSWORD: "${WAZUH_REGISTRATION_PASSWORD:-}"
    volumes:
      - agent_4x_ubuntu_var:/var/ossec

  agent_5x_centos:
    <<: *agent_defaults
    build:
      context: .
      dockerfile: centos/5.x/Dockerfile
      network: host
      args:
        WAZUH_MANAGER: "host.docker.internal"
        WAZUH_REGISTRATION_PASSWORD: "${WAZUH_REGISTRATION_PASSWORD:-}"
    container_name: wazuh-agent-5x-centos
    hostname: wazuh-agent-5x-centos
    environment:
      MANAGER_HOST: "host.docker.internal"
    volumes:
      - agent_5x_centos_var:/var/ossec

  agent_5x_ubuntu:
    <<: *agent_defaults
    build:
      context: .
      dockerfile: ubuntu/5.x/Dockerfile
      network: host
      args:
        WAZUH_MANAGER: "host.docker.internal"
        WAZUH_REGISTRATION_PASSWORD: "${WAZUH_REGISTRATION_PASSWORD:-}"
    container_name: wazuh-agent-5x-ubuntu
    hostname: wazuh-agent-5x-ubuntu
    environment:
      MANAGER_HOST: "host.docker.internal"
    volumes:
      - agent_5x_ubuntu_var:/var/ossec

volumes:
  agent_4x_centos_var:
  agent_4x_ubuntu_var:
  agent_5x_centos_var:
  agent_5x_ubuntu_var:
