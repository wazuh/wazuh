# ab_options/v1.conf -- internal-options overrides applied on top of the v1 snapshot's file by
# `prepare_manager.sh --side v1`. The A/B compares senders, not queue sizes: both
# sides get the same queue, the v1 sender through its own keys: 1 GiB for the engine (the drain
# backlog must fit both sides, README «Sizing the drain backlog»), 64 MiB for inventory_sync.
#
# engine: IndexerConnectorAsync queue (default 64 MiB; 1 GiB here, the same as v2)
analysisd.indexer_queue_max_bytes=1073741824
# inventory_sync_server: the async connector's queue
wazuh_modules.inventory_sync_server_indexer_async_max_queue_bytes=67108864
