# ab_options/v2.conf -- internal-options overrides applied on top of the v2 snapshot's file by
# `prepare_manager.sh --side v2`. Same queue capacity as v1: the engine and the
# agent-state bucket get the same quota as v1 through the keys they share with it (engine 1 GiB per
# bucket, inventory_sync 64 MiB); the ENGINE's global quota (analysisd.*, not wazuh_modules.*) is raised to
# 2 GiB so its two buckets fit;
# the rest of the indexer_client family
# keeps its defaults.
analysisd.indexer_queue_max_bytes=1073741824
wazuh_modules.inventory_sync_server_indexer_async_max_queue_bytes=67108864
analysisd.indexer_client_global_quota_bytes=2147483648
