openapi: 3.0.3
info:
  title: Wazuh-Engine Events Ingestion API
  description: API for ingesting enriched security events into the Wazuh-Engine.
  version: 1.0.0

servers:
  - url: "http+unix:/var/wazuh-manager/queue/sockets/engine-ingest-http.sock"
    description: "Events ingestion socket"

tags:
  - name: Events
    description: Event ingestion endpoints

#################################################################################
# Paths
#################################################################################
paths:
  ################################
  # Events
  ################################
  /events/enriched:
    post:
      tags:
        - Events
      summary: Ingest enriched events (H/E batch protocol)
      description: |
        Accepts a batch of events using the H/E wire protocol over HTTP via Unix domain socket.
        Socket path: /var/wazuh-manager/queue/sockets/engine-ingest-http.sock

        ## Trusted identity

        Every local producer must send exactly one `X-Wazuh-Agent-Id` header. Its value is the
        canonical uint32 agent id: ASCII digits, zero-padded only to three characters (`000`
        through `999`), otherwise no leading zero, and no greater than `4294967295`.
        Header names are case-insensitive; repeated fields, even identical ones, are rejected.
        The H line must contain exactly one `wazuh`, `wazuh.agent`, and `wazuh.agent.id` at
        their respective levels. The final value must be a string equal to the carrier.
        Names are compared after JSON decoding and by length. Literal `wazuh.agent` and
        `wazuh.agent.id` members at the root, and `agent.id` under `wazuh`, are rejected regardless
        of their values: these dotted names resolve to the same indexed identity path. This also
        applies to escaped names such as `wazuh\u002eagent\u002eid`, and to names with trailing dots
        along the identity path (`wazuh.`, `agent.`, `id.`, or dotted aliases with trailing dots).
        Dotted names in unrelated paths and off-path duplicates are accepted.
        Violations return 400 before any event is enqueued. A cache hit reuses only a previously
        validated (agent id, exact header bytes) pair.

        The socket is local, mode 0660 for wazuh-manager. There is no peer-credential check or
        JWT validation here: every process allowed to write to it is a trusted producer and
        must author the carrier from authenticated or server-side identity. This comparison
        checks consistency with that assertion; it does not authenticate local writers.
        Out-of-tree writers must add the carrier; there is no fallback to the H-line id.
        The separate tester metadata path is not covered by this ingest contract.

        Producers use `application/x-ndjson` or `application/x-wev1`; the engine does not use
        Content-Type to select the parser. The existing JSON nesting limit still applies.

        ## Wire Format

        ```
        H <json-metadata>\n
        E <queue>:<location>:<message>\n
        E <queue>:<location>:<message>\n
        ```

        - **Header line** (`H `): JSON object with agent and cluster metadata.
        - **Event lines** (`E `): Legacy event format `<queue_byte>:<location>:<message>`.
        - **Event delimiter**: The 3-byte sequence `\nE ` (newline + E + space) separates events.

        ## Multi-line Events (Continuation-line Indentation)

        When an event payload contains embedded newlines (e.g., multi-line logs, command
        outputs), continuation lines are **indented with a single leading space** by the
        sender to prevent false delimiter matches.

        The receiver strips exactly one leading space from each continuation line to
        recover the original payload.

        ### Quick example

        ```
        H {"wazuh":{"agent":{"id":"001","name":"srv1"}}}
        E 1:/var/log/app.log:START
         continuation (indented with a space)
         E this line starts with E+space (not a delimiter)
        E 2:/var/log/syslog:single-line event
        ```

        See the `examples` section below for more detailed scenarios.

      parameters:
        - in: header
          name: X-Wazuh-Agent-Id
          required: true
          description: Locally authored canonical agent id, at most 4294967295; must equal the H-line id. Exactly one field is allowed.
          schema:
            type: string
            minLength: 3
            maxLength: 10
            pattern: '^(?:[0-9]{3}|[1-9][0-9]{3,9})$'
          example: '001'
      requestBody:
        required: true
        content:
          application/x-ndjson: &EnrichedBatch
            schema:
              type: string
              description: |
                H/E batch protocol. First line is the header (`H <json>`),
                followed by one or more event lines (`E <queue>:<location>:<message>`).
                Multi-line event payloads use continuation-line indentation (one leading space).
            examples:
              singleLineEvents:
                summary: Two single-line events
                value: |-
                  H {"wazuh":{"agent":{"id":"001","name":"srv1"},"cluster":{"name":"wazuh","node":"node01"}}}
                  E 1:/var/log/syslog:May 07 10:00:00 srv1 sshd: Accepted publickey
                  E 2:/var/log/auth.log:session opened for user root
              multiLineEvent:
                summary: Multi-line event with indented continuations
                value: "H {\"wazuh\":{\"agent\":{\"id\":\"001\",\"name\":\"srv1\"}}}\nE 1:/var/log/app.log:START\n line2\n E this starts with E+space\n line4\nE 2:/var/log/syslog:next event\n"
              mixedBatch:
                summary: Mixed batch (multiline, single, multiline, single)
                value: "H {\"wazuh\":{\"agent\":{\"id\":\"001\",\"name\":\"srv1\"}}}\nE 1:/var/log/app.log:BEGIN\n continuation1\n continuation2\nE 2:/var/log/auth.log:single line event\nE 3:/var/log/daemon.log:MULTI\n E looks like delimiter but isn't\n last line\nE 1:/etc/passwd:another single\n"
              commandOutput:
                summary: Command output with multi-line result (netstat)
                value: "H {\"wazuh\":{\"agent\":{\"id\":\"001\",\"name\":\"srv1\"}}}\nE 1:netstat listening ports:ossec: output: 'netstat listening ports':\n tcp 0.0.0.0:22 0.0.0.0:* 534/sshd\n tcp6 :::22 :::* 534/sshd\n udp 0.0.0.0:68 0.0.0.0:* 1362/dhclient\n"
              continuationWithLeadingSpace:
                summary: Payload line that already starts with a space (two spaces on wire)
                value: "H {\"wazuh\":{\"agent\":{\"id\":\"001\",\"name\":\"srv1\"}}}\nE 1:/var/log/app.log:yaml block:\n   key: value\n   nested: true\n"
              vulnerabilityScannerEvent:
                summary: Vulnerability Scanner event (single-line JSON, no indentation needed)
                value: |-
                  H {"wazuh":{"agent":{"id":"001","name":"srv1"},"cluster":{"name":"wazuh","node":"node01"}}}
                  E v:vulnerability-scanner:{"collector":"packages","module":"vulnerability-scanner","data":{"event":{"created":"2026-05-07T10:00:00Z","type":"upsert"},"vulnerability":{"id":"CVE-2024-1234"}}}
          application/x-wev1: *EnrichedBatch
      responses:
        "200":
          description: Events accepted. (Empty body)
        "400":
          description: Invalid carrier, ambiguous or mismatched H-line identity, or malformed H/E payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: integer
                required: [error, code]
              examples:
                invalidCarrier:
                  value: {"error":"NDJson parser error, Expected exactly one X-Wazuh-Agent-Id header","code":400}
                noncanonicalCarrier:
                  value: {"error":"NDJson parser error, X-Wazuh-Agent-Id must be canonical","code":400}
                mismatchedIdentity:
                  value: {"error":"NDJson parser error, AgentMetadataCache: header agent ID does not match the trusted agent ID","code":400}
                dottedIdentityAlias:
                  value: {"error":"NDJson parser error, AgentMetadataCache: dotted alias of /wazuh/agent/id in header","code":400}
                ambiguousIdentity:
                  value: {"error":"NDJson parser error, AgentMetadataCache: missing, repeated or non-string /wazuh/agent/id in header","code":400}
                missingHeader:
                  value: {"error":"NDJson parser error, Missing newline after header","code":400}
                invalidHeader:
                  value: {"error":"NDJson parser error, Invalid header format, expected 'H {json}'","code":400}
                invalidEventMarker:
                  value: {"error":"NDJson parser error, Expected 'E ' at event start","code":400}
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: integer
                required: [error, code]
              examples:
                orchestratorUnavailable:
                  value: {"error":"Internal server error","code":500}
