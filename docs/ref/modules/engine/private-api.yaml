openapi: 3.0.3
info:
  title: Wazuh-Engine Private API
  description: |
    Internal-only API endpoints of the Wazuh Engine used by development, testing, and maintenance tooling. Public endpoints are documented separately in public-api.yaml.

    Every route is served on the engine API socket, `/var/wazuh-manager/queue/sockets/engine-api-http.sock`,
    and takes `POST`. Request bodies are JSON; unknown fields are ignored, and an empty body is read as an empty
    request. Responses carry a JSON body labelled `Content-Type: application/json`.
  version: 1.0.0
servers:
- url: http+unix:/var/wazuh-manager/queue/sockets/engine-api-http.sock
  description: Engine API socket (HTTP over a Unix socket)
tags:
- name: Router
  description: Operations for managing environments and routing
- name: Tester
  description: Operations for testing and validating policies
- name: Geo
  description: Operations for geo databases
- name: Event Dumper
  description: Operations for managing the event dumper.
- name: Raw Event Indexer
  description: Operations for checking the status of raw event indexing.
- name: Content
  description: Internal operations for content and namespace management.
paths:
  /_internal/router/route/post:
    post:
      tags:
      - Router
      summary: Create a new route
      description: |
        Creates a production route that sends events to the policy of a namespace. The route's environment is
        built from the namespace's policy at creation; a policy that cannot be built, or has no assets, is
        rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePost_Request'
            example:
              route:
                name: cmsync_standard
                namespaceId: cmsync_standard_3f9a
                priority: 1
                description: Route of the standard space
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                missing_route_field:
                  summary: Missing /route field
                  value:
                    status: ERROR
                    error: Missing /route
                missing_name:
                  summary: Name field is empty
                  value:
                    status: ERROR
                    error: Name cannot be empty
                policy_build_failed:
                  summary: The namespace's policy cannot be built (missing namespace, invalid asset, ...)
                  value:
                    status: ERROR
                    error: "Failed to create the route: Failed to create environment with policy 'testing': <details>"
                namespace_has_no_assets:
                  summary: The namespace's policy has no assets
                  value:
                    status: ERROR
                    error: "Failed to create the route: Failed to create environment with policy 'testing': Policy 'testing' has no assets"
                priority_zero:
                  summary: Priority is set to 0
                  value:
                    status: ERROR
                    error: Priority cannot be 0
                priority_too_high:
                  summary: Priority is set to more than 1000
                  value:
                    status: ERROR
                    error: Priority cannot be greater than 1000
                priority_already_in_use:
                  summary: Priority already in use (the message has two spaces)
                  value:
                    status: ERROR
                    error: The priority of the route  is already in use
                route_name_already_exists:
                  summary: Route name already exists
                  value:
                    status: ERROR
                    error: The name of the route is already in use
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/router/route/delete:
    post:
      tags:
      - Router
      summary: Delete a route
      description: Deletes a production route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteDelete_Request'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                missing_name:
                  summary: Missing name field
                  value:
                    status: ERROR
                    error: 'Invalid name name: Name cannot be empty'
                route_not_exist:
                  summary: Route does not exist
                  value:
                    status: ERROR
                    error: The route not exist
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/router/route/get:
    post:
      tags:
      - Router
      summary: Retrieve a route
      description: Retrieves a production route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteGet_Request'
      responses:
        '200':
          description: Successfully retrieved route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteGet_Response'
              example:
                status: OK
                route:
                  name: cmsync_standard
                  namespaceId: cmsync_standard_3f9a
                  priority: 1
                  description: Route of the standard space
                  entry_status: ENABLED
                  uptime: 3600
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                missing_name:
                  summary: Name field is empty
                  value:
                    status: ERROR
                    error: Name cannot be empty
                route_not_exist:
                  summary: Route does not exist
                  value:
                    status: ERROR
                    error: The route not exist
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/router/route/reload:
    post:
      tags:
      - Router
      summary: Reload a route
      description: Rebuilds a production route's environment from its namespace's current policy and enables it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteReload_Request'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                missing_name:
                  summary: Name field is empty
                  value:
                    status: ERROR
                    error: 'Invalid name name: Name cannot be empty'
                route_not_exist:
                  summary: Route does not exist
                  value:
                    status: ERROR
                    error: The route not exist
                policy_build_failed:
                  summary: The namespace's policy cannot be rebuilt
                  value:
                    status: ERROR
                    error: "Failed to reload the route: Failed to create environment with policy 'cmsync_standard_3f9a': <details>"
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/router/route/patchPriority:
    post:
      tags:
      - Router
      summary: Update route priority
      description: Changes the priority of a production route (1..1000, not used by another route).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePatchPriority_Request'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                missing_name:
                  summary: Name field is empty
                  value:
                    status: ERROR
                    error: 'Invalid name name: Name cannot be empty'
                route_not_exist:
                  summary: Route does not exist
                  value:
                    status: ERROR
                    error: The route not exist
                priority_too_high:
                  summary: Priority greater than allowed
                  value:
                    status: ERROR
                    error: Priority of the route cannot be greater than 1000
                priority_zero:
                  summary: Priority cannot be zero
                  value:
                    status: ERROR
                    error: Priority of the route cannot be 0
                priority_in_use:
                  summary: Priority already used by another route
                  value:
                    status: ERROR
                    error: Failed to change the priority, it is already in use
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/router/table/get:
    post:
      tags:
      - Router
      summary: Retrieve all routes
      description: Lists the production routes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: Successfully retrieved routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableGet_Response'
              example:
                status: OK
                table:
                - name: cmsync_standard
                  namespaceId: cmsync_standard_3f9a
                  priority: 1
                  description: Route of the standard space
                  entry_status: ENABLED
                  uptime: 3600
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/tester/session/post:
    post:
      tags:
      - Tester
      summary: Create a new tester session
      description: Creates a tester session on the policy of a namespace. The policy is built in test mode at creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterSessionPost_Request'
            example:
              session:
                name: testing
                namespaceId: cmsync_standard_3f9a
                lifetime: 0
                description: Manual test session
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                missing_session:
                  summary: Missing /session
                  value:
                    status: ERROR
                    error: Missing /session
                missing_name:
                  summary: Name cannot be empty
                  value:
                    status: ERROR
                    error: Name cannot be empty
                session_already_exists:
                  summary: Session name already exists
                  value:
                    status: ERROR
                    error: The 'testing' environment already exists.
                policy_build_failed:
                  summary: The namespace's policy cannot be built (missing namespace, invalid asset, ...)
                  value:
                    status: ERROR
                    error: 'Failed to create the testing environment: <details>'
                namespace_without_assets:
                  summary: The namespace's policy has no assets
                  value:
                    status: ERROR
                    error: "Failed to create the testing environment: Policy 'cmsync_standard_3f9a' has no assets"
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/tester/session/delete:
    post:
      tags:
      - Tester
      summary: Delete a tester session
      description: Deletes a tester session. Its namespace is not deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterSessionDelete_Request'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                missing_name:
                  summary: Name cannot be empty
                  value:
                    status: ERROR
                    error: 'Invalid name name: Name cannot be empty'
                session_not_exist:
                  summary: Session does not exist
                  value:
                    status: ERROR
                    error: The 'testing' environment does not exist.
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/tester/session/get:
    post:
      tags:
      - Tester
      summary: Retrieve a tester session
      description: Retrieves a tester session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterSessionGet_Request'
      responses:
        '200':
          description: Successfully retrieved session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterSessionGet_Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                missing_name:
                  summary: Name cannot be empty
                  value:
                    status: ERROR
                    error: Name cannot be empty
                session_not_exist:
                  summary: Session does not exist
                  value:
                    status: ERROR
                    error: The 'testing' environment does not exist.
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/tester/session/reload:
    post:
      tags:
      - Tester
      summary: Reload a tester session
      description: Rebuilds a tester session from its namespace's current policy and enables it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterSessionReload_Request'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                missing_name:
                  summary: Missing name field
                  value:
                    status: ERROR
                    error: 'Invalid name name: Name cannot be empty'
                session_non_exist:
                  summary: Non-existent session
                  value:
                    status: ERROR
                    error: The 'testing' environment does not exist.
                policy_build_failed:
                  summary: The namespace's policy cannot be rebuilt
                  value:
                    status: ERROR
                    error: "Failed to create the 'testing' environment: <details>"
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/tester/run/post:
    post:
      tags:
      - Tester
      summary: Run a test in a session
      description: |
        Injects a single event into the engine using a previously created and loaded testing session.
        The run times out after `analysisd.server_api_timeout` milliseconds (default 5000).

        `event` uses the legacy wire format `<queue>:<location>:<message>`: the first byte is the queue (its
        byte value is stored in `wazuh.protocol.queue`, so `1` is `49`), and a `:` inside the location is escaped
        as `|:`.

        Additional metadata about the agent can be provided in the `agent_metadata` field, which
        is merged into the event before ingestion. It must be a **JSON object** (not a JSON-encoded string);
        omitted, it is an empty object.

        With `trace_level` other than `NONE`, every asset of the session's policy is traced, or only those listed in
        `asset_trace` (each must belong to the policy).

        After the pipeline finishes, the final output event is validated against the Wazuh Common
        Schema (WCS). Validation is **non-blocking**: the pipeline result is always returned
        regardless of validation errors. Unlike `/logtest`, temporary fields are kept in the output and reported.

        Each entry in `result.validation.errors` has:
        - `path` — field path using dot notation for nesting and `[N]` for array indices
          (e.g. `"event.severity"`, `"tags[1]"`).
        - `kind` — one of:
          - `unknown_field` — field is not defined in WCS and is not a temporary field.
          - `temporary_field_not_allowed` — field is a pipeline-internal field (root starts with `_`).
          - `invalid_type` — value does not match the WCS type for that field.
        - `expected` / `actual` — present only for `invalid_type` errors.

        `result.validation` is only present when the schema validator is available and the
        pipeline produced an output event. Errors are sorted by path, with kind as tiebreaker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterRunPost_Request'
            example:
              name: testing
              event: '1:/tmp/json:{"eventName": "CreateGroup"}'
              agent_metadata: {}
              trace_level: ASSET_ONLY
      responses:
        '200':
          description: Successfully ran the test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterRunPost_Response'
              examples:
                ok_valid:
                  summary: OK - pipeline ran and output passes WCS validation
                  value:
                    status: OK
                    result:
                      output:
                        wazuh:
                          protocol:
                            queue: 49
                            location: /tmp/json
                          space:
                            name: standard
                        event:
                          original: '...'
                          kind: event
                          action: group-created
                        cloud:
                          region: us-east-1
                      asset_traces:
                      - asset: decoder/aws-cloudtrail/0
                        success: true
                        traces:
                        - 'event.kind: map("event") -> Success'
                      validation:
                        valid: true
                        errors: []
                ok_with_validation_errors:
                  summary: OK - pipeline ran but output has WCS validation errors (non-blocking)
                  value:
                    status: OK
                    result:
                      output:
                        wazuh:
                          protocol:
                            queue: 49
                            location: /tmp/json
                        event:
                          original: '...'
                          kind: 42
                        _tmp:
                          stage: done
                        unknown_field: value
                      asset_traces: []
                      validation:
                        valid: false
                        errors:
                        - path: _tmp
                          kind: temporary_field_not_allowed
                        - path: event.kind
                          kind: invalid_type
                          expected: keyword
                          actual: number
                        - path: unknown_field
                          kind: unknown_field
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                bad_event_format:
                  summary: Event shorter than `<queue>:<location>:<message>` allows
                  value:
                    status: ERROR
                    error: 'Error parsing event: Invalid format: event must be at least 5 bytes ("<byte>:<location>:<message>")'
                missing_queue_separator:
                  summary: No `:` after the one-byte queue identifier
                  value:
                    status: ERROR
                    error: 'Error parsing event: Invalid format: missing '':'' after the one-byte queue identifier ("<byte>:<location>:<message>")'
                missing_separator:
                  summary: No unescaped `:` between location and message
                  value:
                    status: ERROR
                    error: "Error parsing event: Invalid format: missing unescaped ':' between location and message"
                session_non_exist:
                  summary: Session does not exist
                  value:
                    status: ERROR
                    error: The 'testing' environment does not exist.
                session_not_enabled:
                  summary: Session not enabled
                  value:
                    status: ERROR
                    error: The 'testing' environment is not enabled
                asset_not_in_policy:
                  summary: An `asset_trace` entry is not an asset of the session's policy
                  value:
                    status: ERROR
                    error: Asset decoder/unknown/0 not found in store
                timeout:
                  summary: The test run did not finish within analysisd.server_api_timeout
                  value:
                    status: ERROR
                    error: Timeout waiting for ingestTest
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/tester/table/get:
    post:
      tags:
      - Tester
      summary: Retrieve all tester sessions
      description: Lists the tester sessions.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: Successfully retrieved sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterTableGet_Response'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/geo/db/get:
    post:
      tags:
      - Geo
      summary: Query geolocation data for an IP address
      description: |
        Looks up an IP address in both loaded databases and returns each database's raw record for it:
        `geo` holds the record of the CITY database and `as` the record of the ASN database, with the keys
        the MaxMind MMDB files store (they are not mapped to WCS field names).

        If a database is not available or the IP is not found in it, its object is empty.

        `ip` must be an IPv4 or IPv6 address literal; any other value (a host name, a CIDR, `not-an-ip`) is
        refused with 400 `Invalid IP address: <ip>` before any lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoDbGet_Request'
      responses:
        '200':
          description: Successfully retrieved geolocation data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoDbGet_Response'
              examples:
                withBothData:
                  summary: IP with both CITY and ASN data (records abridged)
                  value:
                    status: OK
                    error: ''
                    data:
                      geo:
                        city:
                          names:
                            en: Mountain View
                        country:
                          iso_code: US
                        location:
                          latitude: 37.386
                          longitude: -122.0838
                      as:
                        autonomous_system_number: 15169
                        autonomous_system_organization: Google LLC
                noData:
                  summary: IP not found in databases
                  value:
                    status: OK
                    error: ''
                    data:
                      geo: {}
                      as: {}
        '400':
          description: Bad Request. The request was malformed or validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                emptyIp:
                  summary: Empty IP address
                  value:
                    status: ERROR
                    error: IP cannot be empty
                invalidIp:
                  summary: Not an IP address
                  value:
                    status: ERROR
                    error: 'Invalid IP address: not-an-ip'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/geo/db/list:
    post:
      tags:
      - Geo
      summary: List all geolocation databases
      description: |
        Lists the geolocation databases currently loaded in the geo manager: file name, path, MD5 hash,
        creation timestamp and type (`city` or `asn`). The databases live in `analysisd.geo_db_path`
        (default `/var/wazuh-manager/data/mmdb`) as `GeoLite2-City.mmdb` and `GeoLite2-ASN.mmdb`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: Successfully retrieved database list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoDbList_Response'
              examples:
                withDatabases:
                  summary: Manager with loaded databases
                  value:
                    status: OK
                    entries:
                    - name: GeoLite2-City.mmdb
                      path: /var/wazuh-manager/data/mmdb/GeoLite2-City.mmdb
                      hash: a1b2c3d4e5f6
                      createdAt: '1705314600'
                      type: city
                    - name: GeoLite2-ASN.mmdb
                      path: /var/wazuh-manager/data/mmdb/GeoLite2-ASN.mmdb
                      hash: f6e5d4c3b2a1
                      createdAt: '1705314600'
                      type: asn
                empty:
                  summary: No databases loaded
                  value:
                    status: OK
                    entries: []
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/event-dumper/activate:
    post:
      tags:
      - Event Dumper
      summary: Activate the event dumper
      description: Activates the event dumper (the `event-dumps` stream log channel).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/event-dumper/deactivate:
    post:
      tags:
      - Event Dumper
      summary: Deactivate the event dumper
      description: Deactivates the event dumper.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/event-dumper/status:
    post:
      tags:
      - Event Dumper
      summary: Get the status of the event dumper
      description: Reports whether the event dumper is active.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: Successfully retrieved event dumper status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDumperStatus_Response'
              examples:
                event_dumper_active:
                  summary: Event dumper is active
                  value:
                    status: OK
                    active: true
                event_dumper_inactive:
                  summary: Event dumper is inactive
                  value:
                    status: OK
                    active: false
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/raweventindexer/status:
    post:
      tags:
      - Raw Event Indexer
      summary: Get the status of the raw event indexer
      description: Reports whether raw event indexing is enabled. The route exists only when the raw event indexer is created at startup.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: Successfully retrieved raw event indexer status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawEventIndexerStatus_Response'
              examples:
                enabled:
                  summary: Raw event indexer enabled
                  value:
                    status: OK
                    enabled: true
                disabled:
                  summary: Raw event indexer disabled
                  value:
                    status: OK
                    enabled: false
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/content/namespace/list:
    post:
      tags:
      - Content
      summary: List namespaces
      description: Lists all namespaces. A store failure is reported with HTTP 200 and `status` `ERROR`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/namespaceGet_Request'
      responses:
        '200':
          description: Namespaces listed (or `status` `ERROR` with the store's error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/namespaceGet_Response'
              example:
                status: OK
                spaces:
                - cmsync_standard_3f9a
                - logtest_8c41d2
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/content/namespace/create:
    post:
      tags:
      - Content
      summary: Create a namespace
      description: Creates a namespace. Errors (an empty `space` is `Field /space cannot be empty`) are 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/namespacePost_Request'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/content/namespace/delete:
    post:
      tags:
      - Content
      summary: Delete a namespace
      description: Deletes a namespace and all its content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/namespaceDelete_Request'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/content/namespace/import:
    post:
      tags:
      - Content
      summary: Import a namespace
      description: |
        Imports a complete namespace definition into a **new** namespace (an existing one is rejected with
        `Namespace '<name>' already exists. Import is only allowed into a new namespace`). `jsonContent` is the
        namespace document as a JSON **string**, an object with exactly the keys `policy` and `resources`
        (see `POST /content/validate/policy` in the public API). A failed import is rolled back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/namespaceImport_Request'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/content/policy/upsert:
    post:
      tags:
      - Content
      summary: Create or replace a policy
      description: Creates or replaces the policy of a namespace. `jsonContent` must be a JSON object (`Payload top-level must be an object`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/policyPost_Request'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/content/policy/delete:
    post:
      tags:
      - Content
      summary: Delete a policy
      description: Deletes the policy of a namespace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/policyDelete_Request'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/content/list:
    post:
      tags:
      - Content
      summary: List resources
      description: |
        Lists the resources of a given type within a namespace. Missing `space`/`type` or an unknown `type` are 400;
        a store failure (e.g. a namespace that does not exist) is reported with HTTP 200 and `status` `ERROR`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resourceList_Request'
      responses:
        '200':
          description: Resources listed (or `status` `ERROR` with the store's error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceList_Response'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/content/get:
    post:
      tags:
      - Content
      summary: Get a resource
      description: |
        Retrieves a resource JSON document by identifier from a namespace. Identifiers are opaque strings
        (any UUID version or other format) and are matched byte by byte. Missing `space`/`uuid` or an invalid
        identifier are 400; a lookup failure (unknown namespace or identifier) is reported with HTTP 200 and
        `status` `ERROR`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resourceGet_Request'
      responses:
        '200':
          description: The resource (or `status` `ERROR` with the store's error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceGet_Response'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/content/upsert:
    post:
      tags:
      - Content
      summary: Create or replace a resource
      description: Creates or replaces a resource in a namespace. `jsonContent` must be a JSON object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resourcePost_Request'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /_internal/content/delete:
    post:
      tags:
      - Content
      summary: Delete a resource
      description: Deletes a resource by identifier from a namespace. Identifiers are opaque strings (any UUID version or other format) and are matched byte by byte.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resourceDelete_Request'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
components:
  schemas:
    ReturnStatus:
      type: string
      enum:
      - UNKNOWN
      - OK
      - ERROR
      description: Status codes representing different return states.
    ReturnError:
      type: string
      description: Error message; present when status is ERROR.
    Response:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReturnStatus'
        error:
          $ref: '#/components/schemas/ReturnError'
    EmptyRequest:
      type: object
      description: Empty request body
      properties: {}
    ResourceName:
      type: string
      description: Name of the resource, a '/' separated string. Where the first part is the type, the second part is the name, and the last part is the version.
      example: type/name/0
    Namespace:
      type: string
      description: Namespace where the policy and assets are located
      example: namespace1
    Result_ValidationError:
      type: object
      properties:
        path:
          type: string
          description: Field path using dot notation for nesting and [N] for array indices (e.g. "event.severity", "tags[1]")
        kind:
          type: string
          enum:
          - unknown_field
          - invalid_type
          - temporary_field_not_allowed
          description: 'Type of validation error:

            - `unknown_field`: field is not defined in WCS and is not a temporary field.

            - `invalid_type`: value does not match the WCS type for that field.

            - `temporary_field_not_allowed`: field is a pipeline-internal field (root starts with `_`).

            '
        expected:
          type: string
          nullable: true
          description: Expected WCS type string. Only present for `invalid_type` errors (e.g. "keyword", "long").
        actual:
          type: string
          nullable: true
          description: Actual JSON type string of the value. Only present for `invalid_type` errors (e.g. "number", "object").
    Result_Validation:
      type: object
      properties:
        valid:
          type: boolean
          description: True when the output event contains no WCS validation errors.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Result_ValidationError'
          description: List of WCS validation errors found in the output event. Empty when valid is true. Sorted by path (alphabetical); kind is used as tiebreaker when two errors share the same path.
    TesterResult:
      type: object
      properties:
        output:
          type: object
          description: JSON output of the event
        asset_traces:
          type: array
          items:
            type: object
            properties:
              asset:
                $ref: '#/components/schemas/ResourceName'
              success:
                type: boolean
                description: If the asset was successfully decoded
              traces:
                type: array
                items:
                  type: string
                description: Traces of the asset
        validation:
          $ref: '#/components/schemas/Result_Validation'
          description: WCS schema validation result. Present in tester-run and logtest responses, only when the schema validator is available and the pipeline produced an output event.
          nullable: true
    TesterRunPost_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          result:
            $ref: '#/components/schemas/TesterResult'
    EventDumperStatus_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          active:
            type: boolean
            description: Indicates whether the event dumper is active
    GeoDbEntry:
      type: object
      properties:
        name:
          type: string
          description: Database file name
        path:
          type: string
          description: Path of the MMDB database file
        hash:
          type: string
          description: MD5 hash of the database file
        createdAt:
          type: string
          description: Database creation timestamp in seconds since the epoch (a 64-bit integer, serialized as a JSON string)
        type:
          type: string
          enum:
          - city
          - asn
          description: MMDB database type
    GeoDbGet_Request:
      type: object
      required:
      - ip
      properties:
        ip:
          type: string
          description: IP address to query for geolocation data
          example: 8.8.8.8
    GeoDbGet_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          data:
            type: object
            description: Raw MMDB records, `geo` from the CITY database and `as` from the ASN database
            properties:
              geo:
                type: object
                description: Record from the CITY database. Empty object if not found or database not available.
                additionalProperties: true
              as:
                type: object
                description: Record from the ASN database. Empty object if not found or database not available.
                additionalProperties: true
    GeoDbList_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          entries:
            type: array
            items:
              $ref: '#/components/schemas/GeoDbEntry'
            description: List of MMDB database entries currently loaded in the geo manager
    RawEventIndexerStatus_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          enabled:
            type: boolean
            description: Indicates whether the raw event indexer is enabled
    ResourceSummary:
      type: object
      properties:
        uuid:
          type: string
          description: Resource identifier (unique within namespace, opaque string)
        name:
          type: string
          description: Logical resource name
    RouteDelete_Request:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the route
    RouteGet_Request:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the route
    RouteGet_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          route:
            $ref: '#/components/schemas/RouterEntry'
    RoutePatchPriority_Request:
      type: object
      required:
      - name
      - priority
      properties:
        name:
          type: string
          description: Name of the route
        priority:
          type: integer
          minimum: 1
          maximum: 1000
          description: New priority of the route
    RoutePost_Request:
      type: object
      required:
      - route
      properties:
        route:
          type: object
          required:
          - name
          - namespaceId
          - priority
          properties:
            name:
              type: string
              description: Name of the route
            namespaceId:
              $ref: '#/components/schemas/Namespace'
            priority:
              type: integer
              minimum: 1
              maximum: 1000
              description: Priority of the route (unique among routes)
            description:
              type: string
              description: Description of the route
    RouteReload_Request:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the route
    RouteState:
      type: string
      enum:
      - STATE_UNKNOWN
      - DISABLED
      - ENABLED
      description: State of the route
    RouterEntry:
      type: object
      properties:
        name:
          type: string
          description: Name of the route
        namespaceId:
          $ref: '#/components/schemas/Namespace'
        priority:
          type: integer
          description: Priority of the route
        description:
          type: string
          description: Description of the route
        entry_status:
          $ref: '#/components/schemas/RouteState'
        uptime:
          type: integer
          description: Seconds since the route's environment was last built; for a DISABLED route, the last-update timestamp itself
    TableGet_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          table:
            type: array
            items:
              $ref: '#/components/schemas/RouterEntry'
            description: List of all routes in the router
    TesterDescription:
      type: string
      description: Optional description of the session
      nullable: true
    TesterLifetime:
      type: integer
      description: Lifetime of the session in seconds
    TesterRunPost_Request:
      type: object
      required:
      - name
      - event
      properties:
        name:
          $ref: '#/components/schemas/TesterSessionName'
        event:
          type: string
          description: Event to test, in the legacy format `<queue>:<location>:<message>`
        agent_metadata:
          type: object
          description: Metadata merged into the event root before ingestion (default `{}`)
        trace_level:
          type: string
          enum:
          - NONE
          - ASSET_ONLY
          - ALL
          default: NONE
          description: Level of traces
        asset_trace:
          type: array
          items:
            $ref: '#/components/schemas/ResourceName'
          description: Assets to trace (default every asset of the session's policy); each must belong to the policy
    TesterSession:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/TesterSessionName'
        namespaceId:
          $ref: '#/components/schemas/Namespace'
        lifetime:
          $ref: '#/components/schemas/TesterLifetime'
        description:
          $ref: '#/components/schemas/TesterDescription'
        entry_status:
          $ref: '#/components/schemas/RouteState'
        last_use:
          type: integer
          description: Last use of the session in seconds since epoch
    TesterSessionDelete_Request:
      type: object
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/TesterSessionName'
    TesterSessionGet_Request:
      type: object
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/TesterSessionName'
    TesterSessionGet_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          session:
            $ref: '#/components/schemas/TesterSession'
    TesterSessionName:
      type: string
      description: Name of the session
    TesterSessionPost:
      type: object
      required:
      - name
      - namespaceId
      properties:
        name:
          $ref: '#/components/schemas/TesterSessionName'
        namespaceId:
          $ref: '#/components/schemas/Namespace'
        lifetime:
          $ref: '#/components/schemas/TesterLifetime'
        description:
          $ref: '#/components/schemas/TesterDescription'
    TesterSessionPost_Request:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/TesterSessionPost'
    TesterSessionReload_Request:
      type: object
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/TesterSessionName'
    TesterTableGet_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          sessions:
            type: array
            items:
              $ref: '#/components/schemas/TesterSession'
            description: List of sessions if status is OK
    namespaceDelete_Request:
      type: object
      required:
      - space
      properties:
        space:
          type: string
          description: Namespace name to delete
    namespaceGet_Request:
      type: object
      description: Empty request body
      properties: {}
    namespaceGet_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          spaces:
            type: array
            items:
              type: string
            description: List of namespaces
    namespaceImport_Request:
      type: object
      required:
      - space
      - jsonContent
      properties:
        space:
          type: string
          description: Namespace name to import into
        jsonContent:
          type: string
          description: Full namespace JSON payload
        force:
          type: boolean
          description: If true, skip the validation of integrations, assets and the policy against the namespace
    namespacePost_Request:
      type: object
      required:
      - space
      properties:
        space:
          type: string
          description: Namespace name to create or ensure
    policyDelete_Request:
      type: object
      required:
      - space
      properties:
        space:
          type: string
          description: Namespace name
    policyPost_Request:
      type: object
      required:
      - space
      - jsonContent
      properties:
        space:
          type: string
          description: Namespace name
        jsonContent:
          type: object
          description: Policy payload as a JSON object
    resourceDelete_Request:
      type: object
      required:
      - space
      - uuid
      properties:
        space:
          type: string
          description: Namespace name
        uuid:
          type: string
          description: Identifier of the resource to delete (non-empty, at most 256 characters, no control characters)
    resourceGet_Request:
      type: object
      required:
      - space
      - uuid
      properties:
        space:
          type: string
          description: Namespace name
        uuid:
          type: string
          description: Identifier of the resource (non-empty, at most 256 characters, no control characters)
    resourceGet_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          jsonContent:
            type: object
            description: JSON representation of the resource
    resourceList_Request:
      type: object
      required:
      - space
      - type
      properties:
        space:
          type: string
          description: Namespace name
        type:
          type: string
          description: Resource type
          enum:
          - decoder
          - output
          - filter
          - integration
          - kvdb
    resourceList_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          resources:
            type: array
            items:
              $ref: '#/components/schemas/ResourceSummary'
            description: List of resources
    resourcePost_Request:
      type: object
      required:
      - space
      - type
      - jsonContent
      properties:
        space:
          type: string
          description: Namespace name
        type:
          type: string
          description: Resource type
          enum:
          - decoder
          - output
          - filter
          - integration
          - kvdb
        jsonContent:
          type: object
          description: Resource payload as a JSON object
  responses:
    InternalServerError_500:
      description: |
        Internal Server Error. A handler whose backing component is gone answers with a JSON `Response`
        (`Error: Handler is not initialized`); an exception escaping a handler is answered by the server
        with the plain-text body `Internal server error`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example:
            status: ERROR
            error: 'Error: Handler is not initialized'
        text/plain:
          schema:
            type: string
          example: Internal server error
    BadRequest_400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example:
            status: ERROR
            error: Error message
    GenericSuccess_200:
      description: Generic Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example:
            status: OK
