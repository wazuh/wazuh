openapi: 3.0.3
info:
  title: Wazuh-Engine Public API
  description: |
    Public-facing API endpoints of the Wazuh Engine. These endpoints are intended for external consumers such as wazuh-indexer in standalone mode.

    Every route is served on the engine API socket, `/var/wazuh-manager/queue/sockets/engine-api-http.sock`
    (`analysisd.server_api_socket`). Request bodies are JSON; unknown fields are ignored, and an empty body is
    read as an empty request. Responses carry a JSON body labelled `Content-Type: application/json`.
    A body larger than `analysisd.server_api_payload_max_bytes` (default `0`, unlimited) is answered with
    HTTP 413 and a plain-text message.
  version: 1.0.0
servers:
- url: http+unix:/var/wazuh-manager/queue/sockets/engine-api-http.sock
  description: Engine API socket (HTTP over a Unix socket)
tags:
- name: Content
  description: Operations for managing content.
- name: Logtest
  description: Operations for testing of events.
- name: Metrics
  description: Operations for querying and controlling engine metrics.
- name: Status
  description: Engine synchronization status.
paths:
  /status:
    get:
      tags:
      - Status
      summary: Get engine status
      description: |
        Returns the overall engine readiness state and per-resource synchronization details.

        The engine is considered **ready** when all enabled spaces are available
        AND all IOC databases are available AND all geo databases are available.

        Resources may still be updating to their latest version — that does NOT
        block readiness. What matters is having *some* version available.

        Resources are organized into three categories:
        - **spaces**: Content manager policy spaces (e.g., `standard`, `custom`)
        - **ioc**: Indicator of Compromise databases (`connection`, `url_domain`, `url_full`, `hash_md5`, `hash_sha1`, `hash_sha256`)
        - **geo**: Geolocation databases (`city`, `asn`)

        Each resource reports:
        - `available` — whether a usable version is currently loaded (independent of `status`; an old version can stay available after a failed sync)
        - `enabled` — (spaces only) whether the space is enabled in the remote policy; disabled spaces do not block readiness
        - `status` — current sync state: `ready`, `updating`, or `failed`
        - `hash` — last known content hash (empty if never synced)
        - `last_successful_update` — Unix timestamp of last successful sync (0 if never)

        **Readiness formula**: `ready = true` when:
        - All enabled spaces have `available == true`
        - All IOC types have `available == true`
        - All geo databases have `available == true`

        With `analysisd.server_enable_event_processing` set to `false` there is no content or IOC
        synchronization: the route still answers `200`, with empty `spaces` and `ioc` maps and
        `ready: false` (the engine processes no events).
      responses:
        '200':
          description: Status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusGet_Response'
              examples:
                all_ready:
                  summary: All enabled resources are ready
                  value:
                    status: OK
                    ready: true
                    spaces:
                      standard:
                        available: true
                        enabled: true
                        status: ready
                        hash: "a1b2c3d4e5f6"
                        last_successful_update: 1750068600
                      custom:
                        available: false
                        enabled: false
                        status: ready
                        hash: ""
                        last_successful_update: 0
                    ioc:
                      connection:
                        available: true
                        status: ready
                        hash: "f6e5d4c3b2a1"
                        last_successful_update: 1750068600
                      url_domain:
                        available: true
                        status: ready
                        hash: "1a2b3c4d5e6f"
                        last_successful_update: 1750068600
                      url_full:
                        available: true
                        status: ready
                        hash: "0f1e2d3c4b5a"
                        last_successful_update: 1750068600
                      hash_md5:
                        available: true
                        status: ready
                        hash: "abcdef123456"
                        last_successful_update: 1750068600
                      hash_sha1:
                        available: true
                        status: ready
                        hash: "654321fedcba"
                        last_successful_update: 1750068600
                      hash_sha256:
                        available: true
                        status: ready
                        hash: "aabbccddee11"
                        last_successful_update: 1750068600
                    geo:
                      city:
                        available: true
                        status: ready
                        hash: "geo1hash2city"
                        last_successful_update: 1750066800
                      asn:
                        available: true
                        status: ready
                        hash: "geo1hash2asn0"
                        last_successful_update: 1750066800
                not_ready_syncing:
                  summary: Engine not ready (IOC not yet available)
                  value:
                    status: OK
                    ready: false
                    spaces:
                      standard:
                        available: true
                        enabled: true
                        status: ready
                        hash: "a1b2c3d4e5f6"
                        last_successful_update: 1750068600
                      custom:
                        available: false
                        enabled: false
                        status: ready
                        hash: ""
                        last_successful_update: 0
                    ioc:
                      connection:
                        available: false
                        status: updating
                        hash: ""
                        last_successful_update: 0
                      url_domain:
                        available: false
                        status: updating
                        hash: ""
                        last_successful_update: 0
                      url_full:
                        available: false
                        status: updating
                        hash: ""
                        last_successful_update: 0
                      hash_md5:
                        available: false
                        status: updating
                        hash: ""
                        last_successful_update: 0
                      hash_sha1:
                        available: false
                        status: updating
                        hash: ""
                        last_successful_update: 0
                      hash_sha256:
                        available: false
                        status: updating
                        hash: ""
                        last_successful_update: 0
                    geo:
                      city:
                        available: true
                        status: ready
                        hash: "geo1hash2city"
                        last_successful_update: 1750066800
                      asn:
                        available: true
                        status: ready
                        hash: "geo1hash2asn0"
                        last_successful_update: 1750066800
        '500':
          description: A status provider (content sync, IOC sync or geo manager) is unavailable.
          content:
            text/plain:
              schema:
                type: string
              example: Internal Server Error
  /content/validate/policy:
    post:
      tags:
      - Content
      summary: Validate a policy JSON payload
      description: |
        Validates a complete **policy JSON document** by importing it into a temporary namespace.

        The `full_policy` object must have exactly two keys: `policy` (the policy definition) and `resources`
        (an object with the `kvdbs`, `decoders`, `filters`, `outputs` and `integrations` to import). Integrations
        and KVDBs carry their name in `metadata.title`; the policy's own `metadata.title` is optional
        (`Untitled Policy` when absent).

        ## Validation strategy

        - **Policy without integrations** (`policy.integrations` is empty): validated by
          import alone. No tester session is created.
        - **Policy with integrations**: after import, a temporary tester session is created
          on the temporary namespace to verify the policy can be fully instantiated by the Engine.

        ## Effect on the tester session named after `space`

        `space` names the persistent tester session this request may replace (the session `/logtest`
        runs against). The `load_in_tester` flag and the policy `enabled` field jointly decide its fate:

        | `load_in_tester` | Has integrations | `enabled` | Outcome |
        |------------------|------------------|-----------|---------|
        | `false`          | any              | any       | The `space` session is **not touched**. Temporary resources are deleted. |
        | `true`           | no               | any       | The `space` session and its namespace are **deleted**. No new session is created. |
        | `true`           | yes              | `true`    | The temporary session is **renamed** to `space`, replacing the old one (old namespace deleted). |
        | `true`           | yes              | `false`   | The temporary session and namespace **and** the `space` session and its namespace are **deleted**. |

        ## Notes
        - A unique temporary namespace and session name is generated per request
          (`logtest_<hex>` when `load_in_tester` is true, `tmp_policy_validate_<hex>` otherwise).
        - If the Tester API is not available, the request fails immediately.
        - Any import or instantiation failure is returned as a 400 with the underlying error message.
        - This is the only point where the Engine checks the content as a whole. Resource names, for
          example, are unique per type within the imported policy, so a policy carrying two decoders with
          the same name is refused here (`import_failed_duplicate_name`), even though the Wazuh Indexer
          accepted both while they were edited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/policyValidate_Request'
            examples:
              validate_only:
                summary: Validate a policy with integrations, leave the tester session untouched
                value:
                  space: standard
                  load_in_tester: false
                  full_policy:
                    policy:
                      metadata:
                        title: <policy_name>
                      root_decoder: <decoder_uuid>
                      integrations:
                      - <integration_uuid>
                      enabled: true
                    resources:
                      kvdbs: []
                      decoders:
                      - id: <decoder_uuid>
                        name: decoder/<name>/0
                        enabled: true
                        normalize:
                        - map:
                          - '@timestamp': get_date()
                      filters: []
                      outputs: []
                      integrations:
                      - id: <integration_uuid>
                        metadata:
                          title: <name>
                        enabled: true
                        category: security
                        decoders:
                        - <decoder_uuid>
                        kvdbs: []
              validate_no_integrations:
                summary: Validate policy without integrations (import-only validation)
                value:
                  space: standard
                  load_in_tester: false
                  full_policy:
                    policy:
                      metadata:
                        title: <policy_name>
                      integrations: []
                      enabled: true
                    resources:
                      decoders: []
                      integrations: []
                      kvdbs: []
                      filters: []
                      outputs: []
              validate_and_load_testing:
                summary: Validate and promote to the `space` tester session (enabled policy with integrations)
                value:
                  space: test
                  load_in_tester: true
                  full_policy:
                    policy:
                      metadata:
                        title: <policy_name>
                      root_decoder: <decoder_uuid>
                      integrations:
                      - <integration_uuid>
                      filters:
                      - <filter_uuid>
                      enabled: true
                    resources:
                      kvdbs:
                      - id: <kvdb_uuid>
                        metadata:
                          title: <name>
                        enabled: true
                        content:
                          <key>: {}
                      decoders:
                      - id: <decoder_uuid>
                        name: decoder/<name>/0
                        enabled: true
                        normalize:
                        - map:
                          - '@timestamp': get_date()
                      integrations:
                      - id: <integration_uuid>
                        metadata:
                          title: <name>
                        enabled: true
                        category: security
                        decoders:
                        - <decoder_uuid>
                        kvdbs:
                        - <kvdb_uuid>
                      filters:
                      - name: filter/prefilter/0
                        metadata:
                          description: Default filter to allow all events (for default ruleset)
                          author:
                            name: Wazuh, Inc.
                            url: https://wazuh.com
                            date: 2022/11/08
                        check: $host.os.platform == 'ubuntu'
                        type: pre-filter
                        enabled: true
                        id: <filter_uuid>
                      outputs: []
              validate_disabled_policy:
                summary: "Validate a disabled policy — deletes the `space` tester session"
                value:
                  space: test
                  load_in_tester: true
                  full_policy:
                    policy:
                      metadata:
                        title: <policy_name>
                      integrations: []
                      enabled: false
                    resources:
                      decoders: []
                      integrations: []
                      kvdbs: []
                      filters: []
                      outputs: []
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                missing_full_policy:
                  summary: Missing or empty full_policy
                  value:
                    status: ERROR
                    error: Missing full policy
                missing_space:
                  summary: Missing or empty space
                  value:
                    status: ERROR
                    error: Field /space cannot be empty
                tester_unavailable:
                  summary: Tester API is not available
                  value:
                    status: ERROR
                    error: Tester API is not available
                import_failed:
                  summary: The policy could not be imported into the temporary namespace
                  value:
                    status: ERROR
                    error: "Failed to import namespace 'tmp_policy_validate_<hex>': <details>"
                import_failed_duplicate_name:
                  summary: Two resources of the same type share a name
                  value:
                    status: ERROR
                    error: "Failed to import namespace 'logtest_<hex>': Resource with name 'decoder/core-wazuh-message/0' and type 'decoder' already exists"
                tester_failed:
                  summary: Creating or renaming the tester session failed (the tester's error message is returned as is)
                  value:
                    status: ERROR
                    error: <tester error>
                cleanup_failed_session:
                  summary: "Strict cleanup failed — could not delete a session"
                  value:
                    status: ERROR
                    error: 'Cleanup: failed deleting session ''<name>'': <details>'
                cleanup_failed_namespace:
                  summary: "Strict cleanup failed — could not delete a namespace"
                  value:
                    status: ERROR
                    error: 'Cleanup: failed deleting namespace ''<name>'': <details>'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /logtest:
    post:
      tags:
      - Logtest
      summary: Inject an event into an existing testing session
      description: |
        Injects a single event into the engine using a previously created and loaded testing session
        (created by `POST /content/validate/policy` with `load_in_tester: true`).

        This endpoint **does not** validate policies and **does not** create sessions.
        It only validates request parameters, builds the event, and runs the test ingestion
        against the session named by the `space` field. The run times out after `analysisd.server_api_timeout` milliseconds (default 5000).

        If tracing is enabled (`trace_level` other than `NONE`), the endpoint retrieves the list of policy assets
        from the testing session and traces all of them.

        After the pipeline finishes, temporary fields (root key starts with `_`) are removed from the
        output event, which is then validated against the Wazuh Common Schema (WCS). Validation is
        **non-blocking**: the pipeline result is always returned regardless of validation errors.

        Each entry in `result.validation.errors` has:
        - `path` — field path using dot notation for nesting and `[N]` for array indices
          (e.g. `"event.severity"`, `"tags[1]"`, `"hits[0].id"`).
        - `kind` — `unknown_field` (the field is not defined in WCS and is not a temporary field) or
          `invalid_type` (the value does not match the WCS type for that field).
        - `expected` / `actual` — type strings, present only for `invalid_type` errors
          (e.g. `"keyword"`, `"object"`, `"number"`).

        Any WCS field can hold either a single value or an array of values of the same type.
        Arrays are always unrolled: each element is validated individually using the field's
        schema type. Only one error is reported per invalid element.
        `FLAT_OBJECT` and `GEO_POINT` fields are treated as opaque: their children are never visited.

        `result.validation` is only present when the schema validator is available and the
        pipeline produced an output event. Errors are sorted by path, with kind as tiebreaker.

        Request rules, checked in this order:
        - `queue` must be 1..255.
        - `trace_level` must be `NONE`, `ASSET_ONLY` or `ALL` (case-insensitive).
        - `metadata` is **optional**. When present it must be a JSON object that is either empty or has
          `wazuh` (an object) as its only key; every leaf under `wazuh` must be a field of the event
          schema with a value of the right type. The object is merged into the event root.
        - `event` must not be empty or whitespace only.
        - `space` must not be empty.
        - `location` cannot be empty. It is stored as given in `wazuh.protocol.location`; the event text goes
          to `event.original` and the queue to `wazuh.protocol.queue`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicRunPost_Request'
            examples:
              basic:
                summary: Basic run using queue 1
                value:
                  space: test
                  queue: 1
                  location: /var/log/auth.log
                  metadata:
                    wazuh:
                      agent:
                        name: AgentName
                  event: 'Dec 19 12:00:00 host sshd[123]: Failed password for root from 10.0.0.1 port 12345 ssh2'
                  trace_level: NONE
              with_trace:
                summary: Run with tracing enabled
                value:
                  space: test
                  queue: 1
                  location: syslog
                  metadata:
                    wazuh:
                      agent:
                        id: '001'
                  event: '<34>Dec 19 12:00:00 my-agent myapp: something happened'
                  trace_level: ALL
              metadata_wazuh_ok:
                summary: metadata with top-level `wazuh` object
                value:
                  space: test
                  queue: 1
                  location: syscheck
                  metadata:
                    wazuh:
                      agent:
                        host:
                          ip: 192.168.1.10
                  event: File /etc/passwd modified
                  trace_level: ALL
              metadata_wazuh_wrong_type:
                summary: INVALID - metadata with type mismatch
                value:
                  space: test
                  queue: 1
                  location: syscheck
                  metadata:
                    wazuh:
                      agent:
                        host:
                          ip: notAnIpAddress
                  event: File /etc/passwd modified
                  trace_level: ALL
              metadata_wazuh_nested_ok:
                summary: metadata can provide nested `wazuh` fields accepted by the event schema
                value:
                  space: test
                  queue: 1
                  location: syscheck
                  metadata:
                    wazuh:
                      agent:
                        id: '001'
                        groups:
                        - default
                  event: File /etc/passwd modified
                  trace_level: ALL
              metadata_wazuh_empty_valid:
                summary: VALID - empty wazuh metadata object
                value:
                  space: test
                  queue: 1
                  location: syscheck
                  metadata:
                    wazuh: {}
                  event: File /etc/passwd modified
                  trace_level: ALL
              metadata_empty_object_valid:
                summary: VALID - empty metadata object
                value:
                  space: test
                  queue: 1
                  location: syscheck
                  metadata: {}
                  event: File /etc/passwd modified
                  trace_level: ALL
              metadata_omitted_valid:
                summary: VALID - metadata omitted
                value:
                  space: test
                  queue: 1
                  location: syscheck
                  event: File /etc/passwd modified
                  trace_level: ALL
              metadata_non_wazuh_key_invalid:
                summary: INVALID - non-`wazuh` top-level metadata fields are rejected
                value:
                  space: test
                  queue: 1
                  location: syscheck
                  metadata:
                    name: test-host
                  event: File /etc/passwd modified
                  trace_level: ALL
              metadata_as_string_invalid:
                summary: INVALID - metadata is a JSON-encoded string (an object is expected)
                value:
                  space: test
                  queue: 1
                  location: syscheck
                  metadata: '{"wazuh": {}}'
                  event: File /etc/passwd modified
                  trace_level: ALL
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterRunPost_Response'
              examples:
                ok_with_wazuh_metadata:
                  summary: OK - `metadata.wazuh` contributes Wazuh-scoped fields
                  value:
                    status: OK
                    result:
                      output:
                        wazuh:
                          protocol:
                            queue: 1
                            location: syscheck
                          integration:
                            category: security
                            name: integration/wazuh-core/0
                            decoders:
                            - core-wazuh-message
                            - integrations
                          agent:
                            name: AgentName
                        event:
                          original: File /etc/passwd modified
                        '@timestamp': '2025-12-26T17:33:22Z'
                      asset_traces:
                      - asset: decoder/core-wazuh-message/0
                        success: true
                        traces:
                        - '@timestamp: get_date -> Success'
                      validation:
                        valid: true
                        errors: []
                ok_with_validation_errors:
                  summary: OK - pipeline ran but output has WCS validation errors (non-blocking)
                  value:
                    status: OK
                    result:
                      output:
                        wazuh:
                          protocol:
                            queue: 1
                            location: syscheck
                        event:
                          original: 42
                        unknown_field: value
                      asset_traces: []
                      validation:
                        valid: false
                        errors:
                        - path: event.original
                          kind: invalid_type
                          expected: keyword
                          actual: number
                        - path: unknown_field
                          kind: unknown_field
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                missing_queue:
                  summary: Queue missing or zero
                  value:
                    status: ERROR
                    error: queue is required and must be non-zero (1..255)
                invalid_queue:
                  summary: Queue out of allowed range (1..255)
                  value:
                    status: ERROR
                    error: 'Invalid queue: 300 (must be 1..255)'
                invalid_trace_level:
                  summary: Unsupported trace level
                  value:
                    status: ERROR
                    error: 'Invalid trace level: VERBOSE. Only support: NONE, ASSET_ONLY, ALL'
                metadata_not_object:
                  summary: metadata is not a JSON object (the request body does not parse)
                  value:
                    status: ERROR
                    error: 'Failed to parse protobuff json request: <details>'
                metadata_extra_top_level_keys:
                  summary: metadata has more than one top-level key
                  value:
                    status: ERROR
                    error: If not empty metadata must contain only 'wazuh' as the top-level key
                metadata_unknown_top_level_field:
                  summary: metadata's only key is not a `wazuh` object
                  value:
                    status: ERROR
                    error: Metadata should contain 'wazuh' as root
                metadata_field_rejected:
                  summary: A metadata leaf is not an event-schema field or has the wrong type
                  value:
                    status: ERROR
                    error: Metadata field 'wazuh.agent.host.ip' doesn't exist or doesn't match the expected one from the schema
                empty_event:
                  summary: Event missing or blank
                  value:
                    status: ERROR
                    error: event is required and cannot be empty
                empty_space:
                  summary: Space missing or empty
                  value:
                    status: ERROR
                    error: space is required and cannot be empty
                empty_location:
                  summary: Location cannot be empty
                  value:
                    status: ERROR
                    error: 'Error parsing event: Invalid format: location cannot be empty'
                timeout:
                  summary: The test run did not finish within analysisd.server_api_timeout
                  value:
                    status: ERROR
                    error: Timeout waiting for ingestTest
        '500':
          $ref: '#/components/responses/InternalServerError_500'
    delete:
      tags:
      - Logtest
      summary: Cleanup logtest session and its namespace
      description: |
        Deletes the namespace of the testing session named by `space` (including all its assets),
        then the session itself.

        This operation is idempotent: if there is no session named `space`, it returns **OK**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogtestDelete_Request'
            examples:
              cleanup_test:
                summary: Cleanup the test space
                value:
                  space: test
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                ok:
                  summary: Cleanup completed or nothing to delete
                  value:
                    status: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                empty_space:
                  summary: Space missing or empty
                  value:
                    status: ERROR
                    error: space is required and cannot be empty
                cleanup_failed_namespace:
                  summary: The session's namespace could not be deleted
                  value:
                    status: ERROR
                    error: 'Cleanup: failed deleting namespace ''<name>'': <details>'
                cleanup_failed_session:
                  summary: The session could not be deleted
                  value:
                    status: ERROR
                    error: 'Cleanup: failed deleting session ''<name>'': <details>'
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /content/ioc/update:
    post:
      tags:
      - Content
      summary: Update IOCs from a file
      description: "Performs an asynchronous update of the Indicators of Compromise (IOCs) in the manager \nusing the provided file path and hash.\n\nThe file must be in **nd-json** (newline-delimited JSON) format, where each line \nrepresents a single IOC JSON object containing at minimum:\n- `name`: The IOC value (IP, domain, hash, etc.)\n- `type`: The IOC type, one of \"connection\", \"url_full\", \"url_domain\", \"hash_md5\", \"hash_sha1\", \"hash_sha256\"\n  (lines with a missing key or an unsupported type are skipped)\n\n**Hash-based optimization**: The `hash` field (typically MD5) is used to skip the \nupdate if the file content hasn't changed since the last synchronization, improving \nefficiency and reducing unnecessary I/O operations.\n\n**Behavior**:\n- If the hash matches the previously stored hash, returns OK without performing sync.\n- If the hash differs, schedules an asynchronous synchronization task.\n- Only one synchronization can run at a time (enforced by internal semaphore).\n- Updates are performed using a hot-swap mechanism to avoid service interruption.\n\n**Error handling**:\n\
        - `path` must resolve (symlinks followed) to a regular file inside the IOC input directory\n  (`analysisd.kvdb_ioc_input_path`, default `/var/wazuh-manager/data/ioc-input`). A path outside it,\n  a directory, a special file, a nonexistent path or one escaping the directory through `..` or a symlink\n  is rejected with the same 400 Bad Request (`Field /path must be a regular file inside <directory>`),\n  so the response does not reveal whether a path outside the directory exists.\n- A file without a single valid IOC line is rejected by the synchronization task: the current IOC data and\n  the stored hash are kept and `GET /content/ioc/state` reports `No valid IOC lines in file`.\n- An empty `hash` field results in a 400 Bad Request (`Field /hash cannot be empty`).\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIoc_Request'
            examples:
              update_iocs:
                summary: Update IOCs from file with hash
                value:
                  path: /var/wazuh-manager/data/ioc-input/threat-intel.ndjson
                  hash: 5d41402abc4b2a76b9719d911017c592
      responses:
        '200':
          description: Success - Synchronization scheduled or skipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                sync_scheduled:
                  summary: Synchronization task scheduled successfully
                  value:
                    status: OK
                hash_match_no_sync:
                  summary: Hash matches, synchronization skipped
                  value:
                    status: OK
                    error: IOC data is already up to date
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                empty_path:
                  summary: Path field is empty
                  value:
                    status: ERROR
                    error: Field /path cannot be empty
                empty_hash:
                  summary: Hash field is empty
                  value:
                    status: ERROR
                    error: Field /hash cannot be empty
                path_outside_input_dir:
                  summary: Path is not a regular file inside the IOC input directory
                  value:
                    status: ERROR
                    error: 'Field /path must be a regular file inside /var/wazuh-manager/data/ioc-input'
                sync_in_progress:
                  summary: Another synchronization is already updating
                  value:
                    status: ERROR
                    error: IOC synchronization already in progress
                schedule_failed:
                  summary: The synchronization task could not be scheduled
                  value:
                    status: ERROR
                    error: 'Failed to schedule IOC sync task: <details>'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                store_unavailable:
                  summary: Store service is not available
                  value:
                    status: ERROR
                    error: Store is not available
                scheduler_unavailable:
                  summary: Scheduler service is not available
                  value:
                    status: ERROR
                    error: Scheduler is not available
  /content/ioc/state:
    get:
      tags:
      - Content
      summary: Get IOC synchronization state
      description: 'Retrieves the current state of the IOC manager, including:

        - **hash**: MD5 hash of the last successfully synchronized IOC file

        - **updating**: Boolean indicating if a synchronization is currently in progress

        - **lastError**: Error message from the last failed synchronization (empty if last sync succeeded)


        This endpoint is useful for:

        - Monitoring IOC synchronization status

        - Checking if updates are being processed

        - Diagnosing synchronization failures

        - Verifying which IOC file version is currently active

        '
      responses:
        '200':
          description: Success - State retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIocState_Response'
              examples:
                idle_state:
                  summary: No sync in progress, last sync successful
                  value:
                    status: OK
                    hash: 5d41402abc4b2a76b9719d911017c592
                    updating: false
                    lastError: ''
                syncing_state:
                  summary: Synchronization currently in progress
                  value:
                    status: OK
                    hash: 5d41402abc4b2a76b9719d911017c592
                    updating: true
                    lastError: ''
                error_state:
                  summary: Last synchronization failed
                  value:
                    status: OK
                    hash: abc123def456
                    updating: false
                    lastError: 'Failed to open file: /path/to/iocs.ndjson'
                initial_state:
                  summary: No IOCs synchronized yet
                  value:
                    status: OK
                    hash: ''
                    updating: false
                    lastError: ''
                store_error:
                  summary: Store is not available
                  value:
                    status: ERROR
                    hash: ''
                    updating: false
                    lastError: Store is not available
  /content/ioc/sync:
    post:
      tags:
      - Content
      summary: Synchronize IOCs from the Wazuh Indexer
      description: "Runs the IoC synchronization now, one cycle for every tracked IoC type, instead of waiting for the next `analysisd.ioc_sync_interval` tick.\n\nThis is the **indexer-backed** counterpart to `POST /content/ioc/update`, which ingests a LOCAL\nnd-json file given a path and a hash. The two share no input and no code path, which is why they\nare separate endpoints rather than one endpoint with a mode flag.\n\n**Behaviour**:\n- Takes no parameters. A request body, if sent, is ignored.\n- Returns as soon as the request is queued: the answer means **accepted**, not **finished**.\n- Per-type progress and results are read from `GET /status`.\n- A type whose remote hash has not moved costs one probe and downloads nothing.\n- A request that arrives while a synchronization is running is served by one more run right after\n  it; a burst of requests coalesces into that one run, so the endpoint is safe to call repeatedly.\n"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            examples:
              sync_now:
                summary: Trigger an IOC synchronization
                value: {}
      responses:
        '200':
          description: Success - Synchronization queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                queued:
                  summary: Synchronization queued for every tracked IoC type
                  value:
                    status: OK
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                service_unavailable:
                  summary: IOC Sync service is not available
                  value:
                    status: ERROR
                    error: IOC Sync service is not available
  /content/ruleset/update:
    post:
      tags:
      - Content
      summary: Synchronize the ruleset from the Wazuh Indexer
      description: "Runs the ruleset synchronization now, one cycle for every tracked ruleset space, instead of waiting for the next `analysisd.cm_sync_interval` tick.\n\n**Behaviour**:\n- Takes no parameters. A request body, if sent, is ignored.\n- Returns as soon as the request is queued: the answer means **accepted**, not **finished**.\n- Per-space progress and results are read from `GET /status`.\n- A space whose remote hash has not moved costs one probe and downloads nothing.\n- A request that arrives while a synchronization is running is served by one more run right after\n  it; a burst of requests coalesces into that one run, so the endpoint is safe to call repeatedly.\n- A space whose remote policy is disabled has its route and namespace removed instead.\n"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            examples:
              update_now:
                summary: Trigger a ruleset synchronization
                value: {}
      responses:
        '200':
          description: Success - Synchronization queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                queued:
                  summary: Synchronization queued for every tracked space
                  value:
                    status: OK
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                service_unavailable:
                  summary: Content Manager Sync service is not available
                  value:
                    status: ERROR
                    error: Content Manager Sync service is not available
  /content/validate/resource:
    post:
      tags:
      - Content
      summary: Validate a content resource
      description: |
        Validates a content resource payload before storing it, without a namespace: a resource is checked
        independently from other assets (referenced decoders and KVDBs need not exist).

        The request body must be a JSON object with a non-empty `type` and a non-empty `resource` object.
        `resource.id` must be present for integrations and KVDBs; identifiers are opaque (any UUID version
        or other format is accepted).

        The request body size is limited by:
        - `analysisd.api_resource_payload_max_bytes` (default 50000), for every type except `kvdb`
        - `analysisd.api_resource_kvdb_payload_max_bytes` (default 100000), for `kvdb`

        A value of `0` means unlimited for that limit. A body over the limit for its type is rejected with
        HTTP 413 (when both limits are set, a body over the larger of the two is rejected before the type is read).

        `type` must be `decoder`, `filter`, `integration` or `kvdb`; any other value (including `output`) is
        rejected with 400 `Unsupported value for /type`.

        Per type:
        - **decoder**, **filter**: the asset name (`name`) must start with the type (`decoder/…`, `filter/…`) and
          the asset must pass the builder's shallow validation.
        - **integration**: `id`, `metadata.title`, `enabled` and `category` are required; `category` must be one of
          `access-management`, `applications`, `cloud-services`, `network-activity`, `other`, `security`,
          `system-activity`, `unclassified`; `decoders[]` and `kvdbs[]` must be non-empty, non-duplicated identifiers;
          `default_parent`, if present, must be a non-empty identifier.
        - **kvdb**: `id`, `metadata.title`, `enabled` and a `content` JSON object are required.

        Validation failures are returned as 400 with `Failed to validate resource of type '<type>': <details>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentValidate_Request'
            examples:
              kvdb_validate:
                summary: Validate a KVDB resource
                value:
                  type: kvdb
                  resource:
                    id: 82e215c4-988a-4f64-8d15-b98b2fc03a4f
                    date: '2025-10-06T13:32:19Z'
                    metadata:
                      title: windows_kerberos_status_code_to_code_name
                    author: Wazuh Inc.
                    content:
                      '0x0': KDC_ERR_NONE
                      '0x1': KDC_ERR_NAME_EXP
                      '0x2': KDC_ERR_SERVICE_EXP
                      '0x3': KDC_ERR_BAD_PVNO
                      '0x4': KDC_ERR_C_OLD_MAST_KVNO
                      '0x5': KDC_ERR_S_OLD_MAST_KVNO
                      '0x6': KDC_ERR_C_PRINCIPAL_UNKNOWN
                    enabled: true
              integration_validate_with_parent:
                summary: Validate an Integration resource (with optional default_parent)
                value:
                  type: integration
                  resource:
                    id: 5c1df6b6-1458-4b2e-9001-96f67a8b12c8
                    metadata:
                      title: windows
                    enabled: true
                    category: security
                    default_parent: 85853f26-5779-469b-86c4-c47ee7d400b4
                    decoders:
                    - 85853f26-5779-469b-86c4-c47ee7d400b4
                    - 4aa06596-5ba9-488c-8354-2475705e1257
                    - 4da71af3-fff5-4b67-90d6-51db9e15bc47
                    - 6f8bd7d2-8516-4b2b-a6f1-cc924513c404
                    kvdbs: []
              integration_validate_no_parent:
                summary: Validate an Integration resource (no default_parent)
                value:
                  type: integration
                  resource:
                    id: 5c1df6b6-1458-4b2e-9001-96f67a8b12c8
                    metadata:
                      title: windows
                    enabled: false
                    category: security
                    decoders:
                    - 85853f26-5779-469b-86c4-c47ee7d400b4
                    kvdbs: []
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess_200'
        '400':
          description: Bad Request. The request was malformed or failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                missing_type:
                  summary: Missing /type
                  value:
                    status: ERROR
                    error: Field /type is required
                missing_resource:
                  summary: Missing or empty /resource
                  value:
                    status: ERROR
                    error: Field /resource cannot be empty
                unsupported_type:
                  summary: Unsupported /type
                  value:
                    status: ERROR
                    error: Unsupported value for /type
                invalid_json:
                  summary: Body is not valid JSON for the request
                  value:
                    status: ERROR
                    error: 'Failed to parse protobuff json request: <details>'
                integration_invalid_category:
                  summary: Integration invalid category
                  value:
                    status: ERROR
                    error: "Failed to validate resource of type 'integration': Integration category is not valid: ossec"
        '413':
          description: Payload Too Large. The body exceeds the limit for its type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                too_large_for_type:
                  summary: Body over the limit of its type
                  value:
                    status: ERROR
                    error: "Request body exceeds maximum allowed size of 50000 bytes for type 'decoder'"
                too_large:
                  summary: Body over the larger of both limits
                  value:
                    status: ERROR
                    error: Request body exceeds maximum allowed document size of 100000 bytes
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /metrics/enable:
    post:
      tags:
      - Metrics
      summary: Enable or disable a specific metric
      description: 'Enables or disables collection for a specific metric instrument.


        When disabled, the metric still exists and can be queried, but its value is

        no longer updated by the engine pipeline.


        **Space resolution**: if the `space` field is provided, the metric name is resolved

        internally as `space.<space>.<instrumentName>`. This allows consumers to reference

        per-space metrics by their short name (e.g., `events.discarded`) without knowing

        the internal naming convention.


        If `space` is omitted, `instrumentName` is used as-is (for global metrics like

        `router.events.processed`).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsEnable_Request'
            examples:
              enable_global:
                summary: Enable a global metric
                value:
                  instrumentName: router.events.processed
                  status: true
              disable_per_space:
                summary: Disable a per-space metric
                value:
                  instrumentName: events.discarded
                  space: standard
                  status: false
      responses:
        '200':
          description: Metric enabled/disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsEnable_Response'
              examples:
                success:
                  summary: Metric enabled
                  value:
                    status: OK
                    content: Metric 'router.events.processed' enabled
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                not_found:
                  summary: Metric not found
                  value:
                    status: ERROR
                    error: Metric 'router.events.unknown' not found
                missing_name:
                  summary: instrumentName missing
                  value:
                    status: ERROR
                    error: Field 'instrumentName' is required
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /metrics/get:
    post:
      tags:
      - Metrics
      summary: Get a single metric value and metadata
      description: 'Retrieves the current value, type, and enablement status of a single metric.


        **Space resolution**: if the `space` field is provided, the metric name is resolved

        internally as `space.<space>.<instrumentName>`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsGet_Request'
            examples:
              get_global:
                summary: Get a global metric
                value:
                  instrumentName: router.events.processed
              get_per_space:
                summary: Get a per-space metric
                value:
                  instrumentName: events.discarded
                  space: standard
      responses:
        '200':
          description: Metric value retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsGet_Response'
              examples:
                counter:
                  summary: Counter metric
                  value:
                    status: OK
                    name: router.events.processed
                    type: counter
                    enabled: true
                    value: 123456
                per_space:
                  summary: Per-space counter
                  value:
                    status: OK
                    name: space.standard.events.discarded
                    type: counter
                    enabled: true
                    value: 42
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                not_found:
                  summary: Metric not found
                  value:
                    status: ERROR
                    error: Metric 'unknown.metric' not found
                missing_name:
                  summary: instrumentName missing
                  value:
                    status: ERROR
                    error: Field 'instrumentName' is required
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /metrics/list:
    post:
      tags:
      - Metrics
      summary: List all registered metric names
      description: 'Returns the names of all registered metrics.


        If `space` is provided, only metrics belonging to that space are returned
        (those matching the internal prefix `space.<space>.`), with that prefix stripped.

        An empty result is an error (400).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsList_Request'
            examples:
              list_all:
                summary: List all metrics
                value: {}
              list_space:
                summary: List metrics for a specific space
                value:
                  space: standard
      responses:
        '200':
          description: Metric names retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsList_Response'
              examples:
                all_metrics:
                  summary: All registered metrics (excerpt)
                  value:
                    status: OK
                    names:
                    - router.events.processed
                    - router.eps.1m
                    - router.eps.5m
                    - router.eps.30m
                    - router.queue.size
                    - router.queue.usage.percent
                    - router.events.dropped
                    - agent.cache.entries
                    - agent.cache.bytes
                    - agent.cache.max_entries
                    - agent.cache.max_bytes
                    - agent.cache.bypass.max_entries
                    - agent.cache.bypass.max_bytes
                    - agent.cache.hits
                    - agent.cache.insertions
                    - agent.cache.updates
                    - agent.cache.evictions
                    - agent.cache.rejected.identity
                    - space.standard.events.discarded
                    - space.standard.events.unclassified
                    - space.standard.events.discarded.prefilter
                    - space.standard.events.discarded.postfilter
                space_filtered:
                  summary: Only metrics for space 'standard' (prefix stripped)
                  value:
                    status: OK
                    names:
                    - events.discarded
                    - events.unclassified
                    - events.discarded.prefilter
                    - events.discarded.postfilter
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                invalid_space:
                  summary: Space not found
                  value:
                    status: ERROR
                    error: No metrics found for space 'nonexistent'
                none_registered:
                  summary: No metric is registered
                  value:
                    status: ERROR
                    error: No metrics registered
        '500':
          $ref: '#/components/responses/InternalServerError_500'
  /metrics/dump:
    post:
      tags:
      - Metrics
      summary: Dump all metrics with their current values
      description: "Returns a full snapshot of all registered metrics, organized into two groups:\n\n- **`global`**: engine-wide metrics not scoped to any specific space\n  (e.g., `router.events.processed`, `router.eps.1m`).\n- **`spaces`**: per-space metrics grouped by space name. The internal prefix\n  `space.<name>.` is stripped from metric names for readability.\n\nThe response also includes:\n- **`name`**: daemon identifier (e.g., `wazuh-manager-analysisd`)\n- **`uptime`**: ISO 8601 timestamp of when the daemon started\n- **`timestamp`**: ISO 8601 timestamp of when the dump was collected\n\nThis endpoint is designed for monitoring dashboards and observability tools.\n"
