components:
  schemas:
    ReturnStatus:
      type: string
      enum:
      - UNKNOWN
      - OK
      - ERROR
      description: Status codes representing different return states.
    ReturnError:
      type: string
      description: Error message; present when status is ERROR (absent otherwise, except where an endpoint documents an informational message).
    Response:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReturnStatus'
        error:
          $ref: '#/components/schemas/ReturnError'
    EmptyRequest:
      type: object
      description: Empty request body
      properties: {}
    ResourceName:
      type: string
      description: Name of the resource, a '/' separated string. Where the first part is the type, the second part is the name, and the last part is the version.
      example: type/name/0
    Namespace:
      type: string
      description: Namespace where the policy and assets are located
      example: namespace1
    Result_ValidationError:
      type: object
      properties:
        path:
          type: string
          description: Field path using dot notation for nesting and [N] for array indices (e.g. "event.severity", "tags[1]")
        kind:
          type: string
          enum:
          - unknown_field
          - invalid_type
          - temporary_field_not_allowed
          description: 'Type of validation error:

            - `unknown_field`: field is not defined in WCS and is not a temporary field.

            - `invalid_type`: value does not match the WCS type for that field.

            - `temporary_field_not_allowed`: field is a pipeline-internal field (root starts with `_`).

            '
        expected:
          type: string
          nullable: true
          description: Expected WCS type string. Only present for `invalid_type` errors (e.g. "keyword", "long").
        actual:
          type: string
          nullable: true
          description: Actual JSON type string of the value. Only present for `invalid_type` errors (e.g. "number", "object").
    Result_Validation:
      type: object
      properties:
        valid:
          type: boolean
          description: True when the output event contains no WCS validation errors.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Result_ValidationError'
          description: List of WCS validation errors found in the output event. Empty when valid is true. Sorted by path (alphabetical); kind is used as tiebreaker when two errors share the same path.
    TesterResult:
      type: object
      properties:
        output:
          type: object
          description: JSON output of the event
        asset_traces:
          type: array
          items:
            type: object
            properties:
              asset:
                $ref: '#/components/schemas/ResourceName'
              success:
                type: boolean
                description: If the asset was successfully decoded
              traces:
                type: array
                items:
                  type: string
                description: Traces of the asset
        validation:
          $ref: '#/components/schemas/Result_Validation'
          description: WCS schema validation result. Present in tester-run and logtest responses, only when the schema validator is available and the pipeline produced an output event.
          nullable: true
    TesterRunPost_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          result:
            $ref: '#/components/schemas/TesterResult'
    policyValidate_Request:
      type: object
      required:
      - full_policy
      - space
      properties:
        space:
          type: string
          description: Target space/session name (e.g. test, standard). Determines which tester session to promote into.
        load_in_tester:
          type: boolean
          description: If true, load testing policies into the Tester environment.
        full_policy:
          type: object
          description: Full policy JSON payload
    UpdateIoc_Request:
      type: object
      required:
      - path
      - hash
      properties:
        path:
          type: string
          description: Absolute path to the ndjson file containing IOCs to synchronize. Must be a regular file inside the IOC input directory (`analysisd.kvdb_ioc_input_path`).
          example: /var/wazuh-manager/data/ioc-input/threat-intel.ndjson
        hash:
          type: string
          description: MD5 hash of the IOC file. Required for change detection and skipping unnecessary syncs.
          example: 5d41402abc4b2a76b9719d911017c592
    GetIocState_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          hash:
            type: string
            description: MD5 hash of the current IOCs in the manager
            example: 5d41402abc4b2a76b9719d911017c592
          updating:
            type: boolean
            description: Indicates if an IOC synchronization is currently in progress
            example: false
          lastError:
            type: string
            description: Error message from last failed synchronization. Empty if last sync succeeded.
            example: ''
    SpaceState:
      type: object
      description: State of a content manager space (has enabled flag)
      properties:
        available:
          type: boolean
          description: Whether a usable version of the space is currently available for event processing. Independent of status — a previously synced version stays available even if the latest sync failed.
        enabled:
          type: boolean
          description: Whether the space is enabled in the remote policy. Disabled spaces do not block readiness.
        status:
          type: string
          enum:
          - ready
          - updating
          - failed
          description: 'Current synchronization state: ready (idle), updating (syncing), or failed (last sync errored).'
        hash:
          type: string
          description: Last known content hash. Empty string if never synced.
        last_successful_update:
          type: integer
          format: uint32
          description: Unix timestamp of last successful synchronization. 0 if never synced.
    ResourceState:
      type: object
      description: State of an IOC or Geo resource (always active, no enabled flag)
      properties:
        available:
          type: boolean
          description: Whether the resource has a version available for processing.
        status:
          type: string
          enum:
          - ready
          - updating
          - failed
          description: 'Current synchronization state: ready (idle), updating (syncing), or failed (last sync errored).'
        hash:
          type: string
          description: Last known content hash. Empty string if never synced.
        last_successful_update:
          type: integer
          format: uint32
          description: Unix timestamp of last successful synchronization. 0 if never synced.
    StatusGet_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          ready:
            type: boolean
            description: Overall readiness. True when all enabled spaces are available AND all IOC and geo databases are available.
          spaces:
            type: object
            description: Content manager policy spaces keyed by name (e.g., "standard", "custom").
            additionalProperties:
              $ref: '#/components/schemas/SpaceState'
          ioc:
            type: object
            description: IOC databases keyed by type name (e.g., "connection", "url_domain").
            additionalProperties:
              $ref: '#/components/schemas/ResourceState'
          geo:
            type: object
            description: Geolocation databases keyed by type name (e.g., "city", "asn").
            additionalProperties:
              $ref: '#/components/schemas/ResourceState'
    PublicRunPost_Request:
      type: object
      required:
      - queue
      - location
      - event
      - trace_level
      - space
      properties:
        space:
          type: string
          description: Target space/session name to run against (e.g. test, standard)
        queue:
          type: integer
          minimum: 1
          maximum: 255
          description: Queue number where the event will be injected (engine/input queue)
        location:
          type: string
          description: Event source/location label (e.g., file path, agent name, or custom identifier)
        metadata:
          type: object
          description: 'Optional metadata object, merged into the event root. It must be empty or have `wazuh` (an object) as its only key, and every leaf under `wazuh` must be an event-schema field of the right type.'
        event:
          type: string
          description: Raw event payload to test
        trace_level:
          type: string
          enum:
          - NONE
          - ASSET_ONLY
          - ALL
          description: Level of traces (case-insensitive)
    LogtestDelete_Request:
      type: object
      required:
      - space
      properties:
        space:
          type: string
          description: Target space/session name to delete (e.g. test, standard)
    ContentValidate_Request:
      type: object
      required:
      - type
      - resource
      properties:
        type:
          type: string
          enum:
          - decoder
          - filter
          - integration
          - kvdb
        resource:
          type: object
          description: JSON object of the resource to validate
    MetricsEnable_Request:
      type: object
      properties:
        instrumentName:
          type: string
          description: Metric name. For global metrics use the full name (e.g., 'router.events.processed'). For per-space metrics use the short name (e.g., 'events.discarded') along with the `space` field.
        status:
          type: boolean
          description: true = enable collection, false = disable collection. Defaults to true.
          default: true
        space:
          type: string
          description: Space name (policy/namespace). When set, the metric is resolved internally as 'space.<space>.<instrumentName>'.
    MetricsEnable_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          content:
            type: string
            description: Confirmation message, `Metric '<name>' enabled` or `Metric '<name>' disabled`.
    MetricsGet_Request:
      type: object
      properties:
        instrumentName:
          type: string
          description: Metric name. For global metrics use the full name. For per-space metrics use the short name along with the `space` field.
        space:
          type: string
          description: Space name. When set, the metric is resolved internally as 'space.<space>.<instrumentName>'.
    MetricsGet_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          name:
            type: string
            description: Resolved metric name (full internal name, e.g., 'space.standard.events.discarded')
          type:
            type: string
            description: Metric type as string
            enum:
            - counter
            - gauge_int
            - pull
          enabled:
            type: boolean
            description: Whether metric collection is currently enabled
          value:
            type: number
            description: Current metric value
    MetricsList_Request:
      type: object
      properties:
        space:
          type: string
          description: If set, list only metrics belonging to this space (filters by internal prefix 'space.<space>.')
    MetricsList_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          names:
            type: array
            items:
              type: string
            description: List of registered metric names matching the filter
    MetricEntry:
      type: object
      description: A single metric with its current value and metadata
      properties:
        name:
          type: string
          description: 'Metric name. For global metrics: full name. For per-space metrics: suffix without the ''space.<name>.'' prefix.'
        type:
          type: string
          description: Metric type as string
          enum:
          - counter
          - gauge_int
          - pull
        enabled:
          type: boolean
          description: Whether metric collection is currently enabled
        value:
          type: number
          description: Current metric value
    SpaceMetrics:
      type: object
      description: Metrics grouped by space (policy/namespace)
      properties:
        name:
          type: string
          description: Space name (e.g., 'standard', 'custom')
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricEntry'
          description: Metrics belonging to this space
    MetricsDump_Response:
      allOf:
      - $ref: '#/components/schemas/Response'
      - type: object
        properties:
          name:
            type: string
            description: Daemon name (e.g., 'wazuh-manager-analysisd')
          uptime:
            type: string
            format: date-time
            description: ISO 8601 timestamp of when the daemon started
          timestamp:
            type: string
            format: date-time
            description: ISO 8601 timestamp of when this dump was collected
          global:
            type: array
            items:
              $ref: '#/components/schemas/MetricEntry'
            description: Global metrics (engine-wide, not scoped to any space)
          spaces:
            type: array
            items:
              $ref: '#/components/schemas/SpaceMetrics'
            description: Per-space metrics grouped by space name
  responses:
    InternalServerError_500:
      description: |
        Internal Server Error. A handler whose backing component is gone answers with a JSON `Response`
        (`Error: Handler is not initialized`); an exception escaping a handler is answered by the server
        with the plain-text body `Internal server error`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example:
            status: ERROR
            error: 'Error: Handler is not initialized'
        text/plain:
          schema:
            type: string
          example: Internal server error
    BadRequest_400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example:
            status: ERROR
            error: Error message
    GenericSuccess_200:
      description: Generic Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example:
            status: OK
